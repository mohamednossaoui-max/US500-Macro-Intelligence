name: Decision State History Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose Decision State History
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repository baseline
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DECISION STATE HISTORY DIAGNOSTIC"
          echo "READ ONLY - NO FILES WILL BE MODIFIED"
          echo "========================================"

          echo
          echo "----- Branch -----"
          git branch --show-current

          echo
          echo "----- Commit -----"
          git rev-parse HEAD

          echo
          echo "----- Git status -----"
          git status --short

          echo
          echo "----- Recent commits -----"
          git log --oneline -10

      - name: Verify protected files are readable
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Protected baseline -----"

          test -f app.py || {
            echo "FAIL: app.py not found"
            exit 1
          }

          test -d public_data || {
            echo "FAIL: public_data directory not found"
            exit 1
          }

          python -m py_compile app.py

          echo "PASS: app.py syntax"
          echo "PASS: public_data exists"

      - name: Inventory Decision artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DECISION ARTIFACT INVENTORY"
          echo "========================================"

          find public_data \
            -maxdepth 3 \
            -type f \
            \( \
              -iname '*decision*' \
              -o -iname '*snapshot*' \
              -o -iname '*history*' \
              -o -iname '*canonical*' \
              -o -iname '*research_context*' \
            \) \
            -print \
            | sort || true

      - name: Inspect canonical manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CANONICAL MANIFEST"
          echo "========================================"

          python - <<'PY'
          from pathlib import Path
          import json

          path = Path("public_data/manifest.json")

          if not path.exists():
              print("MANIFEST FOUND: NO")
              raise SystemExit(0)

          print("MANIFEST FOUND: YES")

          try:
              obj = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except Exception as exc:
              print(
                  "MANIFEST READ ERROR:",
                  type(exc).__name__,
                  str(exc),
              )
              raise SystemExit(0)

          print(
              "generated_at_utc:",
              obj.get("generated_at_utc", "—"),
          )
          print(
              "master_run_id:",
              obj.get("master_run_id", "—"),
          )
          print(
              "dataset_count:",
              obj.get("dataset_count", "—"),
          )

          files = obj.get("files")

          if isinstance(files, dict):
              names = sorted(
                  str(name)
                  for name in files.keys()
              )
          else:
              names = []

          print(
              "manifest file entries:",
              len(names),
          )

          interesting = [
              name
              for name in names
              if any(
                  token in name.lower()
                  for token in (
                      "decision",
                      "snapshot",
                      "history",
                      "canonical",
                      "research_context",
                  )
              )
          ]

          print()
          print(
              "Decision/history-related "
              "manifest entries:"
          )

          if not interesting:
              print("  NONE")
          else:
