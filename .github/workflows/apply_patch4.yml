# .github/workflows/apply-patch4.yml

name: Apply Patch 4 - Fed Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch4:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          test -f app.py || {
            echo "ERROR: app.py not found"
            exit 1
          }

          echo "app.py found."

      - name: Verify current app.py syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile app.py

          echo "PASS: current app.py syntax is valid."

      - name: Verify actual fed function structure
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("app.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)

          fed_nodes = [
              node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == "fed"
          ]

          if len(fed_nodes) != 1:
              raise SystemExit(
                  f"ERROR: expected exactly one fed() function, found {len(fed_nodes)}"
              )

          fed = fed_nodes[0]
          fed_source = "\n".join(
              source.splitlines()[fed.lineno - 1:fed.end_lineno]
          )

          print(
              f"PASS: fed() found at lines "
              f"{fed.lineno}-{fed.end_lineno}"
          )

          required_markers = [
              'st.header("Fed Intelligence")',
              'st.subheader("Policy Pulse")',
              'st.subheader("What Changed?")',
              'st.subheader("FOMC Communication")',
              'st.subheader("SEP Pulse — Current vs Previous")',
              'st.subheader("Communication — Current vs Previous")',
              'st.subheader("Fed Synthesis")',
              'st.subheader("Beige Book Context")',
              'st.subheader("Fed Evidence Quality")',
              'communication_comparison',
              'research_panels',
          ]

          missing = [
              marker
              for marker in required_markers
              if marker not in fed_source
          ]

          if missing:
              print("ERROR: fed() does not match the expected Patch 4 baseline.")
              print("Missing markers:")
              for marker in missing:
                  print(" -", marker)
              raise SystemExit(1)

          print("PASS: actual Patch 4 Fed structure detected.")
          PY

      - name: Create backup
        shell: bash
        run: |
          set -euo pipefail

          cp app.py app.py.pre_patch4_final

          echo "Backup created: app.py.pre_patch4_final"

      - name: Apply corrected Patch 4 presentation
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/apply_patch4.py <<'PY'
          import ast
          from pathlib import Path

          path = Path("app.py")
          source = path.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # 1. Locate fed() using Python AST.
          #    No fragile whole-function exact-string matching.
          # ------------------------------------------------------------
          tree = ast.parse(source)

          fed_nodes = [
              node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == "fed"
          ]

          if len(fed_nodes) != 1:
              raise SystemExit(
                  f"ERROR: expected exactly one fed() function, "
                  f"found {len(fed_nodes)}"
              )

          fed = fed_nodes[0]

          lines = source.splitlines(keepends=True)

          start = fed.lineno - 1
          end = fed.end_lineno

          fed_source = "".join(lines[start:end])

          # ------------------------------------------------------------
          # 2. Guard against applying this to the wrong Fed implementation.
          # ------------------------------------------------------------
          required = [
              'st.subheader("Policy Pulse")',
              'st.subheader("What Changed?")',
              'st.subheader("FOMC Communication")',
              'st.subheader("SEP Pulse — Current vs Previous")',
              'st.subheader("Communication — Current vs Previous")',
              'st.subheader("Fed Synthesis")',
              'st.subheader("Beige Book Context")',
              'st.subheader("Fed Evidence Quality")',
          ]

          missing = [x for x in required if x not in fed_source]

          if missing:
              print("ERROR: unexpected fed() structure.")
              print("Missing:")
              for item in missing:
                  print(" -", item)
              raise SystemExit(1)

          # ------------------------------------------------------------
          # 3. Replace only the Communication Current vs Previous block.
          #
          #    We use stable section boundaries from the real fed()
          #    implementation instead of line numbers.
          # ------------------------------------------------------------
          block_start_marker = (
              "    # --- Communication current vs previous "
              "-----------------------------\n"
          )

          block_end_marker = (
              "    # --- Synthesis "
              "------------------------------------------------------\n"
          )

          if fed_source.count(block_start_marker) != 1:
              raise SystemExit(
                  "ERROR: Communication comparison start marker "
                  "was not found exactly once."
              )

          if fed_source.count(block_end_marker) != 1:
              raise SystemExit(
                  "ERROR: Synthesis boundary was not found exactly once."
              )

          before, remainder = fed_source.split(
              block_start_marker,
              1,
          )

          old_block, after = remainder.split(
              block_end_marker,
              1,
          )

          new_block = r'''    # --- Communication current vs previous -----------------------------
              comparison = obj.get("communication_comparison") if isinstance(obj.get("communication_comparison"), dict) else {}
              st.subheader("Communication — Current vs Previous")

              comparison_rows = []

              for key, label in (
                  ("statement", "FOMC Statement"),
                  ("minutes", "FOMC Minutes"),
                  ("chair_press", "Press Conference"),
              ):
                  item = comparison.get(key) if isinstance(comparison.get(key), dict) else {}
                  comp = item.get("comparison") if isinstance(item.get("comparison"), dict) else {}
                  previous_doc = item.get("previous") if isinstance(item.get("previous"), dict) else {}

                  current_doc = obj.get(
                      "chair_press" if key == "chair_press" else key
                  )
                  current_doc = current_doc if isinstance(current_doc, dict) else {}

                  current_tone = current_doc.get("tone", "UNAVAILABLE")
                  previous_tone = previous_doc.get("tone", "UNAVAILABLE")
                  change = comp.get("classification", "UNAVAILABLE")

                  current_date = item.get("current_date")
                  previous_date = item.get("previous_date")

                  comparison_rows.append({
                      "Report": label,
                      "Current": current_date,
                      "Previous": previous_date,
                      "Current tone": current_tone,
                      "Previous tone": previous_tone,
                      "Change": change,
                  })

                  change_text = str(change or "UNAVAILABLE")
                  change_upper = change_text.upper()

                  if any(
                      token in change_upper
                      for token in (
                          "HAWK",
                          "TIGHT",
                          "HIGHER",
                          "FIRM",
                      )
                  ):
                      signal = "HAWKISH SHIFT"
                  elif any(
                      token in change_upper
                      for token in (
                          "DOV",
                          "EAS",
                          "LOWER",
                          "SOFT",
                      )
                  ):
                      signal = "DOVISH SHIFT"
                  elif change_upper in (
                      "UNAVAILABLE",
                      "PENDING",
                      "NONE",
                      "",
                  ):
                      signal = "NOT AVAILABLE"
                  else:
                      signal = "LIMITED / NEUTRAL SHIFT"

                  st.markdown(
                      f"<div class='signal-card'>"
                      f"<div class='signal-title'>{label}</div>"
                      f"<div class='signal-main'>"
                      f"{fmt(previous_tone)} → {fmt(current_tone)}"
                      f"</div>"
                      f"<div class='signal-why'>"
                      f"<b>{signal}</b> · "
                      f"{fmt(previous_date)} → {fmt(current_date)}"
                      f"</div>"
                      f"</div>",
                      unsafe_allow_html=True,
                  )

              comparison_df = pd.DataFrame(comparison_rows)

              with st.expander(
                  "Raw communication comparison",
                  expanded=False,
              ):
                  table(comparison_df, 260)

              st.caption(
                  "Unavailable or not-yet-published reports remain unavailable; "
                  "they are never converted into neutral evidence."
              )

          '''

          new_fed_source = (
              before
              + new_block
              + block_end_marker
              + after
          )

          if new_fed_source == fed_source:
              raise SystemExit(
                  "ERROR: patch produced no change."
              )

          # ------------------------------------------------------------
          # 4. Rebuild app.py.
          # ------------------------------------------------------------
          new_source = (
              "".join(lines[:start])
              + new_fed_source
              + "".join(lines[end:])
          )

          # ------------------------------------------------------------
          # 5. Validate syntax BEFORE writing.
          # ------------------------------------------------------------
          try:
              ast.parse(new_source)
          except SyntaxError as exc:
              raise SystemExit(
                  f"ERROR: patched app.py is invalid Python: {exc}"
              )

          path.write_text(
              new_source,
              encoding="utf-8",
          )

          print("PATCH 4 APPLIED SUCCESSFULLY")
          print(
              f"fed() baseline was lines "
              f"{fed.lineno}-{fed.end_lineno}"
          )
          PY

          python /tmp/apply_patch4.py

      - name: Verify patched app syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile app.py

          echo "PASS: patched app.py compiles."

      - name: Verify corrected presentation targets
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("app.py").read_text(encoding="utf-8")
          tree = ast.parse(source)

          fed = next(
              node
              for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "fed"
          )

          fed_source = "\n".join(
              source.splitlines()[fed.lineno - 1:fed.end_lineno]
          )

          checks = {
              "Fed header":
                  'st.header("Fed Intelligence")',

              "Policy Pulse":
                  'st.subheader("Policy Pulse")',

              "What Changed":
                  'st.subheader("What Changed?")',

              "FOMC Communication":
                  'st.subheader("FOMC Communication")',

              "SEP comparison":
                  'st.subheader("SEP Pulse — Current vs Previous")',

              "Communication comparison":
                  'st.subheader("Communication — Current vs Previous")',

              "Fed Synthesis":
                  'st.subheader("Fed Synthesis")',

              "Beige Book":
                  'st.subheader("Beige Book Context")',

              "Evidence Quality":
                  'st.subheader("Fed Evidence Quality")',

              "Dynamic communication cards":
                  "signal = \"HAWKISH SHIFT\"",

              "Raw comparison expander":
                  '"Raw communication comparison"',
          }

          failed = []

          for name, marker in checks.items():
              if marker in fed_source:
                  print(f"PASS: {name}")
              else:
                  print(f"FAIL: {name}")
                  failed.append(name)

          if failed:
              raise SystemExit(
                  "ERROR: presentation verification failed: "
                  + ", ".join(failed)
              )

          print()
          print("PATCH 4 PRESENTATION VERIFICATION PASSED")
          PY

      - name: Ensure scoring and governance were not modified
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import difflib

          old = Path(
              "app.py.pre_patch4_final"
          ).read_text(
              encoding="utf-8"
          ).splitlines()

          new = Path(
              "app.py"
          ).read_text(
              encoding="utf-8"
          ).splitlines()

          diff = list(
              difflib.unified_diff(
                  old,
                  new,
                  fromfile="baseline/app.py",
                  tofile="patched/app.py",
                  lineterm="",
              )
          )

          forbidden = [
              "fed_score =",
              "document_weights",
              "document_score_eligibility",
              "score_100",
              "quality_gate",
              "pit_status",
          ]

          changed_lines = [
              line
              for line in diff
              if (
                  line.startswith("+")
                  or line.startswith("-")
              )
              and not line.startswith("+++")
              and not line.startswith("---")
          ]

          violations = []

          for line in changed_lines:
              for token in forbidden:
                  if token in line:
                      violations.append(
                          (token, line)
                      )

          if violations:
              print(
                  "ERROR: protected scoring/governance "
                  "content changed:"
              )
              for token, line in violations:
                  print(token, "=>", line)
              raise SystemExit(1)

          print(
              "PASS: protected scoring/PIT/governance "
              "logic was not modified."
          )
          PY

      - name: Show changed files
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Git status -----"
          git status --short

          echo
          echo "----- Diff summary -----"
          git diff --stat -- app.py

          echo
          echo "----- app.py diff -----"
          git diff -- app.py

      - name: Remove temporary backup
        shell: bash
        run: |
          set -euo pipefail

          rm -f app.py.pre_patch4_final

      - name: Commit Patch 4
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- app.py; then
            echo "ERROR: app.py has no changes to commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add app.py

          git commit \
            -m "Patch 4: improve Fed Intelligence presentation"

      - name: Push Patch 4
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo
          echo "PATCH 4 COMPLETE"
