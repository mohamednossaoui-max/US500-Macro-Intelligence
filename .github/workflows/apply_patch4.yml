name: Apply Corrected Patch 4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-corrected-patch4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f app.py
          test -f apply_patch4_corrected.py
          EXPECTED="fa65e47102e8509e4c841e66d317768fea307ce12c00c3da8c9f23eed58b7298"
          ACTUAL="$(sha256sum app.py | awk '{print $1}')"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Syntax check before patch
        run: |
          python -m py_compile app.py
          python -m py_compile apply_patch4_corrected.py

      - name: Apply corrected Patch 4
        run: python apply_patch4_corrected.py

      - name: Verify presentation targets
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Raw Research Context Summary' app.py
          grep -q 'Raw Macro Context' app.py
          grep -q 'Raw communication comparison' app.py
          grep -q 'Raw Event Study Summary' app.py
          grep -q 'Raw dataset publication map' app.py
          python -m py_compile app.py
          echo "Presentation targets verified."

      - name: Require real app.py change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.py; then
            echo "ERROR: app.py did not change."
            exit 1
          fi
          git diff --stat -- app.py
          git diff -- app.py

      - name: Commit corrected Patch 4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Correct V6.3 Patch 4 dynamic research views"
          git push
