name: ATH Breadth Common Sample Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2,<4' numpy pytest 'yfinance>=0.2,<2' 'pandas_market_calendars==5.5.0'
      - name: Test common sample, quality and chronology
        run: python -m pytest -q tests/test_ath_breadth_comparison_research_v11.py tests/test_ath_sequential_pullback_research_v9.py tests/test_ath_extended_history_research_v10.py
      - name: Acquire calendar-validated extended price history
        run: python ath_extended_history_research_v10.py --mode acquire --output ath_breadth_run/acquisition
      - name: Compare price and breadth on identical cases
        run: python ath_breadth_comparison_research_v11.py --cache ath_breadth_run/acquisition --output ath_breadth_run/study
      - name: Verify publication remained unchanged
        if: always()
        run: python scripts/verify_publication_integrity.py --public-data public_data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ath-breadth-common-sample-audit
          path: ath_breadth_run/
          retention-days: 7
          if-no-files-found: warn
