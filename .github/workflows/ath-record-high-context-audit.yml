name: ATH Record High Context Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2,<4' numpy requests pytest
      - run: python -m pytest tests/test_ath_record_high_research_v6.py tests/test_ath_official_vintage_backfill_v1.py tests/test_ath_macro_edge_research_v4.py tests/test_ath_vintage_receipt_replay_v1.py -q
      - name: Download official VIX into read-only staging
        run: |
          mkdir -p ath_record_run/sources
          python - <<'PY'
          from pathlib import Path
          import requests
          r=requests.get('https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv',timeout=45)
          r.raise_for_status()
          Path('ath_record_run/sources/VIX_History.csv').write_bytes(r.content)
          PY
      - name: Select records using only information known at each close
        run: python ath_record_high_research_v6.py --official-vix ath_record_run/sources/VIX_History.csv --cache research_history/ath_official_vintages_v1 --output ath_record_run/before_backfill
      - name: Acquire official vintages at record-high decision dates
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python ath_official_vintage_backfill_v1.py --events ath_record_run/before_backfill/record_high_v6_events.csv --output ath_record_run/vintages --cache research_history/ath_official_vintages_v1 --coverage-policy available-archive
      - name: Compare price and complete context on common mature labels
        if: always()
        run: |
          if [ -f ath_record_run/vintages/official_vintage_audit.json ]; then
            python ath_record_high_research_v6.py --official-vix ath_record_run/sources/VIX_History.csv --cache ath_record_run/vintages --output ath_record_run/after_backfill
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ath-record-high-context-audit
          path: ath_record_run/
          if-no-files-found: warn
