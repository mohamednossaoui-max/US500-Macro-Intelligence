name: Test V3.8

on:
  workflow_dispatch:
  push:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/**"

jobs:
  v38:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify V3.8 file
        run: |
          pwd
          ls -la
          test -f backtestEMA19Macro.py

      - name: Run V3.8
        run: python backtestEMA19Macro.py
