name: Backtest EMA19

on:
  workflow_dispatch:

jobs:
  backtest-ema19:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests yfinance streamlit

      - name: Run EMA19 Backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python backtestEMA19Macro.py

      - name: Upload Backtest Results
        uses: actions/upload-artifact@v4
        with:
          name: EMA19-Macro-Backtest-Results
          path: |
            backtestEMA19Macro_trades.csv
            backtestEMA19Macro_regimes.csv
            backtestEMA19Macro_yearly.csv
            backtestEMA19Macro_summary.csv
            backtestEMA19Macro_macro_data.csv
            backtestEMA19Macro_data_quality.csv
            backtestEMA19Macro_signals.csv
