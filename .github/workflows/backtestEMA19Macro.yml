name: Backtest EMA19 Macro

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest-ema19-macro:
    name: EMA19 Macro Backtest
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            pandas \
            numpy \
            requests \
            yfinance \
            streamlit

      # ============================================================
      # 4. ENVIRONMENT CHECK
      # ============================================================
      - name: Environment check
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -e

          echo "============================================================"
          echo "US500 MACRO INTELLIGENCE"
          echo "EMA19 MACRO BACKTEST — ENVIRONMENT CHECK"
          echo "============================================================"

          echo
          echo "Python:"
          python --version

          echo
          echo "Pip:"
          pip --version

          echo
          echo "Python packages:"

          python - <<'PY'
          import pandas
          import numpy
          import requests
          import yfinance

          print("pandas     :", pandas.__version__)
          print("numpy      :", numpy.__version__)
          print("requests   :", requests.__version__)
          print("yfinance   :", yfinance.__version__)
          PY

          echo

          if [ -z "${FRED_API_KEY}" ]; then
            echo "ERROR: FRED_API_KEY is missing."
            exit 1
          fi

          echo "FRED_API_KEY: configured"

      # ============================================================
      # 5. VERIFY BACKTEST SOURCE
      # ============================================================
      - name: Verify backtest source
        run: |
          set -e

          echo "============================================================"
          echo "VERIFYING BACKTEST SOURCE"
          echo "============================================================"

          test -f backtestEMA19Macro.py

          echo
          echo "Found:"
          ls -lh backtestEMA19Macro.py

          echo
          echo "Script header:"
          sed -n '1,45p' backtestEMA19Macro.py

      # ============================================================
      # 6. RUN EMA19 MACRO BACKTEST
      # ============================================================
      - name: Run EMA19 Macro Backtest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail

          echo "============================================================"
          echo "US500 MACRO INTELLIGENCE"
          echo "EMA19 MACRO BACKTEST"
          echo "============================================================"

          echo
          echo "Research-only"
          echo "No trade execution"
          echo "No broker integration"
          echo "No Decision Engine modification"
          echo

          python backtestEMA19Macro.py 2>&1 | tee backtestEMA19Macro_run.log

      # ============================================================
      # 7. INSPECT GENERATED OUTPUTS
      # ============================================================
      - name: Inspect generated outputs
        if: always()
        run: |
          echo "============================================================"
          echo "GENERATED OUTPUTS"
          echo "============================================================"

          echo
          echo "Repository root:"
          ls -lah

          echo
          echo "EMA19 generated files:"

          find . -maxdepth 1 -type f \
            \( \
              -name "backtestEMA19Macro*" \
              -o -name "macro_backtest_v310_*.csv" \
            \) \
            -print \
            -exec ls -lh {} \;

      # ============================================================
      # 8. VERIFY V3.10 OUTPUTS
      # ============================================================
      - name: Verify V3.10 temporal robustness outputs
        if: always()
        run: |
          echo "============================================================"
          echo "V3.10 TEMPORAL ROBUSTNESS OUTPUT CHECK"
          echo "============================================================"

          required_files=(
            "macro_backtest_v310_year_by_year.csv"
            "macro_backtest_v310_temporal_summary.csv"
            "macro_backtest_v310_max_drawdown.csv"
            "macro_backtest_v310_leave_one_year_out.csv"
            "macro_backtest_v310_crisis_exclusion.csv"
            "macro_backtest_v310_largest_year_exclusion.csv"
            "macro_backtest_v310_robustness_verdict.csv"
          )

          missing=0

          for f in "${required_files[@]}"; do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
              wc -l "$f"
            else
              echo "MISSING: $f"
              missing=$((missing + 1))
            fi
          done

          echo
          echo "Missing V3.10 files: $missing"

          if [ "$missing" -gt 0 ]; then
            echo
            echo "WARNING: One or more V3.10 outputs were not generated."
          else
            echo
            echo "ALL V3.10 OUTPUT FILES FOUND"
          fi

      # ============================================================
      # 9. BUILD GITHUB SUMMARY
      # ============================================================
      - name: Publish Backtest Report to Job Summary
        if: always()
        run: |
          {
            echo "# US500 Macro Intelligence — EMA19 Macro Backtest"
            echo

            echo "**Mode:** Research-only"
            echo

            echo "**Execution:** GitHub Actions"
            echo

            echo "**Market:** S&P 500 (^GSPC)"
            echo

            echo "**Baseline:** EMA19 frozen baseline"
            echo

            echo "**FRED:** API data with point-in-time/as-of processing"
            echo

            echo "---"
            echo

            echo "## Execution Log"
            echo

            echo '```text'

            if [ -f backtestEMA19Macro_run.log ]; then
              cat backtestEMA19Macro_run.log
            else
              echo "No execution log was created."
            fi

            echo '```'

            echo
            echo "---"
            echo

            echo "## Standard EMA19 Generated CSV Files"
            echo

            for f in \
              backtestEMA19Macro_trades.csv \
              backtestEMA19Macro_regimes.csv \
              backtestEMA19Macro_yearly.csv \
              backtestEMA19Macro_summary.csv \
              backtestEMA19Macro_macro_data.csv \
              backtestEMA19Macro_data_quality.csv \
              backtestEMA19Macro_signals.csv
            do

              if [ -f "$f" ]; then
                echo "- \`$f\` — $(wc -l < "$f") lines"
              else
                echo "- \`$f\` — NOT GENERATED"
              fi

            done

            echo
            echo "---"
            echo

            echo "## V3.10 Temporal Robustness Outputs"
            echo

            for f in \
              macro_backtest_v310_year_by_year.csv \
              macro_backtest_v310_temporal_summary.csv \
              macro_backtest_v310_max_drawdown.csv \
              macro_backtest_v310_leave_one_year_out.csv \
              macro_backtest_v310_crisis_exclusion.csv \
              macro_backtest_v310_largest_year_exclusion.csv \
              macro_backtest_v310_robustness_verdict.csv
            do

              if [ -f "$f" ]; then
                echo "- \`$f\` — $(wc -l < "$f") lines"
              else
                echo "- \`$f\` — NOT GENERATED"
              fi

            done

            echo
            echo "---"
            echo

            echo "## Frozen Baseline"
            echo

            echo "- Expected signals: 119"
            echo "- Expected valid signals: 117"
            echo "- Expected invalid SL: 2"
            echo "- Expected resolved: 109"
            echo "- Expected wins: 36"
            echo "- Expected losses: 73"
            echo "- Expected ambiguous: 3"
            echo "- Expected open: 5"
            echo "- Expected total R: +71.0"

            echo
            echo "---"
            echo

            echo "## Research Safety"
            echo

            echo "- Research-only: YES"
            echo "- Trade execution: NO"
            echo "- Broker integration: NO"
            echo "- Decision Engine modification: NO"
            echo "- Forecast generation: NO"
            echo "- Parameter optimization: NO"
            echo "- Baseline modification: NO"

          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 10. UPLOAD ALL BACKTEST ARTIFACTS
      # ============================================================
      - name: Upload EMA19 Backtest Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EMA19-Macro-Backtest-Results
          if-no-files-found: warn
          retention-days: 30

          path: |
            # ----------------------------------------------------
            # Standard EMA19 outputs
            # ----------------------------------------------------
            backtestEMA19Macro_run.log
            backtestEMA19Macro_trades.csv
            backtestEMA19Macro_regimes.csv
            backtestEMA19Macro_yearly.csv
            backtestEMA19Macro_summary.csv
            backtestEMA19Macro_macro_data.csv
            backtestEMA19Macro_data_quality.csv
            backtestEMA19Macro_signals.csv

            # ----------------------------------------------------
            # V3.10 Temporal Robustness outputs
            # ----------------------------------------------------
            macro_backtest_v310_year_by_year.csv
            macro_backtest_v310_temporal_summary.csv
            macro_backtest_v310_max_drawdown.csv
            macro_backtest_v310_leave_one_year_out.csv
            macro_backtest_v310_crisis_exclusion.csv
            macro_backtest_v310_largest_year_exclusion.csv
            macro_backtest_v310_robustness_verdict.csv

      # ============================================================
      # 11. FINAL STATUS
      # ============================================================
      - name: Final status
        if: always()
        run: |
          echo "============================================================"
          echo "EMA19 MACRO BACKTEST WORKFLOW FINISHED"
          echo "============================================================"

          echo
          echo "Research-only: YES"
          echo "Trade execution: NO"
          echo "Broker integration: NO"
          echo "Decision Engine integration: NO"
          echo "V3.10 temporal robustness outputs: REQUESTED"
          echo "Artifacts: UPLOAD ATTEMPTED"
          echo
