name: Backtest EMA19 Macro

on:
  workflow_dispatch:

jobs:
  backtest-ema19-macro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance streamlit

      - name: Run EMA19 Macro Backtest
        run: |
          python backtestEMA19Macro.py

      - name: Upload Backtest Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema19-macro-backtest-results
          path: |
            ema19_macro_signals.csv
            backtestEMA19Macro_trades.csv
            backtestEMA19Macro_yearly.csv
            backtestEMA19Macro_summary.csv
          if-no-files-found: warn
