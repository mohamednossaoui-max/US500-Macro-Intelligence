name: Collect Economic Historical Data — Phase 1B

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4

      - name: Run historical collector
        run: python "./economic_historical_collector_v1.py"

      - name: Verify outputs
        run: |
          test -f "./economic_historical_events_v1.csv"
          test -f "./economic_historical_quality_v1.csv"

      - name: Show output summary
        run: |
          python - <<'PY'
          import pandas as pd
          e = pd.read_csv("economic_historical_events_v1.csv")
          q = pd.read_csv("economic_historical_quality_v1.csv")
          print("EVENTS:", len(e))
          print("PIT SAFE:", int(q["point_in_time_safe"].sum()), "/", len(q))
          print("INDICATORS:")
          print(e["indicator"].value_counts().sort_index())
          PY
