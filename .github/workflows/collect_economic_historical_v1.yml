name: Collect Economic Historical Data — Phase 1B.1

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run official manifest collector
        run: python "./economic_historical_collector_v1_1.py"

      - name: Verify outputs
        run: |
          test -f "./economic_historical_events_v1.csv"
          test -f "./economic_historical_quality_v1.csv"

      - name: Quality gate
        run: |
          python - <<'PY'
          import pandas as pd
          q = pd.read_csv("economic_historical_quality_v1.csv")
          total = len(q)
          safe = int(q["point_in_time_safe"].sum())
          print(f"PIT SAFE: {safe}/{total}")
          if safe != total:
              raise SystemExit("PIT QUALITY GATE FAILED")
          PY
