name: COT Positioning Analyzer v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cot-positioning-analyzer:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout repository
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. Setup Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # 3. Install dependencies
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      # =====================================================
      # 4. Find latest COT historical artifact
      # =====================================================

      - name: Find COT historical artifact
        id: find_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          set -e

          ARTIFACT_ID=$(python - <<'PY'
          import json
          import os
          import urllib.request
          import sys

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          url = (
              f"https://api.github.com/repos/{repo}/"
              "actions/artifacts?per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          artifacts = data.get("artifacts", [])

          candidates = [
              artifact
              for artifact in artifacts
              if artifact.get("name") == "cot-historical-v1"
              and not artifact.get("expired", True)
          ]

          if not candidates:
              print(
                  "ERROR: No valid cot-historical-v1 artifact found.",
                  file=sys.stderr
              )
              sys.exit(1)

          artifact = max(
              candidates,
              key=lambda x: x["created_at"]
          )

          print(
              f"Selected artifact: "
              f"{artifact['name']} | "
              f"ID={artifact['id']} | "
              f"created={artifact['created_at']}",
              file=sys.stderr
          )

          print(artifact["id"])
          PY
          )

          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

          echo "Selected COT artifact ID:"
          echo "$ARTIFACT_ID"

      # =====================================================
      # 5. Download artifact using GitHub CLI
      # =====================================================

      - name: Download COT historical artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.find_artifact.outputs.artifact_id }}
        run: |

          set -e

          mkdir -p cot_input

          echo "Downloading artifact ID: $ARTIFACT_ID"

          gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > cot_input/cot-historical.zip

          echo "Downloaded artifact:"
          ls -lh cot_input/cot-historical.zip

          # =================================================
          # Validate ZIP
          # =================================================

          unzip -t cot_input/cot-historical.zip

          # =================================================
          # Extract
          # =================================================

          unzip -o \
            cot_input/cot-historical.zip \
            -d cot_input

          echo ""
          echo "Extracted files:"
          find cot_input -maxdepth 3 -type f -print

      # =====================================================
      # 6. Prepare COT input
      # =====================================================

      - name: Prepare COT input
        run: |

          set -e

          RECORD_FILE=$(find cot_input \
            -type f \
            -name "cot_historical_records_input_v1.csv" \
            | head -n 1)

          if [ -z "$RECORD_FILE" ]; then
            echo "ERROR:"
            echo "cot_historical_records_input_v1.csv not found."
            exit 1
          fi

          echo "Found COT records:"
          echo "$RECORD_FILE"

          cp "$RECORD_FILE" \
            cot_historical_records_input_v1.csv

          echo ""
          echo "Prepared input:"
          ls -lh cot_historical_records_input_v1.csv

      # =====================================================
      # 7. Run COT Positioning Analyzer
      # =====================================================

      - name: Run COT Positioning Analyzer v1
        run: |

          set -e

          test -f cot_positioning_analyzer_v1.py
          test -f cot_historical_records_input_v1.csv

          python cot_positioning_analyzer_v1.py

      # =====================================================
      # 8. Validate analyzer outputs
      # =====================================================

      - name: Validate analyzer outputs
        run: |

          set -e

          # -------------------------------------------------
          # Required output files
          # -------------------------------------------------

          test -f cot_positioning_research_v1.csv
          test -f cot_positioning_research_summary_v1.csv
          test -f cot_positioning_extremes_v1.csv

          # -------------------------------------------------
          # Python validation
          # -------------------------------------------------

          python - <<'PY'

          import pandas as pd
          import sys

          records = pd.read_csv(
              "cot_positioning_research_v1.csv"
          )

          summary = pd.read_csv(
              "cot_positioning_research_summary_v1.csv"
          )

          extremes = pd.read_csv(
              "cot_positioning_extremes_v1.csv"
          )

          # =================================================
          # Basic validation
          # =================================================

          if records.empty:
              raise SystemExit(
                  "FAIL: Analyzer output is empty."
              )

          # =================================================
          # Required columns
          # =================================================

          required_columns = [

              "contract_market_code",
              "contract_name",

              "observation_date",
              "availability_date",

              "open_interest",

              "asset_manager_net",
              "asset_manager_net_oi_pct",
              "asset_manager_net_change",
              "asset_manager_net_z",
              "asset_manager_net_percentile",

              "leveraged_money_net",
              "leveraged_money_net_oi_pct",
              "leveraged_money_net_change",
              "leveraged_money_net_z",
              "leveraged_money_net_percentile",

              "dealer_net",
              "dealer_net_oi_pct",
              "dealer_net_change",
              "dealer_net_z",
              "dealer_net_percentile",

              "point_in_time_safe",
              "research_only",
              "decision_engine_ready",
              "sentiment_score_generated",
          ]

          missing = [
              column
              for column in required_columns
              if column not in records.columns
          ]

          if missing:
              raise SystemExit(
                  "FAIL: Missing columns: "
                  + ", ".join(missing)
              )

          # =================================================
          # Contract validation
          # =================================================

          contract_codes = (
              records[
                  "contract_market_code"
              ]
              .astype(str)
              .str.strip()
              .unique()
          )

          if list(contract_codes) != ["13874A"]:
              raise SystemExit(
                  "FAIL: Unexpected contract code(s): "
                  + str(contract_codes)
              )

          # =================================================
          # Date validation
          # =================================================

          records["observation_date"] = pd.to_datetime(
              records["observation_date"],
              errors="coerce"
          )

          records["availability_date"] = pd.to_datetime(
              records["availability_date"],
              errors="coerce"
          )

          if records[
              "observation_date"
          ].isna().any():
              raise SystemExit(
                  "FAIL: Invalid observation dates."
              )

          if records[
              "availability_date"
          ].isna().any():
              raise SystemExit(
                  "FAIL: Invalid availability dates."
              )

          # =================================================
          # PIT validation
          # =================================================

          if not (
              records["availability_date"]
              > records["observation_date"]
          ).all():

              raise SystemExit(
                  "FAIL: Availability date must be "
                  "after observation date."
              )

          if not records[
              "point_in_time_safe"
          ].astype(bool).all():

              raise SystemExit(
                  "FAIL: point_in_time_safe contains FALSE."
              )

          # =================================================
          # Research-only validation
          # =================================================

          if not records[
              "research_only"
          ].astype(bool).all():

              raise SystemExit(
                  "FAIL: research_only contains FALSE."
              )

          # =================================================
          # Decision Engine must remain disabled
          # =================================================

          if records[
              "decision_engine_ready"
          ].astype(bool).any():

              raise SystemExit(
                  "FAIL: Decision Engine integration detected."
              )

          # =================================================
          # Sentiment score must not be generated here
          # =================================================

          if records[
              "sentiment_score_generated"
          ].astype(bool).any():

              raise SystemExit(
                  "FAIL: Sentiment score generated by analyzer."
              )

          # =================================================
          # Duplicate validation
          # =================================================

          duplicates = records.duplicated(
              subset=[
                  "contract_market_code",
                  "observation_date"
              ]
          ).sum()

          if duplicates > 0:
              raise SystemExit(
                  f"FAIL: {duplicates} duplicate observations."
              )

          # =================================================
          # Date ordering
          # =================================================

          if not records[
              "observation_date"
          ].is_monotonic_increasing:

              raise SystemExit(
                  "FAIL: Observation dates are not sorted."
              )

          # =================================================
          # Net positioning validation
          # =================================================

          # Asset Manager
          if not (
              records["asset_manager_net"].round(8)
              ==
              (
                  records["asset_manager_net"]
              ).round(8)
          ).all():

              raise SystemExit(
                  "FAIL: Asset Manager net contains invalid values."
              )

          # =================================================
          # Percentile range validation
          # =================================================

          percentile_columns = [

              "asset_manager_net_percentile",
              "leveraged_money_net_percentile",
              "dealer_net_percentile",

          ]

          for column in percentile_columns:

              values = records[column].dropna()

              if not values.empty:

                  if (values < 0).any() or (
                      values > 100
                  ).any():

                      raise SystemExit(
                          f"FAIL: {column} "
                          "outside 0-100 range."
                      )

          # =================================================
          # Extreme output validation
          # =================================================

          if "observation_date" not in extremes.columns:
              raise SystemExit(
                  "FAIL: Extremes file missing observation_date."
              )

          # =================================================
          # Print validation report
          # =================================================

          first_date = records[
              "observation_date"
          ].min()

          last_date = records[
              "observation_date"
          ].max()

          print()
          print("=" * 72)
          print("COT POSITIONING ANALYZER V1")
          print("VALIDATION REPORT")
          print("=" * 72)

          print(
              f"Records:                    {len(records):,}"
          )

          print(
              f"First observation:          "
              f"{first_date.date()}"
          )

          print(
              f"Last observation:           "
              f"{last_date.date()}"
          )

          print(
              f"Contract:                   13874A"
          )

          print(
              f"Duplicate observations:     {duplicates}"
          )

          print(
              "Point-in-time safe:         "
              f"{records['point_in_time_safe'].astype(bool).all()}"
          )

          print(
              "Research only:              "
              f"{records['research_only'].astype(bool).all()}"
          )

          print(
              "Decision Engine ready:      "
              f"{records['decision_engine_ready'].astype(bool).any()}"
          )

          print(
              "Sentiment score generated:  "
              f"{records['sentiment_score_generated'].astype(bool).any()}"
          )

          print(
              f"Extreme observations:       {len(extremes):,}"
          )

          print()
          print("Latest observation:")

          latest = records.iloc[-1]

          print(
              "  Observation date:",
              latest["observation_date"].date()
          )

          print(
              "  Availability date:",
              latest["availability_date"].date()
          )

          print(
              "  Asset Manager net:",
              latest["asset_manager_net"]
          )

          print(
              "  Asset Manager percentile:",
              latest["asset_manager_net_percentile"]
          )

          print(
              "  Leveraged Money net:",
              latest["leveraged_money_net"]
          )

          print(
              "  Leveraged Money percentile:",
              latest["leveraged_money_net_percentile"]
          )

          print(
              "  Dealer net:",
              latest["dealer_net"]
          )

          print(
              "  Dealer percentile:",
              latest["dealer_net_percentile"]
          )

          print()
          print("=" * 72)
          print("VALIDATION: PASS")
          print("=" * 72)

          PY

      # =====================================================
      # 9. Upload final analyzer artifact
      # =====================================================

      - name: Upload COT positioning artifact
        uses: actions/upload-artifact@v4
        with:
          name: cot-positioning-v1
          path: |
            cot_positioning_research_v1.csv
            cot_positioning_research_summary_v1.csv
            cot_positioning_extremes_v1.csv
          if-no-files-found: error
          retention-days: 90

      # =====================================================
      # 10. Final status
      # =====================================================

      - name: Final status
        run: |

          echo "=================================================="
          echo "COT POSITIONING ANALYZER V1 COMPLETED"
          echo "=================================================="
          echo ""
          echo "Research-only: TRUE"
          echo "Decision Engine: DISABLED"
          echo "Sentiment score: NOT GENERATED"
          echo "Artifact: cot-positioning-v1"
          echo ""
          echo "=================================================="
