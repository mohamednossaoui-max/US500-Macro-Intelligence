name: Cross-Asset Intelligence v1

run-name: "${{ github.workflow }} [${{ inputs.correlation_id || github.run_id }}]"

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: "Internal dispatch correlation token; blank for manual runs"
        required: false
        default: ""
      source_ref:
        description: "Pinned source commit; blank uses dispatched commit"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/cross-asset-intelligence-v1.yml"
      - "tests/cross_asset/cross_asset_intelligence_v1.py"

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-repair-20261016.txt

permissions:
  contents: read

concurrency:
  group: cross-asset-intelligence-v1
  cancel-in-progress: false

jobs:
  cross-asset-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Compile
        run: |
          python -m py_compile tests/cross_asset/cross_asset_intelligence_v1.py

      - name: Run Cross-Asset Intelligence v1
        run: |
          python tests/cross_asset/cross_asset_intelligence_v1.py \
            --output cross_asset_intelligence_v1

      - name: Show validation
        run: |
          cat cross_asset_intelligence_v1/cross_asset_validation_v1.json

      - name: Upload Cross-Asset Intelligence artifact
        uses: actions/upload-artifact@v4
        with:
          name: cross-asset-intelligence-v1
          path: cross_asset_intelligence_v1/
          if-no-files-found: error
