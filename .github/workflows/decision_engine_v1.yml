name: Decision Engine V1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  decision-engine-v1:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pandas

      # ============================================================
      # 4. PREPARE WORKSPACE
      # ============================================================
      - name: Prepare workspace
        run: |
          set -euo pipefail

          rm -rf decision_engine_input
          rm -rf decision_engine_output

          mkdir -p decision_engine_input
          mkdir -p decision_engine_output

          echo "Workspace prepared."

      # ============================================================
      # 5. DISCOVER LATEST RESEARCH CONTEXT ARTIFACT
      # ============================================================
      - name: Discover latest Research Context artifact
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DISCOVERING LATEST RESEARCH CONTEXT ARTIFACT"
          echo "============================================================"

          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from datetime import datetime, timezone

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          url = (
              f"https://api.github.com/repos/"
              f"{repository}/actions/artifacts"
              f"?per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "US500-Macro-Intelligence-Decision-Engine"
              }
          )

          print(f"Repository: {repository}")
          print("Requesting GitHub Actions artifact metadata...")

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except Exception as exc:
              print(f"ERROR: GitHub API request failed: {exc}")
              sys.exit(1)

          artifacts = payload.get("artifacts", [])

          print(f"Artifacts returned: {len(artifacts)}")

          candidates = []

          for artifact in artifacts:
              if artifact.get("name") != "research-context-v1":
                  continue

              if artifact.get("expired") is True:
                  continue

              workflow_run = artifact.get("workflow_run") or {}

              run_id = workflow_run.get("id")
              branch = workflow_run.get("head_branch")
              created_at = artifact.get("created_at")

              if not run_id:
                  continue

              if branch != "main":
                  continue

              if not created_at:
                  continue

              candidates.append({
                  "artifact_id": artifact.get("id"),
                  "artifact_name": artifact.get("name"),
                  "run_id": run_id,
                  "created_at": created_at,
                  "branch": branch,
                  "size_in_bytes": artifact.get("size_in_bytes", 0),
                  "expired": artifact.get("expired", False)
              })

          if not candidates:
              print("")
              print("ERROR: No valid research-context-v1 artifact found.")
              print("")
              print("Available matching artifacts:")

              for artifact in artifacts:
                  if artifact.get("name") == "research-context-v1":
                      print(
                          json.dumps(
                              {
                                  "id": artifact.get("id"),
                                  "run_id": (artifact.get("workflow_run") or {}).get("id"),
                                  "branch": (artifact.get("workflow_run") or {}).get("head_branch"),
                                  "created_at": artifact.get("created_at"),
                                  "expired": artifact.get("expired")
                              },
                              indent=2
                          )
                      )

              sys.exit(1)

          def parse_date(value):
              return datetime.fromisoformat(
                  value.replace("Z", "+00:00")
              ).astimezone(timezone.utc)

          candidates.sort(
              key=lambda x: parse_date(x["created_at"]),
              reverse=True
          )

          latest = candidates[0]

          print("")
          print("LATEST VALID RESEARCH CONTEXT ARTIFACT")
          print("------------------------------------------------------------")
          print(f"Artifact ID : {latest['artifact_id']}")
          print(f"Artifact    : {latest['artifact_name']}")
          print(f"Run ID      : {latest['run_id']}")
          print(f"Branch      : {latest['branch']}")
          print(f"Created     : {latest['created_at']}")
          print(f"Size        : {latest['size_in_bytes']} bytes")
          print("------------------------------------------------------------")

          github_output = os.environ["GITHUB_OUTPUT"]

          with open(github_output, "a", encoding="utf-8") as output:
              output.write(f"artifact_id={latest['artifact_id']}\n")
              output.write(f"artifact_name={latest['artifact_name']}\n")
              output.write(f"run_id={latest['run_id']}\n")
              output.write(f"created_at={latest['created_at']}\n")
              output.write(f"branch={latest['branch']}\n")

          PY

          echo ""
          echo "Discovery completed successfully."

      # ============================================================
      # 6. VERIFY DISCOVERY
      # ============================================================
      - name: Verify discovered artifact
        env:
          ARTIFACT_ID: ${{ steps.discover.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.discover.outputs.artifact_name }}
          RUN_ID: ${{ steps.discover.outputs.run_id }}
          CREATED_AT: ${{ steps.discover.outputs.created_at }}
          BRANCH: ${{ steps.discover.outputs.branch }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFYING RESEARCH CONTEXT ARTIFACT"
          echo "============================================================"

          test -n "${ARTIFACT_ID}"
          test -n "${ARTIFACT_NAME}"
          test -n "${RUN_ID}"
          test -n "${CREATED_AT}"
          test "${BRANCH}" = "main"

          echo "Artifact ID : ${ARTIFACT_ID}"
          echo "Artifact    : ${ARTIFACT_NAME}"
          echo "Run ID      : ${RUN_ID}"
          echo "Created     : ${CREATED_AT}"
          echo "Branch      : ${BRANCH}"

          echo ""
          echo "Artifact metadata validation PASSED."

      # ============================================================
      # 7. DOWNLOAD RESEARCH CONTEXT
      # ============================================================
      - name: Download latest Research Context artifact
        uses: actions/download-artifact@v5
        with:
          name: research-context-v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.discover.outputs.run_id }}
          path: decision_engine_input

      # ============================================================
      # 8. INSPECT DOWNLOADED FILES
      # ============================================================
      - name: Inspect downloaded Research Context
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DOWNLOADED RESEARCH CONTEXT FILES"
          echo "============================================================"

          find decision_engine_input \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

          echo ""

          FILE_COUNT=$(find decision_engine_input -type f | wc -l)

          echo "Downloaded file count: ${FILE_COUNT}"

          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "ERROR: Research Context artifact contains no files."
            exit 1
          fi

      # ============================================================
      # 9. LOCATE CANONICAL CSV
      # ============================================================
      - name: Locate Research Context CSV
        id: locate_input
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "LOCATING RESEARCH CONTEXT CSV"
          echo "============================================================"

          INPUT_FILE=""

          if [ -f "decision_engine_input/research_context_v1.csv" ]; then
            INPUT_FILE="decision_engine_input/research_context_v1.csv"
          else
            INPUT_FILE=$(
              find decision_engine_input \
                -type f \
                -iname "*research*context*v1*.csv" \
                -print \
                | sort \
                | head -n 1
            )
          fi

          if [ -z "${INPUT_FILE}" ]; then
            echo "ERROR: research_context_v1.csv was not found."

            echo ""
            echo "Available CSV files:"
            find decision_engine_input \
              -type f \
              -iname "*.csv" \
              -print \
              | sort

            exit 1
          fi

          echo "Selected input:"
          echo "${INPUT_FILE}"

          echo "input_file=${INPUT_FILE}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # 10. VALIDATE INPUT CSV
      # ============================================================
      - name: Validate Research Context input
        env:
          INPUT_FILE: ${{ steps.locate_input.outputs.input_file }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VALIDATING RESEARCH CONTEXT INPUT"
          echo "============================================================"

          test -f "${INPUT_FILE}"

          echo "File: ${INPUT_FILE}"
          echo "Size: $(wc -c < "${INPUT_FILE}") bytes"
          echo "Rows: $(($(wc -l < "${INPUT_FILE}") - 1))"

          python - <<PY
          import pandas as pd

          path = "${INPUT_FILE}"

          df = pd.read_csv(path)

          print("")
          print("CSV validation:")
          print(f"Rows    : {len(df)}")
          print(f"Columns : {len(df.columns)}")

          print("")
          print("Columns:")
          for column in df.columns:
              print(f"  - {column}")

          if df.empty:
              raise SystemExit("ERROR: Research Context CSV is empty.")

          print("")
          print("Research Context input validation PASSED.")
          PY

      # ============================================================
      # 11. RUN DECISION ENGINE
      # ============================================================
      - name: Run Decision Engine V1
        id: decision_engine
        env:
          INPUT_FILE: ${{ steps.locate_input.outputs.input_file }}
        run: |
          set -u

          echo "============================================================"
          echo "RUNNING DECISION ENGINE V1"
          echo "============================================================"

          echo "Input file:"
          echo "${INPUT_FILE}"

          echo ""
          echo "Output directory:"
          echo "decision_engine_output"

          set +e

          python tests/decision_engine/decision_engine_v1.py \
            --input "${INPUT_FILE}" \
            --output-dir decision_engine_output

          EXIT_CODE=$?

          set -e

          echo ""
          echo "Decision Engine exit code: ${EXIT_CODE}"

          echo "exit_code=${EXIT_CODE}" >> "${GITHUB_OUTPUT}"

          if [ "${EXIT_CODE}" -ne 0 ]; then
            echo ""
            echo "ERROR: Decision Engine V1 failed."
            exit "${EXIT_CODE}"
          fi

          echo ""
          echo "Decision Engine V1 completed successfully."

      # ============================================================
      # 12. VERIFY OUTPUTS
      # ============================================================
      - name: Verify Decision Engine outputs
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFYING DECISION ENGINE OUTPUTS"
          echo "============================================================"

          if [ ! -d "decision_engine_output" ]; then
            echo "ERROR: decision_engine_output directory not found."
            exit 1
          fi

          echo ""
          echo "Generated files:"
          find decision_engine_output \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          FILE_COUNT=$(find decision_engine_output -type f | wc -l)

          echo ""
          echo "Output file count: ${FILE_COUNT}"

          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "ERROR: Decision Engine generated no output files."
            exit 1
          fi

          echo ""
          echo "Checking expected artifacts..."

          REQUIRED_FILES=(
            "decision_engine_research_v1.json"
            "decision_engine_research_v1.csv"
            "decision_engine_research_summary_v1.csv"
            "decision_engine_research_evidence_v1.csv"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "decision_engine_output/${FILE}" ]; then
              echo "ERROR: Missing required output: ${FILE}"
              exit 1
            fi

            echo "PASS: ${FILE}"
          done

          echo ""
          echo "Decision Engine output validation PASSED."

      # ============================================================
      # 13. DISPLAY DECISION ENGINE SUMMARY
      # ============================================================
      - name: Display Decision Engine summary
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL DECISION ENGINE STATUS"
          echo "============================================================"

          if [ -f "decision_engine_output/decision_engine_research_v1.json" ]; then
            python - <<'PY'
          import json

          path = "decision_engine_output/decision_engine_research_v1.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("Decision Engine:")
          print("----------------------------------------")

          keys = [
              "engine_version",
              "research_only",
              "decision_engine_enabled",
              "state",
              "confidence",
              "evidence_count",
              "supportive_evidence",
              "contradictory_evidence",
              "missing_evidence",
              "data_quality",
              "point_in_time_safe",
              "trading_signal",
              "forecast",
              "unified_decision",
              "execution",
              "broker_integration",
              "position_sizing",
              "stop_loss",
              "take_profit"
          ]

          for key in keys:
              if key in data:
                  print(f"{key}: {data[key]}")

          print("----------------------------------------")
          PY
          fi

      # ============================================================
      # 14. DISPLAY OUTPUT FILES
      # ============================================================
      - name: Display generated artifacts
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "GENERATED DECISION ENGINE ARTIFACTS"
          echo "============================================================"

          for FILE in decision_engine_output/*; do
            if [ -f "${FILE}" ]; then
              echo ""
              echo "------------------------------------------------------------"
              echo "${FILE}"
              echo "------------------------------------------------------------"

              if [[ "${FILE}" == *.json ]]; then
                python -m json.tool "${FILE}" || true
              else
                head -n 20 "${FILE}" || true
              fi
            fi
          done

      # ============================================================
      # 15. UPLOAD DECISION ENGINE ARTIFACT
      # ============================================================
      - name: Upload Decision Engine artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-engine-v1
          path: decision_engine_output/
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 16. FINAL STATUS
      # ============================================================
      - name: Final Decision Engine status
        if: always()
        env:
          ENGINE_EXIT_CODE: ${{ steps.decision_engine.outputs.exit_code }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL DECISION ENGINE STATUS"
          echo "============================================================"

          if [ -z "${ENGINE_EXIT_CODE:-}" ]; then
            echo "ERROR:"
            echo "Decision Engine exit code was not recorded."
            exit 1
          fi

          echo "Decision Engine exit code: ${ENGINE_EXIT_CODE}"

          if [ "${ENGINE_EXIT_CODE}" -ne 0 ]; then
            echo ""
            echo "Decision Engine FAILED."
            exit "${ENGINE_EXIT_CODE}"
          fi

          echo ""
          echo "============================================================"
          echo "DECISION ENGINE V1 — SUCCESS"
          echo "============================================================"
          echo ""
          echo "Research-only: TRUE"
          echo "Trading execution: FALSE"
          echo "Broker integration: FALSE"
          echo "Position sizing: FALSE"
          echo "Stop loss: NONE"
          echo "Take profit: NONE"
          echo ""
          echo "Decision Engine completed successfully."
