name: Decision Engine V1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  decision-engine-v1:
    name: decision-engine-v1
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pandas

      # ============================================================
      # 4. PREPARE WORKSPACE
      # ============================================================
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf decision_engine_input
          rm -rf decision_engine_output

          mkdir -p decision_engine_input
          mkdir -p decision_engine_output

          echo "DECISION_ENGINE_EXIT_CODE=999" >> "$GITHUB_ENV"

      # ============================================================
      # 5. DISCOVER LATEST RESEARCH CONTEXT ARTIFACT
      #
      # IMPORTANT:
      # We discover BOTH:
      #   - artifact ID
      #   - workflow_run.id
      #
      # No hardcoded Run ID.
      # ============================================================
      - name: Discover latest Research Context artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"

          echo "============================================================"
          echo "DISCOVERING LATEST RESEARCH CONTEXT ARTIFACT"
          echo "============================================================"

          gh api \
            --paginate \
            "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '
              .artifacts[]
              | select(.expired == false)
              | select(.name == "research-context-v1")
              | [
                  .id,
                  .created_at,
                  .workflow_run.id,
                  .workflow_run.head_branch,
                  .workflow_run.head_sha
                ]
              | @tsv
            ' \
            > /tmp/research_context_artifacts.tsv

          if [ ! -s /tmp/research_context_artifacts.tsv ]; then
            echo
            echo "ERROR: No valid research-context-v1 artifact found."
            echo "Please run Research Context V1 first."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          from datetime import datetime

          source = Path("/tmp/research_context_artifacts.tsv")

          rows = []

          for line in source.read_text(encoding="utf-8").splitlines():

              parts = line.split("\t")

              if len(parts) != 5:
                  continue

              artifact_id, created_at, run_id, branch, sha = parts

              try:
                  dt = datetime.fromisoformat(
                      created_at.replace("Z", "+00:00")
                  )
              except Exception:
                  continue

              rows.append(
                  {
                      "created_at": dt,
                      "artifact_id": artifact_id,
                      "run_id": run_id,
                      "branch": branch,
                      "sha": sha,
                  }
              )

          if not rows:
              raise SystemExit(
                  "ERROR: No valid research-context-v1 artifact rows."
              )

          rows.sort(
              key=lambda x: x["created_at"],
              reverse=True,
          )

          latest = rows[0]

          Path("/tmp/latest_research_context.txt").write_text(
              "\t".join(
                  [
                      latest["artifact_id"],
                      latest["run_id"],
                      latest["created_at"].isoformat(),
                      latest["branch"],
                      latest["sha"],
                  ]
              ),
              encoding="utf-8",
          )

          print()
          print("LATEST RESEARCH CONTEXT")
          print("--------------------------------------------")
          print("Artifact ID :", latest["artifact_id"])
          print("Run ID      :", latest["run_id"])
          print("Created     :", latest["created_at"].isoformat())
          print("Branch      :", latest["branch"])
          print("SHA         :", latest["sha"])
          print("--------------------------------------------")
          PY

          read \
            ARTIFACT_ID \
            RUN_ID \
            CREATED_AT \
            BRANCH \
            SHA \
            < /tmp/latest_research_context.txt

          echo "RESEARCH_CONTEXT_ARTIFACT_ID=${ARTIFACT_ID}" >> "$GITHUB_ENV"
          echo "RESEARCH_CONTEXT_RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "RESEARCH_CONTEXT_CREATED_AT=${CREATED_AT}" >> "$GITHUB_ENV"
          echo "RESEARCH_CONTEXT_SHA=${SHA}" >> "$GITHUB_ENV"

      # ============================================================
      # 6. VERIFY ARTIFACT METADATA
      # ============================================================
      - name: Verify Research Context artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          ARTIFACT_ID="${RESEARCH_CONTEXT_ARTIFACT_ID}"
          RUN_ID="${RESEARCH_CONTEXT_RUN_ID}"

          echo "============================================================"
          echo "VERIFYING ARTIFACT METADATA"
          echo "============================================================"

          echo "Artifact ID : ${ARTIFACT_ID}"
          echo "Run ID      : ${RUN_ID}"
          echo

          gh api \
            "repos/${REPO}/actions/artifacts/${ARTIFACT_ID}" \
            --jq '
              {
                id: .id,
                name: .name,
                expired: .expired,
                created_at: .created_at,
                workflow_run_id: .workflow_run.id,
                workflow_run_branch: .workflow_run.head_branch,
                workflow_run_sha: .workflow_run.head_sha
              }
            '

      # ============================================================
      # 7. DOWNLOAD EXACT ARTIFACT FROM EXACT RUN
      # ============================================================
      - name: Download latest Research Context artifact
        uses: actions/download-artifact@v5
        with:
          name: research-context-v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RESEARCH_CONTEXT_RUN_ID }}
          path: decision_engine_input
          merge-multiple: false

      # ============================================================
      # 8. VERIFY DOWNLOAD
      # ============================================================
      - name: Verify Research Context download
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFYING RESEARCH CONTEXT DOWNLOAD"
          echo "============================================================"

          echo
          echo "Downloaded files:"
          find decision_engine_input \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

          CSV_COUNT="$(
            find decision_engine_input \
              -type f \
              -name "*.csv" \
              | wc -l
          )"

          if [ "$CSV_COUNT" -eq 0 ]; then
            echo
            echo "ERROR: No CSV files found in Research Context artifact."
            exit 1
          fi

          echo
          echo "CSV files found: ${CSV_COUNT}"

      # ============================================================
      # 9. VALIDATE INPUT
      # ============================================================
      - name: Validate Research Context input
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VALIDATING RESEARCH CONTEXT INPUT"
          echo "============================================================"

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("decision_engine_input")

          csv_files = sorted(root.rglob("*.csv"))

          if not csv_files:
              raise SystemExit(
                  "ERROR: Research Context CSV not found."
              )

          print("Research Context CSV candidates:")
          for path in csv_files:
              print(" -", path)

          preferred = [
              p for p in csv_files
              if p.name == "research_context_v1.csv"
          ]

          if preferred:
              target = preferred[0]
          else:
              target = csv_files[0]

          print()
          print("Selected input:")
          print(target)

          df = pd.read_csv(target)

          if df.empty:
              raise SystemExit(
                  "ERROR: Research Context CSV is empty."
              )

          print()
          print("Rows:", len(df))
          print("Columns:", len(df.columns))

          required_candidates = [
              "asof_date",
              "point_in_time_safe",
              "research_only",
          ]

          lower_map = {
              str(c).strip().lower(): c
              for c in df.columns
          }

          for required in required_candidates:

              if required not in lower_map:
                  print(
                      f"WARNING: Expected column '{required}' "
                      "was not found."
                  )

          pit_col = lower_map.get("point_in_time_safe")

          if pit_col is not None:

              values = (
                  df[pit_col]
                  .astype(str)
                  .str.strip()
                  .str.lower()
              )

              bad = ~values.isin(
                  [
                      "true",
                      "1",
                      "yes",
                      "y",
                      "pass",
                  ]
              )

              if bad.any():
                  raise SystemExit(
                      "ERROR: Research Context contains "
                      "non-PIT-safe rows."
                  )

          research_col = lower_map.get("research_only")

          if research_col is not None:

              values = (
                  df[research_col]
                  .astype(str)
                  .str.strip()
                  .str.lower()
              )

              bad = ~values.isin(
                  [
                      "true",
                      "1",
                      "yes",
                      "y",
                  ]
              )

              if bad.any():
                  raise SystemExit(
                      "ERROR: Research Context contains "
                      "non-research-only rows."
                  )

          print()
          print("Research Context input validation: PASS")
          PY

      # ============================================================
      # 10. RUN DECISION ENGINE
      # ============================================================
      - name: Run Decision Engine V1
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "RUNNING DECISION ENGINE V1"
          echo "============================================================"

          python tests/decision_engine/decision_engine_v1.py \
            --input-dir decision_engine_input \
            --output-dir decision_engine_output

          RC=$?

          echo
          echo "Decision Engine exit code: ${RC}"

          echo "DECISION_ENGINE_EXIT_CODE=${RC}" >> "$GITHUB_ENV"

          exit 0

      # ============================================================
      # 11. DISPLAY JSON
      # ============================================================
      - name: Display Decision Engine JSON
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DECISION ENGINE JSON"
          echo "============================================================"

          FILE="decision_engine_output/decision_engine_research_v1.json"

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Decision Engine JSON not found."
          fi

      # ============================================================
      # 12. DISPLAY CSV
      # ============================================================
      - name: Display Decision Engine CSV
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DECISION ENGINE CSV"
          echo "============================================================"

          FILE="decision_engine_output/decision_engine_research_v1.csv"

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Decision Engine CSV not found."
          fi

      # ============================================================
      # 13. DISPLAY SUMMARY
      # ============================================================
      - name: Display Decision Engine Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DECISION ENGINE SUMMARY"
          echo "============================================================"

          FILE="decision_engine_output/decision_engine_research_summary_v1.csv"

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Decision Engine summary not found."
          fi

      # ============================================================
      # 14. DISPLAY EVIDENCE
      # ============================================================
      - name: Display Decision Engine Evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DECISION ENGINE EVIDENCE"
          echo "============================================================"

          FILE="decision_engine_output/decision_engine_research_evidence_v1.csv"

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Decision Engine evidence not found."
          fi

      # ============================================================
      # 15. UPLOAD OUTPUT
      # ============================================================
      - name: Upload Decision Engine artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-engine-v1
          path: decision_engine_output/**
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 16. FINAL STATUS
      # ============================================================
      - name: Final Decision Engine Status
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "FINAL DECISION ENGINE STATUS"
          echo "============================================================"

          RC="${DECISION_ENGINE_EXIT_CODE:-999}"

          echo
          echo "Research Context artifact : ${RESEARCH_CONTEXT_ARTIFACT_ID:-unknown}"
          echo "Research Context Run      : ${RESEARCH_CONTEXT_RUN_ID:-unknown}"
          echo "Research Context created  : ${RESEARCH_CONTEXT_CREATED_AT:-unknown}"
          echo
          echo "Captured exit code: ${RC}"

          echo
          echo "Decision Engine output directory:"

          if [ -d "decision_engine_output" ]; then
            find decision_engine_output \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          else
            echo "decision_engine_output directory missing."
          fi

          echo

          if [ "$RC" -eq 0 ]; then

            echo "============================================================"
            echo "DECISION ENGINE V1: SUCCESS"
            echo "============================================================"

            exit 0
          fi

          echo "============================================================"
          echo "DECISION ENGINE V1: FAILED"
          echo "============================================================"

          echo
          echo "Exit code: ${RC}"

          exit "$RC"
