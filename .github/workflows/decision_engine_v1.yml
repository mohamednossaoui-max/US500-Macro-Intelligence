name: Decision Engine V1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  decision-engine-v1:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. PYTHON
      # ==========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pandas

      # ==========================================================
      # 4. PREPARE WORKSPACE
      # ==========================================================

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf decision_engine_input
          rm -rf decision_engine_output

          mkdir -p decision_engine_input
          mkdir -p decision_engine_output

          echo "DECISION_ENGINE_EXIT_CODE=999" >> "$GITHUB_ENV"

      # ==========================================================
      # 5. DISCOVER LATEST RESEARCH CONTEXT ARTIFACT
      # ==========================================================

      - name: Discover latest Research Context artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"

          echo "============================================================"
          echo "DISCOVERING RESEARCH CONTEXT ARTIFACT"
          echo "============================================================"

          gh api \
            --paginate \
            "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] |
              select(.expired == false) |
              select(.name == "research-context-v1") |
              [
                .id,
                .created_at,
                .archive_download_url
              ] | @tsv' \
            > /tmp/research_context_artifacts.tsv

          if [ ! -s /tmp/research_context_artifacts.tsv ]; then
            echo
            echo "ERROR: No valid research-context-v1 artifact found."
            echo "Run Research Context V1 first."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          from datetime import datetime

          source = Path("/tmp/research_context_artifacts.tsv")

          rows = []

          for line in source.read_text(
              encoding="utf-8"
          ).splitlines():

              parts = line.split("\t")

              if len(parts) != 3:
                  continue

              artifact_id, created_at, url = parts

              try:
                  dt = datetime.fromisoformat(
                      created_at.replace("Z", "+00:00")
                  )
              except Exception:
                  continue

              rows.append(
                  (
                      dt,
                      artifact_id,
                      url,
                  )
              )

          if not rows:
              raise SystemExit(
                  "No valid research-context-v1 artifact."
              )

          rows.sort(
              key=lambda x: x[0],
              reverse=True,
          )

          latest = rows[0]

          Path(
              "/tmp/latest_research_context.txt"
          ).write_text(
              "\t".join(
                  [
                      latest[1],
                      latest[0].isoformat(),
                      latest[2],
                  ]
              ),
              encoding="utf-8",
          )

          print("Latest research-context-v1:")
          print("artifact_id =", latest[1])
          print("created_at  =", latest[0].isoformat())
          PY

      # ==========================================================
      # 6. DOWNLOAD RESEARCH CONTEXT
      # ==========================================================

      - name: Download Research Context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          IFS=$'\t' read -r \
            ARTIFACT_ID \
            CREATED_AT \
            ARCHIVE_URL \
            < /tmp/latest_research_context.txt

          echo "============================================================"
          echo "DOWNLOADING RESEARCH CONTEXT"
          echo "============================================================"

          echo "Artifact ID : $ARTIFACT_ID"
          echo "Created     : $CREATED_AT"

          gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            "$ARCHIVE_URL" \
            > /tmp/research_context.zip

          if [ ! -s /tmp/research_context.zip ]; then
            echo "ERROR: downloaded artifact is empty."
            exit 1
          fi

          unzip \
            -q \
            -o \
            /tmp/research_context.zip \
            -d decision_engine_input

          echo
          echo "Downloaded files:"
          find decision_engine_input -type f -print | sort

      # ==========================================================
      # 7. LOCATE CANONICAL CSV
      # ==========================================================

      - name: Locate Research Context CSV
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "LOCATING RESEARCH CONTEXT CSV"
          echo "============================================================"

          MATCHES="$(
            find \
              decision_engine_input \
              -type f \
              -name "research_context_v1.csv" \
              -print
          )"

          if [ -z "$MATCHES" ]; then

            echo
            echo "ERROR:"
            echo "research_context_v1.csv not found."

            echo
            echo "Available CSV files:"

            find \
              decision_engine_input \
              -type f \
              -name "*.csv" \
              -print \
              | sort

            exit 1
          fi

          COUNT="$(
            printf '%s\n' "$MATCHES" |
            grep -c . || true
          )"

          if [ "$COUNT" -ne 1 ]; then

            echo
            echo "ERROR:"
            echo "Expected exactly one research_context_v1.csv."
            echo "Found: $COUNT"

            printf '%s\n' "$MATCHES"

            exit 1
          fi

          RESEARCH_CONTEXT_FILE="$(
            printf '%s\n' "$MATCHES"
          )"

          echo "$RESEARCH_CONTEXT_FILE" \
            > decision_engine_input/research_context_path.txt

          echo
          echo "Using:"
          echo "$RESEARCH_CONTEXT_FILE"

      # ==========================================================
      # 8. PRE-VALIDATE INPUT
      # ==========================================================

      - name: Validate Research Context input
        shell: bash
        run: |
          set -euo pipefail

          INPUT_FILE="$(
            cat \
              decision_engine_input/research_context_path.txt
          )"

          echo "============================================================"
          echo "PRE-VALIDATING RESEARCH CONTEXT"
          echo "============================================================"

          python - "$INPUT_FILE" <<'PY'
          import sys
          from pathlib import Path

          import pandas as pd

          path = Path(sys.argv[1])

          if not path.exists():
              raise SystemExit(
                  f"Missing input: {path}"
              )

          df = pd.read_csv(path)

          if df.empty:
              raise SystemExit(
                  "Research Context is empty."
              )

          print("Rows:", len(df))
          print("Columns:", len(df.columns))

          required = [
              "point_in_time_safe",
              "research_only",
          ]

          missing = [
              c
              for c in required
              if c not in df.columns
          ]

          if missing:
              raise SystemExit(
                  "Missing required columns: "
                  + ", ".join(missing)
              )

          def parse_bool(value):

              if isinstance(value, bool):
                  return value

              text = str(value).strip().lower()

              if text in {
                  "true",
                  "1",
                  "yes",
                  "y",
                  "pass",
              }:
                  return True

              if text in {
                  "false",
                  "0",
                  "no",
                  "n",
                  "fail",
              }:
                  return False

              return None

          pit = df[
              "point_in_time_safe"
          ].map(parse_bool)

          if pit.isna().any():
              raise SystemExit(
                  "Invalid point_in_time_safe values."
              )

          if not pit.all():
              raise SystemExit(
                  "Research Context contains PIT-unsafe rows."
              )

          research = df[
              "research_only"
          ].map(parse_bool)

          if research.isna().any():
              raise SystemExit(
                  "Invalid research_only values."
              )

          if not research.all():
              raise SystemExit(
                  "Research Context contains non-research rows."
              )

          print("PIT validation: PASS")
          print("Research-only validation: PASS")
          PY

      # ==========================================================
      # 9. RUN DECISION ENGINE
      # ==========================================================

      - name: Run Decision Engine V1
        shell: bash
        run: |
          set +e

          mkdir -p decision_engine_output

          INPUT_FILE="$(
            cat \
              decision_engine_input/research_context_path.txt
          )"

          echo "============================================================"
          echo "RUNNING DECISION ENGINE V1"
          echo "============================================================"

          echo
          echo "Input:"
          echo "$INPUT_FILE"

          echo
          echo "Python:"
          python --version

          echo
          echo "Decision Engine:"
          test -f tests/decision_engine/decision_engine_v1.py

          if [ "$?" -ne 0 ]; then

            echo "ERROR: decision_engine_v1.py not found."

            echo "1" \
              > decision_engine_output/decision_engine_exit_code.txt

            echo "DECISION_ENGINE_EXIT_CODE=1" >> "$GITHUB_ENV"

            exit 0
          fi

          python \
            tests/decision_engine/decision_engine_v1.py \
            --input "$INPUT_FILE" \
            --output-dir decision_engine_output

          RC=$?

          echo
          echo "Decision Engine exit code: $RC"

          echo "$RC" \
            > decision_engine_output/decision_engine_exit_code.txt

          echo "DECISION_ENGINE_EXIT_CODE=$RC" \
            >> "$GITHUB_ENV"

          echo
          echo "Output directory:"
          find \
            decision_engine_output \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          # Important:
          # Do NOT fail this step yet.
          # Diagnostics and artifact upload must execute.

          exit 0

      # ==========================================================
      # 10. DISPLAY JSON
      # ==========================================================

      - name: Display Decision Engine JSON
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DECISION ENGINE JSON"
          echo "============================================================"

          if [ -f \
            "decision_engine_output/decision_engine_research_v1.json"
          ]; then

            cat \
              decision_engine_output/decision_engine_research_v1.json

          else

            echo "Decision Engine JSON not found."

          fi

      # ==========================================================
      # 11. DISPLAY CSV
      # ==========================================================

      - name: Display Decision Engine CSV
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DECISION ENGINE CSV"
          echo "============================================================"

          if [ -f \
            "decision_engine_output/decision_engine_research_v1.csv"
          ]; then

            cat \
              decision_engine_output/decision_engine_research_v1.csv

          else

            echo "Decision Engine CSV not found."

          fi

      # ==========================================================
      # 12. DISPLAY SUMMARY
      # ==========================================================

      - name: Display Decision Engine Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DECISION ENGINE SUMMARY"
          echo "============================================================"

          if [ -f \
            "decision_engine_output/decision_engine_research_summary_v1.csv"
          ]; then

            cat \
              decision_engine_output/decision_engine_research_summary_v1.csv

          else

            echo "Summary not found."

          fi

      # ==========================================================
      # 13. DISPLAY EVIDENCE
      # ==========================================================

      - name: Display Decision Engine Evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DECISION ENGINE EVIDENCE"
          echo "============================================================"

          if [ -f \
            "decision_engine_output/decision_engine_research_evidence_v1.csv"
          ]; then

            cat \
              decision_engine_output/decision_engine_research_evidence_v1.csv

          else

            echo "Evidence file not found."

          fi

      # ==========================================================
      # 14. UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload Decision Engine artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-engine-v1
          path: |
            decision_engine_output/**
          if-no-files-found: warn
          retention-days: 30

      # ==========================================================
      # 15. FINAL STATUS
      # ==========================================================

      - name: Final Decision Engine Status
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL DECISION ENGINE STATUS"
          echo "============================================================"

          RC="${DECISION_ENGINE_EXIT_CODE:-999}"

          echo
          echo "Captured exit code: $RC"

          echo
          echo "Output files:"

          if [ -d "decision_engine_output" ]; then

            find \
              decision_engine_output \
              -maxdepth 2 \
              -type f \
              -print \
              | sort

          else

            echo "decision_engine_output directory missing."

          fi

          if [ "$RC" -eq 0 ]; then

            echo
            echo "============================================================"
            echo "DECISION ENGINE V1: SUCCESS"
            echo "============================================================"

            exit 0

          fi

          echo
          echo "============================================================"
          echo "DECISION ENGINE V1: FAILED"
          echo "============================================================"

          exit "$RC"
