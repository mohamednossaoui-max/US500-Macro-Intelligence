name: Decision Engine V1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  decision-engine-v1:
    name: decision-engine-v1
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pandas

      # ============================================================
      # 4. PREPARE WORKSPACE
      # ============================================================
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf decision_engine_input
          rm -rf decision_engine_output

          mkdir -p decision_engine_input
          mkdir -p decision_engine_output

          echo "DECISION_ENGINE_EXIT_CODE=999" >> "$GITHUB_ENV"

      # ============================================================
      # 5. DISCOVER LATEST RESEARCH CONTEXT
      # ============================================================
      - name: Discover latest Research Context
        id: discover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"

          echo
          echo "============================================================"
          echo "DISCOVERING LATEST RESEARCH CONTEXT ARTIFACT"
          echo "============================================================"
          echo

          gh api \
            "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '
              .artifacts[]
              | select(.expired == false)
              | select(.name == "research-context-v1")
              | select(.workflow_run != null)
              | [
                  .id,
                  .created_at,
                  .workflow_run.id,
                  .workflow_run.head_branch,
                  .workflow_run.head_sha
                ]
              | @tsv
            ' \
            > /tmp/research_context_artifacts.tsv

          if [ ! -s /tmp/research_context_artifacts.tsv ]; then
            echo "ERROR: No research-context-v1 artifact found."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          from datetime import datetime

          source = Path("/tmp/research_context_artifacts.tsv")

          rows = []

          for line in source.read_text(encoding="utf-8").splitlines():
              parts = line.split("\t")

              if len(parts) != 5:
                  continue

              artifact_id, created_at, run_id, branch, sha = parts

              if branch != "main":
                  continue

              try:
                  dt = datetime.fromisoformat(
                      created_at.replace("Z", "+00:00")
                  )
              except Exception:
                  continue

              rows.append(
                  {
                      "artifact_id": artifact_id,
                      "created_at": created_at,
                      "run_id": run_id,
                      "branch": branch,
                      "sha": sha,
                      "dt": dt,
                  }
              )

          if not rows:
              raise SystemExit(
                  "ERROR: No valid research-context-v1 artifact on main."
              )

          rows.sort(
              key=lambda x: x["dt"],
              reverse=True,
          )

          latest = rows[0]

          output = Path("/tmp/latest_research_context.env")

          output.write_text(
              "\n".join(
                  [
                      f"ARTIFACT_ID={latest['artifact_id']}",
                      f"RUN_ID={latest['run_id']}",
                      f"CREATED_AT={latest['created_at']}",
                      f"BRANCH={latest['branch']}",
                      f"SHA={latest['sha']}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )

          print("Latest Research Context selected:")
          print(f"  Artifact ID : {latest['artifact_id']}")
          print(f"  Run ID      : {latest['run_id']}")
          print(f"  Created     : {latest['created_at']}")
          print(f"  Branch      : {latest['branch']}")
          print(f"  SHA         : {latest['sha']}")
          PY

          source /tmp/latest_research_context.env

          if [ -z "${ARTIFACT_ID:-}" ]; then
            echo "ERROR: ARTIFACT_ID is empty."
            exit 1
          fi

          if [ -z "${RUN_ID:-}" ]; then
            echo "ERROR: RUN_ID is empty."
            exit 1
          fi

          {
            echo "artifact_id=${ARTIFACT_ID}"
            echo "run_id=${RUN_ID}"
            echo "created_at=${CREATED_AT}"
            echo "branch=${BRANCH}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"

          echo
          echo "============================================================"
          echo "RESEARCH CONTEXT DISCOVERY SUCCESS"
          echo "============================================================"
          echo "Artifact ID : ${ARTIFACT_ID}"
          echo "Run ID      : ${RUN_ID}"
          echo "Created     : ${CREATED_AT}"
          echo "Branch      : ${BRANCH}"
          echo "SHA         : ${SHA}"
          echo

      # ============================================================
      # 6. VERIFY ARTIFACT METADATA
      # ============================================================
      - name: Verify Research Context artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.discover.outputs.artifact_id }}
          RUN_ID: ${{ steps.discover.outputs.run_id }}
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "VERIFYING RESEARCH CONTEXT ARTIFACT"
          echo "============================================================"
          echo

          if [ -z "${ARTIFACT_ID}" ]; then
            echo "ERROR: Missing artifact ID."
            exit 1
          fi

          if [ -z "${RUN_ID}" ]; then
            echo "ERROR: Missing workflow run ID."
            exit 1
          fi

          gh api \
            "repos/${REPO}/actions/artifacts/${ARTIFACT_ID}" \
            --jq '
              {
                id: .id,
                name: .name,
                size_in_bytes: .size_in_bytes,
                expired: .expired,
                created_at: .created_at,
                updated_at: .updated_at,
                workflow_run_id: .workflow_run.id,
                workflow_run_url: .workflow_run.html_url
              }
            '

          echo
          echo "Expected workflow run: ${RUN_ID}"
          echo "Artifact verification completed."
          echo

      # ============================================================
      # 7. DOWNLOAD RESEARCH CONTEXT
      # ============================================================
      - name: Download latest Research Context artifact
        uses: actions/download-artifact@v5
        with:
          name: research-context-v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.discover.outputs.run_id }}
          path: decision_engine_input
          merge-multiple: false

      # ============================================================
      # 8. VERIFY DOWNLOAD
      # ============================================================
      - name: Verify Research Context download
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "VERIFYING RESEARCH CONTEXT DOWNLOAD"
          echo "============================================================"
          echo

          find decision_engine_input \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

          echo

          CSV_COUNT=$(find decision_engine_input -type f -name "*.csv" | wc -l)

          echo "CSV files found: ${CSV_COUNT}"

          if [ "${CSV_COUNT}" -lt 1 ]; then
            echo "ERROR: No CSV files found in Research Context artifact."
            exit 1
          fi

          echo
          echo "Research Context download verified."
          echo

      # ============================================================
      # 9. VALIDATE INPUT
      # ============================================================
      - name: Validate Research Context input
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "VALIDATING RESEARCH CONTEXT INPUT"
          echo "============================================================"
          echo

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("decision_engine_input")

          files = sorted(root.rglob("*.csv"))

          if not files:
              raise SystemExit(
                  "ERROR: No CSV files found."
              )

          print(f"CSV files discovered: {len(files)}")

          valid_files = 0

          for path in files:
              try:
                  df = pd.read_csv(path)
              except Exception as exc:
                  raise SystemExit(
                      f"ERROR: Failed reading {path}: {exc}"
                  )

              print(
                  f"{path}: rows={len(df)}, columns={len(df.columns)}"
              )

              if df.empty:
                  raise SystemExit(
                      f"ERROR: Empty CSV: {path}"
                  )

              if "point_in_time_safe" in df.columns:
                  values = (
                      df["point_in_time_safe"]
                      .dropna()
                      .astype(str)
                      .str.lower()
                      .unique()
                      .tolist()
                  )

                  bad = [
                      value
                      for value in values
                      if value not in {
                          "true",
                          "1",
                          "yes",
                          "y",
                      }
                  ]

                  if bad:
                      raise SystemExit(
                          f"ERROR: PIT violation in {path}: {bad}"
                      )

              if "research_only" in df.columns:
                  values = (
                      df["research_only"]
                      .dropna()
                      .astype(str)
                      .str.lower()
                      .unique()
                      .tolist()
                  )

                  bad = [
                      value
                      for value in values
                      if value not in {
                          "true",
                          "1",
                          "yes",
                          "y",
                      }
                  ]

                  if bad:
                      raise SystemExit(
                          f"ERROR: Research-only violation in {path}: {bad}"
                      )

              valid_files += 1

          print()
          print(
              f"Research Context validation passed: {valid_files} CSV files."
          )
          PY

          echo
          echo "============================================================"
          echo "RESEARCH CONTEXT INPUT VALIDATION PASSED"
          echo "============================================================"
          echo

      # ============================================================
      # 10. RUN DECISION ENGINE
      # ============================================================
      - name: Run Decision Engine V1
        shell: bash
        run: |
          set +e

          echo
          echo "============================================================"
          echo "RUNNING DECISION ENGINE V1"
          echo "============================================================"
          echo

          python tests/decision_engine/decision_engine_v1.py \
            --input decision_engine_input \
            --output-dir decision_engine_output

          RC=$?

          echo
          echo "Decision Engine exit code: ${RC}"
          echo

          echo "DECISION_ENGINE_EXIT_CODE=${RC}" >> "$GITHUB_ENV"

          exit 0

      # ============================================================
      # 11. DISPLAY JSON
      # ============================================================
      - name: Display Decision Engine JSON
        if: always()
        shell: bash
        run: |
          set +e

          FILE="decision_engine_output/decision_engine_research_v1.json"

          echo
          echo "============================================================"
          echo "DECISION ENGINE JSON"
          echo "============================================================"
          echo

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Decision Engine JSON not found."
          fi

      # ============================================================
      # 12. DISPLAY CSV
      # ============================================================
      - name: Display Decision Engine CSV
        if: always()
        shell: bash
        run: |
          set +e

          FILE="decision_engine_output/decision_engine_research_v1.csv"

          echo
          echo "============================================================"
          echo "DECISION ENGINE CSV"
          echo "============================================================"
          echo

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Decision Engine CSV not found."
          fi

      # ============================================================
      # 13. DISPLAY SUMMARY
      # ============================================================
      - name: Display Decision Engine Summary
        if: always()
        shell: bash
        run: |
          set +e

          FILE="decision_engine_output/decision_engine_research_summary_v1.csv"

          echo
          echo "============================================================"
          echo "DECISION ENGINE SUMMARY"
          echo "============================================================"
          echo

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Decision Engine summary not found."
          fi

      # ============================================================
      # 14. DISPLAY EVIDENCE
      # ============================================================
      - name: Display Decision Engine Evidence
        if: always()
        shell: bash
        run: |
          set +e

          FILE="decision_engine_output/decision_engine_research_evidence_v1.csv"

          echo
          echo "============================================================"
          echo "DECISION ENGINE EVIDENCE"
          echo "============================================================"
          echo

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Decision Engine evidence not found."
          fi

      # ============================================================
      # 15. UPLOAD OUTPUT
      # ============================================================
      - name: Upload Decision Engine artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-engine-v1
          path: decision_engine_output/**
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 16. FINAL STATUS
      # ============================================================
      - name: Final Decision Engine Status
        if: always()
        shell: bash
        run: |
          set +e

          RC="${DECISION_ENGINE_EXIT_CODE:-999}"

          echo
          echo "============================================================"
          echo "FINAL DECISION ENGINE STATUS"
          echo "============================================================"
          echo

          echo "Research Context artifact : ${{ steps.discover.outputs.artifact_id }}"
          echo "Research Context Run      : ${{ steps.discover.outputs.run_id }}"
          echo "Research Context created  : ${{ steps.discover.outputs.created_at }}"
          echo "Research Context branch   : ${{ steps.discover.outputs.branch }}"
          echo "Research Context SHA      : ${{ steps.discover.outputs.sha }}"
          echo

          echo "Decision Engine exit code: ${RC}"
          echo

          echo "Decision Engine output:"

          if [ -d "decision_engine_output" ]; then
            find decision_engine_output \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          else
            echo "No output directory."
          fi

          echo

          if [ "$RC" -eq 0 ]; then
            echo "============================================================"
            echo "DECISION ENGINE V1: SUCCESS"
            echo "============================================================"
            exit 0
          fi

          echo "============================================================"
          echo "DECISION ENGINE V1: FAILED"
          echo "============================================================"
          echo
          echo "Exit code: ${RC}"

          exit "$RC"
