name: Decision Engine V1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  decision-engine-v1:
    name: decision-engine-v1
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pandas

      # ============================================================
      # 4. PREPARE WORKSPACE
      # ============================================================
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf decision_engine_input
          rm -rf decision_engine_output

          mkdir -p decision_engine_input
          mkdir -p decision_engine_output

          echo "DECISION_ENGINE_EXIT_CODE=999" >> "$GITHUB_ENV"

      # ============================================================
      # 5. DISCOVER LATEST RESEARCH CONTEXT
      # ============================================================
      - name: Discover latest Research Context
        id: discover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"

          echo
          echo "============================================================"
          echo "DISCOVERING LATEST RESEARCH CONTEXT ARTIFACT"
          echo "============================================================"
          echo

          gh api \
            "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '
              .artifacts[]
              | select(.expired == false)
              | select(.name == "research-context-v1")
              | select(.workflow_run != null)
              | [
                  .id,
                  .created_at,
                  .workflow_run.id,
                  .workflow_run.head_branch,
                  .workflow_run.head_sha
                ]
              | @tsv
            ' \
            > /tmp/research_context_artifacts.tsv

          if [ ! -s /tmp/research_context_artifacts.tsv ]; then
            echo "ERROR: No research-context-v1 artifact found."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          source = Path("/tmp/research_context_artifacts.tsv")

          rows = []

          for line in source.read_text(encoding="utf-8").splitlines():
              parts = line.split("\t")

              if len(parts) != 5:
                  continue

              artifact_id, created_at, run_id, branch, sha = parts

              if branch != "main":
                  continue

              try:
                  dt = datetime.fromisoformat(
                      created_at.replace("Z", "+00:00")
                  )
              except Exception:
                  continue

              rows.append(
                  {
                      "artifact_id": artifact_id,
                      "created_at": dt,
                      "run_id": run_id,
                      "branch": branch,
                      "sha": sha,
                  }
              )

          if not rows:
              raise SystemExit(
                  "ERROR: No valid research-context-v1 artifact on main."
              )

          rows.sort(
              key=lambda x: x["created_at"],
              reverse=True,
          )

          latest = rows[0]

          output = Path("/tmp/latest_research_context.env")

          output.write_text(
              "\n".join(
                  [
                      f"artifact_id={latest['artifact_id']}",
                      f"run_id={latest['run_id']}",
                      f"created_at={latest['created_at'].isoformat()}",
                      f"branch={latest['branch']}",
                      f"sha={latest['sha']}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )

          print()
          print("LATEST RESEARCH CONTEXT")
          print("--------------------------------------------")
          print(f"Artifact ID : {latest['artifact_id']}")
          print(f"Run ID      : {latest['run_id']}")
          print(f"Created     : {latest['created_at'].isoformat()}")
          print(f"Branch      : {latest['branch']}")
          print(f"SHA         : {latest['sha']}")
          print("--------------------------------------------")
          PY

          cat /tmp/latest_research_context.env

          ARTIFACT_ID="$(grep '^artifact_id=' /tmp/latest_research_context.env | cut -d= -f2-)"
          RUN_ID="$(grep '^run_id=' /tmp/latest_research_context.env | cut -d= -f2-)"
          CREATED_AT="$(grep '^created_at=' /tmp/latest_research_context.env | cut -d= -f2-)"
          BRANCH="$(grep '^branch=' /tmp/latest_research_context.env | cut -d= -f2-)"
          SHA="$(grep '^sha=' /tmp/latest_research_context.env | cut -d= -f2-)"

          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: ARTIFACT_ID is empty."
            exit 1
          fi

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: RUN_ID is empty."
            exit 1
          fi

          {
            echo "artifact_id=$ARTIFACT_ID"
            echo "run_id=$RUN_ID"
            echo "created_at=$CREATED_AT"
            echo "branch=$BRANCH"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 6. VERIFY ARTIFACT METADATA
      # ============================================================
      - name: Verify Research Context artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.discover.outputs.artifact_id }}
          RUN_ID: ${{ steps.discover.outputs.run_id }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"

          echo
          echo "============================================================"
          echo "VERIFYING RESEARCH CONTEXT ARTIFACT"
          echo "============================================================"
          echo

          echo "Artifact ID: ${ARTIFACT_ID}"
          echo "Workflow Run: ${RUN_ID}"
          echo

          gh api \
            "repos/${REPO}/actions/artifacts/${ARTIFACT_ID}" \
            --jq '
              {
                id: .id,
                name: .name,
                size_in_bytes: .size_in_bytes,
                expired: .expired,
                created_at: .created_at,
                expires_at: .expires_at,
                workflow_run_id: .workflow_run.id,
                workflow_run_name: .workflow_run.name,
                workflow_run_head_branch: .workflow_run.head_branch,
                workflow_run_head_sha: .workflow_run.head_sha
              }
            '

      # ============================================================
      # 7. DOWNLOAD RESEARCH CONTEXT
      # ============================================================
      - name: Download latest Research Context artifact
        uses: actions/download-artifact@v5
        with:
          name: research-context-v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.discover.outputs.run_id }}
          path: decision_engine_input
          merge-multiple: false

      # ============================================================
      # 8. VERIFY DOWNLOAD
      # ============================================================
      - name: Verify Research Context download
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "RESEARCH CONTEXT DOWNLOADED FILES"
          echo "============================================================"
          echo

          find decision_engine_input \
            -maxdepth 5 \
            -type f \
            -print \
            | sort

          echo

          CSV_COUNT="$(find decision_engine_input -type f -name '*.csv' | wc -l)"

          echo "CSV count: ${CSV_COUNT}"

          if [ "$CSV_COUNT" -lt 1 ]; then
            echo "ERROR: No CSV files were downloaded."
            exit 1
          fi

      # ============================================================
      # 9. VALIDATE RESEARCH CONTEXT INPUT
      # ============================================================
      - name: Validate Research Context input
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("decision_engine_input")

          files = sorted(root.rglob("*.csv"))

          if not files:
              raise SystemExit(
                  "ERROR: No CSV files found in decision_engine_input."
              )

          print()
          print("============================================================")
          print("VALIDATING RESEARCH CONTEXT INPUT")
          print("============================================================")
          print()

          valid = 0

          for path in files:
              print(f"Checking: {path}")

              try:
                  df = pd.read_csv(path)
              except Exception as exc:
                  raise SystemExit(
                      f"ERROR: Cannot read {path}: {exc}"
                  )

              if df.empty:
                  raise SystemExit(
                      f"ERROR: Empty CSV: {path}"
                  )

              columns = {str(c).strip().lower() for c in df.columns}

              if "point_in_time_safe" in columns:
                  col = next(
                      c for c in df.columns
                      if str(c).strip().lower() == "point_in_time_safe"
                  )

                  values = (
                      df[col]
                      .astype(str)
                      .str.strip()
                      .str.lower()
                  )

                  allowed = {
                      "true",
                      "1",
                      "yes",
                      "y",
                      "t",
                  }

                  bad = ~values.isin(allowed)

                  if bad.any():
                      raise SystemExit(
                          f"ERROR: PIT violation detected in {path}"
                      )

              if "research_only" in columns:
                  col = next(
                      c for c in df.columns
                      if str(c).strip().lower() == "research_only"
                  )

                  values = (
                      df[col]
                      .astype(str)
                      .str.strip()
                      .str.lower()
                  )

                  allowed = {
                      "true",
                      "1",
                      "yes",
                      "y",
                      "t",
                  }

                  bad = ~values.isin(allowed)

                  if bad.any():
                      raise SystemExit(
                          f"ERROR: research_only violation detected in {path}"
                      )

              valid += 1

          print()
          print(f"Validated CSV files: {valid}")
          print("Research Context input validation: PASS")
          print()

          PY

      # ============================================================
      # 10. RUN DECISION ENGINE
      # ============================================================
      - name: Run Decision Engine V1
        id: run_engine
        shell: bash
        run: |
          set +e

          echo
          echo "============================================================"
          echo "RUNNING DECISION ENGINE V1"
          echo "============================================================"
          echo

          python tests/decision_engine/decision_engine_v1.py \
            --input-dir decision_engine_input \
            --output-dir decision_engine_output

          RC=$?

          echo
          echo "Decision Engine exit code: ${RC}"

          echo "DECISION_ENGINE_EXIT_CODE=${RC}" >> "$GITHUB_ENV"

          exit 0

      # ============================================================
      # 11. DISPLAY JSON
      # ============================================================
      - name: Display Decision Engine JSON
        if: always()
        shell: bash
        run: |
          set +e

          FILE="decision_engine_output/decision_engine_research_v1.json"

          echo
          echo "============================================================"
          echo "DECISION ENGINE JSON"
          echo "============================================================"
          echo

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Decision Engine JSON not found."
          fi

      # ============================================================
      # 12. DISPLAY CSV
      # ============================================================
      - name: Display Decision Engine CSV
        if: always()
        shell: bash
        run: |
          set +e

          FILE="decision_engine_output/decision_engine_research_v1.csv"

          echo
          echo "============================================================"
          echo "DECISION ENGINE CSV"
          echo "============================================================"
          echo

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Decision Engine CSV not found."
          fi

      # ============================================================
      # 13. DISPLAY SUMMARY
      # ============================================================
      - name: Display Decision Engine Summary
        if: always()
        shell: bash
        run: |
          set +e

          FILE="decision_engine_output/decision_engine_research_summary_v1.csv"

          echo
          echo "============================================================"
          echo "DECISION ENGINE SUMMARY"
          echo "============================================================"
          echo

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Decision Engine summary not found."
          fi

      # ============================================================
      # 14. DISPLAY EVIDENCE
      # ============================================================
      - name: Display Decision Engine Evidence
        if: always()
        shell: bash
        run: |
          set +e

          FILE="decision_engine_output/decision_engine_research_evidence_v1.csv"

          echo
          echo "============================================================"
          echo "DECISION ENGINE EVIDENCE"
          echo "============================================================"
          echo

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Decision Engine evidence not found."
          fi

      # ============================================================
      # 15. UPLOAD OUTPUT
      # ============================================================
      - name: Upload Decision Engine artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-engine-v1
          path: decision_engine_output/**
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 16. FINAL STATUS
      # ============================================================
      - name: Final Decision Engine Status
        if: always()
        shell: bash
        run: |
          set +e

          RC="${DECISION_ENGINE_EXIT_CODE:-999}"

          echo
          echo "============================================================"
          echo "FINAL DECISION ENGINE STATUS"
          echo "============================================================"
          echo

          echo "Research Context artifact : ${{ steps.discover.outputs.artifact_id }}"
          echo "Research Context Run      : ${{ steps.discover.outputs.run_id }}"
          echo "Research Context created  : ${{ steps.discover.outputs.created_at }}"
          echo "Research Context branch   : ${{ steps.discover.outputs.branch }}"
          echo "Research Context SHA      : ${{ steps.discover.outputs.sha }}"
          echo

          echo "Decision Engine exit code: ${RC}"
          echo

          echo "Decision Engine output:"
          if [ -d "decision_engine_output" ]; then
            find decision_engine_output \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          else
            echo "No output directory."
          fi

          echo

          if [ "$RC" -eq 0 ]; then
            echo "============================================================"
            echo "DECISION ENGINE V1: SUCCESS"
            echo "============================================================"
            exit 0
          fi

          echo "============================================================"
          echo "DECISION ENGINE V1: FAILED"
          echo "============================================================"
          echo
          echo "Exit code: ${RC}"

          exit "$RC"
