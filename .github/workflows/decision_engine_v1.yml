name: Decision Engine V1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  decision-engine-v1:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. SETUP
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pandas

      # ============================================================
      # 2. PREPARE WORKSPACE
      # ============================================================
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf decision_engine_input
          rm -rf decision_engine_output

          mkdir -p decision_engine_input
          mkdir -p decision_engine_output

          echo "DECISION_ENGINE_EXIT_CODE=999" >> "$GITHUB_ENV"

      # ============================================================
      # 3. DISCOVER LATEST RESEARCH CONTEXT ARTIFACT
      # ============================================================
      - name: Discover latest Research Context
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"

          echo
          echo "============================================================"
          echo "DISCOVERING LATEST RESEARCH CONTEXT ARTIFACT"
          echo "============================================================"
          echo

          gh api \
            "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '
              .artifacts[]
              | select(.expired == false)
              | select(.name == "research-context-v1")
              | select(.workflow_run != null)
              | [
                  .id,
                  .created_at,
                  .workflow_run.id,
                  .workflow_run.head_branch,
                  .workflow_run.head_sha
                ]
              | @tsv
            ' \
            > /tmp/research_context_artifacts.tsv

          if [ ! -s /tmp/research_context_artifacts.tsv ]; then
            echo "ERROR: No research-context-v1 artifact found."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          from datetime import datetime

          source = Path("/tmp/research_context_artifacts.tsv")

          rows = []

          for line in source.read_text(encoding="utf-8").splitlines():
              parts = line.split("\t")

              if len(parts) != 5:
                  continue

              artifact_id, created_at, run_id, branch, sha = parts

              if branch != "main":
                  continue

              try:
                  dt = datetime.fromisoformat(
                      created_at.replace("Z", "+00:00")
                  )
              except Exception:
                  continue

              rows.append(
                  {
                      "artifact_id": artifact_id,
                      "created_at": created_at,
                      "run_id": run_id,
                      "branch": branch,
                      "sha": sha,
                      "dt": dt,
                  }
              )

          if not rows:
              raise SystemExit(
                  "ERROR: No valid research-context-v1 artifact on main."
              )

          rows.sort(
              key=lambda x: x["dt"],
              reverse=True,
          )

          latest = rows[0]

          output = Path("/tmp/latest_research_context.env")

          output.write_text(
              "\n".join(
                  [
                      f"ARTIFACT_ID={latest['artifact_id']}",
                      f"CREATED_AT={latest['created_at']}",
                      f"RUN_ID={latest['run_id']}",
                      f"BRANCH={latest['branch']}",
                      f"SHA={latest['sha']}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )

          print("Latest Research Context selected:")
          print(f"Artifact ID : {latest['artifact_id']}")
          print(f"Created     : {latest['created_at']}")
          print(f"Run ID      : {latest['run_id']}")
          print(f"Branch      : {latest['branch']}")
          print(f"SHA         : {latest['sha']}")
          PY

          source /tmp/latest_research_context.env

          echo "artifact_id=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
          echo "created_at=${CREATED_AT}" >> "$GITHUB_OUTPUT"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          echo
          echo "Research Context artifact selected successfully."

      # ============================================================
      # 4. VERIFY ARTIFACT METADATA
      # ============================================================
      - name: Verify Research Context artifact metadata
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.discover.outputs.artifact_id }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"

          echo
          echo "============================================================"
          echo "VERIFYING RESEARCH CONTEXT ARTIFACT"
          echo "============================================================"
          echo

          gh api \
            "repos/${REPO}/actions/artifacts/${ARTIFACT_ID}" \
            --jq '
              {
                id: .id,
                name: .name,
                size_in_bytes: .size_in_bytes,
                expired: .expired,
                created_at: .created_at,
                updated_at: .updated_at,
                workflow_run_id: .workflow_run.id,
                workflow_run_name: .workflow_run.name,
                workflow_run_head_branch: .workflow_run.head_branch,
                workflow_run_head_sha: .workflow_run.head_sha
              }
            '

      # ============================================================
      # 5. DOWNLOAD RESEARCH CONTEXT
      # ============================================================
      - name: Download latest Research Context artifact
        uses: actions/download-artifact@v5
        with:
          name: research-context-v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.discover.outputs.run_id }}
          path: decision_engine_input

      # ============================================================
      # 6. VERIFY DOWNLOAD
      # ============================================================
      - name: Verify Research Context download
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "DOWNLOADED RESEARCH CONTEXT FILES"
          echo "============================================================"
          echo

          if [ ! -d "decision_engine_input" ]; then
            echo "ERROR: decision_engine_input directory does not exist."
            exit 1
          fi

          find decision_engine_input \
            -maxdepth 5 \
            -type f \
            -print \
            | sort

          echo

          FILE_COUNT="$(find decision_engine_input -type f | wc -l | tr -d ' ')"

          echo "Downloaded file count: ${FILE_COUNT}"

          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "ERROR: Research Context artifact contains no files."
            exit 1
          fi

      # ============================================================
      # 7. IDENTIFY EXACT RESEARCH CONTEXT CSV
      # ============================================================
      - name: Identify Research Context input CSV
        id: input
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "IDENTIFYING RESEARCH CONTEXT INPUT"
          echo "============================================================"
          echo

          INPUT_FILE=""

          # Preferred canonical filename
          CANDIDATE="$(find decision_engine_input \
            -type f \
            -name 'research_context_v1.csv' \
            -print \
            | head -n 1)"

          if [ -n "${CANDIDATE}" ]; then
            INPUT_FILE="${CANDIDATE}"
          fi

          # Fallback: tolerate artifact nesting while still requiring
          # the canonical Research Context filename.
          if [ -z "${INPUT_FILE}" ]; then
            CANDIDATE="$(find decision_engine_input \
              -type f \
              -iname '*research*context*v1*.csv' \
              -print \
              | head -n 1)"

            if [ -n "${CANDIDATE}" ]; then
              INPUT_FILE="${CANDIDATE}"
            fi
          fi

          if [ -z "${INPUT_FILE}" ]; then
            echo "ERROR: Could not locate research_context_v1.csv."
            echo
            echo "Available CSV files:"
            find decision_engine_input \
              -type f \
              -name '*.csv' \
              -print \
              | sort

            exit 1
          fi

          echo "Research Context input file:"
          echo "${INPUT_FILE}"

          echo "input_file=${INPUT_FILE}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 8. VALIDATE INPUT
      # ============================================================
      - name: Validate Research Context input
        shell: bash
        env:
          INPUT_FILE: ${{ steps.input.outputs.input_file }}
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "VALIDATING RESEARCH CONTEXT INPUT"
          echo "============================================================"
          echo

          if [ ! -f "${INPUT_FILE}" ]; then
            echo "ERROR: Input file does not exist:"
            echo "${INPUT_FILE}"
            exit 1
          fi

          echo "Input file:"
          echo "${INPUT_FILE}"
          echo

          echo "File size:"
          ls -lh "${INPUT_FILE}"
          echo

          echo "CSV header:"
          head -n 1 "${INPUT_FILE}"
          echo

          python - "${INPUT_FILE}" <<'PY'
          import sys
          from pathlib import Path
          import pandas as pd

          path = Path(sys.argv[1])

          if not path.exists():
              raise SystemExit(
                  f"ERROR: Input file does not exist: {path}"
              )

          if path.stat().st_size == 0:
              raise SystemExit(
                  f"ERROR: Input file is empty: {path}"
              )

          df = pd.read_csv(path)

          print("Rows:", len(df))
          print("Columns:", len(df.columns))
          print("Columns:")
          for column in df.columns:
              print(f"  - {column}")

          if df.empty:
              raise SystemExit(
                  "ERROR: Research Context CSV contains zero rows."
              )

          # --------------------------------------------------------
          # Point-in-time validation
          # --------------------------------------------------------
          pit_candidates = [
              "point_in_time_safe",
              "pit_safe",
              "pit",
              "research_point_in_time_safe",
          ]

          found_pit = None

          for column in pit_candidates:
              if column in df.columns:
                  found_pit = column
                  break

          if found_pit:
              values = (
                  df[found_pit]
                  .astype(str)
                  .str.strip()
                  .str.lower()
              )

              invalid = ~values.isin(
                  {
                      "true",
                      "1",
                      "yes",
                      "y",
                  }
              )

              invalid_count = int(invalid.sum())

              print(
                  f"PIT column: {found_pit}; "
                  f"invalid rows: {invalid_count}"
              )

              if invalid_count > 0:
                  raise SystemExit(
                      "ERROR: Research Context contains "
                      "non-PIT-safe rows."
                  )

          # --------------------------------------------------------
          # Research-only validation
          # --------------------------------------------------------
          research_only_candidates = [
              "research_only",
              "research_only_mode",
              "research_mode",
          ]

          found_research_only = None

          for column in research_only_candidates:
              if column in df.columns:
                  found_research_only = column
                  break

          if found_research_only:
              values = (
                  df[found_research_only]
                  .astype(str)
                  .str.strip()
                  .str.lower()
              )

              invalid = ~values.isin(
                  {
                      "true",
                      "1",
                      "yes",
                      "y",
                  }
              )

              invalid_count = int(invalid.sum())

              print(
                  f"Research-only column: "
                  f"{found_research_only}; "
                  f"invalid rows: {invalid_count}"
              )

              if invalid_count > 0:
                  raise SystemExit(
                      "ERROR: Research Context contains "
                      "non-research-only rows."
                  )

          print()
          print("Research Context input validation: PASS")
          PY

      # ============================================================
      # 9. RUN DECISION ENGINE V1
      # ============================================================
      - name: Run Decision Engine V1
        shell: bash
        env:
          INPUT_FILE: ${{ steps.input.outputs.input_file }}
        run: |
          set +e

          echo
          echo "============================================================"
          echo "RUNNING DECISION ENGINE V1"
          echo "============================================================"
          echo

          echo "Input:"
          echo "${INPUT_FILE}"
          echo

          python tests/decision_engine/decision_engine_v1.py \
            --input "${INPUT_FILE}" \
            --output-dir decision_engine_output

          RC=$?

          echo
          echo "Decision Engine exit code: ${RC}"

          echo "DECISION_ENGINE_EXIT_CODE=${RC}" >> "$GITHUB_ENV"

          exit 0

      # ============================================================
      # 10. DISPLAY JSON
      # ============================================================
      - name: Display Decision Engine JSON
        if: always()
        shell: bash
        run: |
          set +e

          FILE="decision_engine_output/decision_engine_research_v1.json"

          echo
          echo "============================================================"
          echo "DECISION ENGINE JSON"
          echo "============================================================"
          echo

          if [ -f "${FILE}" ]; then
            cat "${FILE}"
          else
            echo "Decision Engine JSON not found."
          fi

      # ============================================================
      # 11. DISPLAY CSV
      # ============================================================
      - name: Display Decision Engine CSV
        if: always()
        shell: bash
        run: |
          set +e

          FILE="decision_engine_output/decision_engine_research_v1.csv"

          echo
          echo "============================================================"
          echo "DECISION ENGINE CSV"
          echo "============================================================"
          echo

          if [ -f "${FILE}" ]; then
            cat "${FILE}"
          else
            echo "Decision Engine CSV not found."
          fi

      # ============================================================
      # 12. DISPLAY SUMMARY
      # ============================================================
      - name: Display Decision Engine Summary
        if: always()
        shell: bash
        run: |
          set +e

          FILE="decision_engine_output/decision_engine_research_summary_v1.csv"

          echo
          echo "============================================================"
          echo "DECISION ENGINE SUMMARY"
          echo "============================================================"
          echo

          if [ -f "${FILE}" ]; then
            cat "${FILE}"
          else
            echo "Decision Engine summary not found."
          fi

      # ============================================================
      # 13. DISPLAY EVIDENCE
      # ============================================================
      - name: Display Decision Engine Evidence
        if: always()
        shell: bash
        run: |
          set +e

          FILE="decision_engine_output/decision_engine_research_evidence_v1.csv"

          echo
          echo "============================================================"
          echo "DECISION ENGINE EVIDENCE"
          echo "============================================================"
          echo

          if [ -f "${FILE}" ]; then
            cat "${FILE}"
          else
            echo "Decision Engine evidence not found."
          fi

      # ============================================================
      # 14. LIST OUTPUT FILES
      # ============================================================
      - name: Verify Decision Engine outputs
        if: always()
        shell: bash
        run: |
          set +e

          echo
          echo "============================================================"
          echo "DECISION ENGINE OUTPUT FILES"
          echo "============================================================"
          echo

          if [ -d "decision_engine_output" ]; then
            find decision_engine_output \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          else
            echo "No output directory."
          fi

      # ============================================================
      # 15. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Decision Engine artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-engine-v1
          path: decision_engine_output/**
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 16. FINAL STATUS
      # ============================================================
      - name: Final Decision Engine Status
        if: always()
        shell: bash
        run: |
          set +e

          RC="${DECISION_ENGINE_EXIT_CODE:-999}"

          echo
          echo "============================================================"
          echo "FINAL DECISION ENGINE STATUS"
          echo "============================================================"
          echo

          echo "Research Context artifact : ${{ steps.discover.outputs.artifact_id }}"
          echo "Research Context Run      : ${{ steps.discover.outputs.run_id }}"
          echo "Research Context created  : ${{ steps.discover.outputs.created_at }}"
          echo "Research Context branch   : ${{ steps.discover.outputs.branch }}"
          echo "Research Context SHA      : ${{ steps.discover.outputs.sha }}"
          echo
          echo "Research Context input    : ${{ steps.input.outputs.input_file }}"
          echo
          echo "Decision Engine exit code: ${RC}"
          echo

          echo "Decision Engine output:"
          echo

          if [ -d "decision_engine_output" ]; then
            find decision_engine_output \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          else
            echo "No output directory."
          fi

          echo

          if [ "${RC}" -eq 0 ]; then
            echo "============================================================"
            echo "DECISION ENGINE V1: SUCCESS"
            echo "============================================================"
            exit 0
          fi

          echo "============================================================"
          echo "DECISION ENGINE V1: FAILED"
          echo "============================================================"
          echo
          echo "Exit code: ${RC}"

          exit "${RC}"
