name: Diagnose Decision Pipeline Call Chain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-decision-pipeline:
    name: Read-Only Decision Pipeline Diagnostic
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. REPOSITORY BASELINE
      # ============================================================
      - name: Repository baseline
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "REPOSITORY BASELINE"
          echo "READ ONLY"
          echo "========================================"
          echo

          echo "Branch:"
          git branch --show-current || true

          echo
          echo "HEAD:"
          git rev-parse HEAD

          echo
          echo "Status:"
          git status --short

          echo
          echo "========================================"

      # ============================================================
      # 3. SHOW DECISION PIPELINE CALL CHAIN
      # ============================================================
      - name: Show Decision pipeline call chain
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DECISION PIPELINE CALL CHAIN"
          echo "READ ONLY"
          echo "========================================"
          echo

          FILE=".github/workflows/autonomous-intelligence-pipeline-v1.yml"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          echo "Workflow:"
          echo "$FILE"
          echo

          echo "----------------------------------------"
          echo "LINES 700-775"
          echo "----------------------------------------"

          sed -n '700,775p' "$FILE" | nl -ba -v700

          echo
          echo "----------------------------------------"
          echo "DECISION-RELATED COMMANDS"
          echo "----------------------------------------"

          grep -nEi \
            'decision_engine|decision_intelligence|decision.*research|snapshot|publish|manifest' \
            "$FILE" || true

          echo
          echo "========================================"
          echo "CALL CHAIN DIAGNOSTIC COMPLETE"
          echo "NO FILES MODIFIED"
          echo "========================================"

      # ============================================================
      # 4. LOCATE DECISION ENGINE INVOCATIONS
      # ============================================================
      - name: Find Decision Engine invocations
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DECISION ENGINE INVOCATIONS"
          echo "READ ONLY"
          echo "========================================"
          echo

          grep -RniE \
            --exclude-dir=.git \
            --exclude='*.pyc' \
            'python[[:space:]]+.*decision.*engine|decision_engine_research|decision_intelligence_v2\.py' \
            .github scripts *.py 2>/dev/null || true

          echo
          echo "========================================"
          echo "INVOCATION SEARCH COMPLETE"
          echo "========================================"

      # ============================================================
      # 5. INSPECT DECISION INTELLIGENCE INVOCATION CONTEXT
      # ============================================================
      - name: Inspect Decision Intelligence invocation context
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DECISION INTELLIGENCE INVOCATION CONTEXT"
          echo "READ ONLY"
          echo "========================================"
          echo

          FILE=".github/workflows/autonomous-intelligence-pipeline-v1.yml"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          LINE="$(
            grep -n 'python decision_intelligence_v2.py' "$FILE" \
              | head -1 \
              | cut -d: -f1 || true
          )"

          if [ -z "$LINE" ]; then
            echo "STATUS: decision_intelligence_v2.py invocation not found."
            exit 0
          fi

          echo "Invocation line: $LINE"
          echo

          START=$((LINE - 50))
          END=$((LINE + 25))

          if [ "$START" -lt 1 ]; then
            START=1
          fi

          echo "----------------------------------------"
          echo "SHOWING WORKFLOW LINES $START-$END"
          echo "----------------------------------------"

          sed -n "${START},${END}p" "$FILE" \
            | nl -ba -v"$START"

          echo
          echo "========================================"
          echo "INVOCATION CONTEXT COMPLETE"
          echo "========================================"

      # ============================================================
      # 6. INSPECT DECISION INTELLIGENCE PRODUCER
      # ============================================================
      - name: Inspect Decision Intelligence producer
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DECISION INTELLIGENCE PRODUCER"
          echo "READ ONLY"
          echo "========================================"
          echo

          FILE="decision_intelligence_v2.py"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          echo "File:"
          echo "$FILE"
          echo

          echo "----------------------------------------"
          echo "FULL FILE WITH LINE NUMBERS"
          echo "----------------------------------------"

          nl -ba "$FILE"

          echo
          echo "========================================"
          echo "PRODUCER INSPECTION COMPLETE"
          echo "========================================"

      # ============================================================
      # 7. INSPECT CURRENT CANONICAL DECISION ARTIFACTS
      #    NO PANDAS — PYTHON STANDARD LIBRARY ONLY
      # ============================================================
      - name: Inspect current canonical Decision artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CURRENT CANONICAL DECISION ARTIFACTS"
          echo "READ ONLY"
          echo "========================================"
          echo

          FILES=(
            "public_data/decision_engine_research_summary_v1.csv"
            "public_data/decision_engine_research_v1.csv"
            "public_data/decision_engine_research_v1.json"
            "public_data/decision_intelligence_v2.json"
            "public_data/decision_intelligence_summary_v2.csv"
          )

          for FILE in "${FILES[@]}"; do

            echo
            echo "----------------------------------------"
            echo "$FILE"
            echo "----------------------------------------"

            if [ ! -f "$FILE" ]; then
              echo "STATUS: MISSING"
              continue
            fi

            echo "STATUS: PRESENT"
            echo "SIZE: $(wc -c < "$FILE") bytes"

            case "$FILE" in

              *.json)

                python - "$FILE" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          try:
              with open(path, "r", encoding="utf-8") as f:
                  obj = json.load(f)

              print("JSON root type:", type(obj).__name__)

              if isinstance(obj, dict):

                  relevant_keys = [
                      "context_date",
                      "decision_state",
                      "state",
                      "what_changed",
                      "current_environment",
                  ]

                  found = False

                  for key in relevant_keys:
                      if key in obj:
                          print(f"{key}: {obj[key]}")
                          found = True

                  if not found:
                      print(
                          "Relevant top-level keys not found."
                      )
                      print(
                          "Available keys:",
                          list(obj.keys())
                      )

              elif isinstance(obj, list):

                  print("JSON list length:", len(obj))

                  if obj and isinstance(obj[0], dict):

                      print(
                          "First item keys:",
                          list(obj[0].keys())
                      )

                      for key in [
                          "context_date",
                          "decision_state",
                          "state",
                          "what_changed",
                      ]:
                          if key in obj[0]:
                              print(
                                  f"{key}: {obj[0][key]}"
                              )

          except Exception as exc:
              print(
                  "INSPECTION ERROR:",
                  type(exc).__name__,
                  str(exc)
              )
          PY
                ;;

              *.csv)

                python - "$FILE" <<'PY'
          import csv
          import sys

          path = sys.argv[1]

          try:
              with open(
                  path,
                  "r",
                  encoding="utf-8-sig",
                  newline=""
              ) as f:

                  reader = csv.DictReader(f)

                  columns = reader.fieldnames or []
                  first_row = next(reader, None)

              print("columns:", columns)

              if first_row is None:
                  print("rows: 0")

              else:
                  print("first row detected: YES")

                  relevant_keys = [
                      "context_date",
                      "decision_state",
                      "state",
                      "what_changed",
                  ]

                  found = False

                  for key in relevant_keys:
                      if key in first_row:
                          print(
                              f"{key}: {first_row.get(key)}"
                          )
                          found = True

                  if not found:
                      print(
                          "Relevant fields not found "
                          "in first row."
                      )

          except Exception as exc:
              print(
                  "INSPECTION ERROR:",
                  type(exc).__name__,
                  str(exc)
              )
          PY
                ;;

              *)

                echo "Unsupported diagnostic file type."
                ;;

            esac

          done

          echo
          echo "========================================"
          echo "CANONICAL ARTIFACT INSPECTION COMPLETE"
          echo "NO FILES MODIFIED"
          echo "========================================"

      # ============================================================
      # 8. FIND SNAPSHOT / HISTORY / WHAT_CHANGED LOGIC
      # ============================================================
      - name: Find snapshot and history logic
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SNAPSHOT / HISTORY / WHAT_CHANGED LOGIC"
          echo "READ ONLY"
          echo "========================================"
          echo

          grep -RniE \
            --exclude-dir=.git \
            --exclude='*.pyc' \
            --exclude='manifest.json' \
            'prior canonical|previous canonical|canonical snapshot|snapshot|what_changed|what changed|decision history|historical decision' \
            . 2>/dev/null || true

          echo
          echo "========================================"
          echo "SNAPSHOT / HISTORY SEARCH COMPLETE"
          echo "========================================"

      # ============================================================
      # 9. SHOW RECENT DECISION ARTIFACT GIT HISTORY
      # ============================================================
      - name: Show recent Decision artifact git history
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "RECENT DECISION ARTIFACT HISTORY"
          echo "READ ONLY"
          echo "========================================"
          echo

          FILES=(
            "public_data/decision_engine_research_summary_v1.csv"
            "public_data/decision_engine_research_v1.csv"
            "public_data/decision_engine_research_v1.json"
            "public_data/decision_intelligence_v2.json"
            "public_data/decision_intelligence_summary_v2.csv"
          )

          for FILE in "${FILES[@]}"; do

            echo
            echo "----------------------------------------"
            echo "$FILE"
            echo "----------------------------------------"

            if git ls-files --error-unmatch "$FILE" \
              >/dev/null 2>&1; then

              git log \
                --date=iso \
                --format='%h | %ad | %s' \
                -8 \
                -- "$FILE" || true

            else
              echo "STATUS: not tracked by git"
            fi

          done

          echo
          echo "========================================"
          echo "ARTIFACT HISTORY COMPLETE"
          echo "========================================"

      # ============================================================
      # 10. INSPECT HISTORICAL DECISION VALUES DIRECTLY FROM GIT
      #     READ ONLY
      # ============================================================
      - name: Inspect historical Decision values from git
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "HISTORICAL DECISION VALUES FROM GIT"
          echo "READ ONLY"
          echo "========================================"
          echo

          python <<'PY'
          import csv
          import io
          import json
          import subprocess

          FILES = [
              "public_data/decision_engine_research_summary_v1.csv",
              "public_data/decision_engine_research_v1.csv",
              "public_data/decision_engine_research_v1.json",
              "public_data/decision_intelligence_v2.json",
          ]

          def run_git(*args):
              result = subprocess.run(
                  ["git", *args],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              return result.returncode, result.stdout

          def inspect_csv(text):
              reader = csv.DictReader(
                  io.StringIO(text)
              )

              row = next(reader, None)

              if row is None:
                  return None, None, None

              context = row.get("context_date")

              state = (
                  row.get("decision_state")
                  or row.get("state")
              )

              changed = row.get("what_changed")

              return context, state, changed

          def inspect_json(text):
              try:
                  obj = json.loads(text)
              except Exception:
                  return None, None, None

              if isinstance(obj, list):
                  if not obj:
                      return None, None, None
                  obj = obj[0]

              if not isinstance(obj, dict):
                  return None, None, None

              context = obj.get("context_date")

              state = (
                  obj.get("decision_state")
                  or obj.get("state")
              )

              changed = obj.get("what_changed")

              return context, state, changed

          for path in FILES:

              print()
              print("-" * 72)
              print(path)
              print("-" * 72)

              rc, history = run_git(
                  "log",
                  "--format=%H",
                  "-6",
                  "--",
                  path,
              )

              commits = [
                  x.strip()
                  for x in history.splitlines()
                  if x.strip()
              ]

              if not commits:
                  print("No git history found.")
                  continue

              for commit in commits:

                  rc, text = run_git(
                      "show",
                      f"{commit}:{path}",
                  )

                  if rc != 0:
                      continue

                  if path.endswith(".json"):
                      context, state, changed = (
                          inspect_json(text)
                      )
                  else:
                      context, state, changed = (
                          inspect_csv(text)
                      )

                  rc, meta = run_git(
                      "show",
                      "-s",
                      "--format=%h | %aI | %s",
                      commit,
                  )

                  meta = meta.strip()

                  print(
                      f"{meta} | "
                      f"context={context or '—'} | "
                      f"state={state or '—'} | "
                      f"what_changed={changed or '—'}"
                  )

                  if isinstance(changed, dict):
                      reason = changed.get("reason")

                      if reason:
                          print(
                              "    reason:",
                              reason
                          )

          print()
          print("=" * 72)
          print(
              "HISTORICAL INSPECTION COMPLETE "
              "— NO FILES MODIFIED"
          )
          print("=" * 72)
          PY

      # ============================================================
      # 11. VERIFY READ-ONLY CONTRACT
      # ============================================================
      - name: Verify workflow remained read only
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "READ-ONLY VERIFICATION"
          echo "========================================"
          echo

          STATUS="$(git status --porcelain)"

          if [ -n "$STATUS" ]; then

            echo "ERROR:"
            echo "Diagnostic workflow changed repository files."
            echo

            echo "$STATUS"

            exit 1
          fi

          echo "PASS: repository working tree remains unchanged."
          echo "PASS: no Decision artifacts were generated."
          echo "PASS: no Decision Engine was executed."
          echo "PASS: no publication files were modified."
          echo "PASS: no manifest was rebuilt."
          echo

          echo "READ-ONLY DIAGNOSTIC PASSED"
          echo "========================================"

      # ============================================================
      # 12. FINAL SUMMARY
      # ============================================================
      - name: Diagnostic summary
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DECISION PIPELINE DIAGNOSTIC COMPLETE"
          echo "========================================"
          echo

          echo "Completed:"
          echo
          echo "  [1] Repository baseline"
          echo "  [2] Master pipeline ordering"
          echo "  [3] Decision Engine invocation search"
          echo "  [4] Decision Intelligence call context"
          echo "  [5] Decision Intelligence producer"
          echo "  [6] Current canonical artifacts"
          echo "  [7] Snapshot/history logic search"
          echo "  [8] Artifact git history"
          echo "  [9] Historical Decision values"
          echo " [10] Read-only verification"
          echo

          echo "No production logic was executed."
          echo "No research dataset was regenerated."
          echo "No Decision state was changed."
          echo "No manifest was changed."
          echo

          echo "SAFE TO REVIEW RESULTS"
          echo
          echo "========================================"
