name: Test Earnings Market Reaction V3

on:
  workflow_dispatch:

jobs:
  earnings-reaction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance

      - name: Verify required Python files
        run: |
          test -f earnings_breadth_v2.py
          test -f earnings_reaction_v3.py
          python -m py_compile earnings_breadth_v2.py
          python -m py_compile earnings_reaction_v3.py

      - name: Build Earnings Breadth V2 dataset
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ALPHAVANTAGE_REQUEST_DELAY: "1.5"
        run: |
          python earnings_breadth_v2.py

      - name: Verify generated V2 input
        run: |
          test -f earnings_breadth_events_v2.csv
          ls -lh earnings_breadth_events_v2.csv

      - name: Run Earnings Market Reaction V3
        run: |
          python earnings_reaction_v3.py

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lh earnings_market_reaction_v3.csv || true
          ls -lh earnings_market_reaction_summary_v3.csv || true
          ls -lh earnings_reaction_by_eps_class_v3.csv || true
          ls -lh earnings_reaction_by_sector_v3.csv || true

      - name: Upload V3 results
        uses: actions/upload-artifact@v4
        with:
          name: earnings-market-reaction-v3-results
          path: |
            earnings_market_reaction_v3.csv
            earnings_market_reaction_summary_v3.csv
            earnings_reaction_by_eps_class_v3.csv
            earnings_reaction_by_sector_v3.csv
