name: Economic Intelligence Full Pipeline v1

on:
  workflow_dispatch:

  push:
    paths:
      - "economic_historical_collector_v1_5.py"
      - "economic_surprise_engine_v1.py"
      - "economic_regime_classifier_v1.py"
      - ".github/workflows/economic_intelligence_full_pipeline_v1.yml"

jobs:
  economic-intelligence:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy


      # ============================================================
      # 4. ECONOMIC HISTORICAL COLLECTOR v1.5
      # ============================================================

      - name: Run Economic Historical Collector v1.5
        run: |
          python "./economic_historical_collector_v1_5.py"


      # ============================================================
      # 5. VALIDATE HISTORICAL DATA
      # ============================================================

      - name: Validate Historical Data
        run: |
          test -f economic_historical_events_v1.csv
          test -f economic_historical_quality_v1.csv

          python - <<'PY'
          import pandas as pd

          events = pd.read_csv(
              "economic_historical_events_v1.csv"
          )

          quality = pd.read_csv(
              "economic_historical_quality_v1.csv"
          )

          print("=" * 72)
          print("HISTORICAL DATA VALIDATION")
          print("=" * 72)

          print(
              f"Historical events: {len(events)}"
          )

          print(
              f"Quality rows: {len(quality)}"
          )

          # --------------------------------------------------------
          # BASIC VALIDATION
          # --------------------------------------------------------

          if len(events) == 0:
              raise SystemExit(
                  "ERROR: Historical events file is empty."
              )

          if len(quality) == 0:
              raise SystemExit(
                  "ERROR: Historical quality file is empty."
              )

          # --------------------------------------------------------
          # EXPECTED TOTAL
          # --------------------------------------------------------

          if len(events) != 48:
              raise SystemExit(
                  f"ERROR: Expected 48 historical records, "
                  f"found {len(events)}."
              )

          if len(quality) != 48:
              raise SystemExit(
                  f"ERROR: Expected 48 quality rows, "
                  f"found {len(quality)}."
              )

          # --------------------------------------------------------
          # REQUIRED EVENT COLUMNS
          # --------------------------------------------------------

          required_events = {
              "indicator",
              "agency",
              "release_date",
              "release_time",
              "reference_period",
              "actual",
              "vintage_date",
              "source",
              "source_url"
          }

          missing_events = (
              required_events - set(events.columns)
          )

          if missing_events:
              raise SystemExit(
                  "ERROR: Missing event columns: "
                  f"{sorted(missing_events)}"
              )

          # --------------------------------------------------------
          # REQUIRED QUALITY COLUMNS
          # --------------------------------------------------------

          required_quality = {
              "record_id",
              "indicator",
              "agency",
              "release_date",
              "reference_period",
              "point_in_time_safe",
              "quality_issues",
              "historical_consensus_available"
          }

          missing_quality = (
              required_quality - set(quality.columns)
          )

          if missing_quality:
              raise SystemExit(
                  "ERROR: Missing quality columns: "
                  f"{sorted(missing_quality)}"
              )

          # --------------------------------------------------------
          # PIT SAFETY
          # --------------------------------------------------------

          safe = (
              quality["point_in_time_safe"]
              .astype(str)
              .str.strip()
              .str.upper()
              .isin(["TRUE", "1", "YES"])
          )

          safe_count = int(safe.sum())

          print(
              f"PIT safe: {safe_count}/{len(quality)}"
          )

          if safe_count != len(quality):

              print("\nPIT UNSAFE RECORDS:")

              print(
                  quality.loc[
                      ~safe,
                      [
                          "record_id",
                          "indicator",
                          "release_date",
                          "quality_issues"
                      ]
                  ].to_string(index=False)
              )

              raise SystemExit(
                  "ERROR: Historical data contains "
                  "PIT-unsafe records."
              )

          # --------------------------------------------------------
          # DUPLICATE OBSERVATIONS
          # --------------------------------------------------------

          duplicate_subset = [
              "indicator",
              "agency",
              "release_date",
              "release_time",
              "reference_period",
              "source_url"
          ]

          if events.duplicated(
              subset=duplicate_subset
          ).any():

              print("\nDUPLICATE RECORDS:")

              print(
                  events.loc[
                      events.duplicated(
                          subset=duplicate_subset,
                          keep=False
                      ),
                      duplicate_subset
                  ].to_string(index=False)
              )

              raise SystemExit(
                  "ERROR: Duplicate historical "
                  "observations detected."
              )

          # --------------------------------------------------------
          # DUPLICATE RECORD IDs
          # --------------------------------------------------------

          if quality["record_id"].duplicated().any():

              print("\nDUPLICATE RECORD IDs:")

              print(
                  quality.loc[
                      quality["record_id"].duplicated(
                          keep=False
                      ),
                      [
                          "record_id",
                          "indicator",
                          "release_date"
                      ]
                  ].to_string(index=False)
              )

              raise SystemExit(
                  "ERROR: Duplicate record_id detected."
              )

          # --------------------------------------------------------
          # HISTORICAL CONSENSUS GATE
          # --------------------------------------------------------

          consensus_count = int(
              quality[
                  "historical_consensus_available"
              ]
              .astype(str)
              .str.strip()
              .str.upper()
              .isin(["TRUE", "1", "YES"])
              .sum()
          )

          print(
              f"Historical consensus: "
              f"{consensus_count}/{len(quality)}"
          )

          if consensus_count != 0:
              raise SystemExit(
                  "ERROR: Unexpected historical consensus "
                  "was introduced."
              )

          # --------------------------------------------------------
          # INDICATOR UNIVERSE
          # --------------------------------------------------------

          indicators = sorted(
              events["indicator"]
              .dropna()
              .unique()
              .tolist()
          )

          print(
              f"Indicators: {len(indicators)}"
          )

          print("\nIndicators:")

          for indicator in indicators:

              count = int(
                  (
                      events["indicator"] == indicator
                  ).sum()
              )

              print(
                  f"  {indicator}: {count}"
              )

          expected_indicators = {
              "CPI",
              "CORE_CPI",
              "NFP",
              "UNEMPLOYMENT_RATE",
              "INITIAL_JOBLESS_CLAIMS",
              "ISM_MANUFACTURING_PMI",
              "GDP"
          }

          if set(indicators) != expected_indicators:
              raise SystemExit(
                  "ERROR: Indicator universe mismatch."
              )

          # --------------------------------------------------------
          # 2023 BATCH
          #
          # v1.5 total:
          # 10 newly added 2023 records
          # + 4 existing 2023 records
          # = 14
          # --------------------------------------------------------

          batch_2023 = events[
              events["release_date"]
              .astype(str)
              .str.startswith("2023-")
          ]

          print(
              f"\n2023 records: {len(batch_2023)}"
          )

          if len(batch_2023) != 14:
              raise SystemExit(
                  f"ERROR: Expected 14 records in "
                  f"the 2023 batch, found "
                  f"{len(batch_2023)}."
              )

          print(
              "\n" + "=" * 72
          )

          print(
              "HISTORICAL DATA VALIDATION: PASS"
          )

          print(
              "=" * 72
          )

          PY


      # ============================================================
      # 6. ECONOMIC SURPRISE ENGINE
      # ============================================================

      - name: Run Economic Surprise Engine
        run: |
          python "./economic_surprise_engine_v1.py"


      # ============================================================
      # 7. VALIDATE SURPRISE ENGINE
      # ============================================================

      - name: Validate Surprise Engine
        run: |
          test -f economic_surprise_engine_v1.csv
          test -f economic_surprise_summary_v1.csv

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv(
              "economic_surprise_engine_v1.csv"
          )

          print("=" * 72)
          print("ECONOMIC SURPRISE ENGINE VALIDATION")
          print("=" * 72)

          print(
              f"Surprise Engine rows: {len(df)}"
          )

          if len(df) == 0:
              raise SystemExit(
                  "ERROR: Economic Surprise Engine "
                  "output is empty."
              )

          # --------------------------------------------------------
          # REQUIRED COLUMNS
          # --------------------------------------------------------

          required = {
              "pit_safe",
              "directional_shock_z"
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  "ERROR: Surprise Engine is missing: "
                  f"{sorted(missing)}"
              )

          # --------------------------------------------------------
          # PIT SAFETY
          # --------------------------------------------------------

          safe = (
              df["pit_safe"]
              .astype(str)
              .str.strip()
              .str.upper()
              .isin(["TRUE", "1", "YES"])
          )

          safe_count = int(safe.sum())

          print(
              f"PIT safe: {safe_count}/{len(df)}"
          )

          if safe_count != len(df):
              raise SystemExit(
                  "ERROR: Surprise Engine contains "
                  "PIT-unsafe records."
              )

          # --------------------------------------------------------
          # CONSENSUS INFORMATION
          # --------------------------------------------------------

          if "surprise_method" in df.columns:

              print("\nSurprise methods:")

              print(
                  df["surprise_method"]
                  .value_counts(dropna=False)
                  .to_string()
              )

          # --------------------------------------------------------
          # Z-SCORE COVERAGE
          # --------------------------------------------------------

          z_count = int(
              df["directional_shock_z"]
              .notna()
              .sum()
          )

          print(
              f"\nPIT-safe z-scores: "
              f"{z_count}/{len(df)}"
          )

          print(
              "\n" + "=" * 72
          )

          print(
              "SURPRISE ENGINE VALIDATION: PASS"
          )

          print(
              "=" * 72
          )

          PY


      # ============================================================
      # 8. ECONOMIC REGIME CLASSIFIER
      # ============================================================

      - name: Run Economic Regime Classifier
        run: |
          python "./economic_regime_classifier_v1.py"


      # ============================================================
      # 9. VALIDATE ECONOMIC REGIME
      # ============================================================

      - name: Validate Economic Regime
        run: |
          test -f economic_regime_events_v1.csv
          test -f economic_regime_summary_v1.csv

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          print("=" * 72)
          print("ECONOMIC REGIME VALIDATION")
          print("=" * 72)

          print(
              f"Regime observations: {len(df)}"
          )

          if len(df) == 0:
              raise SystemExit(
                  "ERROR: Economic Regime output "
                  "is empty."
              )

          # --------------------------------------------------------
          # REQUIRED COLUMNS
          # --------------------------------------------------------

          required = {
              "release_date",
              "inflation_score",
              "labor_score",
              "growth_score",
              "economic_regime",
              "pit_safe"
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  "ERROR: Missing regime columns: "
                  f"{sorted(missing)}"
              )

          # --------------------------------------------------------
          # PIT SAFETY
          # --------------------------------------------------------

          safe = (
              df["pit_safe"]
              .astype(str)
              .str.strip()
              .str.upper()
              .isin(["TRUE", "1", "YES"])
          )

          if not safe.all():
              raise SystemExit(
                  "ERROR: Regime output contains "
                  "PIT-unsafe rows."
              )

          # --------------------------------------------------------
          # REGIME DISTRIBUTION
          # --------------------------------------------------------

          print("\nRegime distribution:")

          print(
              df["economic_regime"]
              .value_counts(dropna=False)
              .to_string()
          )

          # --------------------------------------------------------
          # SCORE COVERAGE
          # --------------------------------------------------------

          print("\nScore coverage:")

          for column in [
              "inflation_score",
              "labor_score",
              "growth_score"
          ]:

              count = int(
                  df[column].notna().sum()
              )

              print(
                  f"  {column}: "
                  f"{count}/{len(df)}"
              )

          print(
              "\n" + "=" * 72
          )

          print(
              "ECONOMIC REGIME VALIDATION: PASS"
          )

          print(
              "=" * 72
          )

          PY


      # ============================================================
      # 10. UPLOAD ALL ECONOMIC INTELLIGENCE ARTIFACTS
      # ============================================================

      - name: Upload Economic Intelligence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v1
          path: |
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv
          if-no-files-found: error


      # ============================================================
      # 11. FINAL PIPELINE STATUS
      # ============================================================

      - name: Economic Intelligence Pipeline Complete
        run: |
          echo "============================================================"
          echo "US500 MACRO INTELLIGENCE"
          echo "ECONOMIC INTELLIGENCE PIPELINE v1"
          echo "============================================================"
          echo ""
          echo "Historical Collector v1.5:  PASS"
          echo "Historical PIT Gate:        PASS"
          echo "Historical Integrity:       PASS"
          echo "Economic Surprise Engine:   PASS"
          echo "Economic Regime Classifier: PASS"
          echo "Artifacts:                  UPLOADED"
          echo ""
          echo "Research-only."
          echo "No Decision Engine integration."
          echo "No trading signal generated."
