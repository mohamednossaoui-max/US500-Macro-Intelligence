name: Economic Intelligence Full Pipeline v1

on:
  workflow_dispatch:

jobs:
  economic-intelligence:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy


      # ============================================================
      # 4. VERIFY REQUIRED FILES
      # ============================================================
      - name: Verify Economic Intelligence files
        run: |
          python -c '
          import os

          required = [
              "economic_historical_collector_v1_5.py",
              "economic_surprise_engine_v1.py",
              "economic_regime_classifier_v1.3.py"
          ]

          print("=" * 72)
          print("VERIFYING ECONOMIC INTELLIGENCE FILES")
          print("=" * 72)

          for file in required:
              if not os.path.exists(file):
                  raise RuntimeError(
                      f"Missing required file: {file}"
                  )

              print(f"[OK] {file}")

          print("")
          print("All required files found.")
          '


      # ============================================================
      # 5. RUN HISTORICAL COLLECTOR
      # ============================================================
      - name: Run Economic Historical Collector v1.5
        run: |
          python economic_historical_collector_v1_5.py \
            > collector_output.txt 2>&1

          cat collector_output.txt


      # ============================================================
      # 6. VALIDATE HISTORICAL DATA
      # ============================================================
      - name: Validate Economic Historical Data
        run: |
          python -c '
          import pandas as pd

          events = pd.read_csv(
              "economic_historical_events_v1.csv"
          )

          quality = pd.read_csv(
              "economic_historical_quality_v1.csv"
          )

          print("=" * 72)
          print("VALIDATING ECONOMIC HISTORICAL DATA")
          print("=" * 72)

          print(f"Historical events: {len(events)}")
          print(f"Quality rows: {len(quality)}")

          if len(events) != 48:
              raise RuntimeError(
                  f"Expected 48 historical records, got {len(events)}"
              )

          if len(quality) != 48:
              raise RuntimeError(
                  f"Expected 48 quality records, got {len(quality)}"
              )

          required_events = [
              "indicator",
              "agency",
              "release_date",
              "release_time",
              "reference_period",
              "actual"
          ]

          for col in required_events:
              if col not in events.columns:
                  raise RuntimeError(
                      f"Missing historical event column: {col}"
                  )

          required_quality = [
              "indicator",
              "agency",
              "release_date",
              "reference_period",
              "point_in_time_safe",
              "quality_issues",
              "historical_consensus_available"
          ]

          for col in required_quality:
              if col not in quality.columns:
                  raise RuntimeError(
                      f"Missing historical quality column: {col}"
                  )

          pit = quality[
              "point_in_time_safe"
          ].fillna(False)

          if not pit.all():
              raise RuntimeError(
                  "Historical PIT quality gate failed."
              )

          issues = (
              quality["quality_issues"]
              .fillna("")
              .astype(str)
              .str.strip()
          )

          if (issues != "").any():
              bad = quality.loc[
                  issues != "",
                  [
                      "indicator",
                      "release_date",
                      "quality_issues"
                  ]
              ]

              print(bad.to_string(index=False))

              raise RuntimeError(
                  "Historical data contains quality issues."
              )

          consensus = quality[
              "historical_consensus_available"
          ].fillna(False)

          if consensus.any():
              raise RuntimeError(
                  "Historical consensus detected unexpectedly."
              )

          indicators = events[
              "indicator"
          ].dropna().unique()

          if len(indicators) != 7:
              raise RuntimeError(
                  f"Expected 7 indicators, got {len(indicators)}"
              )

          release_dates = pd.to_datetime(
              events["release_date"],
              errors="coerce"
          )

          records_2023 = (
              release_dates.dt.year == 2023
          ).sum()

          if records_2023 != 14:
              raise RuntimeError(
                  f"Expected 14 records from 2023 batch, got {records_2023}"
              )

          duplicate_subset = [
              "indicator",
              "agency",
              "release_date",
              "release_time",
              "reference_period",
              "source_url"
          ]

          existing_subset = [
              c for c in duplicate_subset
              if c in events.columns
          ]

          duplicates = events.duplicated(
              subset=existing_subset
          ).sum()

          if duplicates:
              raise RuntimeError(
                  f"Duplicate historical records detected: {duplicates}"
              )

          print("")
          print("HISTORICAL DATA QUALITY")
          print("-" * 72)
          print(f"PIT safe: {int(pit.sum())}/{len(pit)}")
          print(
              f"Historical consensus: "
              f"{int(consensus.sum())}/{len(consensus)}"
          )
          print(f"Indicators: {len(indicators)}")
          print(f"2023 records: {records_2023}")

          print("")
          print("ECONOMIC HISTORICAL QUALITY GATE: PASS")
          '


      # ============================================================
      # 7. RUN SURPRISE ENGINE
      # ============================================================
      - name: Run Economic Surprise Engine v1.0
        run: |
          python economic_surprise_engine_v1.py \
            > surprise_output.txt 2>&1

          cat surprise_output.txt


      # ============================================================
      # 8. VALIDATE SURPRISE ENGINE
      # ============================================================
      - name: Validate Economic Surprise Engine
        run: |
          python -c '
          import pandas as pd

          df = pd.read_csv(
              "economic_surprise_engine_v1.csv"
          )

          summary = pd.read_csv(
              "economic_surprise_summary_v1.csv"
          )

          print("=" * 72)
          print("VALIDATING ECONOMIC SURPRISE ENGINE v1.0")
          print("=" * 72)

          print(f"Records: {len(df)}")
          print(f"Summary rows: {len(summary)}")

          if len(df) != 48:
              raise RuntimeError(
                  f"Expected 48 surprise records, got {len(df)}"
              )

          if len(summary) == 0:
              raise RuntimeError(
                  "Surprise summary is empty."
              )

          required_columns = [
              "indicator",
              "release_date",
              "directional_release_shock",
              "research_only",
              "decision_engine_ready"
          ]

          for col in required_columns:
              if col not in df.columns:
                  raise RuntimeError(
                      f"Missing surprise column: {col}"
                  )

          indicators = df[
              "indicator"
          ].dropna().unique()

          if len(indicators) != 7:
              raise RuntimeError(
                  f"Expected 7 indicators, got {len(indicators)}"
              )

          shocks = df[
              "directional_release_shock"
          ]

          shock_count = shocks.notna().sum()

          if shock_count <= 0:
              raise RuntimeError(
                  "No directional release shocks were generated."
              )

          research_only = df[
              "research_only"
          ].fillna(False)

          if not research_only.all():
              raise RuntimeError(
                  "Surprise Engine research-only gate failed."
              )

          decision_ready = df[
              "decision_engine_ready"
          ].fillna(True)

          if decision_ready.any():
              raise RuntimeError(
                  "Surprise Engine Decision Engine integration "
                  "must remain disabled."
              )

          dates = pd.to_datetime(
              df["release_date"],
              errors="coerce"
          )

          if dates.isna().any():
              raise RuntimeError(
                  "Invalid release_date detected in surprise output."
              )

          print("")
          print("SURPRISE ENGINE COVERAGE")
          print("-" * 72)
          print(f"Indicators: {len(indicators)}")
          print(f"Directional shocks: {shock_count}")
          print(
              f"Research only: "
              f"{int(research_only.sum())}/{len(research_only)}"
          )
          print(
              f"Decision Engine ready: "
              f"{int(decision_ready.sum())}/{len(decision_ready)}"
          )

          if "prior_zscore" in df.columns:
              z_count = df[
                  "prior_zscore"
              ].notna().sum()

              print(
                  f"PIT-safe z-scores: "
                  f"{z_count}/{len(df)}"
              )

          print("")
          print("ECONOMIC SURPRISE ENGINE QUALITY GATE: PASS")
          '


      # ============================================================
      # 9. RUN REGIME CLASSIFIER
      # ============================================================
      - name: Run Economic Regime Classifier v1.3
        run: |
          python economic_regime_classifier_v1.3.py \
            > regime_output.txt 2>&1

          cat regime_output.txt


      # ============================================================
      # 10. VALIDATE REGIME CLASSIFIER
      # ============================================================
      - name: Validate Economic Regime Classifier
        run: |
          python -c '
          import pandas as pd

          df = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          summary = pd.read_csv(
              "economic_regime_summary_v1.csv"
          )

          print("=" * 72)
          print("VALIDATING ECONOMIC REGIME CLASSIFIER v1.3")
          print("=" * 72)

          print(f"Regime observations: {len(df)}")
          print(f"Summary rows: {len(summary)}")

          # --------------------------------------------------------
          # COUNT
          # --------------------------------------------------------
          if len(df) != 34:
              raise RuntimeError(
                  f"Expected 34 regime observations, got {len(df)}"
              )

          if len(summary) == 0:
              raise RuntimeError(
                  "Regime summary is empty."
              )

          # --------------------------------------------------------
          # EXACT v1.3 SCHEMA
          # --------------------------------------------------------
          required_columns = [
              "release_date",

              "inflation_score",
              "inflation_method",
              "inflation_observation_date",
              "inflation_age_days",
              "inflation_indicator_count",
              "inflation_indicators",
              "inflation_zscore_count",
              "inflation_raw_shock_count",

              "labor_score",
              "labor_method",
              "labor_observation_date",
              "labor_age_days",
              "labor_indicator_count",
              "labor_indicators",
              "labor_zscore_count",
              "labor_raw_shock_count",

              "growth_score",
              "growth_method",
              "growth_observation_date",
              "growth_age_days",
              "growth_indicator_count",
              "growth_indicators",
              "growth_zscore_count",
              "growth_raw_shock_count",

              "dimensions_available",
              "economic_regime",
              "research_only",
              "decision_engine_ready",
              "pit_safe"
          ]

          for col in required_columns:
              if col not in df.columns:
                  raise RuntimeError(
                      f"Missing regime column: {col}"
                  )

          # --------------------------------------------------------
          # DATE
          # --------------------------------------------------------
          dates = pd.to_datetime(
              df["release_date"],
              errors="coerce"
          )

          if dates.isna().any():
              raise RuntimeError(
                  "Invalid release_date detected."
              )

          # --------------------------------------------------------
          # PIT
          # --------------------------------------------------------
          pit = df[
              "pit_safe"
          ].fillna(False)

          if not pit.all():
              raise RuntimeError(
                  "Regime PIT quality gate failed."
              )

          # --------------------------------------------------------
          # RESEARCH ONLY
          # --------------------------------------------------------
          research_only = df[
              "research_only"
          ].fillna(False)

          if not research_only.all():
              raise RuntimeError(
                  "Regime research-only gate failed."
              )

          # --------------------------------------------------------
          # DECISION ENGINE
          # --------------------------------------------------------
          decision_ready = df[
              "decision_engine_ready"
          ].fillna(True)

          if decision_ready.any():
              raise RuntimeError(
                  "Regime Decision Engine integration "
                  "must remain disabled."
              )

          # --------------------------------------------------------
          # VALID REGIMES
          # --------------------------------------------------------
          valid_regimes = {
              "INFLATIONARY_GROWTH",
              "DISINFLATIONARY_GROWTH",
              "STAGFLATIONARY",
              "DISINFLATIONARY_SLOWDOWN",
              "RECESSIONARY_PRESSURE",
              "MIXED",
              "PARTIAL_DATA",
              "INSUFFICIENT_DATA"
          }

          actual_regimes = set(
              df[
                  "economic_regime"
              ]
              .dropna()
              .astype(str)
          )

          invalid = (
              actual_regimes
              - valid_regimes
          )

          if invalid:
              raise RuntimeError(
                  f"Invalid regime labels detected: {invalid}"
              )

          # --------------------------------------------------------
          # COVERAGE
          # --------------------------------------------------------
          print("")
          print("DIMENSION COVERAGE")
          print("-" * 72)

          for col in [
              "inflation_score",
              "labor_score",
              "growth_score"
          ]:

              count = df[
                  col
              ].notna().sum()

              print(
                  f"{col}: {count}/{len(df)}"
              )

          # --------------------------------------------------------
          # DISTRIBUTION
          # --------------------------------------------------------
          print("")
          print("REGIME DISTRIBUTION")
          print("-" * 72)

          print(
              df[
                  "economic_regime"
              ]
              .value_counts()
              .to_string()
          )

          print("")
          print("REGIME CLASSIFIER QUALITY GATE: PASS")
          '


      # ============================================================
      # 11. PRINT ORGANIZED 34 OBSERVATIONS
      #
      # IMPORTANT:
      # No nested f-string expressions.
      # Values are prepared first, then formatted.
      # This avoids the previous SyntaxError.
      # ============================================================
      - name: Print Organized Economic Regime Observations
        run: |
          python -c '
          import pandas as pd

          pd.set_option(
              "display.max_columns",
              None
          )

          pd.set_option(
              "display.width",
              240
          )

          pd.set_option(
              "display.max_colwidth",
              40
          )

          df = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          df["release_date"] = pd.to_datetime(
              df["release_date"],
              errors="coerce"
          )

          df = df.sort_values(
              "release_date"
          ).reset_index(drop=True)

          # ========================================================
          # MAIN TABLE
          # ========================================================
          print("")
          print("=" * 120)
          print("ECONOMIC REGIME OBSERVATIONS — v1.3")
          print("=" * 120)

          print("")
          print(
              "No. | Date       | Inflation | Labor    | Growth   | "
              "Dims | Regime"
          )

          print("-" * 120)

          for index, row in df.iterrows():

              date_value = row["release_date"]

              if pd.notna(date_value):
                  date_text = date_value.strftime(
                      "%Y-%m-%d"
                  )
              else:
                  date_text = "N/A"

              inflation_value = row[
                  "inflation_score"
              ]

              if pd.notna(inflation_value):
                  inflation_text = "{:.3f}".format(
                      inflation_value
                  )
              else:
                  inflation_text = "N/A"

              labor_value = row[
                  "labor_score"
              ]

              if pd.notna(labor_value):
                  labor_text = "{:.3f}".format(
                      labor_value
                  )
              else:
                  labor_text = "N/A"

              growth_value = row[
                  "growth_score"
              ]

              if pd.notna(growth_value):
                  growth_text = "{:.3f}".format(
                      growth_value
                  )
              else:
                  growth_text = "N/A"

              dimensions_text = str(
                  row["dimensions_available"]
              )

              regime_text = str(
                  row["economic_regime"]
              )

              number_text = str(
                  index + 1
              ).rjust(2)

              print(
                  number_text
                  + " | "
                  + date_text
                  + " | "
                  + inflation_text.rjust(9)
                  + " | "
                  + labor_text.rjust(8)
                  + " | "
                  + growth_text.rjust(8)
                  + " | "
                  + dimensions_text.ljust(4)
                  + " | "
                  + regime_text
              )

          # ========================================================
          # DETAILED TABLE
          # ========================================================
          print("")
          print("=" * 120)
          print("DETAILED DIMENSION OBSERVATIONS")
          print("=" * 120)

          detailed_columns = [
              "release_date",

              "inflation_score",
              "inflation_method",
              "inflation_observation_date",
              "inflation_age_days",
              "inflation_indicator_count",
              "inflation_indicators",
              "inflation_zscore_count",
              "inflation_raw_shock_count",

              "labor_score",
              "labor_method",
              "labor_observation_date",
              "labor_age_days",
              "labor_indicator_count",
              "labor_indicators",
              "labor_zscore_count",
              "labor_raw_shock_count",

              "growth_score",
              "growth_method",
              "growth_observation_date",
              "growth_age_days",
              "growth_indicator_count",
              "growth_indicators",
              "growth_zscore_count",
              "growth_raw_shock_count",

              "dimensions_available",
              "economic_regime"
          ]

          detailed = df[
              detailed_columns
          ].copy()

          detailed["release_date"] = (
              detailed["release_date"]
              .dt.strftime("%Y-%m-%d")
          )

          print(
              detailed.to_string(
                  index=False
              )
          )

          # ========================================================
          # REGIME DISTRIBUTION
          # ========================================================
          print("")
          print("=" * 120)
          print("REGIME DISTRIBUTION")
          print("=" * 120)

          distribution = (
              df[
                  "economic_regime"
              ]
              .value_counts()
              .rename_axis("economic_regime")
              .reset_index(
                  name="observations"
              )
          )

          print(
              distribution.to_string(
                  index=False
              )
          )

          # ========================================================
          # DIMENSION AVAILABILITY
          # ========================================================
          print("")
          print("=" * 120)
          print("DIMENSION AVAILABILITY")
          print("=" * 120)

          dimension_info = [
              ("inflation_score", "Inflation"),
              ("labor_score", "Labor"),
              ("growth_score", "Growth")
          ]

          for column, label in dimension_info:

              available = df[
                  column
              ].notna().sum()

              print(
                  "{:<12}: {}/{}".format(
                      label,
                      available,
                      len(df)
                  )
              )

          # ========================================================
          # PIT / RESEARCH / DECISION STATUS
          # ========================================================
          print("")
          print("=" * 120)
          print("PIPELINE STATUS")
          print("=" * 120)

          pit_count = df[
              "pit_safe"
          ].fillna(False).sum()

          research_count = df[
              "research_only"
          ].fillna(False).sum()

          decision_count = df[
              "decision_engine_ready"
          ].fillna(True).sum()

          print(
              "PIT safe              : {}/{}".format(
                  pit_count,
                  len(df)
              )
          )

          print(
              "Research only         : {}/{}".format(
                  research_count,
                  len(df)
              )
          )

          print(
              "Decision Engine ready : {}/{}".format(
                  decision_count,
                  len(df)
              )
          )

          print("")
          print("=" * 120)
          print("END OF ECONOMIC REGIME OBSERVATIONS")
          print("=" * 120)
          '


      # ============================================================
      # 12. DISPLAY PIPELINE OUTPUTS
      # ============================================================
      - name: Display Pipeline Outputs
        run: |
          echo "========================================================================"
          echo "ECONOMIC HISTORICAL COLLECTOR OUTPUT"
          echo "========================================================================"
          cat collector_output.txt

          echo ""
          echo "========================================================================"
          echo "ECONOMIC SURPRISE ENGINE OUTPUT"
          echo "========================================================================"
          cat surprise_output.txt

          echo ""
          echo "========================================================================"
          echo "ECONOMIC REGIME CLASSIFIER OUTPUT"
          echo "========================================================================"
          cat regime_output.txt


      # ============================================================
      # 13. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload Economic Intelligence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v1
          path: |
            collector_output.txt
            surprise_output.txt
            regime_output.txt
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv


      # ============================================================
      # 14. FINAL QUALITY GATE
      # ============================================================
      - name: Final Economic Intelligence Quality Gate
        run: |
          python -c '
          import pandas as pd

          historical_quality = pd.read_csv(
              "economic_historical_quality_v1.csv"
          )

          surprise = pd.read_csv(
              "economic_surprise_engine_v1.csv"
          )

          regime = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          print("=" * 72)
          print("FINAL ECONOMIC INTELLIGENCE QUALITY GATE")
          print("=" * 72)

          # --------------------------------------------------------
          # HISTORICAL
          # --------------------------------------------------------
          if len(historical_quality) != 48:
              raise RuntimeError(
                  "Historical record count gate failed."
              )

          historical_pit = historical_quality[
              "point_in_time_safe"
          ].fillna(False)

          if not historical_pit.all():
              raise RuntimeError(
                  "Historical PIT gate failed."
              )

          # --------------------------------------------------------
          # SURPRISE
          # --------------------------------------------------------
          if len(surprise) != 48:
              raise RuntimeError(
                  "Surprise record count gate failed."
              )

          if not surprise[
              "research_only"
          ].fillna(False).all():

              raise RuntimeError(
                  "Surprise Engine research-only gate failed."
              )

          if surprise[
              "decision_engine_ready"
          ].fillna(True).any():

              raise RuntimeError(
                  "Surprise Engine Decision Engine gate failed."
              )

          # --------------------------------------------------------
          # REGIME
          # --------------------------------------------------------
          if len(regime) != 34:
              raise RuntimeError(
                  "Regime observation count gate failed."
              )

          regime_pit = regime[
              "pit_safe"
          ].fillna(False)

          if not regime_pit.all():
              raise RuntimeError(
                  "Regime PIT gate failed."
              )

          if not regime[
              "research_only"
          ].fillna(False).all():

              raise RuntimeError(
                  "Regime research-only gate failed."
              )

          if regime[
              "decision_engine_ready"
          ].fillna(True).any():

              raise RuntimeError(
                  "Regime Decision Engine gate failed."
              )

          # --------------------------------------------------------
          # FINAL
          # --------------------------------------------------------
          print("")
          print(
              "Historical records: {}".format(
                  len(historical_quality)
              )
          )

          print(
              "Historical PIT safe: {}/{}".format(
                  historical_pit.sum(),
                  len(historical_pit)
              )
          )

          print(
              "Surprise records: {}".format(
                  len(surprise)
              )
          )

          print(
              "Regime observations: {}".format(
                  len(regime)
              )
          )

          print(
              "Regime PIT safe: {}/{}".format(
                  regime_pit.sum(),
                  len(regime_pit)
              )
          )

          print("")
          print(
              "ALL ECONOMIC INTELLIGENCE QUALITY GATES: PASS"
          )

          print("")
          print(
              "STATUS: RESEARCH-ONLY"
          )

          print(
              "DECISION ENGINE INTEGRATION: DISABLED"
          )

          print("")
          '
