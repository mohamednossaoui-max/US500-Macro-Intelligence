name: Economic Intelligence Pipeline

on:
  workflow_dispatch:

jobs:
  economic-intelligence:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy


      # ============================================================
      # 4. VERIFY ECONOMIC INTELLIGENCE FILES
      # ============================================================
      - name: Verify Economic Intelligence files
        run: |
          python -c '
          import os

          required = [
              "economic_historical_collector_v1_5.py",
              "economic_surprise_engine_v1.py",
              "economic_regime_classifier_v1.4.py"
          ]

          print("=" * 72)
          print("VERIFYING ECONOMIC INTELLIGENCE FILES")
          print("=" * 72)

          for file in required:
              if not os.path.exists(file):
                  raise RuntimeError(
                      f"Missing required file: {file}"
                  )

              print(f"[OK] {file}")

          print("")
          print("All required files found.")
          '


      # ============================================================
      # 5. SHOW ECONOMIC FILES
      # ============================================================
      - name: List Economic Intelligence files
        run: |
          echo "Economic Intelligence Python files:"
          ls -lah economic_*.py || true

          echo ""
          echo "Repository root:"
          ls -lah


      # ============================================================
      # 6. RUN HISTORICAL COLLECTOR
      # ============================================================
      - name: Run Historical Economic Collector v1.5
        run: |
          python economic_historical_collector_v1_5.py \
            | tee collector_output.txt


      # ============================================================
      # 7. VALIDATE HISTORICAL DATA
      # ============================================================
      - name: Validate Historical Economic Data
        run: |
          python -c '
          import pandas as pd
          import os

          events_file = "economic_historical_events_v1.csv"
          quality_file = "economic_historical_quality_v1.csv"

          print("=" * 72)
          print("VALIDATING HISTORICAL ECONOMIC DATA")
          print("=" * 72)

          if not os.path.exists(events_file):
              raise RuntimeError(
                  f"Missing output: {events_file}"
              )

          if not os.path.exists(quality_file):
              raise RuntimeError(
                  f"Missing output: {quality_file}"
              )

          events = pd.read_csv(events_file)
          quality = pd.read_csv(quality_file)

          print(f"Historical records: {len(events)}")
          print(f"Quality records: {len(quality)}")

          required_event_columns = [
              "record_id",
              "indicator",
              "agency",
              "release_date",
              "release_time",
              "reference_period",
              "actual",
              "source_url",
              "point_in_time_safe",
              "vintage_date"
          ]

          required_quality_columns = [
              "record_id",
              "indicator",
              "point_in_time_safe",
              "quality_issues",
              "historical_consensus_available"
          ]

          for col in required_event_columns:
              if col not in events.columns:
                  raise RuntimeError(
                      f"Missing historical event column: {col}"
                  )

          for col in required_quality_columns:
              if col not in quality.columns:
                  raise RuntimeError(
                      f"Missing historical quality column: {col}"
                  )

          if len(events) != 48:
              raise RuntimeError(
                  f"Expected 48 historical records, found {len(events)}"
              )

          if len(quality) != len(events):
              raise RuntimeError(
                  "Event and quality row counts do not match"
              )

          pit_safe = events["point_in_time_safe"].astype(bool)

          if not pit_safe.all():
              raise RuntimeError(
                  "Historical PIT safety check failed"
              )

          quality_pit = quality["point_in_time_safe"].astype(bool)

          if not quality_pit.all():
              raise RuntimeError(
                  "Historical quality PIT check failed"
              )

          consensus_count = (
              quality["historical_consensus_available"]
              .fillna(False)
              .astype(bool)
              .sum()
          )

          if consensus_count != 0:
              raise RuntimeError(
                  f"Historical consensus should be 0, found {consensus_count}"
              )

          indicators = sorted(
              events["indicator"].dropna().unique().tolist()
          )

          print(f"PIT safe: {pit_safe.sum()}/{len(events)}")
          print(f"Historical consensus: {consensus_count}")
          print(f"Indicators: {len(indicators)}")
          print(f"Indicator list: {indicators}")

          print("")
          print("HISTORICAL DATA QUALITY GATE: PASS")
          '


      # ============================================================
      # 8. RUN SURPRISE ENGINE
      # ============================================================
      - name: Run Economic Surprise Engine v1
        run: |
          python economic_surprise_engine_v1.py \
            | tee surprise_output.txt


      # ============================================================
      # 9. VALIDATE SURPRISE ENGINE
      # ============================================================
      - name: Validate Surprise Engine
        run: |
          python -c '
          import pandas as pd
          import os

          output_file = "economic_surprise_engine_v1.csv"
          summary_file = "economic_surprise_summary_v1.csv"

          print("=" * 72)
          print("VALIDATING ECONOMIC SURPRISE ENGINE")
          print("=" * 72)

          if not os.path.exists(output_file):
              raise RuntimeError(
                  f"Missing output: {output_file}"
              )

          if not os.path.exists(summary_file):
              raise RuntimeError(
                  f"Missing output: {summary_file}"
              )

          df = pd.read_csv(output_file)
          summary = pd.read_csv(summary_file)

          print(f"Input/output records: {len(df)}")
          print(f"Summary rows: {len(summary)}")

          if len(df) != 48:
              raise RuntimeError(
                  f"Expected 48 surprise records, found {len(df)}"
              )

          if summary.empty:
              raise RuntimeError(
                  "Surprise summary is empty"
              )

          required_columns = [
              "indicator",
              "release_date",
              "directional_release_shock",
              "research_only",
              "decision_engine_ready"
          ]

          for col in required_columns:
              if col not in df.columns:
                  raise RuntimeError(
                      f"Missing surprise engine column: {col}"
                  )

          if df["directional_release_shock"].notna().sum() == 0:
              raise RuntimeError(
                  "No directional release shocks were generated"
              )

          if not df["research_only"].astype(bool).all():
              raise RuntimeError(
                  "Research-only gate failed"
              )

          if df["decision_engine_ready"].astype(bool).any():
              raise RuntimeError(
                  "Decision Engine readiness must remain disabled"
              )

          dates = pd.to_datetime(
              df["release_date"],
              errors="coerce"
          )

          if dates.isna().any():
              raise RuntimeError(
                  "Invalid release dates detected"
              )

          print(
              "Directional release shocks:",
              df["directional_release_shock"].notna().sum()
          )

          if "directional_shock_z" in df.columns:
              print(
                  "PIT-safe z-scores:",
                  df["directional_shock_z"].notna().sum()
              )

          print("")
          print("SURPRISE ENGINE QUALITY GATE: PASS")
          '


      # ============================================================
      # 10. RUN REGIME CLASSIFIER v1.4
      # ============================================================
      - name: Run Economic Regime Classifier v1.4
        run: |
          python economic_regime_classifier_v1.4.py \
            | tee regime_output.txt


      # ============================================================
      # 11. VALIDATE REGIME CLASSIFIER v1.4
      # ============================================================
      - name: Validate Economic Regime Classifier v1.4
        run: |
          python -c '
          import pandas as pd
          import os

          output_file = "economic_regime_events_v1.csv"
          summary_file = "economic_regime_summary_v1.csv"

          print("=" * 72)
          print("VALIDATING ECONOMIC REGIME CLASSIFIER v1.4")
          print("=" * 72)

          if not os.path.exists(output_file):
              raise RuntimeError(
                  f"Missing output: {output_file}"
              )

          if not os.path.exists(summary_file):
              raise RuntimeError(
                  f"Missing output: {summary_file}"
              )

          df = pd.read_csv(output_file)
          summary = pd.read_csv(summary_file)

          print(f"Regime observations: {len(df)}")
          print(f"Summary rows: {len(summary)}")

          if df.empty:
              raise RuntimeError(
                  "Regime output is empty"
              )

          if summary.empty:
              raise RuntimeError(
                  "Regime summary is empty"
              )

          required_columns = [
              "release_date",

              "inflation_score",
              "inflation_method",
              "inflation_observation_date",
              "inflation_age_days",
              "inflation_indicator_count",
              "inflation_indicators",
              "inflation_zscore_count",
              "inflation_raw_shock_count",

              "labor_score",
              "labor_method",
              "labor_observation_date",
              "labor_age_days",
              "labor_indicator_count",
              "labor_indicators",
              "labor_zscore_count",
              "labor_raw_shock_count",

              "growth_score",
              "growth_method",
              "growth_observation_date",
              "growth_age_days",
              "growth_indicator_count",
              "growth_indicators",
              "growth_zscore_count",
              "growth_raw_shock_count",

              "dimensions_available",
              "economic_regime",

              "inflation_stale_indicator_count",
              "inflation_stale_indicators",

              "labor_stale_indicator_count",
              "labor_stale_indicators",

              "growth_stale_indicator_count",
              "growth_stale_indicators",

              "research_only",
              "decision_engine_ready",
              "pit_safe"
          ]

          for col in required_columns:
              if col not in df.columns:
                  raise RuntimeError(
                      f"Missing regime column: {col}"
                  )

          dates = pd.to_datetime(
              df["release_date"],
              errors="coerce"
          )

          if dates.isna().any():
              raise RuntimeError(
                  "Invalid regime release dates detected"
              )

          if not df["pit_safe"].astype(bool).all():
              raise RuntimeError(
                  "Regime PIT safety gate failed"
              )

          if not df["research_only"].astype(bool).all():
              raise RuntimeError(
                  "Regime research-only gate failed"
              )

          if df["decision_engine_ready"].astype(bool).any():
              raise RuntimeError(
                  "Decision Engine readiness must remain disabled"
              )

          # --------------------------------------------------------
          # v1.4 NORMALIZATION GATE
          # No raw shock fallback is allowed.
          # --------------------------------------------------------

          raw_columns = [
              "inflation_raw_shock_count",
              "labor_raw_shock_count",
              "growth_raw_shock_count"
          ]

          for col in raw_columns:
              raw_values = pd.to_numeric(
                  df[col],
                  errors="coerce"
              ).fillna(0)

              if (raw_values != 0).any():
                  raise RuntimeError(
                      f"Normalization gate failed: {col} contains raw shocks"
                  )

          # --------------------------------------------------------
          # v1.4 METHOD GATE
          # Every populated dimension must use z-scores.
          # --------------------------------------------------------

          method_columns = [
              "inflation_method",
              "labor_method",
              "growth_method"
          ]

          invalid_methods = {
              "RAW_DIRECTIONAL_SHOCK",
              "MIXED"
          }

          for col in method_columns:
              values = (
                  df[col]
                  .dropna()
                  .astype(str)
                  .str.strip()
              )

              bad = values[values.isin(invalid_methods)]

              if not bad.empty:
                  raise RuntimeError(
                      f"Method gate failed in {col}: {bad.tolist()}"
                  )

          # --------------------------------------------------------
          # Validate expected regime labels.
          # --------------------------------------------------------

          valid_regimes = {
              "INFLATIONARY_GROWTH",
              "DISINFLATIONARY_GROWTH",
              "STAGFLATIONARY",
              "DISINFLATIONARY_SLOWDOWN",
              "RECESSIONARY_PRESSURE",
              "MIXED",
              "PARTIAL_DATA",
              "INSUFFICIENT_DATA"
          }

          actual_regimes = set(
              df["economic_regime"]
              .dropna()
              .astype(str)
              .unique()
          )

          unexpected = actual_regimes - valid_regimes

          if unexpected:
              raise RuntimeError(
                  f"Unexpected economic regime labels: {unexpected}"
              )

          # --------------------------------------------------------
          # Print diagnostics.
          # --------------------------------------------------------

          print("")
          print("REGIME DISTRIBUTION")
          print("-" * 72)
          print(
              df["economic_regime"]
              .value_counts()
              .to_string()
          )

          print("")
          print("DIMENSION COVERAGE")
          print("-" * 72)

          for dimension in ["inflation", "labor", "growth"]:
              count_col = f"{dimension}_indicator_count"

              available = (
                  pd.to_numeric(
                      df[count_col],
                      errors="coerce"
                  )
                  .fillna(0)
                  .gt(0)
                  .sum()
              )

              print(
                  f"{dimension.capitalize():12s}: "
                  f"{available}/{len(df)}"
              )

          print("")
          print("INDICATOR USAGE")
          print("-" * 72)

          for dimension in ["inflation", "labor", "growth"]:
              indicator_col = f"{dimension}_indicators"

              values = (
                  df[indicator_col]
                  .dropna()
                  .astype(str)
              )

              print(f"{dimension.capitalize()}:")

              if values.empty:
                  print("  None")
                  continue

              counts = {}

              for value in values:
                  for indicator in value.split(","):
                      indicator = indicator.strip()

                      if not indicator:
                          continue

                      counts[indicator] = (
                          counts.get(indicator, 0) + 1
                      )

              for indicator, count in sorted(
                  counts.items(),
                  key=lambda x: (-x[1], x[0])
              ):
                  print(
                      f"  {indicator}: {count}"
                  )

          print("")
          print("STALE INDICATOR COUNTS")
          print("-" * 72)

          for dimension in ["inflation", "labor", "growth"]:
              stale_col = (
                  f"{dimension}_stale_indicator_count"
              )

              total_stale = (
                  pd.to_numeric(
                      df[stale_col],
                      errors="coerce"
                  )
                  .fillna(0)
                  .sum()
              )

              print(
                  f"{dimension.capitalize():12s}: "
                  f"{int(total_stale)}"
              )

          print("")
          print("ECONOMIC REGIME v1.4 QUALITY GATE: PASS")
          '


      # ============================================================
      # 12. PRINT REGIME OBSERVATIONS
      # ============================================================
      - name: Print Regime Observations
        run: |
          python -c '
          import pandas as pd

          df = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          print("=" * 72)
          print("REGIME OBSERVATIONS — v1.4")
          print("=" * 72)

          display_columns = [
              "release_date",
              "inflation_score",
              "labor_score",
              "growth_score",
              "economic_regime",
              "dimensions_available",
              "pit_safe"
          ]

          existing = [
              c for c in display_columns
              if c in df.columns
          ]

          print(
              df[existing]
              .sort_values("release_date")
              .to_string(index=False)
          )
          '


      # ============================================================
      # 13. DISPLAY GENERATED OUTPUT FILES
      # ============================================================
      - name: Display Economic Intelligence outputs
        run: |
          echo "Generated Economic Intelligence files:"
          ls -lah \
            economic_historical_events_v1.csv \
            economic_historical_quality_v1.csv \
            economic_surprise_engine_v1.csv \
            economic_surprise_summary_v1.csv \
            economic_regime_events_v1.csv \
            economic_regime_summary_v1.csv \
            collector_output.txt \
            surprise_output.txt \
            regime_output.txt


      # ============================================================
      # 14. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Economic Intelligence artifact
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v1
          path: |
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv
            collector_output.txt
            surprise_output.txt
            regime_output.txt


      # ============================================================
      # 15. FINAL QUALITY GATE
      # ============================================================
      - name: Final Economic Intelligence Quality Gate
        run: |
          python -c '
          import pandas as pd

          historical = pd.read_csv(
              "economic_historical_events_v1.csv"
          )

          quality = pd.read_csv(
              "economic_historical_quality_v1.csv"
          )

          surprise = pd.read_csv(
              "economic_surprise_engine_v1.csv"
          )

          regime = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          print("=" * 72)
          print("FINAL ECONOMIC INTELLIGENCE QUALITY GATE")
          print("=" * 72)

          print(
              f"Historical records : {len(historical)}"
          )

          print(
              f"Surprise records   : {len(surprise)}"
          )

          print(
              f"Regime observations: {len(regime)}"
          )

          print(
              f"PIT historical     : "
              f"{historical['point_in_time_safe'].astype(bool).sum()}"
              f"/{len(historical)}"
          )

          print(
              f"PIT quality        : "
              f"{quality['point_in_time_safe'].astype(bool).sum()}"
              f"/{len(quality)}"
          )

          print(
              f"PIT regime         : "
              f"{regime['pit_safe'].astype(bool).sum()}"
              f"/{len(regime)}"
          )

          print(
              f"Research-only regime: "
              f"{regime['research_only'].astype(bool).sum()}"
              f"/{len(regime)}"
          )

          decision_ready = (
              regime["decision_engine_ready"]
              .astype(bool)
              .sum()
          )

          print(
              f"Decision Engine ready: "
              f"{decision_ready}/{len(regime)}"
          )

          if not historical["point_in_time_safe"].astype(bool).all():
              raise RuntimeError(
                  "Final historical PIT gate failed"
              )

          if not quality["point_in_time_safe"].astype(bool).all():
              raise RuntimeError(
                  "Final quality PIT gate failed"
              )

          if not regime["pit_safe"].astype(bool).all():
              raise RuntimeError(
                  "Final regime PIT gate failed"
              )

          if not regime["research_only"].astype(bool).all():
              raise RuntimeError(
                  "Final research-only gate failed"
              )

          if decision_ready != 0:
              raise RuntimeError(
                  "Decision Engine must remain disabled"
              )

          print("")
          print(
              "FINAL ECONOMIC INTELLIGENCE QUALITY GATE: PASS"
          )
          '
