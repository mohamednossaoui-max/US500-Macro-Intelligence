name: Economic Intelligence Full Pipeline v1

on:
  workflow_dispatch:

jobs:
  economic-intelligence:
    runs-on: ubuntu-latest

    steps:

      # ================================================================
      # 1. CHECKOUT
      # ================================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ================================================================
      # 2. PYTHON
      # ================================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ================================================================
      # 3. DEPENDENCIES
      # ================================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy


      # ================================================================
      # 4. VERIFY PYTHON FILES
      # ================================================================

      - name: Verify Economic Intelligence Python files
        run: |
          echo "========================================================================"
          echo "VERIFYING ECONOMIC INTELLIGENCE PYTHON FILES"
          echo "========================================================================"

          required_files=(
            "economic_historical_collector_v1_5.py"
            "economic_surprise_engine_v1.1.py"
            "economic_regime_classifier_v1.4.py"
          )

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "[OK] $file"
            else
              echo "[ERROR] Missing required file: $file"
              exit 1
            fi
          done


      # ================================================================
      # 5. HISTORICAL ECONOMIC DATA
      # ================================================================

      - name: Run Historical Economic Collector v1.5
        run: |
          echo "========================================================================"
          echo "RUNNING HISTORICAL ECONOMIC COLLECTOR v1.5"
          echo "========================================================================"

          python "./economic_historical_collector_v1_5.py"


      # ================================================================
      # 6. VERIFY HISTORICAL DATA
      # ================================================================

      - name: Verify Historical Economic outputs
        run: |
          echo "========================================================================"
          echo "VERIFYING HISTORICAL ECONOMIC OUTPUTS"
          echo "========================================================================"

          test -f economic_historical_events_v1.csv
          test -f economic_historical_quality_v1.csv

          echo "[OK] economic_historical_events_v1.csv"
          echo "[OK] economic_historical_quality_v1.csv"


      # ================================================================
      # 7. ECONOMIC SURPRISE ENGINE v1.1
      # ================================================================

      - name: Run Economic Surprise Engine v1.1
        run: |
          echo "========================================================================"
          echo "RUNNING ECONOMIC SURPRISE ENGINE v1.1"
          echo "========================================================================"

          python "./economic_surprise_engine_v1.1.py"


      # ================================================================
      # 8. VERIFY SURPRISE ENGINE OUTPUTS
      # ================================================================

      - name: Verify Economic Surprise outputs
        run: |
          echo "========================================================================"
          echo "VERIFYING ECONOMIC SURPRISE OUTPUTS"
          echo "========================================================================"

          test -f economic_surprise_engine_v1.csv
          test -f economic_surprise_summary_v1.csv

          echo "[OK] economic_surprise_engine_v1.csv"
          echo "[OK] economic_surprise_summary_v1.csv"


      # ================================================================
      # 9. ECONOMIC REGIME CLASSIFIER v1.4
      # ================================================================

      - name: Run Economic Regime Classifier v1.4
        run: |
          echo "========================================================================"
          echo "RUNNING ECONOMIC REGIME CLASSIFIER v1.4"
          echo "========================================================================"

          python "./economic_regime_classifier_v1.4.py"


      # ================================================================
      # 10. VERIFY REGIME OUTPUTS
      # ================================================================

      - name: Verify Economic Regime outputs
        run: |
          echo "========================================================================"
          echo "VERIFYING ECONOMIC REGIME OUTPUTS"
          echo "========================================================================"

          test -f economic_regime_events_v1.csv
          test -f economic_regime_summary_v1.csv

          echo "[OK] economic_regime_events_v1.csv"
          echo "[OK] economic_regime_summary_v1.csv"


      # ================================================================
      # 11. FINAL QUALITY CHECK
      # ================================================================

      - name: Final Economic Intelligence Quality Gate
        run: |
          echo "========================================================================"
          echo "FINAL ECONOMIC INTELLIGENCE QUALITY GATE"
          echo "========================================================================"

          python <<'PY'
          import pandas as pd
          import sys

          HISTORICAL_FILE = "economic_historical_events_v1.csv"
          QUALITY_FILE = "economic_historical_quality_v1.csv"
          SURPRISE_FILE = "economic_surprise_engine_v1.csv"
          REGIME_FILE = "economic_regime_events_v1.csv"

          print("")
          print("Loading outputs...")
          print("")

          historical = pd.read_csv(HISTORICAL_FILE)
          quality = pd.read_csv(QUALITY_FILE)
          surprise = pd.read_csv(SURPRISE_FILE)
          regime = pd.read_csv(REGIME_FILE)

          # ============================================================
          # HISTORICAL DATA
          # ============================================================

          print("Historical records:", len(historical))
          print("Historical quality records:", len(quality))

          if len(historical) == 0:
              print("[FAIL] Historical dataset is empty")
              sys.exit(1)

          if len(quality) != len(historical):
              print(
                  "[FAIL] Historical and quality datasets "
                  "have different record counts"
              )
              sys.exit(1)

          # ============================================================
          # PIT QUALITY
          # ============================================================

          if "point_in_time_safe" not in quality.columns:
              print(
                  "[FAIL] Missing point_in_time_safe "
                  "in historical quality output"
              )
              sys.exit(1)

          pit_safe = quality["point_in_time_safe"].fillna(False)

          print(
              "Historical PIT safe:",
              int(pit_safe.sum()),
              "/",
              len(quality)
          )

          if not bool(pit_safe.all()):
              print("[FAIL] Historical PIT quality gate failed")
              sys.exit(1)

          # ============================================================
          # SURPRISE ENGINE
          # ============================================================

          print("")
          print("Surprise Engine records:", len(surprise))

          required_surprise_columns = [
              "indicator",
              "release_date",
              "directional_release_shock",
              "directional_shock_z",
              "pit_safe",
              "research_only",
              "decision_engine_ready",
          ]

          missing_surprise = [
              c
              for c in required_surprise_columns
              if c not in surprise.columns
          ]

          if missing_surprise:
              print(
                  "[FAIL] Missing Surprise Engine columns:",
                  missing_surprise
              )
              sys.exit(1)

          if len(surprise) == 0:
              print("[FAIL] Surprise Engine output is empty")
              sys.exit(1)

          surprise_pit = (
              surprise["pit_safe"]
              .fillna(False)
          )

          print(
              "Surprise PIT safe:",
              int(surprise_pit.sum()),
              "/",
              len(surprise)
          )

          if not bool(surprise_pit.all()):
              print(
                  "[FAIL] Surprise Engine PIT gate failed"
              )
              sys.exit(1)

          # Research-only requirement
          research_only = (
              surprise["research_only"]
              .fillna(False)
          )

          if not bool(research_only.all()):
              print(
                  "[FAIL] Surprise Engine contains "
                  "non-research records"
              )
              sys.exit(1)

          # Decision Engine must remain disabled
          decision_ready = (
              surprise["decision_engine_ready"]
              .fillna(True)
          )

          if bool(decision_ready.any()):
              print(
                  "[FAIL] Decision Engine integration "
                  "is unexpectedly enabled"
              )
              sys.exit(1)

          # ============================================================
          # REGIME CLASSIFIER
          # ============================================================

          print("")
          print("Regime records:", len(regime))

          required_regime_columns = [
              "release_date",
              "economic_regime",
              "pit_safe",
              "research_only",
              "decision_engine_ready",
          ]

          missing_regime = [
              c
              for c in required_regime_columns
              if c not in regime.columns
          ]

          if missing_regime:
              print(
                  "[FAIL] Missing Regime columns:",
                  missing_regime
              )
              sys.exit(1)

          if len(regime) == 0:
              print(
                  "[FAIL] Regime output is empty"
              )
              sys.exit(1)

          regime_pit = (
              regime["pit_safe"]
              .fillna(False)
          )

          print(
              "Regime PIT safe:",
              int(regime_pit.sum()),
              "/",
              len(regime)
          )

          if not bool(regime_pit.all()):
              print(
                  "[FAIL] Regime PIT gate failed"
              )
              sys.exit(1)

          # ============================================================
          # REGIME RESEARCH-ONLY GATE
          # ============================================================

          regime_research = (
              regime["research_only"]
              .fillna(False)
          )

          if not bool(regime_research.all()):
              print(
                  "[FAIL] Regime contains "
                  "non-research records"
              )
              sys.exit(1)

          regime_decision = (
              regime["decision_engine_ready"]
              .fillna(True)
          )

          if bool(regime_decision.any()):
              print(
                  "[FAIL] Regime unexpectedly marked "
                  "Decision Engine ready"
              )
              sys.exit(1)

          # ============================================================
          # FINAL RESULT
          # ============================================================

          print("")
          print("========================================================================")
          print("FINAL QUALITY GATE: PASS")
          print("========================================================================")

          print("")
          print(
              "Historical:",
              len(historical)
          )

          print(
              "Surprise Engine:",
              len(surprise)
          )

          print(
              "Regime observations:",
              len(regime)
          )

          print("")
          print(
              "Decision Engine integration: DISABLED"
          )

          print(
              "Research-only pipeline: PASS"
          )

          print("")
          PY


      # ================================================================
      # 12. UPLOAD ARTIFACTS
      # ================================================================

      - name: Upload Economic Intelligence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v1
          path: |
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv
