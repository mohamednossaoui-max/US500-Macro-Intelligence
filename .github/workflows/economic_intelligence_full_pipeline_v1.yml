name: Economic Intelligence Full Pipeline v1

on:
  workflow_dispatch:

  push:
    paths:
      - "economic_historical_collector_v1_4.py"
      - "economic_surprise_engine_v1.py"
      - "economic_regime_classifier_v1.py"
      - ".github/workflows/economic_intelligence_full_pipeline_v1.yml"

jobs:
  economic-intelligence:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Economic Historical Collector
        run: |
          python "./economic_historical_collector_v1_4.py"

      - name: Validate Historical Data
        run: |
          test -f economic_historical_events_v1.csv
          test -f economic_historical_quality_v1.csv

          python - <<'PY'
          import pandas as pd

          events = pd.read_csv(
              "economic_historical_events_v1.csv"
          )

          print(
              "Historical events:",
              len(events)
          )

          if len(events) == 0:
              raise SystemExit(
                  "ERROR: Historical events file is empty."
              )

          safe = (
              events["pit_safe"]
              .astype(str)
              .str.upper()
              .isin(
                  ["TRUE", "1", "YES"]
              )
              .sum()
          )

          print(
              f"PIT safe: {safe}/{len(events)}"
          )

          if safe != len(events):
              raise SystemExit(
                  "ERROR: Historical data "
                  "contains PIT-unsafe records."
              )

          print(
              "Historical data validation: PASS"
          )
          PY

      - name: Run Economic Surprise Engine
        run: |
          python "./economic_surprise_engine_v1.py"

      - name: Validate Surprise Engine
        run: |
          test -f economic_surprise_engine_v1.csv
          test -f economic_surprise_summary_v1.csv

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv(
              "economic_surprise_engine_v1.csv"
          )

          print(
              "Surprise Engine rows:",
              len(df)
          )

          if len(df) == 0:
              raise SystemExit(
                  "ERROR: Economic Surprise Engine "
                  "output is empty."
              )

          safe = (
              df["pit_safe"]
              .astype(str)
              .str.upper()
              .isin(
                  ["TRUE", "1", "YES"]
              )
              .sum()
          )

          print(
              f"PIT safe: {safe}/{len(df)}"
          )

          if safe != len(df):
              raise SystemExit(
                  "ERROR: Surprise Engine contains "
                  "PIT-unsafe records."
              )

          if "directional_shock_z" not in df.columns:
              raise SystemExit(
                  "ERROR: Missing directional_shock_z."
              )

          print(
              "Surprise Engine validation: PASS"
          )
          PY

      - name: Run Economic Regime Classifier
        run: |
          python "./economic_regime_classifier_v1.py"

      - name: Validate Economic Regime
        run: |
          test -f economic_regime_events_v1.csv
          test -f economic_regime_summary_v1.csv

          echo "Regime Classifier files found."

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          print(
              "Regime observations:",
              len(df)
          )

          if len(df) == 0:
              raise SystemExit(
                  "ERROR: Economic Regime output "
                  "is empty."
              )

          required = {
              "release_date",
              "inflation_score",
              "labor_score",
              "growth_score",
              "economic_regime",
              "pit_safe",
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  f"ERROR: Missing regime columns: "
                  f"{sorted(missing)}"
              )

          safe = (
              df["pit_safe"]
              .astype(str)
              .str.upper()
              .isin(
                  ["TRUE", "1", "YES"]
              )
              .all()
          )

          if not safe:
              raise SystemExit(
                  "ERROR: Regime output contains "
                  "PIT-unsafe rows."
              )

          print()
          print("Regime distribution:")

          print(
              df["economic_regime"]
              .value_counts(
                  dropna=False
              )
          )

          print()
          print(
              "Economic Regime validation: PASS"
          )
          PY

      - name: Upload Economic Intelligence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v1
          path: |
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv
          if-no-files-found: error

      - name: Economic Intelligence Pipeline Complete
        run: |
          echo "============================================================"
          echo "US500 MACRO INTELLIGENCE"
          echo "ECONOMIC INTELLIGENCE PIPELINE v1"
          echo "============================================================"
          echo ""
          echo "Historical Collector:       PASS"
          echo "Economic Surprise Engine:   PASS"
          echo "Economic Regime Classifier: PASS"
          echo "Artifacts:                  UPLOADED"
          echo ""
          echo "Research-only."
          echo "No Decision Engine integration."
          echo "No trading signal generated."
