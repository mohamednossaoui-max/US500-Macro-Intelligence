name: Economic Intelligence Full Pipeline v1

on:
  workflow_dispatch:

jobs:
  economic-intelligence:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy


      # ============================================================
      # 4. VERIFY REQUIRED FILES
      # ============================================================
      - name: Verify Economic Intelligence files
        run: |
          python -c '
          import os

          required = [
              "economic_historical_collector_v1_5.py",
              "economic_surprise_engine_v1.py",
              "economic_regime_classifier_v1.3.py"
          ]

          print("=" * 72)
          print("VERIFYING ECONOMIC INTELLIGENCE FILES")
          print("=" * 72)

          for file in required:
              if not os.path.exists(file):
                  raise RuntimeError(
                      f"Missing required file: {file}"
                  )

              print(f"[OK] {file}")

          print("")
          print("All required files found.")
          '


      # ============================================================
      # 5. RUN HISTORICAL COLLECTOR
      # ============================================================
      - name: Run Economic Historical Collector v1.5
        run: |
          python economic_historical_collector_v1_5.py \
            > collector_output.txt 2>&1

          cat collector_output.txt


      # ============================================================
      # 6. VALIDATE HISTORICAL DATA
      # ============================================================
      - name: Validate Economic Historical Data
        run: |
          python -c '
          import pandas as pd

          events = pd.read_csv(
              "economic_historical_events_v1.csv"
          )

          quality = pd.read_csv(
              "economic_historical_quality_v1.csv"
          )

          print("=" * 72)
          print("VALIDATING ECONOMIC HISTORICAL DATA")
          print("=" * 72)

          print(f"Historical events: {len(events)}")
          print(f"Quality rows: {len(quality)}")

          # --------------------------------------------------------
          # RECORD COUNT
          # --------------------------------------------------------
          if len(events) != 48:
              raise RuntimeError(
                  f"Expected 48 historical records, got {len(events)}"
              )

          if len(quality) != 48:
              raise RuntimeError(
                  f"Expected 48 quality records, got {len(quality)}"
              )

          # --------------------------------------------------------
          # EVENTS COLUMNS
          # --------------------------------------------------------
          required_events = [
              "indicator",
              "agency",
              "release_date",
              "release_time",
              "reference_period",
              "actual"
          ]

          for col in required_events:
              if col not in events.columns:
                  raise RuntimeError(
                      f"Missing historical event column: {col}"
                  )

          # --------------------------------------------------------
          # QUALITY COLUMNS
          # --------------------------------------------------------
          required_quality = [
              "indicator",
              "agency",
              "release_date",
              "reference_period",
              "point_in_time_safe",
              "quality_issues",
              "historical_consensus_available"
          ]

          for col in required_quality:
              if col not in quality.columns:
                  raise RuntimeError(
                      f"Missing historical quality column: {col}"
                  )

          # --------------------------------------------------------
          # PIT
          # --------------------------------------------------------
          pit = quality[
              "point_in_time_safe"
          ].fillna(False)

          if not pit.all():
              raise RuntimeError(
                  "Historical PIT quality gate failed."
              )

          # --------------------------------------------------------
          # QUALITY ISSUES
          # --------------------------------------------------------
          issues = (
              quality["quality_issues"]
              .fillna("")
              .astype(str)
              .str.strip()
          )

          if (issues != "").any():
              bad = quality.loc[
                  issues != "",
                  [
                      "indicator",
                      "release_date",
                      "quality_issues"
                  ]
              ]

              print(bad.to_string(index=False))

              raise RuntimeError(
                  "Historical data contains quality issues."
              )

          # --------------------------------------------------------
          # CONSENSUS
          # --------------------------------------------------------
          consensus = quality[
              "historical_consensus_available"
          ].fillna(False)

          if consensus.any():
              raise RuntimeError(
                  "Historical consensus detected unexpectedly."
              )

          # --------------------------------------------------------
          # INDICATORS
          # --------------------------------------------------------
          indicators = events[
              "indicator"
          ].dropna().unique()

          if len(indicators) != 7:
              raise RuntimeError(
                  f"Expected 7 indicators, got {len(indicators)}"
              )

          # --------------------------------------------------------
          # 2023 BATCH
          # --------------------------------------------------------
          release_dates = pd.to_datetime(
              events["release_date"],
              errors="coerce"
          )

          records_2023 = (
              release_dates.dt.year == 2023
          ).sum()

          if records_2023 != 14:
              raise RuntimeError(
                  f"Expected 14 records from 2023 batch, got {records_2023}"
              )

          # --------------------------------------------------------
          # DUPLICATES
          # --------------------------------------------------------
          duplicate_subset = [
              "indicator",
              "agency",
              "release_date",
              "release_time",
              "reference_period",
              "source_url"
          ]

          existing_subset = [
              c for c in duplicate_subset
              if c in events.columns
          ]

          duplicates = events.duplicated(
              subset=existing_subset
          ).sum()

          if duplicates:
              raise RuntimeError(
                  f"Duplicate historical records detected: {duplicates}"
              )

          print("")
          print("HISTORICAL DATA QUALITY")
          print("-" * 72)
          print(f"PIT safe: {int(pit.sum())}/{len(pit)}")
          print(
              f"Historical consensus: "
              f"{int(consensus.sum())}/{len(consensus)}"
          )
          print(f"Indicators: {len(indicators)}")
          print(f"2023 records: {records_2023}")

          print("")
          print("ECONOMIC HISTORICAL QUALITY GATE: PASS")
          '


      # ============================================================
      # 7. RUN SURPRISE ENGINE
      # ============================================================
      - name: Run Economic Surprise Engine v1.0
        run: |
          python economic_surprise_engine_v1.py \
            > surprise_output.txt 2>&1

          cat surprise_output.txt


      # ============================================================
      # 8. VALIDATE SURPRISE ENGINE
      # ============================================================
      - name: Validate Economic Surprise Engine
        run: |
          python -c '
          import pandas as pd

          df = pd.read_csv(
              "economic_surprise_engine_v1.csv"
          )

          summary = pd.read_csv(
              "economic_surprise_summary_v1.csv"
          )

          print("=" * 72)
          print("VALIDATING ECONOMIC SURPRISE ENGINE v1.0")
          print("=" * 72)

          print(f"Records: {len(df)}")
          print(f"Summary rows: {len(summary)}")

          # --------------------------------------------------------
          # RECORD COUNT
          # --------------------------------------------------------
          if len(df) != 48:
              raise RuntimeError(
                  f"Expected 48 surprise records, got {len(df)}"
              )

          if len(summary) == 0:
              raise RuntimeError(
                  "Surprise summary is empty."
              )

          # --------------------------------------------------------
          # REQUIRED COLUMNS
          #
          # IMPORTANT:
          # point_in_time_safe is NOT required here because
          # the Surprise Engine validates PIT internally and
          # does not necessarily export that field.
          # --------------------------------------------------------
          required_columns = [
              "indicator",
              "release_date",
              "directional_release_shock",
              "research_only",
              "decision_engine_ready"
          ]

          for col in required_columns:
              if col not in df.columns:
                  raise RuntimeError(
                      f"Missing surprise column: {col}"
                  )

          # --------------------------------------------------------
          # INDICATORS
          # --------------------------------------------------------
          indicators = df[
              "indicator"
          ].dropna().unique()

          if len(indicators) != 7:
              raise RuntimeError(
                  f"Expected 7 indicators, got {len(indicators)}"
              )

          # --------------------------------------------------------
          # DIRECTIONAL SHOCKS
          # --------------------------------------------------------
          shocks = df[
              "directional_release_shock"
          ]

          shock_count = shocks.notna().sum()

          if shock_count <= 0:
              raise RuntimeError(
                  "No directional release shocks were generated."
              )

          # --------------------------------------------------------
          # RESEARCH ONLY
          # --------------------------------------------------------
          research_only = df[
              "research_only"
          ].fillna(False)

          if not research_only.all():
              raise RuntimeError(
                  "Surprise Engine research-only gate failed."
              )

          # --------------------------------------------------------
          # DECISION ENGINE DISABLED
          # --------------------------------------------------------
          decision_ready = df[
              "decision_engine_ready"
          ].fillna(True)

          if decision_ready.any():
              raise RuntimeError(
                  "Surprise Engine Decision Engine integration "
                  "must remain disabled."
              )

          # --------------------------------------------------------
          # RELEASE DATES
          # --------------------------------------------------------
          dates = pd.to_datetime(
              df["release_date"],
              errors="coerce"
          )

          if dates.isna().any():
              raise RuntimeError(
                  "Invalid release_date detected in surprise output."
              )

          # --------------------------------------------------------
          # INSPECTION
          # --------------------------------------------------------
          print("")
          print("SURPRISE ENGINE COVERAGE")
          print("-" * 72)
          print(f"Indicators: {len(indicators)}")
          print(f"Directional shocks: {shock_count}")
          print(
              f"Research only: "
              f"{int(research_only.sum())}/{len(research_only)}"
          )
          print(
              f"Decision Engine ready: "
              f"{int(decision_ready.sum())}/{len(decision_ready)}"
          )

          # --------------------------------------------------------
          # Z-SCORE COVERAGE
          # --------------------------------------------------------
          if "prior_zscore" in df.columns:
              z_count = df[
                  "prior_zscore"
              ].notna().sum()

              print(
                  f"PIT-safe z-scores: "
                  f"{z_count}/{len(df)}"
              )

          print("")
          print("ECONOMIC SURPRISE ENGINE QUALITY GATE: PASS")
          '


      # ============================================================
      # 9. RUN REGIME CLASSIFIER
      # ============================================================
      - name: Run Economic Regime Classifier v1.3
        run: |
          python economic_regime_classifier_v1.3.py \
            > regime_output.txt 2>&1

          cat regime_output.txt


      # ============================================================
      # 10. INSPECT REGIME OUTPUT SCHEMA
      #
      # This step intentionally does NOT assume column names.
      # It shows the actual schema generated by v1.3.
      # ============================================================
      - name: Inspect Economic Regime Output Schema
        run: |
          python -c '
          import pandas as pd

          df = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          summary = pd.read_csv(
              "economic_regime_summary_v1.csv"
          )

          print("=" * 72)
          print("ECONOMIC REGIME OUTPUT SCHEMA — v1.3")
          print("=" * 72)

          # --------------------------------------------------------
          # EVENTS
          # --------------------------------------------------------
          print("")
          print("EVENTS FILE")
          print("-" * 72)

          print(f"Rows: {len(df)}")

          print("")
          print("Columns:")

          for i, col in enumerate(df.columns, 1):
              print(
                  f"{i:02d}. {col}"
              )

          print("")
          print("First 5 rows:")
          print(
              df.head(5).to_string(
                  index=False
              )
          )

          # --------------------------------------------------------
          # SUMMARY
          # --------------------------------------------------------
          print("")
          print("=" * 72)
          print("SUMMARY FILE")
          print("=" * 72)

          print("")
          print(f"Rows: {len(summary)}")

          print("")
          print("Columns:")

          for i, col in enumerate(summary.columns, 1):
              print(
                  f"{i:02d}. {col}"
              )

          print("")
          print("Summary:")
          print(
              summary.to_string(
                  index=False
              )
          )

          # --------------------------------------------------------
          # PREFERRED ECONOMIC FIELDS
          # --------------------------------------------------------
          print("")
          print("=" * 72)
          print("REGIME OBSERVATIONS")
          print("=" * 72)

          preferred = [
              "date",
              "release_date",
              "observation_date",
              "snapshot",
              "snapshot_date",
              "economic_regime",
              "inflation_score",
              "labor_score",
              "growth_score",
              "inflation_observation_date",
              "labor_observation_date",
              "growth_observation_date",
              "inflation_age_days",
              "labor_age_days",
              "growth_age_days",
              "inflation_indicators",
              "labor_indicators",
              "growth_indicators",
              "point_in_time_safe",
              "research_only",
              "decision_engine_ready"
          ]

          available = [
              c for c in preferred
              if c in df.columns
          ]

          print("")

          if available:
              print(
                  df[available].to_string(
                      index=False
                  )
              )
          else:
              print(
                  df.to_string(
                      index=False
                  )
              )
          '


      # ============================================================
      # 11. VALIDATE REGIME CLASSIFIER
      #
      # IMPORTANT:
      # This validation is intentionally schema-safe.
      # It first detects which date/PIT fields actually exist.
      # ============================================================
      - name: Validate Economic Regime Classifier
        run: |
          python -c '
          import pandas as pd

          df = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          summary = pd.read_csv(
              "economic_regime_summary_v1.csv"
          )

          print("=" * 72)
          print("VALIDATING ECONOMIC REGIME CLASSIFIER v1.3")
          print("=" * 72)

          print(f"Regime observations: {len(df)}")
          print(f"Summary rows: {len(summary)}")

          # --------------------------------------------------------
          # COUNTS
          # --------------------------------------------------------
          if len(df) != 34:
              raise RuntimeError(
                  f"Expected 34 regime observations, got {len(df)}"
              )

          if len(summary) == 0:
              raise RuntimeError(
                  "Regime summary is empty."
              )

          # --------------------------------------------------------
          # DISPLAY ACTUAL SCHEMA
          # --------------------------------------------------------
          print("")
          print("ACTUAL REGIME COLUMNS")
          print("-" * 72)

          for col in df.columns:
              print(col)

          # --------------------------------------------------------
          # REGIME COLUMN
          # --------------------------------------------------------
          if "economic_regime" not in df.columns:
              raise RuntimeError(
                  "Missing regime column: economic_regime"
              )

          # --------------------------------------------------------
          # VALID REGIMES
          # --------------------------------------------------------
          valid_regimes = {
              "INFLATIONARY_GROWTH",
              "DISINFLATIONARY_GROWTH",
              "STAGFLATIONARY",
              "DISINFLATIONARY_SLOWDOWN",
              "RECESSIONARY_PRESSURE",
              "MIXED",
              "PARTIAL_DATA",
              "INSUFFICIENT_DATA"
          }

          actual_regimes = set(
              df[
                  "economic_regime"
              ]
              .dropna()
              .astype(str)
          )

          invalid = (
              actual_regimes
              - valid_regimes
          )

          if invalid:
              raise RuntimeError(
                  f"Invalid regime labels detected: {invalid}"
              )

          # --------------------------------------------------------
          # FIND DATE COLUMN
          # --------------------------------------------------------
          possible_date_columns = [
              "snapshot_date",
              "date",
              "observation_date",
              "release_date",
              "snapshot"
          ]

          date_column = None

          for col in possible_date_columns:
              if col in df.columns:
                  date_column = col
                  break

          if date_column is not None:

              dates = pd.to_datetime(
                  df[date_column],
                  errors="coerce"
              )

              if dates.isna().any():
                  raise RuntimeError(
                      f"Invalid dates detected in {date_column}."
                  )

              print("")
              print(
                  f"Date column detected: {date_column}"
              )

          else:

              print("")
              print(
                  "WARNING: No standard date column was exported "
                  "by the Regime Classifier."
              )

          # --------------------------------------------------------
          # PIT
          # --------------------------------------------------------
          pit_columns = [
              "point_in_time_safe",
              "pit_safe",
              "point_in_time"
          ]

          pit_column = None

          for col in pit_columns:
              if col in df.columns:
                  pit_column = col
                  break

          if pit_column is not None:

              pit = df[
                  pit_column
              ].fillna(False)

              if not pit.all():
                  raise RuntimeError(
                      "Regime PIT quality gate failed."
                  )

              print(
                  f"PIT safe: {int(pit.sum())}/{len(pit)}"
              )

          else:

              print(
                  "PIT field not exported in regime events; "
                  "PIT validation is performed internally by v1.3."
              )

          # --------------------------------------------------------
          # RESEARCH ONLY
          # --------------------------------------------------------
          if "research_only" in df.columns:

              research_only = df[
                  "research_only"
              ].fillna(False)

              if not research_only.all():
                  raise RuntimeError(
                      "Regime research-only gate failed."
                  )

              print(
                  f"Research only: "
                  f"{int(research_only.sum())}/{len(research_only)}"
              )

          else:

              print(
                  "research_only field not exported."
              )

          # --------------------------------------------------------
          # DECISION ENGINE
          # --------------------------------------------------------
          if "decision_engine_ready" in df.columns:

              decision_ready = df[
                  "decision_engine_ready"
              ].fillna(True)

              if decision_ready.any():
                  raise RuntimeError(
                      "Regime Decision Engine integration "
                      "must remain disabled."
                  )

              print(
                  f"Decision Engine ready: "
                  f"{int(decision_ready.sum())}/{len(decision_ready)}"
              )

          else:

              print(
                  "decision_engine_ready field not exported."
              )

          # --------------------------------------------------------
          # DIMENSION COVERAGE
          # --------------------------------------------------------
          print("")
          print("DIMENSION COVERAGE")
          print("-" * 72)

          for col in [
              "inflation_score",
              "labor_score",
              "growth_score"
          ]:

              if col in df.columns:

                  count = df[
                      col
                  ].notna().sum()

                  print(
                      f"{col}: "
                      f"{count}/{len(df)}"
                  )

          # --------------------------------------------------------
          # DISTRIBUTION
          # --------------------------------------------------------
          print("")
          print("REGIME DISTRIBUTION")
          print("-" * 72)

          print(
              df[
                  "economic_regime"
              ]
              .value_counts()
              .to_string()
          )

          print("")
          print("REGIME CLASSIFIER QUALITY GATE: PASS")
          print("")
          '


      # ============================================================
      # 12. DISPLAY PIPELINE OUTPUTS
      # ============================================================
      - name: Display Economic Intelligence outputs
        run: |
          echo "========================================================================"
          echo "ECONOMIC HISTORICAL COLLECTOR OUTPUT"
          echo "========================================================================"
          cat collector_output.txt

          echo ""
          echo "========================================================================"
          echo "ECONOMIC SURPRISE ENGINE OUTPUT"
          echo "========================================================================"
          cat surprise_output.txt

          echo ""
          echo "========================================================================"
          echo "ECONOMIC REGIME CLASSIFIER OUTPUT"
          echo "========================================================================"
          cat regime_output.txt


      # ============================================================
      # 13. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload Economic Intelligence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v1
          path: |
            collector_output.txt
            surprise_output.txt
            regime_output.txt
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv


      # ============================================================
      # 14. FINAL QUALITY GATE
      # ============================================================
      - name: Final Economic Intelligence Quality Gate
        run: |
          python -c '
          import pandas as pd

          historical_quality = pd.read_csv(
              "economic_historical_quality_v1.csv"
          )

          surprise = pd.read_csv(
              "economic_surprise_engine_v1.csv"
          )

          regime = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          print("=" * 72)
          print("FINAL ECONOMIC INTELLIGENCE QUALITY GATE")
          print("=" * 72)

          # --------------------------------------------------------
          # HISTORICAL
          # --------------------------------------------------------
          if len(historical_quality) != 48:
              raise RuntimeError(
                  "Historical record count gate failed."
              )

          pit = historical_quality[
              "point_in_time_safe"
          ].fillna(False)

          if not pit.all():
              raise RuntimeError(
                  "Historical PIT gate failed."
              )

          # --------------------------------------------------------
          # SURPRISE
          # --------------------------------------------------------
          if "research_only" in surprise.columns:

              if not surprise[
                  "research_only"
              ].fillna(False).all():

                  raise RuntimeError(
                      "Surprise Engine research-only gate failed."
                  )

          if "decision_engine_ready" in surprise.columns:

              if surprise[
                  "decision_engine_ready"
              ].fillna(True).any():

                  raise RuntimeError(
                      "Surprise Engine Decision Engine gate failed."
                  )

          # --------------------------------------------------------
          # REGIME
          # --------------------------------------------------------
          if "research_only" in regime.columns:

              if not regime[
                  "research_only"
              ].fillna(False).all():

                  raise RuntimeError(
                      "Regime research-only gate failed."
                  )

          if "decision_engine_ready" in regime.columns:

              if regime[
                  "decision_engine_ready"
              ].fillna(True).any():

                  raise RuntimeError(
                      "Regime Decision Engine gate failed."
                  )

          # --------------------------------------------------------
          # FINAL
          # --------------------------------------------------------
          print("")
          print(
              "Historical records: "
              f"{len(historical_quality)}"
          )

          print(
              "Historical PIT safe: "
              f"{int(pit.sum())}/{len(pit)}"
          )

          print(
              "Surprise records: "
              f"{len(surprise)}"
          )

          print(
              "Regime observations: "
              f"{len(regime)}"
          )

          print("")
          print(
              "ALL ECONOMIC INTELLIGENCE QUALITY GATES: PASS"
          )

          print("")
          print(
              "STATUS: RESEARCH-ONLY"
          )

          print(
              "DECISION ENGINE INTEGRATION: DISABLED"
          )

          print("")
          '
