name: Economic Intelligence Full Pipeline v1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  economic-intelligence:
    runs-on: ubuntu-latest

    steps:

      # ================================================================
      # 1. CHECKOUT
      # ================================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ================================================================
      # 2. SETUP PYTHON
      # ================================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ================================================================
      # 3. VERIFY ECONOMIC INTELLIGENCE FILES
      # ================================================================
      - name: Verify Economic Intelligence Python files
        run: |
          echo "========================================================================"
          echo "VERIFYING ECONOMIC INTELLIGENCE PYTHON FILES"
          echo "========================================================================"

          REQUIRED_FILES=(
            "economic_historical_collector_v1_6.py"
            "economic_surprise_engine_v1.1.py"
            "economic_regime_classifier_v1.4.py"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "[ERROR] Missing required file: $file"
              exit 1
            fi

            echo "[OK] Found: $file"
          done

          echo "========================================================================"
          echo "ALL REQUIRED ECONOMIC INTELLIGENCE FILES FOUND"
          echo "========================================================================"

      # ================================================================
      # 4. INSTALL DEPENDENCIES
      # ================================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      # ================================================================
      # 5. RUN HISTORICAL COLLECTOR v1.6
      # ================================================================
      - name: Run Economic Historical Collector v1.6
        run: |
          echo "========================================================================"
          echo "RUNNING ECONOMIC HISTORICAL COLLECTOR v1.6"
          echo "========================================================================"

          python economic_historical_collector_v1_6.py

      # ================================================================
      # 6. VERIFY HISTORICAL COLLECTOR OUTPUTS
      # ================================================================
      - name: Verify Historical Collector outputs
        run: |
          echo "========================================================================"
          echo "VERIFYING HISTORICAL COLLECTOR OUTPUTS"
          echo "========================================================================"

          REQUIRED_OUTPUTS=(
            "economic_historical_events_v1.csv"
            "economic_historical_quality_v1.csv"
          )

          for file in "${REQUIRED_OUTPUTS[@]}"; do
            if [ ! -f "$file" ]; then
              echo "[ERROR] Missing output: $file"
              exit 1
            fi

            echo "[OK] Found: $file"
          done

          echo ""
          echo "Historical events rows:"
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("economic_historical_events_v1.csv")

          print(f"Rows: {len(df)}")
          print(f"Indicators: {df['indicator'].nunique()}")

          print("\nIndicator counts:")
          print(df["indicator"].value_counts().sort_index())
          PY

          echo "========================================================================"

      # ================================================================
      # 7. RUN ECONOMIC SURPRISE ENGINE v1.1
      # ================================================================
      - name: Run Economic Surprise Engine v1.1
        run: |
          echo "========================================================================"
          echo "RUNNING ECONOMIC SURPRISE ENGINE v1.1"
          echo "========================================================================"

          python economic_surprise_engine_v1.1.py

      # ================================================================
      # 8. VERIFY SURPRISE ENGINE OUTPUTS
      # ================================================================
      - name: Verify Surprise Engine outputs
        run: |
          echo "========================================================================"
          echo "VERIFYING SURPRISE ENGINE OUTPUTS"
          echo "========================================================================"

          REQUIRED_OUTPUTS=(
            "economic_surprise_engine_v1.csv"
            "economic_surprise_summary_v1.csv"
          )

          for file in "${REQUIRED_OUTPUTS[@]}"; do
            if [ ! -f "$file" ]; then
              echo "[ERROR] Missing output: $file"
              exit 1
            fi

            echo "[OK] Found: $file"
          done

          echo ""
          echo "Surprise Engine summary:"
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("economic_surprise_engine_v1.csv")

          print(f"Input/output records: {len(df)}")

          if "pit_safe" in df.columns:
              print(
                  f"PIT-safe records: "
                  f"{int(df['pit_safe'].fillna(False).sum())}/{len(df)}"
              )

          if "directional_release_shock" in df.columns:
              print(
                  "Directional release shocks: "
                  f"{int(df['directional_release_shock'].notna().sum())}"
              )

          if "directional_shock_z" in df.columns:
              print(
                  "PIT-safe z-scores: "
                  f"{int(df['directional_shock_z'].notna().sum())}"
              )

          if "consensus_available" in df.columns:
              print(
                  "Consensus-based surprises: "
                  f"{int(df['consensus_available'].fillna(False).sum())}"
              )

          if "research_only" in df.columns:
              print(
                  "Research-only rows: "
                  f"{int(df['research_only'].fillna(False).sum())}/{len(df)}"
              )

          if "decision_engine_ready" in df.columns:
              print(
                  "Decision Engine ready rows: "
                  f"{int(df['decision_engine_ready'].fillna(False).sum())}/{len(df)}"
              )
          PY

          echo "========================================================================"

      # ================================================================
      # 9. RUN ECONOMIC REGIME CLASSIFIER v1.4
      # ================================================================
      - name: Run Economic Regime Classifier v1.4
        run: |
          echo "========================================================================"
          echo "RUNNING ECONOMIC REGIME CLASSIFIER v1.4"
          echo "========================================================================"

          python economic_regime_classifier_v1.4.py

      # ================================================================
      # 10. VERIFY REGIME CLASSIFIER OUTPUTS
      # ================================================================
      - name: Verify Regime Classifier outputs
        run: |
          echo "========================================================================"
          echo "VERIFYING REGIME CLASSIFIER OUTPUTS"
          echo "========================================================================"

          REQUIRED_OUTPUTS=(
            "economic_regime_events_v1.csv"
            "economic_regime_summary_v1.csv"
          )

          for file in "${REQUIRED_OUTPUTS[@]}"; do
            if [ ! -f "$file" ]; then
              echo "[ERROR] Missing output: $file"
              exit 1
            fi

            echo "[OK] Found: $file"
          done

          echo ""
          echo "Economic Regime summary:"

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("economic_regime_events_v1.csv")

          print(f"Regime observations: {len(df)}")

          if "economic_regime" in df.columns:
              print("\nRegime distribution:")
              print(df["economic_regime"].value_counts())

          if "pit_safe" in df.columns:
              print(
                  "\nPIT-safe observations: "
                  f"{int(df['pit_safe'].fillna(False).sum())}/{len(df)}"
              )

          if "research_only" in df.columns:
              print(
                  "Research-only observations: "
                  f"{int(df['research_only'].fillna(False).sum())}/{len(df)}"
              )

          if "decision_engine_ready" in df.columns:
              print(
                  "Decision Engine ready observations: "
                  f"{int(df['decision_engine_ready'].fillna(False).sum())}/{len(df)}"
              )

          print("\nColumns:")
          print(list(df.columns))
          PY

          echo "========================================================================"

      # ================================================================
      # 11. FINAL QUALITY GATE
      # ================================================================
      - name: Final Economic Intelligence Quality Gate
        run: |
          echo "========================================================================"
          echo "FINAL ECONOMIC INTELLIGENCE QUALITY GATE"
          echo "========================================================================"

          python - <<'PY'
          import pandas as pd
          import sys

          events = pd.read_csv("economic_historical_events_v1.csv")
          quality = pd.read_csv("economic_historical_quality_v1.csv")
          surprise = pd.read_csv("economic_surprise_engine_v1.csv")
          regime = pd.read_csv("economic_regime_events_v1.csv")

          failed = False

          # --------------------------------------------------------------
          # Historical events
          # --------------------------------------------------------------
          if len(events) == 0:
              print("[FAIL] Historical events file is empty")
              failed = True
          else:
              print(f"[PASS] Historical events: {len(events)} records")

          # --------------------------------------------------------------
          # Historical PIT quality
          # --------------------------------------------------------------
          if "point_in_time_safe" in quality.columns:
              pit_safe = quality["point_in_time_safe"].fillna(False)

              if not pit_safe.all():
                  print("[FAIL] Historical PIT quality gate failed")
                  failed = True
              else:
                  print(
                      f"[PASS] Historical PIT: "
                      f"{int(pit_safe.sum())}/{len(quality)}"
                  )

          # --------------------------------------------------------------
          # Surprise Engine PIT
          # --------------------------------------------------------------
          if "pit_safe" in surprise.columns:
              surprise_pit = surprise["pit_safe"].fillna(False)

              if not surprise_pit.all():
                  print("[FAIL] Surprise Engine PIT gate failed")
                  failed = True
              else:
                  print(
                      f"[PASS] Surprise Engine PIT: "
                      f"{int(surprise_pit.sum())}/{len(surprise)}"
                  )

          # --------------------------------------------------------------
          # Surprise Engine research-only
          # --------------------------------------------------------------
          if "research_only" in surprise.columns:
              research_only = surprise["research_only"].fillna(False)

              if not research_only.all():
                  print("[FAIL] Surprise Engine research-only gate failed")
                  failed = True
              else:
                  print("[PASS] Surprise Engine research-only")

          # --------------------------------------------------------------
          # Surprise Engine Decision Engine disabled
          # --------------------------------------------------------------
          if "decision_engine_ready" in surprise.columns:
              decision_ready = surprise["decision_engine_ready"].fillna(False)

              if decision_ready.any():
                  print("[FAIL] Surprise Engine has Decision Engine ready rows")
                  failed = True
              else:
                  print("[PASS] Surprise Engine Decision Engine disabled")

          # --------------------------------------------------------------
          # Regime PIT
          # --------------------------------------------------------------
          if "pit_safe" in regime.columns:
              regime_pit = regime["pit_safe"].fillna(False)

              if not regime_pit.all():
                  print("[FAIL] Regime PIT gate failed")
                  failed = True
              else:
                  print(
                      f"[PASS] Regime PIT: "
                      f"{int(regime_pit.sum())}/{len(regime)}"
                  )

          # --------------------------------------------------------------
          # Regime research-only
          # --------------------------------------------------------------
          if "research_only" in regime.columns:
              regime_research = regime["research_only"].fillna(False)

              if not regime_research.all():
                  print("[FAIL] Regime research-only gate failed")
                  failed = True
              else:
                  print("[PASS] Regime research-only")

          # --------------------------------------------------------------
          # Regime Decision Engine disabled
          # --------------------------------------------------------------
          if "decision_engine_ready" in regime.columns:
              regime_ready = regime["decision_engine_ready"].fillna(False)

              if regime_ready.any():
                  print("[FAIL] Regime Classifier has Decision Engine ready rows")
                  failed = True
              else:
                  print("[PASS] Regime Classifier Decision Engine disabled")

          # --------------------------------------------------------------
          # Final result
          # --------------------------------------------------------------
          print("")
          print("------------------------------------------------------------------------")

          if failed:
              print("ECONOMIC INTELLIGENCE QUALITY GATE: FAIL")
              sys.exit(1)

          print("ECONOMIC INTELLIGENCE QUALITY GATE: PASS")
          print("------------------------------------------------------------------------")
          PY

      # ================================================================
      # 12. UPLOAD ALL ECONOMIC INTELLIGENCE ARTIFACTS
      # ================================================================
      - name: Upload Economic Intelligence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v1
          path: |
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv
          if-no-files-found: error
          retention-days: 30

      # ================================================================
      # 13. FINAL SUMMARY
      # ================================================================
      - name: Final Pipeline Summary
        run: |
          echo ""
          echo "========================================================================"
          echo "ECONOMIC INTELLIGENCE FULL PIPELINE — COMPLETE"
          echo "========================================================================"
          echo ""
          echo "Historical Collector:"
          echo "  economic_historical_collector_v1_6.py"
          echo ""
          echo "Surprise Engine:"
          echo "  economic_surprise_engine_v1.1.py"
          echo ""
          echo "Regime Classifier:"
          echo "  economic_regime_classifier_v1.4.py"
          echo ""
          echo "Outputs:"
          echo "  economic_historical_events_v1.csv"
          echo "  economic_historical_quality_v1.csv"
          echo "  economic_surprise_engine_v1.csv"
          echo "  economic_surprise_summary_v1.csv"
          echo "  economic_regime_events_v1.csv"
          echo "  economic_regime_summary_v1.csv"
          echo ""
          echo "Decision Engine integration: DISABLED"
          echo "Research-only status: ENABLED"
          echo ""
          echo "========================================================================"
