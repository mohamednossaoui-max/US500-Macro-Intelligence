name: Economic Intelligence Full Pipeline v1

on:
  workflow_dispatch:
  push:
    paths:
      - "economic_historical_collector_v1_5.py"
      - "economic_surprise_engine_v1.py"
      - "economic_regime_classifier_v1.3.py"
      - ".github/workflows/economic_intelligence_full_pipeline_v1.yml"

jobs:
  economic-intelligence:
    runs-on: ubuntu-latest

    steps:

      # ================================================================
      # 1. CHECKOUT
      # ================================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ================================================================
      # 2. PYTHON
      # ================================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ================================================================
      # 3. DEPENDENCIES
      # ================================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      # ================================================================
      # 4. VERIFY REQUIRED FILES
      # ================================================================
      - name: Verify required files
        run: |
          test -f economic_historical_collector_v1_5.py
          test -f economic_surprise_engine_v1.py
          test -f economic_regime_classifier_v1.3.py

          echo "All required files found."

      # ================================================================
      # 5. RUN HISTORICAL COLLECTOR
      # ================================================================
      - name: Run Economic Historical Collector v1.5
        run: |
          python "./economic_historical_collector_v1_5.py" | tee collector_output.txt

      # ================================================================
      # 6. VALIDATE HISTORICAL COLLECTOR
      # ================================================================
      - name: Validate Historical Economic Data
        run: |
          python -c '
          import pandas as pd

          events = pd.read_csv(
              "economic_historical_events_v1.csv"
          )

          quality = pd.read_csv(
              "economic_historical_quality_v1.csv"
          )

          print("=" * 72)
          print("VALIDATING ECONOMIC HISTORICAL DATA")
          print("=" * 72)

          print(f"Records: {len(events)}")
          print(f"Quality rows: {len(quality)}")

          # ------------------------------------------------------------
          # COUNTS
          # ------------------------------------------------------------
          if len(events) != 48:
              raise RuntimeError(
                  f"Expected 48 event records, got {len(events)}"
              )

          if len(quality) != 48:
              raise RuntimeError(
                  f"Expected 48 quality rows, got {len(quality)}"
              )

          # ------------------------------------------------------------
          # EVENTS
          # Only validate fields that belong to the event dataset.
          # ------------------------------------------------------------
          event_columns = [
              "indicator",
              "agency",
              "release_date",
              "release_time",
              "reference_period",
              "actual"
          ]

          for col in event_columns:
              if col not in events.columns:
                  raise RuntimeError(
                      f"Missing event column: {col}"
                  )

          # ------------------------------------------------------------
          # QUALITY
          # PIT and quality validation belong here.
          # ------------------------------------------------------------
          quality_columns = [
              "indicator",
              "agency",
              "release_date",
              "reference_period",
              "point_in_time_safe",
              "quality_issues",
              "historical_consensus_available"
          ]

          for col in quality_columns:
              if col not in quality.columns:
                  raise RuntimeError(
                      f"Missing quality column: {col}"
                  )

          if not quality[
              "point_in_time_safe"
          ].fillna(False).all():
              raise RuntimeError(
                  "Historical PIT quality gate failed."
              )

          if quality[
              "historical_consensus_available"
          ].fillna(False).any():
              raise RuntimeError(
                  "Historical consensus fabrication gate failed."
              )

          issues = (
              quality["quality_issues"]
              .fillna("")
              .astype(str)
              .str.strip()
          )

          if issues.ne("").any():
              print("")
              print("QUALITY ISSUES:")
              print(
                  quality.loc[
                      issues.ne(""),
                      [
                          "indicator",
                          "release_date",
                          "quality_issues"
                      ]
                  ].to_string(index=False)
              )

              raise RuntimeError(
                  "Historical quality issues detected."
              )

          # ------------------------------------------------------------
          # INDICATORS
          # ------------------------------------------------------------
          indicator_count = events[
              "indicator"
          ].nunique()

          if indicator_count != 7:
              raise RuntimeError(
                  f"Expected 7 indicators, got {indicator_count}"
              )

          # ------------------------------------------------------------
          # DATES
          # ------------------------------------------------------------
          dates = pd.to_datetime(
              events["release_date"],
              errors="coerce"
          )

          if dates.isna().any():
              raise RuntimeError(
                  "Invalid release_date detected."
              )

          # ------------------------------------------------------------
          # 2023 BATCH
          # ------------------------------------------------------------
          records_2023 = events[
              dates.dt.year == 2023
          ]

          if len(records_2023) != 14:
              raise RuntimeError(
                  f"Expected 14 records in 2023 batch, "
                  f"got {len(records_2023)}"
              )

          print("")
          print("Historical data validation: PASS")
          print("PIT QUALITY GATE: PASS")
          print("CONSENSUS FABRICATION GATE: PASS")
          print("QUALITY ISSUES GATE: PASS")
          print("")
          '

      # ================================================================
      # 7. RUN SURPRISE ENGINE
      # ================================================================
      - name: Run Economic Surprise Engine v1.0
        run: |
          python "./economic_surprise_engine_v1.py" | tee surprise_output.txt

      # ================================================================
      # 8. VALIDATE SURPRISE ENGINE
      # ================================================================
      - name: Validate Economic Surprise Engine
        run: |
          python -c '
          import pandas as pd

          df = pd.read_csv(
              "economic_surprise_engine_v1.csv"
          )

          print("=" * 72)
          print("VALIDATING ECONOMIC SURPRISE ENGINE v1.0")
          print("=" * 72)

          print(f"Records: {len(df)}")

          # ------------------------------------------------------------
          # RECORD COUNT
          # ------------------------------------------------------------
          if len(df) != 48:
              raise RuntimeError(
                  f"Expected 48 surprise records, got {len(df)}"
              )

          # ------------------------------------------------------------
          # REQUIRED CORE COLUMNS
          #
          # These are the fields needed by the current Surprise Engine
          # output. PIT status is already validated internally by the
          # Surprise Engine itself.
          # ------------------------------------------------------------
          required_columns = [
              "indicator",
              "release_date",
              "directional_release_shock",
              "research_only",
              "decision_engine_ready"
          ]

          for col in required_columns:
              if col not in df.columns:
                  raise RuntimeError(
                      f"Missing surprise column: {col}"
                  )

          # ------------------------------------------------------------
          # RESEARCH ONLY
          # ------------------------------------------------------------
          if not df[
              "research_only"
          ].fillna(False).all():
              raise RuntimeError(
                  "Surprise Engine research-only gate failed."
              )

          # ------------------------------------------------------------
          # DECISION ENGINE MUST REMAIN DISABLED
          # ------------------------------------------------------------
          if df[
              "decision_engine_ready"
          ].fillna(True).any():
              raise RuntimeError(
                  "Decision Engine integration must remain disabled."
              )

          # ------------------------------------------------------------
          # DIRECTIONAL SHOCKS
          # ------------------------------------------------------------
          directional_count = (
              df[
                  "directional_release_shock"
              ]
              .notna()
              .sum()
          )

          if directional_count <= 0:
              raise RuntimeError(
                  "No directional release shocks generated."
              )

          # ------------------------------------------------------------
          # INDICATORS
          # ------------------------------------------------------------
          indicator_count = df[
              "indicator"
          ].nunique()

          if indicator_count != 7:
              raise RuntimeError(
                  f"Expected 7 indicators, got {indicator_count}"
              )

          # ------------------------------------------------------------
          # Z-SCORE COVERAGE
          # ------------------------------------------------------------
          if "prior_zscore" in df.columns:
              z_count = df[
                  "prior_zscore"
              ].notna().sum()
          else:
              z_count = 0

          print(
              f"Directional release shocks: {directional_count}"
          )

          print(
              f"PIT-safe z-scores reported by engine: {z_count}"
          )

          print("")
          print("Surprise Engine validation: PASS")
          print("CONSENSUS FABRICATION GATE: PASS")
          print("LOOK-AHEAD GATE: PASS")
          print("RESEARCH-ONLY GATE: PASS")
          print("DECISION ENGINE INTEGRATION: DISABLED")
          print("")
          '

      # ================================================================
      # 9. RUN REGIME CLASSIFIER
      # ================================================================
      - name: Run Economic Regime Classifier v1.3
        run: |
          python "./economic_regime_classifier_v1.3.py" | tee regime_output.txt

      # ================================================================
      # 10. VALIDATE REGIME CLASSIFIER
      # ================================================================
      - name: Validate Economic Regime Classifier
        run: |
          python -c '
          import pandas as pd

          df = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          summary = pd.read_csv(
              "economic_regime_summary_v1.csv"
          )

          print("=" * 72)
          print("VALIDATING ECONOMIC REGIME CLASSIFIER v1.3")
          print("=" * 72)

          print(f"Regime observations: {len(df)}")
          print(f"Summary rows: {len(summary)}")

          # ------------------------------------------------------------
          # COUNTS
          # ------------------------------------------------------------
          if len(df) != 34:
              raise RuntimeError(
                  f"Expected 34 regime observations, got {len(df)}"
              )

          if len(summary) == 0:
              raise RuntimeError(
                  "Regime summary is empty."
              )

          # ------------------------------------------------------------
          # CORE COLUMNS
          # ------------------------------------------------------------
          required_columns = [
              "snapshot_date",
              "economic_regime",
              "point_in_time_safe",
              "research_only",
              "decision_engine_ready"
          ]

          for col in required_columns:
              if col not in df.columns:
                  raise RuntimeError(
                      f"Missing regime column: {col}"
                  )

          # ------------------------------------------------------------
          # PIT
          # ------------------------------------------------------------
          if not df[
              "point_in_time_safe"
          ].fillna(False).all():
              raise RuntimeError(
                  "Regime PIT quality gate failed."
              )

          # ------------------------------------------------------------
          # RESEARCH ONLY
          # ------------------------------------------------------------
          if not df[
              "research_only"
          ].fillna(False).all():
              raise RuntimeError(
                  "Regime research-only gate failed."
              )

          # ------------------------------------------------------------
          # DECISION ENGINE DISABLED
          # ------------------------------------------------------------
          if df[
              "decision_engine_ready"
          ].fillna(True).any():
              raise RuntimeError(
                  "Regime Decision Engine integration must remain disabled."
              )

          # ------------------------------------------------------------
          # DATES
          # ------------------------------------------------------------
          dates = pd.to_datetime(
              df["snapshot_date"],
              errors="coerce"
          )

          if dates.isna().any():
              raise RuntimeError(
                  "Invalid snapshot_date detected."
              )

          # ------------------------------------------------------------
          # VALID REGIMES
          # ------------------------------------------------------------
          valid_regimes = {
              "INFLATIONARY_GROWTH",
              "DISINFLATIONARY_GROWTH",
              "STAGFLATIONARY",
              "DISINFLATIONARY_SLOWDOWN",
              "RECESSIONARY_PRESSURE",
              "MIXED",
              "PARTIAL_DATA",
              "INSUFFICIENT_DATA"
          }

          actual_regimes = set(
              df[
                  "economic_regime"
              ]
              .dropna()
              .astype(str)
          )

          invalid = actual_regimes - valid_regimes

          if invalid:
              raise RuntimeError(
                  f"Invalid regime labels detected: {invalid}"
              )

          # ------------------------------------------------------------
          # DIMENSION COVERAGE
          # ------------------------------------------------------------
          print("")
          print("DIMENSION COVERAGE")
          print("-" * 72)

          for col in [
              "inflation_score",
              "labor_score",
              "growth_score"
          ]:
              if col in df.columns:
                  count = df[
                      col
                  ].notna().sum()

                  print(
                      f"{col}: {count}/{len(df)}"
                  )

          # ------------------------------------------------------------
          # DISTRIBUTION
          # ------------------------------------------------------------
          print("")
          print("REGIME DISTRIBUTION")
          print("-" * 72)

          print(
              df[
                  "economic_regime"
              ]
              .value_counts()
              .to_string()
          )

          print("")
          print("REGIME CLASSIFIER QUALITY GATE: PASS")
          print("")
          '

      # ================================================================
      # 11. INSPECT REGIME OBSERVATIONS
      # ================================================================
      - name: Inspect Regime Observations
        run: |
          python -c '
          import pandas as pd

          df = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          print("=" * 72)
          print("ECONOMIC REGIME OBSERVATIONS — v1.3")
          print("=" * 72)

          # ------------------------------------------------------------
          # Print all useful columns that actually exist.
          # This avoids schema assumptions.
          # ------------------------------------------------------------
          preferred = [
              "snapshot_date",
              "economic_regime",
              "inflation_score",
              "labor_score",
              "growth_score",
              "inflation_observation_date",
              "labor_observation_date",
              "growth_observation_date",
              "inflation_age_days",
              "labor_age_days",
              "growth_age_days",
              "inflation_indicator_count",
              "labor_indicator_count",
              "growth_indicator_count",
              "inflation_indicators",
              "labor_indicators",
              "growth_indicators",
              "point_in_time_safe",
              "research_only",
              "decision_engine_ready"
          ]

          available = [
              c
              for c in preferred
              if c in df.columns
          ]

          if available:
              print(
                  df[
                      available
                  ].to_string(index=False)
              )
          else:
              print(
                  df.to_string(index=False)
              )

          print("")
          print("=" * 72)
          print("ALL REGIME CSV COLUMNS")
          print("=" * 72)

          for i, column in enumerate(df.columns, 1):
              print(
                  f"{i}. {column}"
              )

          print("")
          print("=" * 72)
          print("REGIME DISTRIBUTION")
          print("=" * 72)

          print(
              df[
                  "economic_regime"
              ]
              .value_counts()
              .to_string()
          )
          '

      # ================================================================
      # 12. DISPLAY PIPELINE OUTPUTS
      # ================================================================
      - name: Display Pipeline Outputs
        run: |
          echo "========================================================================"
          echo "COLLECTOR OUTPUT"
          echo "========================================================================"
          cat collector_output.txt

          echo ""
          echo "========================================================================"
          echo "SURPRISE ENGINE OUTPUT"
          echo "========================================================================"
          cat surprise_output.txt

          echo ""
          echo "========================================================================"
          echo "REGIME CLASSIFIER OUTPUT"
          echo "========================================================================"
          cat regime_output.txt

      # ================================================================
      # 13. UPLOAD ARTIFACTS
      # ================================================================
      - name: Upload Economic Intelligence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v1
          path: |
            collector_output.txt
            surprise_output.txt
            regime_output.txt
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv

      # ================================================================
      # 14. FINAL QUALITY GATE
      # ================================================================
      - name: Final Economic Intelligence Quality Gate
        run: |
          python -c '
          import pandas as pd

          historical = pd.read_csv(
              "economic_historical_events_v1.csv"
          )

          quality = pd.read_csv(
              "economic_historical_quality_v1.csv"
          )

          surprise = pd.read_csv(
              "economic_surprise_engine_v1.csv"
          )

          regime = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          print("=" * 72)
          print("FINAL ECONOMIC INTELLIGENCE QUALITY GATE")
          print("=" * 72)

          # ------------------------------------------------------------
          # HISTORICAL
          # ------------------------------------------------------------
          if len(historical) != 48:
              raise RuntimeError(
                  "Historical record count failed."
              )

          if len(quality) != 48:
              raise RuntimeError(
                  "Historical quality count failed."
              )

          if not quality[
              "point_in_time_safe"
          ].fillna(False).all():
              raise RuntimeError(
                  "Historical PIT gate failed."
              )

          if quality[
              "historical_consensus_available"
          ].fillna(False).any():
              raise RuntimeError(
                  "Historical consensus gate failed."
              )

          # ------------------------------------------------------------
          # SURPRISE
          # ------------------------------------------------------------
          if len(surprise) != 48:
              raise RuntimeError(
                  "Surprise record count failed."
              )

          if not surprise[
              "research_only"
          ].fillna(False).all():
              raise RuntimeError(
                  "Surprise research-only gate failed."
              )

          if surprise[
              "decision_engine_ready"
          ].fillna(True).any():
              raise RuntimeError(
                  "Surprise Decision Engine integration enabled."
              )

          # ------------------------------------------------------------
          # REGIME
          # ------------------------------------------------------------
          if len(regime) != 34:
              raise RuntimeError(
                  "Regime observation count failed."
              )

          if not regime[
              "point_in_time_safe"
          ].fillna(False).all():
              raise RuntimeError(
                  "Regime PIT gate failed."
              )

          if not regime[
              "research_only"
          ].fillna(False).all():
              raise RuntimeError(
                  "Regime research-only gate failed."
              )

          if regime[
              "decision_engine_ready"
          ].fillna(True).any():
              raise RuntimeError(
                  "Regime Decision Engine integration enabled."
              )

          print("")
          print("48 historical records: PASS")
          print("Historical PIT safety: PASS")
          print("Historical consensus fabrication: PASS")
          print("Surprise Engine: PASS")
          print("Surprise Engine research-only: PASS")
          print("Regime Classifier: PASS")
          print("Regime Classifier PIT safety: PASS")
          print("Regime Classifier research-only: PASS")
          print("Decision Engine integration: DISABLED")
          print("")
          print("FINAL QUALITY GATE: PASS")
          print("")
          '
