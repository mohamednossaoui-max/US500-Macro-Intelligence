name: Economic Intelligence Full Pipeline v1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  economic-intelligence:
    runs-on: ubuntu-latest

    steps:

      # ================================================================
      # 1. CHECKOUT
      # ================================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ================================================================
      # 2. SETUP PYTHON
      # ================================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ================================================================
      # 3. VERIFY PYTHON FILES
      # ================================================================
      - name: Verify Economic Intelligence Python files
        run: |
          echo "========================================================================"
          echo "VERIFYING ECONOMIC INTELLIGENCE PYTHON FILES"
          echo "========================================================================"

          REQUIRED_FILES=(
            "economic_historical_collector_v1_7.py"
            "economic_surprise_engine_v1.1.py"
            "economic_regime_classifier_v1.4.py"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "[ERROR] Missing required file: $file"
              exit 1
            fi

            echo "[OK] Found: $file"
          done

          echo "========================================================================"
          echo "ALL REQUIRED PYTHON FILES FOUND"
          echo "========================================================================"


      # ================================================================
      # 4. INSTALL DEPENDENCIES
      # ================================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy


      # ================================================================
      # 5. RUN HISTORICAL COLLECTOR v1.7
      # ================================================================
      - name: Run Economic Historical Collector v1.7
        run: |
          echo "========================================================================"
          echo "RUNNING ECONOMIC HISTORICAL COLLECTOR v1.7"
          echo "========================================================================"

          python economic_historical_collector_v1_7.py


      # ================================================================
      # 6. VERIFY HISTORICAL OUTPUTS
      # ================================================================
      - name: Verify Historical Collector outputs
        run: |
          echo "========================================================================"
          echo "VERIFYING HISTORICAL COLLECTOR OUTPUTS"
          echo "========================================================================"

          REQUIRED_OUTPUTS=(
            "economic_historical_events_v1.csv"
            "economic_historical_quality_v1.csv"
          )

          for file in "${REQUIRED_OUTPUTS[@]}"; do
            if [ ! -f "$file" ]; then
              echo "[ERROR] Missing output: $file"
              exit 1
            fi

            echo "[OK] Found: $file"
          done

          echo ""
          echo "Historical dataset summary:"

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("economic_historical_events_v1.csv")

          print(f"Total records: {len(df)}")
          print(f"Indicators: {df['indicator'].nunique()}")

          print("\nRecords by indicator:")
          print(df["indicator"].value_counts().sort_index())

          print("\nRecords with previous:")
          print(
              f"{df['previous'].notna().sum()}/{len(df)}"
          )

          print("\nDate range:")
          print(f"First release: {df['release_date'].min()}")
          print(f"Last release:  {df['release_date'].max()}")
          PY

          echo "========================================================================"


      # ================================================================
      # 7. RUN ECONOMIC SURPRISE ENGINE v1.1
      # ================================================================
      - name: Run Economic Surprise Engine v1.1
        run: |
          echo "========================================================================"
          echo "RUNNING ECONOMIC SURPRISE ENGINE v1.1"
          echo "========================================================================"

          python economic_surprise_engine_v1.1.py


      # ================================================================
      # 8. VERIFY SURPRISE ENGINE OUTPUTS
      # ================================================================
      - name: Verify Surprise Engine outputs
        run: |
          echo "========================================================================"
          echo "VERIFYING SURPRISE ENGINE OUTPUTS"
          echo "========================================================================"

          REQUIRED_OUTPUTS=(
            "economic_surprise_engine_v1.csv"
            "economic_surprise_summary_v1.csv"
          )

          for file in "${REQUIRED_OUTPUTS[@]}"; do
            if [ ! -f "$file" ]; then
              echo "[ERROR] Missing output: $file"
              exit 1
            fi

            echo "[OK] Found: $file"
          done

          echo ""
          echo "ECONOMIC SURPRISE ENGINE v1.1 — SUMMARY"
          echo "------------------------------------------------------------------------"

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("economic_surprise_engine_v1.csv")

          print(f"Input records: {len(df)}")

          if "pit_safe" in df.columns:
              pit = df["pit_safe"].fillna(False)
              print(
                  f"PIT-safe records: {pit.sum()}/{len(df)}"
              )

          if "consensus_available" in df.columns:
              consensus = df["consensus_available"].fillna(False)
              print(
                  f"Consensus-based surprises: {consensus.sum()}"
              )

          if "directional_release_shock" in df.columns:
              shocks = df["directional_release_shock"].notna()
              print(
                  f"Directional release shocks: {shocks.sum()}"
              )

          if "directional_shock_z" in df.columns:
              z = df["directional_shock_z"].notna()
              print(
                  f"PIT-safe z-scores: {z.sum()}"
              )

          if "prior_valid_observation_count" in df.columns:
              print(
                  f"Maximum prior history: "
                  f"{df['prior_valid_observation_count'].max()}"
              )

          print("\nZ-score coverage by indicator:")

          if "directional_shock_z" in df.columns:
              coverage = (
                  df.groupby("indicator")["directional_shock_z"]
                  .agg(
                      total="size",
                      z_scores=lambda x: x.notna().sum()
                  )
              )

              for indicator, row in coverage.iterrows():
                  print(
                      f"  {indicator:<30}"
                      f"{int(row['z_scores'])}/{int(row['total'])}"
                  )

          if "research_only" in df.columns:
              research = df["research_only"].fillna(False)
              print(
                  f"\nResearch-only rows: "
                  f"{research.sum()}/{len(df)}"
              )

          if "decision_engine_ready" in df.columns:
              ready = df["decision_engine_ready"].fillna(False)
              print(
                  f"Decision Engine ready rows: "
                  f"{ready.sum()}/{len(df)}"
              )
          PY

          echo "========================================================================"


      # ================================================================
      # 9. RUN ECONOMIC REGIME CLASSIFIER v1.4
      # ================================================================
      - name: Run Economic Regime Classifier v1.4
        run: |
          echo "========================================================================"
          echo "RUNNING ECONOMIC REGIME CLASSIFIER v1.4"
          echo "========================================================================"

          python economic_regime_classifier_v1.4.py


      # ================================================================
      # 10. VERIFY REGIME OUTPUTS
      # ================================================================
      - name: Verify Regime Classifier outputs
        run: |
          echo "========================================================================"
          echo "VERIFYING REGIME CLASSIFIER OUTPUTS"
          echo "========================================================================"

          REQUIRED_OUTPUTS=(
            "economic_regime_events_v1.csv"
            "economic_regime_summary_v1.csv"
          )

          for file in "${REQUIRED_OUTPUTS[@]}"; do
            if [ ! -f "$file" ]; then
              echo "[ERROR] Missing output: $file"
              exit 1
            fi

            echo "[OK] Found: $file"
          done

          echo ""
          echo "ECONOMIC REGIME CLASSIFIER v1.4 — SUMMARY"
          echo "------------------------------------------------------------------------"

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("economic_regime_events_v1.csv")

          print(f"Regime observations: {len(df)}")

          if "economic_regime" in df.columns:
              print("\nRegime distribution:")
              print(df["economic_regime"].value_counts())

          if "pit_safe" in df.columns:
              pit = df["pit_safe"].fillna(False)
              print(
                  f"\nPIT-safe observations: "
                  f"{pit.sum()}/{len(df)}"
              )

          if "research_only" in df.columns:
              research = df["research_only"].fillna(False)
              print(
                  f"Research-only observations: "
                  f"{research.sum()}/{len(df)}"
              )

          if "decision_engine_ready" in df.columns:
              ready = df["decision_engine_ready"].fillna(False)
              print(
                  f"Decision Engine ready: "
                  f"{ready.sum()}/{len(df)}"
              )

          print("\nDate range:")
          print(f"First: {df['release_date'].min()}")
          print(f"Last:  {df['release_date'].max()}")
          PY

          echo "========================================================================"


      # ================================================================
      # 11. FINAL QUALITY GATE
      # ================================================================
      - name: Final Economic Intelligence Quality Gate
        run: |
          echo "========================================================================"
          echo "FINAL ECONOMIC INTELLIGENCE QUALITY GATE"
          echo "========================================================================"

          python - <<'PY'
          import pandas as pd
          import sys

          failed = False

          events = pd.read_csv(
              "economic_historical_events_v1.csv"
          )

          quality = pd.read_csv(
              "economic_historical_quality_v1.csv"
          )

          surprise = pd.read_csv(
              "economic_surprise_engine_v1.csv"
          )

          regime = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          # --------------------------------------------------------------
          # HISTORICAL DATASET
          # --------------------------------------------------------------

          if len(events) == 0:
              print("[FAIL] Historical dataset is empty")
              failed = True
          else:
              print(
                  f"[PASS] Historical dataset: "
                  f"{len(events)} records"
              )

          # --------------------------------------------------------------
          # HISTORICAL PIT
          # --------------------------------------------------------------

          if "point_in_time_safe" in quality.columns:

              pit = quality[
                  "point_in_time_safe"
              ].fillna(False)

              if not pit.all():
                  print(
                      "[FAIL] Historical PIT QUALITY GATE"
                  )
                  failed = True
              else:
                  print(
                      f"[PASS] Historical PIT QUALITY GATE: "
                      f"{pit.sum()}/{len(pit)}"
                  )

          # --------------------------------------------------------------
          # SURPRISE PIT
          # --------------------------------------------------------------

          if "pit_safe" in surprise.columns:

              pit = surprise[
                  "pit_safe"
              ].fillna(False)

              if not pit.all():
                  print(
                      "[FAIL] Surprise Engine PIT QUALITY GATE"
                  )
                  failed = True
              else:
                  print(
                      f"[PASS] Surprise Engine PIT: "
                      f"{pit.sum()}/{len(pit)}"
                  )

          # --------------------------------------------------------------
          # SURPRISE RESEARCH ONLY
          # --------------------------------------------------------------

          if "research_only" in surprise.columns:

              research = surprise[
                  "research_only"
              ].fillna(False)

              if not research.all():
                  print(
                      "[FAIL] Surprise Engine research-only gate"
                  )
                  failed = True
              else:
                  print(
                      "[PASS] Surprise Engine RESEARCH-ONLY"
                  )

          # --------------------------------------------------------------
          # SURPRISE DECISION ENGINE DISABLED
          # --------------------------------------------------------------

          if "decision_engine_ready" in surprise.columns:

              ready = surprise[
                  "decision_engine_ready"
              ].fillna(False)

              if ready.any():
                  print(
                      "[FAIL] Surprise Engine Decision Engine enabled"
                  )
                  failed = True
              else:
                  print(
                      "[PASS] Surprise Engine Decision Engine DISABLED"
                  )

          # --------------------------------------------------------------
          # REGIME PIT
          # --------------------------------------------------------------

          if "pit_safe" in regime.columns:

              pit = regime[
                  "pit_safe"
              ].fillna(False)

              if not pit.all():
                  print(
                      "[FAIL] Regime PIT QUALITY GATE"
                  )
                  failed = True
              else:
                  print(
                      f"[PASS] Regime PIT: "
                      f"{pit.sum()}/{len(pit)}"
                  )

          # --------------------------------------------------------------
          # REGIME RESEARCH ONLY
          # --------------------------------------------------------------

          if "research_only" in regime.columns:

              research = regime[
                  "research_only"
              ].fillna(False)

              if not research.all():
                  print(
                      "[FAIL] Regime research-only gate"
                  )
                  failed = True
              else:
                  print(
                      "[PASS] Regime Classifier RESEARCH-ONLY"
                  )

          # --------------------------------------------------------------
          # REGIME DECISION ENGINE DISABLED
          # --------------------------------------------------------------

          if "decision_engine_ready" in regime.columns:

              ready = regime[
                  "decision_engine_ready"
              ].fillna(False)

              if ready.any():
                  print(
                      "[FAIL] Regime Classifier Decision Engine enabled"
                  )
                  failed = True
              else:
                  print(
                      "[PASS] Regime Classifier Decision Engine DISABLED"
                  )

          # --------------------------------------------------------------
          # FINAL RESULT
          # --------------------------------------------------------------

          print("")
          print("------------------------------------------------------------------------")

          if failed:
              print(
                  "ECONOMIC INTELLIGENCE QUALITY GATE: FAIL"
              )
              sys.exit(1)

          print(
              "ECONOMIC INTELLIGENCE QUALITY GATE: PASS"
          )

          print("------------------------------------------------------------------------")
          PY


      # ================================================================
      # 12. UPLOAD ARTIFACTS
      # ================================================================
      - name: Upload Economic Intelligence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v1
          path: |
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv
          if-no-files-found: error
          retention-days: 30


      # ================================================================
      # 13. FINAL SUMMARY
      # ================================================================
      - name: Final Pipeline Summary
        run: |
          echo ""
          echo "========================================================================"
          echo "ECONOMIC INTELLIGENCE FULL PIPELINE — COMPLETE"
          echo "========================================================================"
          echo ""
          echo "Historical Collector:"
          echo "  economic_historical_collector_v1_7.py"
          echo ""
          echo "Surprise Engine:"
          echo "  economic_surprise_engine_v1.1.py"
          echo ""
          echo "Regime Classifier:"
          echo "  economic_regime_classifier_v1.4.py"
          echo ""
          echo "Pipeline:"
          echo "  Historical Collector v1.7"
          echo "          ↓"
          echo "  Surprise Engine v1.1"
          echo "          ↓"
          echo "  Regime Classifier v1.4"
          echo ""
          echo "Decision Engine integration: DISABLED"
          echo "Research-only: ENABLED"
          echo ""
          echo "========================================================================"
