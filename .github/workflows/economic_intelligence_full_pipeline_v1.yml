name: Economic Intelligence Full Pipeline v1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  economic-intelligence:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. VERIFY REQUIRED PYTHON FILES
      # ============================================================
      - name: Verify Economic Intelligence Python files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING ECONOMIC INTELLIGENCE FILES"
          echo "=========================================="

          REQUIRED_FILES=(
            "economic_historical_collector_v1_7.py"
            "economic_surprise_engine_v1.1.py"
            "economic_regime_classifier_v1_5.py"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "[ERROR] Missing required file: $FILE"
              exit 1
            fi

            echo "[OK] $FILE"
          done

          echo ""
          echo "All required Python files found."

      # ============================================================
      # 4. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install pandas numpy

      # ============================================================
      # 5. PYTHON SYNTAX CHECK
      # ============================================================
      - name: Validate Python syntax
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PYTHON SYNTAX CHECK"
          echo "=========================================="

          python -m py_compile \
            economic_historical_collector_v1_7.py \
            economic_surprise_engine_v1.1.py \
            economic_regime_classifier_v1_5.py

          echo "Syntax check: PASS"

      # ============================================================
      # 6. HISTORICAL COLLECTOR v1.7
      # ============================================================
      - name: Run Economic Historical Collector v1.7
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ECONOMIC HISTORICAL COLLECTOR v1.7"
          echo "=========================================="

          python economic_historical_collector_v1_7.py

      # ============================================================
      # 7. VERIFY HISTORICAL OUTPUTS
      # ============================================================
      - name: Verify Historical Collector outputs
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING HISTORICAL OUTPUTS"
          echo "=========================================="

          REQUIRED_OUTPUTS=(
            "economic_historical_events_v1.csv"
            "economic_historical_quality_v1.csv"
          )

          for FILE in "${REQUIRED_OUTPUTS[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "[ERROR] Missing output: $FILE"
              exit 1
            fi

            echo "[OK] $FILE"
          done

          python - <<'PY'
          import pandas as pd

          events = pd.read_csv("economic_historical_events_v1.csv")
          quality = pd.read_csv("economic_historical_quality_v1.csv")

          print("")
          print("Historical events:", len(events))
          print("Historical quality:", len(quality))

          if len(events) == 0:
              raise SystemExit("ERROR: Historical dataset is empty.")

          if len(events) != len(quality):
              raise SystemExit(
                  "ERROR: Events and quality row counts do not match."
              )

          print("Date range:")
          print(events["release_date"].min(), "->", events["release_date"].max())

          print("")
          print("Indicator distribution:")
          print(events["indicator"].value_counts().to_string())

          print("")
          print("Historical Collector verification: PASS")
          PY

      # ============================================================
      # 8. SURPRISE ENGINE v1.1
      # ============================================================
      - name: Run Economic Surprise Engine v1.1
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ECONOMIC SURPRISE ENGINE v1.1"
          echo "=========================================="

          python economic_surprise_engine_v1.1.py

      # ============================================================
      # 9. VERIFY SURPRISE OUTPUTS
      # ============================================================
      - name: Verify Surprise Engine outputs
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING SURPRISE ENGINE OUTPUTS"
          echo "=========================================="

          REQUIRED_OUTPUTS=(
            "economic_surprise_engine_v1.csv"
            "economic_surprise_summary_v1.csv"
          )

          for FILE in "${REQUIRED_OUTPUTS[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "[ERROR] Missing output: $FILE"
              exit 1
            fi

            echo "[OK] $FILE"
          done

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("economic_surprise_engine_v1.csv")

          required = {
              "indicator",
              "release_date",
              "pit_safe",
              "directional_release_shock",
              "directional_shock_z",
              "prior_valid_observation_count",
              "research_only",
              "decision_engine_ready",
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  f"ERROR: Missing required columns: {sorted(missing)}"
              )

          print("")
          print("Input records:", len(df))

          pit = df["pit_safe"].fillna(False)
          print(
              "PIT-safe:",
              int(pit.sum()),
              "/",
              len(df)
          )

          consensus = (
              df.get("consensus_available", pd.Series(False, index=df.index))
              .fillna(False)
          )

          shocks = df["directional_release_shock"].notna()
          zscores = df["directional_shock_z"].notna()

          print("Consensus-based surprises:", int(consensus.sum()))
          print("Directional release shocks:", int(shocks.sum()))
          print("PIT-safe z-scores:", int(zscores.sum()))

          print("")
          print("Minimum prior history:")
          print(
              int(df["prior_valid_observation_count"].max())
              if len(df) else 0
          )

          print("")
          print("Z-score coverage by indicator:")

          coverage = (
              df.groupby("indicator")
              .agg(
                  events=("indicator", "size"),
                  z_scores=("directional_shock_z", "count")
              )
          )

          print(coverage.to_string())

          if not pit.all():
              raise SystemExit(
                  "ERROR: Surprise Engine PIT gate failed."
              )

          if not df["research_only"].fillna(False).all():
              raise SystemExit(
                  "ERROR: Research-only gate failed."
              )

          if df["decision_engine_ready"].fillna(False).any():
              raise SystemExit(
                  "ERROR: Decision Engine is enabled."
              )

          print("")
          print("PIT QUALITY GATE: PASS")
          print("RESEARCH-ONLY GATE: PASS")
          print("DECISION ENGINE DISABLED: PASS")
          PY

      # ============================================================
      # 10. REGIME CLASSIFIER v1.5
      # ============================================================
      - name: Run Economic Regime Classifier v1.5
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ECONOMIC REGIME CLASSIFIER v1.5"
          echo "LABOR DIMENSION STABILIZATION"
          echo "=========================================="

          python economic_regime_classifier_v1_5.py

      # ============================================================
      # 11. VERIFY REGIME OUTPUTS
      # ============================================================
      - name: Verify Regime Classifier outputs
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING REGIME OUTPUTS"
          echo "=========================================="

          REQUIRED_OUTPUTS=(
            "economic_regime_events_v1.csv"
            "economic_regime_summary_v1.csv"
          )

          for FILE in "${REQUIRED_OUTPUTS[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "[ERROR] Missing output: $FILE"
              exit 1
            fi

            echo "[OK] $FILE"
          done

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("economic_regime_events_v1.csv")

          required = {
              "release_date",
              "inflation_score",
              "labor_score",
              "growth_score",
              "economic_regime",
              "dimensions_available",
              "labor_indicator_count",
              "labor_indicators",
              "labor_method",
              "labor_raw_shock_count",
              "pit_safe",
              "research_only",
              "decision_engine_ready",
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  f"ERROR: Missing required columns: {sorted(missing)}"
              )

          print("")
          print("Regime observations:", len(df))

          print(
              "PIT-safe:",
              int(df["pit_safe"].fillna(False).sum()),
              "/",
              len(df)
          )

          print(
              "Research-only:",
              int(df["research_only"].fillna(False).sum()),
              "/",
              len(df)
          )

          print(
              "Decision Engine ready:",
              int(
                  df["decision_engine_ready"]
                  .fillna(False)
                  .sum()
              ),
              "/",
              len(df)
          )

          print("")
          print("Regime distribution:")
          print(
              df["economic_regime"]
              .value_counts()
              .to_string()
          )

          print("")
          print("Dimension coverage:")

          print(
              "Inflation:",
              int(df["inflation_score"].notna().sum()),
              "/",
              len(df)
          )

          print(
              "Labor:",
              int(df["labor_score"].notna().sum()),
              "/",
              len(df)
          )

          print(
              "Growth:",
              int(df["growth_score"].notna().sum()),
              "/",
              len(df)
          )

          print("")
          print("Labor indicator usage:")

          print(
              df["labor_indicators"]
              .replace("", pd.NA)
              .value_counts(dropna=False)
              .to_string()
          )

          print("")
          print("Labor method distribution:")

          print(
              df["labor_method"]
              .value_counts(dropna=False)
              .to_string()
          )

          print("")
          print(
              "Labor observations with >=2 indicators:",
              int((df["labor_indicator_count"] >= 2).sum()),
              "/",
              len(df)
          )

          print("")
          print("Labor raw shock count:")
          print(
              int(df["labor_raw_shock_count"].sum())
          )

          # ------------------------------------------
          # HARD QUALITY GATES
          # ------------------------------------------

          if not df["pit_safe"].fillna(False).all():
              raise SystemExit(
                  "ERROR: Regime PIT gate failed."
              )

          if not df["research_only"].fillna(False).all():
              raise SystemExit(
                  "ERROR: Research-only gate failed."
              )

          if df["decision_engine_ready"].fillna(False).any():
              raise SystemExit(
                  "ERROR: Decision Engine must remain disabled."
              )

          if df["labor_raw_shock_count"].sum() != 0:
              raise SystemExit(
                  "ERROR: Labor dimension contains raw shocks."
              )

          if (
              df["inflation_score"].notna()
              & df["growth_score"].notna()
          ).any():
              pass

          print("")
          print("PIT QUALITY GATE: PASS")
          print("NORMALIZATION GATE: PASS")
          print("LABOR STABILIZATION GATE: PASS")
          print("RESEARCH-ONLY GATE: PASS")
          print("DECISION ENGINE DISABLED: PASS")
          PY

      # ============================================================
      # 12. FINAL PIPELINE QUALITY GATE
      # ============================================================
      - name: Final Economic Intelligence Quality Gate
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL ECONOMIC INTELLIGENCE QUALITY GATE"
          echo "=========================================="

          python - <<'PY'
          import pandas as pd

          historical = pd.read_csv(
              "economic_historical_events_v1.csv"
          )

          surprise = pd.read_csv(
              "economic_surprise_engine_v1.csv"
          )

          regime = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          print("Historical records:", len(historical))
          print("Surprise records:", len(surprise))
          print("Regime observations:", len(regime))

          if len(historical) == 0:
              raise SystemExit(
                  "FAIL: Historical dataset is empty."
              )

          if len(surprise) != len(historical):
              raise SystemExit(
                  "FAIL: Surprise rows do not match historical rows."
              )

          if not surprise["pit_safe"].fillna(False).all():
              raise SystemExit(
                  "FAIL: Surprise PIT gate."
              )

          if not regime["pit_safe"].fillna(False).all():
              raise SystemExit(
                  "FAIL: Regime PIT gate."
              )

          if not surprise["research_only"].fillna(False).all():
              raise SystemExit(
                  "FAIL: Surprise research-only gate."
              )

          if not regime["research_only"].fillna(False).all():
              raise SystemExit(
                  "FAIL: Regime research-only gate."
              )

          if surprise["decision_engine_ready"].fillna(False).any():
              raise SystemExit(
                  "FAIL: Surprise Engine enabled Decision Engine."
              )

          if regime["decision_engine_ready"].fillna(False).any():
              raise SystemExit(
                  "FAIL: Regime Classifier enabled Decision Engine."
              )

          if (
              regime["labor_raw_shock_count"]
              .fillna(0)
              .sum()
              != 0
          ):
              raise SystemExit(
                  "FAIL: Raw labor shocks detected."
              )

          print("")
          print("==========================================")
          print("FINAL QUALITY GATE:
