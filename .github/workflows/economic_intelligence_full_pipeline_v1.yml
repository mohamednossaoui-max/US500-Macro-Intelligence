name: Economic Intelligence Full Pipeline v1

on:
  workflow_dispatch:

  push:
    paths:
      - "economic_historical_collector_v1_4.py"
      - "economic_surprise_engine_v1.py"
      - "economic_regime_classifier_v1.py"
      - ".github/workflows/economic_intelligence_full_pipeline_v1.yml"

jobs:
  economic-intelligence:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. Install dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      # ============================================================
      # 4. Historical Economic Data Collector
      # ============================================================

      - name: Run Economic Historical Collector
        run: |
          python "./economic_historical_collector_v1_4.py"

      # ============================================================
      # 5. Validate Historical Collector outputs
      # ============================================================

      - name: Validate Historical Data
        run: |
          test -f economic_historical_events_v1.csv
          test -f economic_historical_quality_v1.csv

          echo "Historical data files found."

          python - <<'PY'
          import pandas as pd

          events = pd.read_csv("economic_historical_events_v1.csv")
          quality = pd.read_csv("economic_historical_quality_v1.csv")

          print("Historical events:", len(events))
          print("Quality rows:", len(quality))

          if len(events) == 0:
              raise SystemExit("ERROR: Historical events file is empty.")

          if "pit_safe" in events.columns:
              safe = events["pit_safe"].astype(str).str.upper().isin(
                  ["TRUE", "1", "YES"]
              ).sum()

              print(f"PIT safe: {safe}/{len(events)}")

              if safe != len(events):
                  raise SystemExit(
                      "ERROR: Historical data contains PIT-unsafe records."
                  )

          print("Historical data validation: PASS")
          PY

      # ============================================================
      # 6. Economic Surprise Engine
      # ============================================================

      - name: Run Economic Surprise Engine
        run: |
          python "./economic_surprise_engine_v1.py"

      # ============================================================
      # 7. Validate Surprise Engine outputs
      # ============================================================

      - name: Validate Surprise Engine
        run: |
          test -f economic_surprise_engine_v1.csv
          test -f economic_surprise_summary_v1.csv

          echo "Surprise Engine files found."

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("economic_surprise_engine_v1.csv")

          print("Surprise Engine rows:", len(df))

          if len(df) == 0:
              raise SystemExit(
                  "ERROR: Economic Surprise Engine output is empty."
              )

          if "pit_safe" in df.columns:
              safe = df["pit_safe"].astype(str).str.upper().isin(
                  ["TRUE", "1", "YES"]
              ).sum()

              print(f"PIT safe: {safe}/{len(df)}")

              if safe != len(df):
                  raise SystemExit(
                      "ERROR: Surprise Engine contains PIT-unsafe records."
                  )

          print("Surprise Engine validation: PASS")
          PY

      # ============================================================
      # 8. Economic Regime Classifier
      # ============================================================

      - name: Run Economic Regime Classifier
        run: |
          python "./economic_regime_classifier_v1.py"

      # ============================================================
      # 9. Validate Regime Classifier outputs
      # ============================================================

      - name: Validate Economic Regime
        run: |
          test -f economic_regime_classification_v1.csv
          test -f economic_regime_summary_v1.csv

          echo "Regime Classifier files found."

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("economic_regime_classification_v1.csv")

          print("Regime observations:", len(df))

          if len(df) == 0:
              raise SystemExit(
                  "ERROR: Economic Regime Classifier output is empty."
              )

          print("\nRegime distribution:")

          if "regime" in df.columns:
              print(df["regime"].value_counts(dropna=False))

          print("\nEconomic Regime validation: PASS")
          PY

      # ============================================================
      # 10. Upload all Economic Intelligence outputs
      # ============================================================

      - name: Upload Economic Intelligence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v1
          path: |
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_classification_v1.csv
            economic_regime_summary_v1.csv
          if-no-files-found: error

      # ============================================================
      # 11. Final status
      # ============================================================

      - name: Economic Intelligence Pipeline Complete
        run: |
          echo "============================================================"
          echo "US500 MACRO INTELLIGENCE"
          echo "ECONOMIC INTELLIGENCE PIPELINE v1"
          echo "============================================================"
          echo ""
          echo "Historical Collector:      PASS"
          echo "Economic Surprise Engine:  PASS"
          echo "Economic Regime Classifier: PASS"
          echo "Artifacts:                  UPLOADED"
          echo ""
          echo "Research-only."
          echo "No Decision Engine integration."
          echo "No trading signal generated."
