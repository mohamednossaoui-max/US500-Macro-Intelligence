name: Economic Intelligence Full Pipeline v1.8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economic-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Economic Intelligence Python files
        run: |
          set -e
          for FILE in economic_historical_collector_v1_8.py economic_surprise_engine_v1.1.py economic_regime_classifier_v1.5.py; do
            if [ ! -f "$FILE" ]; then echo "[ERROR] Missing required file: $FILE"; exit 1; fi
            echo "[OK] $FILE"
          done
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
      - name: Validate Python syntax
        run: |
          python -m py_compile economic_historical_collector_v1_8.py economic_surprise_engine_v1.1.py economic_regime_classifier_v1.5.py
          echo "Syntax check: PASS"
      - name: Run Economic Historical Collector v1.8
        run: python economic_historical_collector_v1_8.py
      - name: Verify Historical Collector
        run: |
          set -e
          test -f economic_historical_events_v1.csv
          test -f economic_historical_quality_v1.csv
          python - <<'PY'
          import pandas as pd
          e = pd.read_csv("economic_historical_events_v1.csv")
          q = pd.read_csv("economic_historical_quality_v1.csv")
          print("Historical records:", len(e))
          print("Quality records:", len(q))
          print("Date range:", e["release_date"].min(), "->", e["release_date"].max())
          print("")
          print(e["indicator"].value_counts().to_string())
          if len(e) != len(q): raise SystemExit("ERROR: Events/quality row mismatch.")
          if not q["point_in_time_safe"].fillna(False).all(): raise SystemExit("ERROR: PIT gate failed.")
          if q["historical_consensus_available"].fillna(False).any(): raise SystemExit("ERROR: Historical consensus detected.")
          print("Historical Collector verification: PASS")
          PY
      - name: Run Economic Surprise Engine v1.1
        run: python economic_surprise_engine_v1.1.py
      - name: Verify Surprise Engine
        run: |
          set -e
          test -f economic_surprise_engine_v1.csv
          test -f economic_surprise_summary_v1.csv
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("economic_surprise_engine_v1.csv")
          required = {"indicator","release_date","pit_safe","directional_release_shock","directional_shock_z","prior_valid_observation_count","research_only","decision_engine_ready"}
          missing = required - set(df.columns)
          if missing: raise SystemExit(f"ERROR: Missing columns: {sorted(missing)}")
          print("Records:", len(df))
          print("PIT-safe:", int(df["pit_safe"].fillna(False).sum()), "/", len(df))
          print("Directional shocks:", int(df["directional_release_shock"].notna().sum()))
          print("Z-scores:", int(df["directional_shock_z"].notna().sum()))
          print("")
          print(df.groupby("indicator").agg(events=("indicator","size"), z_scores=("directional_shock_z","count")).to_string())
          if not df["pit_safe"].fillna(False).all(): raise SystemExit("ERROR: Surprise PIT gate failed.")
          if not df["research_only"].fillna(False).all(): raise SystemExit("ERROR: Research-only gate failed.")
          if df["decision_engine_ready"].fillna(False).any(): raise SystemExit("ERROR: Decision Engine enabled.")
          print("Surprise Engine verification: PASS")
          PY
      - name: Run Economic Regime Classifier v1.5
        run: python economic_regime_classifier_v1.5.py
      - name: Verify Regime Classifier
        run: |
          set -e
          test -f economic_regime_events_v1.csv
          test -f economic_regime_summary_v1.csv
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("economic_regime_events_v1.csv")
          required = {"release_date","inflation_score","labor_score","growth_score","economic_regime","labor_indicator_count","labor_indicators","labor_method","labor_raw_shock_count","pit_safe","research_only","decision_engine_ready"}
          missing = required - set(df.columns)
          if missing: raise SystemExit(f"ERROR: Missing columns: {sorted(missing)}")
          print("Regime observations:", len(df))
          print("PIT-safe:", int(df["pit_safe"].fillna(False).sum()), "/", len(df))
          print("")
          print("Regime distribution:")
          print(df["economic_regime"].value_counts().to_string())
          print("")
          print("Dimension coverage:")
          print("Inflation:", int(df["inflation_score"].notna().sum()), "/", len(df))
          print("Labor:", int(df["labor_score"].notna().sum()), "/", len(df))
          print("Growth:", int(df["growth_score"].notna().sum()), "/", len(df))
          print("")
          print("Labor method:")
          print(df["labor_method"].value_counts(dropna=False).to_string())
          if not df["pit_safe"].fillna(False).all(): raise SystemExit("ERROR: Regime PIT gate failed.")
          if not df["research_only"].fillna(False).all(): raise SystemExit("ERROR: Research-only gate failed.")
          if df["decision_engine_ready"].fillna(False).any(): raise SystemExit("ERROR: Decision Engine enabled.")
          if df["labor_raw_shock_count"].fillna(0).sum() != 0: raise SystemExit("ERROR: Raw labor shocks detected.")
          print("Regime Classifier verification: PASS")
          PY
      - name: Final Economic Intelligence Quality Gate
        run: |
          python - <<'PY'
          import pandas as pd
          h = pd.read_csv("economic_historical_events_v1.csv")
          s = pd.read_csv("economic_surprise_engine_v1.csv")
          r = pd.read_csv("economic_regime_events_v1.csv")
          print("Historical:", len(h))
          print("Surprise:", len(s))
          print("Regime:", len(r))
          if len(h) == 0 or len(s) != len(h): raise SystemExit("FAIL: Pipeline row integrity.")
          if not s["pit_safe"].fillna(False).all() or not r["pit_safe"].fillna(False).all(): raise SystemExit("FAIL: PIT gate.")
          if not s["research_only"].fillna(False).all() or not r["research_only"].fillna(False).all(): raise SystemExit("FAIL: Research-only gate.")
          if s["decision_engine_ready"].fillna(False).any() or r["decision_engine_ready"].fillna(False).any(): raise SystemExit("FAIL: Decision Engine enabled.")
          if r["labor_raw_shock_count"].fillna(0).sum() != 0: raise SystemExit("FAIL: Raw labor shocks detected.")
          print("")
          print("FINAL QUALITY GATE: PASS")
          print("Research-only: YES")
          print("Decision Engine: DISABLED")
          print("PIT-safe: YES")
          PY
      - name: Upload Economic Intelligence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v1.8
          path: |
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv
          if-no-files-found: error
          retention-days: 30
