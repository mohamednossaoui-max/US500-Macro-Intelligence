name: Economic Intelligence Full Pipeline v1.9.1

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

jobs:
  economic-intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Syntax check
        run: |
          python -m py_compile economic_historical_collector_v1_9.py
          python -m py_compile economic_historical_collector_v1_9_1.py
          python -m py_compile economic_surprise_engine_v1.1.py
          python -m py_compile economic_regime_classifier_v1.5.py

      - name: Historical Collector v1.9
        run: python economic_historical_collector_v1_9.py

      - name: Add verified 2025 Claims + ISM
        run: python economic_historical_collector_v1_9_1.py

      - name: Surprise Engine v1.1
        run: python economic_surprise_engine_v1.1.py

      - name: Regime Classifier v1.5
        run: python economic_regime_classifier_v1.5.py

      - name: Final quality gate
        run: |
          test -f economic_historical_events_v1.csv
          test -f economic_historical_quality_v1.csv
          test -f economic_surprise_engine_v1.csv
          test -f economic_surprise_summary_v1.csv
          test -f economic_regime_events_v1.csv
          test -f economic_regime_summary_v1.csv

          python - <<'PY'
          import pandas as pd
          h = pd.read_csv("economic_historical_events_v1.csv")
          q = pd.read_csv("economic_historical_quality_v1.csv")
          print("Historical records:", len(h))
          print("PIT safe:", int(q["point_in_time_safe"].sum()), "/", len(q))
          print("Consensus:", int(q["historical_consensus_available"].sum()))
          print("2025 Claims:", int(((h["indicator"]=="INITIAL_JOBLESS_CLAIMS") & h["release_date"].astype(str).str.startswith("2025")).sum()))
          print("2025 ISM:", int(((h["indicator"]=="ISM_MANUFACTURING_PMI") & h["release_date"].astype(str).str.startswith("2025")).sum()))
          assert q["point_in_time_safe"].all()
          assert not q["historical_consensus_available"].any()
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v1.9.1
          path: |
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv
