name: Economic Intelligence Full Pipeline v2.1

on:
  workflow_dispatch:

jobs:
  economic-intelligence-v2-1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4 pypdf

      - name: Verify files
        run: |
          test -f economic_historical_collector_v1_9_1.py
          test -f economic_historical_expansion_v2_1.py
          test -f economic_surprise_engine_v1.1.py
          test -f economic_regime_classifier_v1.5.py

      - name: Syntax check
        run: |
          python -m py_compile economic_historical_collector_v1_9_1.py
          python -m py_compile economic_historical_expansion_v2_1.py
          python -m py_compile economic_surprise_engine_v1.1.py
          python -m py_compile economic_regime_classifier_v1.5.py

      - name: Build v1.9.1 baseline
        run: python economic_historical_collector_v1_9_1.py

      - name: Historical Expansion v2.1
        run: python economic_historical_expansion_v2_1.py

      - name: Surprise Engine v1.1
        run: python economic_surprise_engine_v1.1.py

      - name: Regime Classifier v1.5
        run: python economic_regime_classifier_v1.5.py

      - name: Upload v2.1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v2-1
          path: |
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv
