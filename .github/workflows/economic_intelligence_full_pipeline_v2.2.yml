name: Economic Intelligence Full Pipeline v2.2

on:
  workflow_dispatch:

jobs:
  economic-intelligence-v2-2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4 pypdf pytest

      - name: Verify v2.2 standalone files
        run: |
          test -f economic_historical_expansion_v2.2.py
          test -f economic_surprise_engine_v1.1.py
          test -f economic_regime_classifier_v1.5.py
          test -f economic_canonical_input_v2.py
          test -f point_in_time.py
          test -f tests/test_point_in_time_integrity.py

      - name: Syntax check
        run: |
          python -m py_compile economic_historical_expansion_v2.2.py
          python -m py_compile economic_surprise_engine_v1.1.py
          python -m py_compile economic_regime_classifier_v1.5.py
          python -m py_compile economic_canonical_input_v2.py
          python -m py_compile point_in_time.py
          python -m py_compile macro_context_v1.py

      - name: PR-04 Point-in-Time integrity tests
        run: python -m pytest -q tests/test_point_in_time_integrity.py

      - name: Stage canonical Economic input (14-indicator foundation)
        run: python economic_canonical_input_v2.py

      - name: Surprise Engine v1.3 (same filename)
        run: python economic_surprise_engine_v1.1.py

      - name: Regime Classifier v1.6 (same filename)
        run: python economic_regime_classifier_v1.5.py

      - name: Canonical Universe + PIT Quality Gate
        run: |
          python - <<'PY'
          import pandas as pd
          h = pd.read_csv("economic_historical_events_v1.csv")
          q = pd.read_csv("economic_historical_quality_v1.csv")
          s = pd.read_csv("economic_surprise_engine_v1.csv")
          r = pd.read_csv("economic_regime_events_v1.csv")
          indicators = set(h["indicator"].dropna().astype(str))
          assert {"PCE_PRICE_INDEX", "CORE_PCE"} <= indicators
          assert len(indicators) > 7
          assert q["point_in_time_safe"].all()
          assert s["point_in_time_safe"].all()
          assert s["research_only"].all() and not s["decision_engine_ready"].any()
          assert r["pit_safe"].all()
          assert r["research_only"].all() and not r["decision_engine_ready"].any()
          print("Historical records:", len(h))
          print("Indicators:", len(indicators))
          print("Extended universe:", sorted(indicators))
          print("CANONICAL INPUT GATE: PASS")
          print("PIT / RESEARCH-ONLY GATES: PASS")
          PY

      - name: Upload v2.2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v2-2
          path: |
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv
