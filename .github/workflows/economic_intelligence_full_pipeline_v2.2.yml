name: Economic Intelligence Full Pipeline v2.2

on:
  workflow_dispatch:

jobs:
  economic-intelligence-v2-2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4 pypdf

      - name: Verify v2.2 standalone files
        run: |
          test -f economic_historical_expansion_v2.2.py
          test -f economic_surprise_engine_v1.1.py
          test -f economic_regime_classifier_v1.5.py

      - name: Syntax check
        run: |
          python -m py_compile economic_historical_expansion_v2.2.py
          python -m py_compile economic_surprise_engine_v1.1.py
          python -m py_compile economic_regime_classifier_v1.5.py

      - name: Historical Expansion v2.2
        run: python economic_historical_expansion_v2.2.py

      - name: Surprise Engine v1.3 (same filename)
        run: python economic_surprise_engine_v1.1.py

      - name: Regime Classifier v1.6 (same filename)
        run: python economic_regime_classifier_v1.5.py

      - name: Final v2.2 Quality Gate
        run: |
          python - <<'PY'
          import pandas as pd
          h = pd.read_csv("economic_historical_events_v1.csv")
          q = pd.read_csv("economic_historical_quality_v1.csv")

          assert q["point_in_time_safe"].all()
          assert not q["historical_consensus_available"].any()

          claims = ((h["indicator"] == "INITIAL_JOBLESS_CLAIMS") &
                    h["release_date"].astype(str).str[:4].isin(["2020","2021"])).sum()
          ism = ((h["indicator"] == "ISM_MANUFACTURING_PMI") &
                 h["release_date"].astype(str).str[:4].isin(["2020","2021"])).sum()
          # For monthly BLS series, use the reference period year rather than
          # release year. December 2021 was released in January 2022, so a
          # release-date filter would incorrectly report 46 instead of 48.
          ref_year = h["reference_period"].astype(str).str.extract(r"(20\d{2})", expand=False)

          cpi_core = ((h["indicator"].isin(["CPI", "CORE_CPI"])) &
                      ref_year.isin(["2020", "2021"])).sum()
          labor = ((h["indicator"].isin(["NFP", "UNEMPLOYMENT_RATE"])) &
                   ref_year.isin(["2020", "2021"])).sum()

          print("Historical records:", len(h))
          print("PIT safe:", int(q["point_in_time_safe"].sum()), "/", len(q))
          print("Historical consensus:", int(q["historical_consensus_available"].sum()))
          print("2020-2021 Claims:", int(claims))
          print("2020-2021 ISM:", int(ism))
          print("2020-2021 CPI/Core CPI (reference years):", int(cpi_core))
          print("2020-2021 NFP/Unemployment (reference years):", int(labor))

          assert ism == 24
          assert claims >= 90
          assert cpi_core == 48
          assert labor == 48

          s = pd.read_csv("economic_surprise_engine_v1.csv")
          r = pd.read_csv("economic_regime_events_v1.csv")

          assert len(s) == 486
          assert len(r) == 340
          assert s["point_in_time_safe"].all()
          assert s["research_only"].all()
          assert not s["decision_engine_ready"].any()
          assert (s.loc[s["indicator"] == "GDP", "release_type"]
                  .isin(["NEW_PERIOD_RELEASE", "SAME_PERIOD_REVISION"]).all())
          gdp = s[s["indicator"] == "GDP"]
          assert int((gdp["release_type"] == "NEW_PERIOD_RELEASE").sum()) == 15
          assert int((gdp["release_type"] == "SAME_PERIOD_REVISION").sum()) == 25
          assert r["pit_safe"].all()
          assert r["research_only"].all()
          assert not r["decision_engine_ready"].any()
          assert int(r["growth_raw_shock_count"].sum()) == 0

          print("Surprise Engine records:", len(s))
          print("Regime observations:", len(r))
          print("GDP new-period releases:", int((gdp["release_type"] == "NEW_PERIOD_RELEASE").sum()))
          print("GDP same-period revisions:", int((gdp["release_type"] == "SAME_PERIOD_REVISION").sum()))
          print("PIT QUALITY GATE: PASS")
          print("GDP VINTAGE/REVISION GATE: PASS")
          print("NO RAW SHOCK FALLBACK GATE: PASS")
          print("RESEARCH-ONLY GATE: PASS")
          print("DECISION ENGINE DISABLED: PASS")
          PY

      - name: Upload v2.2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v2-2
          path: |
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv
