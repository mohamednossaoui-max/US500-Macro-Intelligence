name: Economic Intelligence Full Pipeline v2.3 Refresh

run-name: "${{ github.workflow }} [${{ inputs.correlation_id || github.run_id }}]"

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: "Internal dispatch correlation token; blank for manual runs"
        required: false
        default: ""
      source_ref:
        description: "Pinned source commit; blank uses dispatched commit"
        required: false
        default: ""

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-repair-20261016.txt

permissions:
  contents: read

jobs:
  economic-intelligence-v2-3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Official refresh, staging validation and canonical merge
        run: python economic_official_ingestion_v1.py --mode merge
      - name: Validate merged canonical Economic input
        run: python economic_canonical_input_v2.py --workspace
      - name: Surprise Engine
        run: python economic_surprise_engine_v1.1.py
      - name: Regime Classifier
        run: python economic_regime_classifier_v1.5.py
      - name: Release-aware canonical gate
        run: python economic_official_ingestion_v1.py --mode gate
      - name: PIT and ingestion regressions
        run: python -m pytest -q tests/test_point_in_time_integrity.py tests/test_economic_official_ingestion_v1.py tests/test_bls_fred_metadata.py tests/test_repair_integrity_20261016.py
      - name: Upload audit evidence even on source failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-official-source-audit
          path: economic_official_staging/
      - name: Upload validated Economic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-v2-3-refresh
          path: |
            economic_ingestion_status_v1.json
            economic_historical_events_v1.csv
            economic_historical_quality_v1.csv
            economic_surprise_engine_v1.csv
            economic_surprise_summary_v1.csv
            economic_regime_events_v1.csv
            economic_regime_summary_v1.csv
