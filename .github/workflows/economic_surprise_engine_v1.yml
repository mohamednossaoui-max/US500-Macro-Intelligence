name: Economic Surprise Engine v1

on:
  workflow_dispatch:

jobs:
  economic-surprise:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Build historical economic dataset
        run: |
          python "./economic_historical_collector_v1_4.py"

      - name: Run Economic Surprise Engine
        run: |
          python "./economic_surprise_engine_v1.py"

      - name: Verify outputs
        run: |
          test -f economic_historical_events_v1.csv
          test -f economic_surprise_engine_v1.csv
          test -f economic_surprise_summary_v1.csv
