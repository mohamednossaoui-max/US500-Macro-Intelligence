name: Economic Surprise Engine — Phase 1

on:
  workflow_dispatch:

jobs:
  surprise-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Economic Surprise Engine
        run: python "./economic_surprise_engine_v1.py"

      - name: Verify outputs
        run: |
          test -f "./economic_surprise_engine_v1.csv"
          test -f "./economic_surprise_summary_v1.csv"

      - name: Quality gate
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("economic_surprise_engine_v1.csv")

          if not df["pit_safe"].all():
              raise SystemExit("PIT QUALITY GATE FAILED")

          if (df["consensus_available"] & df["consensus"].isna()).any():
              raise SystemExit("CONSENSUS GATE FAILED")

          print("PIT QUALITY GATE: PASS")
          print("CONSENSUS FABRICATION GATE: PASS")
          print("LOOK-AHEAD GATE: PASS")
          PY
