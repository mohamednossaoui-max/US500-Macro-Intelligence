name: Event News Intelligence v1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/event-news-intelligence-v1.yml"
      - "tests/event_news/event_news_intelligence_v1.py"

permissions:
  contents: read

concurrency:
  group: event-news-intelligence-v1
  cancel-in-progress: false

jobs:
  event-news-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      - name: Compile
        run: python -m py_compile tests/event_news/event_news_intelligence_v1.py

      - name: Run Event / News Intelligence v1
        run: |
          python tests/event_news/event_news_intelligence_v1.py \
            --output event_news_intelligence_v1

      - name: Show validation
        run: cat event_news_intelligence_v1/event_news_validation_v1.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: event-news-intelligence-v1
          path: event_news_intelligence_v1/
