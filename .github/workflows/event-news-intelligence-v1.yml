name: Event News Intelligence v1

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/event-news-intelligence-v1.yml"
      - "tests/event_news/event_news_intelligence_v1.py"

permissions:
  contents: read

jobs:
  event-news:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install pandas

      - name: Verify Event News files
        run: |
          set -euo pipefail

          test -f tests/event_news/event_news_intelligence_v1.py

          test -f .github/workflows/event-news-intelligence-v1.yml

          echo "Python file:"
          ls -lh tests/event_news/event_news_intelligence_v1.py

          echo "Workflow:"
          ls -lh .github/workflows/event-news-intelligence-v1.yml

      - name: Compile Event News Intelligence
        run: |
          set -euo pipefail

          python -m py_compile \
            tests/event_news/event_news_intelligence_v1.py

      - name: Run Event / News Intelligence v2.1
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail

          python tests/event_news/event_news_intelligence_v1.py \
            --output event_news_intelligence_v1

      - name: Verify research-only output
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "event_news_intelligence_v1/event_news_validation_v2.json"
          )

          if not path.exists():
              raise SystemExit(
                  "Validation JSON was not created."
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          required_flags = {
              "research_only": True,
              "decision_engine_ready": False,
              "trading_signal": False,
              "forecast": False,
          }

          for key, expected in required_flags.items():

              actual = data.get(key)

              if actual != expected:
                  raise SystemExit(
                      f"Safety check failed: "
                      f"{key}={actual}, "
                      f"expected={expected}"
                  )

          print(
              "Research-only safety check: PASS"
          )
          PY

      - name: Display validation
        if: always()
        run: |
          echo "=================================================="
          echo "VALIDATION"
          echo "=================================================="

          cat \
            event_news_intelligence_v1/event_news_validation_v2.json \
            2>/dev/null || true

      - name: Display summary
        if: always()
        run: |
          echo "=================================================="
          echo "SUMMARY"
          echo "=================================================="

          cat \
            event_news_intelligence_v1/event_news_research_summary_v2.json \
            2>/dev/null || true

      - name: Display dataset information
        if: always()
        run: |
          echo "=================================================="
          echo "DATASET"
          echo "=================================================="

          if [ -f event_news_intelligence_v1/event_news_research_v2.csv ]; then

            echo "Dataset exists."

            wc -l \
              event_news_intelligence_v1/event_news_research_v2.csv

            echo ""
            echo "Header:"

            head -n 1 \
              event_news_intelligence_v1/event_news_research_v2.csv

          else

            echo "Dataset not found."

          fi

      - name: Upload Event News artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-news-intelligence-v2.1
          path: event_news_intelligence_v1/
          if-no-files-found: warn
