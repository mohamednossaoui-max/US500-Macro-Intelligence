name: Event News Intelligence v1
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/event-news-intelligence-v1.yml"
      - "tests/event_news/event_news_intelligence_v1.py"
permissions:
  contents: read
jobs:
  event-news:
    runs-on: ubuntu-latest
    steps:
      # ======================================================
      # Checkout
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4
      # ======================================================
      # Python
      # ======================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ======================================================
      # Dependencies
      # ======================================================
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install \
            pandas \
            numpy
      # ======================================================
      # Compile
      # ======================================================
      - name: Compile Event News Intelligence
        run: |
          set -euo pipefail
          python -m py_compile \
            tests/event_news/event_news_intelligence_v1.py
      # ======================================================
      # Run Event / News Intelligence
      # ======================================================
      - name: Run Event / News Intelligence v1
        env:
          # Optional but recommended for SEC compliance.
          # If absent, the Python collector uses a fallback
          # research-only User-Agent.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          python \
            tests/event_news/event_news_intelligence_v1.py \
            --output event_news_intelligence_v1
      # ======================================================
      # Research-only safety guard
      # ======================================================
      - name: Research-only safety guard
        if: always()
        run: |
          set -euo pipefail
          VALIDATION_FILE="event_news_intelligence_v1/event_news_validation_v1.json"
          DATA_FILE="event_news_intelligence_v1/event_news_research_v1.csv"
          test -f "${VALIDATION_FILE}"
          test -f "${DATA_FILE}"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path(
              "event_news_intelligence_v1/"
              "event_news_validation_v1.json"
          )
          with path.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)
          required = {
              "research_only": True,
              "decision_engine_ready": False,
              "trading_signal": False,
              "forecast": False,
              "pit_perfect": False,
              "point_in_time_reconstructed": False,
          }
          errors = []
          for key, expected in required.items():
              actual = data.get(key)
              if actual != expected:
                  errors.append(
                      f"{key}: expected "
                      f"{expected}, got {actual}"
                  )
          if errors:
              print(
                  "Research-only guard FAILED:"
              )
              for error in errors:
                  print(
                      f" - {error}"
                  )
              raise SystemExit(1)
          print(
              "Research-only guard: PASS"
          )
          PY
      # ======================================================
      # Display validation report
      # ======================================================
      - name: Display validation report
        if: always()
        run: |
          echo "===== Event News Validation ====="
          if [ -f \
            event_news_intelligence_v1/event_news_validation_v1.json
          ]; then
            cat \
              event_news_intelligence_v1/event_news_validation_v1.json
          else
            echo \
              "Validation report not found."
          fi
      # ======================================================
      # Display GDELT / SEC execution summary
      # ======================================================
      - name: Display execution summary
        if: always()
        run: |
          echo "===== Event News Execution Summary ====="
          if [ -f \
            event_news_intelligence_v1/event_news_research_summary_v1.json
          ]; then
            cat \
              event_news_intelligence_v1/event_news_research_summary_v1.json
          else
            echo \
              "Research summary not found."
          fi
      # ======================================================
      # Dataset summary
      # ======================================================
      - name: Display event dataset summary
        if: always()
        run: |
          echo "===== Event News Dataset ====="
          if [ -f \
            event_news_intelligence_v1/event_news_research_v1.csv
          ]; then
            python - <<'PY'
          import pandas as pd
          path = (
              "event_news_intelligence_v1/"
              "event_news_research_v1.csv"
          )
          df = pd.read_csv(path)
          print(
              f"Rows: {len(df)}"
          )
          print("\nColumns:")
          print(
              list(df.columns)
          )
          if len(df) > 0:
              if "source_type" in df.columns:
                  print(
                      "\nSource counts:"
                  )
                  print(
                      df["source_type"]
                      .value_counts(
                          dropna=False
                      )
                      .to_string()
                  )
              if "topic" in df.columns:
                  print(
                      "\nTopic counts:"
                  )
                  print(
                      df["topic"]
                      .value_counts(
                          dropna=False
                      )
                      .to_string()
                  )
              if "published_at" in df.columns:
                  dates = pd.to_datetime(
                      df["published_at"],
                      errors="coerce",
                      utc=True,
                  )
                  print(
                      "\nDate range:"
                  )
                  print(
                      f"start={dates.min()}"
                  )
                  print(
                      f"end={dates.max()}"
                  )
          PY
          else
            echo \
              "Research dataset not found."
          fi
      # ======================================================
      # Upload artifacts
      # ======================================================
      - name: Upload Event News artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-news-intelligence-v1
          path: |
            event_news_intelligence_v1/event_news_research_v1.csv
            event_news_intelligence_v1/event_news_research_summary_v1.json
            event_news_intelligence_v1/event_news_validation_v1.json
          if-no-files-found: warn
