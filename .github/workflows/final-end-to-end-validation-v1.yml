name: Final End-to-End Validation V1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  final-end-to-end-validation:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy

      # ============================================================
      # PREPARE
      # ============================================================
      - name: Prepare artifact directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          rm -rf final_end_to_end_validation_output

          rm -f final_end_to_end_validation_run.log
          rm -f final_end_to_end_validation_exit_code.txt

          mkdir -p artifacts

      # ============================================================
      # DISCOVER ALL GITHUB ACTIONS ARTIFACTS
      #
      # IMPORTANT:
      #
      # --paginate + --slurp
      #
      # preserves full pagination and avoids the old 100-artifact
      # limitation.
      # ============================================================
      - name: Discover ALL GitHub Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            > /tmp/all_artifacts_pages.json

          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("/tmp/all_artifacts_pages.json")
          destination = Path("/tmp/all_artifacts.json")

          raw = json.loads(
              source.read_text(
                  encoding="utf-8"
              )
          )

          artifacts = []

          for page in raw:
              if isinstance(page, dict):
                  artifacts.extend(
                      page.get(
                          "artifacts",
                          []
                      )
                  )

          # Remove duplicate artifact IDs.
          unique = {}

          for artifact in artifacts:
              artifact_id = str(
                  artifact.get(
                      "id"
                  )
              )

              unique[artifact_id] = artifact

          artifacts = list(
              unique.values()
          )

          destination.write_text(
              json.dumps(
                  {
                      "artifacts": artifacts
                  },
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"Discovered {len(artifacts)} GitHub Actions artifacts."
          )
          PY

      # ============================================================
      # SELECT AND DOWNLOAD RESEARCH ARTIFACTS
      #
      # Only relevant research artifacts are downloaded.
      # Detailed download information is intentionally suppressed
      # from the Actions log.
      # ============================================================
      - name: Download relevant research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]

          data = json.loads(
              Path(
                  "/tmp/all_artifacts.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          artifacts = data.get(
              "artifacts",
              []
          )

          # --------------------------------------------------------
          # Relevant research artifact patterns.
          # --------------------------------------------------------
          patterns = [
              r"economic",
              r"fed",
              r"financial[-_ ]stress",
              r"cot",
              r"aaii",
              r"vix",
              r"sentiment",
              r"technical",
              r"breadth",
              r"cross[-_ ]asset",
              r"event[-_ ]news",
              r"earnings",
              r"macro[-_ ]context",
              r"research[-_ ]context",
              r"ema19",
          ]

          selected = []

          for artifact in artifacts:

              if artifact.get(
                  "expired"
              ):
                  continue

              name = str(
                  artifact.get(
                      "name",
                      ""
                  )
              ).lower()

              if any(
                  re.search(
                      pattern,
                      name
                  )
                  for pattern in patterns
              ):
                  selected.append(
                      artifact
                  )

          # --------------------------------------------------------
          # Keep newest non-expired artifact for each exact name.
          # --------------------------------------------------------
          newest = {}

          for artifact in selected:

              name = artifact["name"]

              if (
                  name not in newest
                  or artifact.get(
                      "created_at",
                      ""
                  )
                  > newest[name].get(
                      "created_at",
                      ""
                  )
              ):
                  newest[name] = artifact

          selected = sorted(
              newest.values(),
              key=lambda x: (
                  x.get(
                      "created_at",
                      ""
                  ),
                  str(
                      x.get(
                          "id",
                          ""
                      )
                  ),
              )
          )

          print(
              f"Selected {len(selected)} relevant research artifacts."
          )

          download_root = Path(
              "artifacts"
          )

          download_root.mkdir(
              parents=True,
              exist_ok=True
          )

          for artifact in selected:

              artifact_id = artifact["id"]

              artifact_name = artifact["name"]

              safe_name = re.sub(
                  r"[^A-Za-z0-9._-]+",
                  "_",
                  artifact_name
              )

              destination = (
                  download_root
                  / (
                      f"{artifact_id}_"
                      f"{safe_name}"
                  )
              )

              destination.mkdir(
                  parents=True,
                  exist_ok=True
              )

              url = (
                  "https://api.github.com/repos/"
                  f"{repo}/actions/artifacts/"
                  f"{artifact_id}/zip"
              )

              archive = (
                  destination
                  / "artifact.zip"
              )

              subprocess.run(
                  [
                      "curl",
                      "-L",
                      "-f",
                      "-sS",
                      "-H",
                      (
                          "Authorization: Bearer "
                          f"{os.environ['GH_TOKEN']}"
                      ),
                      "-H",
                      (
                          "Accept: "
                          "application/vnd.github+json"
                      ),
                      url,
                      "-o",
                      str(archive),
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )

              subprocess.run(
                  [
                      "unzip",
                      "-q",
                      "-o",
                      str(archive),
                      "-d",
                      str(destination),
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )

              archive.unlink(
                  missing_ok=True
              )

          print(
              "Research artifact download completed."
          )
          PY

      # ============================================================
      # RUN FINAL VALIDATION
      #
      # IMPORTANT:
      #
      # The validator output is stored in a log file instead of
      # flooding the GitHub Actions console.
      # ============================================================
      - name: Run Final End-to-End Validation
        id: validation
        shell: bash
        run: |
          set +e

          python \
            tests/final_end_to_end_validation_v1.py \
            --repo-root . \
            --artifacts-dir artifacts \
            --output-dir final_end_to_end_validation_output \
            > final_end_to_end_validation_run.log 2>&1

          rc=$?

          echo "${rc}" \
            > final_end_to_end_validation_exit_code.txt

          exit 0

      # ============================================================
      # DISPLAY CLEAN VALIDATION SUMMARY
      #
      # This is the ONLY detailed validation output shown in the
      # normal GitHub Actions console.
      # ============================================================
      - name: Display clean validation summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "US500 MACRO INTELLIGENCE"
          echo "FINAL END-TO-END VALIDATION V1"
          echo "============================================================"
          echo

          JSON_FILE="final_end_to_end_validation_output/final_end_to_end_validation.json"

          if [ ! -f "$JSON_FILE" ]; then
            echo "------------------------------------------------------------"
            echo "VALIDATION SUMMARY"
            echo "------------------------------------------------------------"
            echo "Validation JSON : NOT FOUND"
            echo
            echo "Detailed validation output:"
            echo "final_end_to_end_validation_run.log"
            echo "------------------------------------------------------------"
            exit 0
          fi

          python - "$JSON_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          passed = int(
              data.get(
                  "checks_pass",
                  0
              )
          )

          review = int(
              data.get(
                  "checks_review",
                  0
              )
          )

          failed = int(
              data.get(
                  "checks_fail",
                  0
              )
          )

          if failed > 0:
              status = "FAILED"
          elif review > 0:
              status = "PASSED WITH REVIEW"
          else:
              status = "PASSED"

          print(
              "------------------------------------------------------------"
          )
          print(
              "VALIDATION SUMMARY"
          )
          print(
              "------------------------------------------------------------"
          )

          print(
              f"PASS              : {passed}"
          )

          print(
              f"REVIEW            : {review}"
          )

          print(
              f"FAIL              : {failed}"
          )

          print()

          print(
              "Validation logic  : PASSED"
          )

          print(
              f"Validation status : {status}"
          )

          print()

          print(
              "Detailed validation output:"
          )

          print(
              "final_end_to_end_validation_run.log"
          )

          print(
              "------------------------------------------------------------"
          )

          print(
              f"FINAL STATUS: {status}"
          )

          print(
              "------------------------------------------------------------"
          )
          PY

      # ============================================================
      # UPLOAD COMPLETE VALIDATION RESULTS
      #
      # The console stays clean, while all detailed information is
      # still preserved as a downloadable GitHub Actions artifact.
      # ============================================================
      - name: Upload Final End-to-End Validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Final-End-to-End-Validation-V1
          path: |
            final_end_to_end_validation_run.log
            final_end_to_end_validation_exit_code.txt
            final_end_to_end_validation_output/
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # FINAL WORKFLOW STATUS
      #
      # REVIEW  -> success
      # PASS    -> success
      # FAIL    -> workflow failure
      # ============================================================
      - name: Apply final validation status
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f \
            final_end_to_end_validation_exit_code.txt
          ]; then
            echo "Validation exit code file not found."
            exit 1
          fi

          rc="$(
            cat \
              final_end_to_end_validation_exit_code.txt
          )"

          echo
          echo "============================================================"

          if [ "$rc" -eq 0 ]; then
            echo "FINAL END-TO-END VALIDATION: SUCCESS"
            echo "============================================================"
            exit 0
          fi

          echo "FINAL END-TO-END VALIDATION: FAILED"
          echo "============================================================"

          exit "$rc"
