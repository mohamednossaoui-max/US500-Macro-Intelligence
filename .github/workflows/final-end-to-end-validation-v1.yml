name: Final End-to-End Validation V1
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  final-end-to-end-validation:
    runs-on: ubuntu-latest
    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install \
            pandas \
            numpy
      # ============================================================
      # PREPARE
      # ============================================================
      - name: Prepare artifact directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          echo "Artifact directory prepared."
      # ============================================================
      # DISCOVER ALL GITHUB ACTIONS ARTIFACTS
      #
      # IMPORTANT:
      #
      # --paginate + --slurp
      #
      # prevents the old 100-artifact limitation.
      # ============================================================
      - name: Discover ALL GitHub Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "DISCOVERING ALL GITHUB ACTIONS ARTIFACTS"
          echo "============================================================"
          gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            > /tmp/all_artifacts_pages.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path(
              "/tmp/all_artifacts_pages.json"
          )
          raw = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )
          artifacts = []
          for page in raw:
              if isinstance(
                  page,
                  dict
              ):
                  artifacts.extend(
                      page.get(
                          "artifacts",
                          []
                      )
                  )
          # --------------------------------------------------------
          # Remove duplicate artifact IDs.
          # --------------------------------------------------------
          unique = {}
          for artifact in artifacts:
              unique[
                  str(
                      artifact["id"]
                  )
              ] = artifact
          artifacts = list(
              unique.values()
          )
          output = {
              "artifacts": artifacts
          }
          Path(
              "/tmp/all_artifacts.json"
          ).write_text(
              json.dumps(
                  output,
                  indent=2
              ),
              encoding="utf-8"
          )
          print(
              "Total artifacts discovered "
              "across all pages: "
              f"{len(artifacts)}"
          )
          print()
          for artifact in sorted(
              artifacts,
              key=lambda x:
                  x.get(
                      "created_at",
                      ""
                  )
          ):
              print(
                  f"{artifact.get('id')} | "
                  f"{artifact.get('name')} | "
                  f"expired="
                  f"{artifact.get('expired')} | "
                  f"created="
                  f"{artifact.get('created_at')}"
              )
          PY
      # ============================================================
      # SELECT AND DOWNLOAD RESEARCH ARTIFACTS
      #
      # We do NOT download arbitrary unrelated artifacts.
      # ============================================================
      - name: Download relevant research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          repo = os.environ[
              "GITHUB_REPOSITORY"
          ]
          data = json.loads(
              Path(
                  "/tmp/all_artifacts.json"
              ).read_text(
                  encoding="utf-8"
              )
          )
          artifacts = data.get(
              "artifacts",
              []
          )
          # --------------------------------------------------------
          # Relevant research artifact patterns.
          # --------------------------------------------------------
          patterns = [
              r"economic",
              r"fed",
              r"financial[-_ ]stress",
              r"cot",
              r"aaii",
              r"vix",
              r"sentiment",
              r"technical",
              r"breadth",
              r"cross[-_ ]asset",
              r"event[-_ ]news",
              r"earnings",
              r"macro[-_ ]context",
              r"research[-_ ]context",
              r"ema19",
          ]
          selected = []
          for artifact in artifacts:
              if artifact.get(
                  "expired"
              ):
                  continue
              name = str(
                  artifact.get(
                      "name",
                      ""
                  )
              ).lower()
              if any(
                  re.search(
                      pattern,
                      name
                  )
                  for pattern in patterns
              ):
                  selected.append(
                      artifact
                  )
          # --------------------------------------------------------
          # Keep newest non-expired artifact for each exact name.
          #
          # This prevents stale duplicate versions from overwhelming
          # the validation while preserving one complete snapshot
          # for every artifact name.
          # --------------------------------------------------------
          newest = {}
          for artifact in selected:
              name = artifact[
                  "name"
              ]
              if (
                  name not in newest
                  or artifact.get(
                      "created_at",
                      ""
                  )
                  > newest[name].get(
                      "created_at",
                      ""
                  )
              ):
                  newest[name] = artifact
          selected = sorted(
              newest.values(),
              key=lambda x: (
                  x.get(
                      "created_at",
                      ""
                  ),
                  str(
                      x.get(
                          "id",
                          ""
                      )
                  ),
              )
          )
          print(
              "Relevant non-expired artifact "
              "names selected: "
              f"{len(selected)}"
          )
          download_root = Path(
              "artifacts"
          )
          download_root.mkdir(
              parents=True,
              exist_ok=True
          )
          for artifact in selected:
              artifact_id = artifact[
                  "id"
              ]
              artifact_name = artifact[
                  "name"
              ]
              safe_name = re.sub(
                  r"[^A-Za-z0-9._-]+",
                  "_",
                  artifact_name
              )
              destination = (
                  download_root
                  / (
                      f"{artifact_id}_"
                      f"{safe_name}"
                  )
              )
              destination.mkdir(
                  parents=True,
                  exist_ok=True
              )
              print()
              print(
                  "------------------------------------------------------------"
              )
              print(
                  f"Downloading artifact: "
                  f"{artifact_name}"
              )
              print(
                  f"Artifact ID         : "
                  f"{artifact_id}"
              )
              print(
                  f"Created             : "
                  f"{artifact.get('created_at')}"
              )
              print(
                  f"Destination         : "
                  f"{destination}"
              )
              print(
                  "------------------------------------------------------------"
              )
              url = (
                  "https://api.github.com/repos/"
                  f"{repo}/actions/artifacts/"
                  f"{artifact_id}/zip"
              )
              archive = (
                  destination
                  / "artifact.zip"
              )
              subprocess.run(
                  [
                      "curl",
                      "-L",
                      "-f",
                      "-sS",
                      "-H",
                      (
                          "Authorization: Bearer "
                          f"{os.environ['GH_TOKEN']}"
                      ),
                      "-H",
                      (
                          "Accept: "
                          "application/vnd.github+json"
                      ),
                      url,
                      "-o",
                      str(archive),
                  ],
                  check=True,
              )
              subprocess.run(
                  [
                      "unzip",
                      "-o",
                      str(archive),
                      "-d",
                      str(destination),
                  ],
                  check=True,
              )
              archive.unlink(
                  missing_ok=True
              )
          print()
          print(
              "Artifact download completed successfully."
          )
          print(
              "CSV and JSON research artifacts "
              "are included in validation."
          )
          PY
      # ============================================================
      # SHOW ARTIFACT TREE
      # ============================================================
      - name: Show downloaded artifact tree
        shell: bash
        run: |
          echo "============================================================"
          echo "DOWNLOADED ARTIFACT TREE"
          echo "============================================================"
          find artifacts \
            -maxdepth 8 \
            -type f \
            -print \
            | sort
      # ============================================================
      # SHOW RESEARCH ARTIFACT INVENTORY
      # ============================================================
      - name: Show research artifact inventory
        shell: bash
        run: |
          echo "============================================================"
          echo "RESEARCH ARTIFACT INVENTORY"
          echo "============================================================"
          find artifacts \
            -type f \
            \( \
              -name "*.csv" \
              -o \
              -name "*.json" \
            \) \
            -print \
            | sort
      # ============================================================
      # RUN FINAL VALIDATION
      # ============================================================
      - name: Run Final End-to-End Validation
        shell: bash
        run: |
          set -o pipefail
          echo "============================================================"
          echo "US500 MACRO INTELLIGENCE"
          echo "FINAL END-TO-END VALIDATION V1"
          echo "============================================================"
          python \
            tests/final_end_to_end_validation_v1.py \
            --repo-root . \
            --artifacts-dir artifacts \
            --output-dir final_end_to_end_validation_output \
            2>&1 \
            | tee \
              final_end_to_end_validation_run.log
      # ============================================================
      # DISPLAY SUMMARY
      # ============================================================
      - name: Display validation summary
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo "VALIDATION SUMMARY"
          echo "============================================================"
          if [ -f \
            final_end_to_end_validation_output/final_end_to_end_validation_summary.csv
          ]; then
            cat \
              final_end_to_end_validation_output/final_end_to_end_validation_summary.csv
          else
            echo "Summary file not found."
          fi
          echo
          echo "============================================================"
          echo "VALIDATION EVENTS"
          echo "============================================================"
          if [ -f \
            final_end_to_end_validation_output/final_end_to_end_validation_events.csv
          ]; then
            cat \
              final_end_to_end_validation_output/final_end_to_end_validation_events.csv
          else
            echo "Events file not found."
          fi
      # ============================================================
      # DISPLAY FINAL JSON
      # ============================================================
      - name: Verify final JSON
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo "FINAL VALIDATION JSON"
          echo "============================================================"
          if [ -f \
            final_end_to_end_validation_output/final_end_to_end_validation.json
          ]; then
            cat \
              final_end_to_end_validation_output/final_end_to_end_validation.json
          else
            echo "Final JSON not found."
          fi
      # ============================================================
      # UPLOAD VALIDATION RESULTS
      # ============================================================
      - name: Upload Final End-to-End Validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Final-End-to-End-Validation-V1
          path: |
            final_end_to_end_validation_run.log
            final_end_to_end_validation_output/
          if-no-files-found: warn
          retention-days: 30
