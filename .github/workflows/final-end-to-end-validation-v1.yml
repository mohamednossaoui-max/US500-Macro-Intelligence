name: Final End-to-End Validation V1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  final-validation:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pandas

      # ============================================================
      # 4. PREPARE WORKSPACE
      # ============================================================
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          rm -rf final_end_to_end_validation_output
          rm -f final_end_to_end_validation_exit_code.txt

          mkdir -p artifacts
          mkdir -p final_end_to_end_validation_output

      # ============================================================
      # 5. DISCOVER LATEST NON-EXPIRED ARTIFACTS
      # ============================================================
      - name: Discover latest research artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"

          echo "============================================================"
          echo "DISCOVERING GITHUB ACTIONS ARTIFACTS"
          echo "============================================================"

          gh api \
            --paginate \
            "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] |
              select(.expired == false) |
              [
                .name,
                .id,
                .created_at,
                .archive_download_url
              ] | @tsv' \
            > /tmp/all_artifacts.tsv

          if [ ! -s /tmp/all_artifacts.tsv ]; then
            echo "ERROR: no downloadable artifacts found."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          from datetime import datetime

          source = Path("/tmp/all_artifacts.tsv")
          output = Path("/tmp/latest_artifacts.tsv")

          latest = {}

          for line in source.read_text(
              encoding="utf-8"
          ).splitlines():

              parts = line.split("\t")

              if len(parts) != 4:
                  continue

              name, artifact_id, created_at, url = parts

              try:
                  dt = datetime.fromisoformat(
                      created_at.replace("Z", "+00:00")
                  )
              except Exception:
                  continue

              previous = latest.get(name)

              if previous is None or dt > previous[0]:
                  latest[name] = (
                      dt,
                      artifact_id,
                      url,
                  )

          with output.open("w", encoding="utf-8") as f:

              for name, (
                  dt,
                  artifact_id,
                  url,
              ) in sorted(latest.items()):

                  f.write(
                      f"{name}\t"
                      f"{artifact_id}\t"
                      f"{dt.isoformat()}\t"
                      f"{url}\n"
                  )

          print(
              "Latest unique artifact names:",
              len(latest),
          )
          PY

          echo
          echo "============================================================"
          echo "LATEST ARTIFACT INVENTORY"
          echo "============================================================"

          cat /tmp/latest_artifacts.tsv

      # ============================================================
      # 6. DOWNLOAD CANONICAL RESEARCH ARTIFACTS
      # ============================================================
      - name: Download canonical research artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DOWNLOADING CANONICAL RESEARCH ARTIFACTS"
          echo "============================================================"

          # --------------------------------------------------------
          # IMPORTANT:
          # These names were verified against the actual workflows
          # in the repository.
          # --------------------------------------------------------

          REQUIRED_NAMES=(
            "economic-intelligence-v2-3-refresh"
            "fed-intelligence-v1"
            "financial-stress-research-v1"

            "cot-positioning-v1"
            "aaii-sentiment-v1"
            "vix-sentiment-v1"

            "sentiment-engine-v1"
            "technical-intelligence-v1"
            "market-breadth-full-validation-v1"
            "cross-asset-intelligence-v1"
            "event-news-intelligence-v2.1"
            "earnings-market-reaction-v3-results"

            "macro-context-v1"
            "research-context-v1"
          )

          download_one() {

            local wanted="$1"
            local row

            row="$(
              awk \
                -F '\t' \
                -v n="$wanted" \
                '$1 == n {print; exit}' \
                /tmp/latest_artifacts.tsv \
                || true
            )"

            if [ -z "$row" ]; then

              echo
              echo "ERROR: required canonical artifact not found:"
              echo "$wanted"
              echo

              return 1
            fi

            IFS=$'\t' read -r \
              name \
              artifact_id \
              created_at \
              archive_url <<< "$row"

            local safe_name

            safe_name="$(
              printf '%s' "$name" |
              tr '/:' '__'
            )"

            local zip_path
            zip_path="/tmp/${safe_name}.zip"

            local extract_dir
            extract_dir="artifacts/${safe_name}"

            mkdir -p "$extract_dir"

            echo
            echo "------------------------------------------------------------"
            echo "Artifact : $name"
            echo "ID       : $artifact_id"
            echo "Created  : $created_at"
            echo "------------------------------------------------------------"

            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "$archive_url" \
              > "$zip_path"

            if [ ! -s "$zip_path" ]; then

              echo "ERROR: empty artifact archive:"
              echo "$name"

              return 1
            fi

            unzip \
              -q \
              -o \
              "$zip_path" \
              -d "$extract_dir"

            rm -f "$zip_path"
          }

          # --------------------------------------------------------
          # Download every required canonical artifact.
          # Missing artifact = hard failure.
          # --------------------------------------------------------

          for name in "${REQUIRED_NAMES[@]}"; do
            download_one "$name"
          done

          echo
          echo "============================================================"
          echo "DOWNLOADED FILES"
          echo "============================================================"

          find artifacts \
            -type f \
            -print \
            | sort

          csv_count="$(
            find artifacts \
              -type f \
              -name "*.csv" \
              | wc -l
          )"

          json_count="$(
            find artifacts \
              -type f \
              -name "*.json" \
              | wc -l
          )"

          echo
          echo "CSV count : $csv_count"
          echo "JSON count: $json_count"

          if [ "$csv_count" -eq 0 ] && [ "$json_count" -eq 0 ]; then

            echo
            echo "ERROR:"
            echo "No research artifacts were downloaded."

            exit 1
          fi

      # ============================================================
      # 7. VERIFY FINAL VALIDATOR
      # ============================================================
      - name: Verify validator
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFYING FINAL VALIDATOR"
          echo "============================================================"

          if [ ! -f tests/final_end_to_end_validation_v1.py ]; then

            echo "ERROR:"
            echo "Final validator not found."

            echo
            echo "Searching for validation scripts..."

            find tests \
              -type f \
              \( \
                -name "*final*validation*.py" \
                -o \
                -name "*end*to*end*.py" \
              \) \
              -print

            exit 1
          fi

          echo "Final validator found:"
          echo "tests/final_end_to_end_validation_v1.py"

          if [ -f FINAL_UNIFIED_DECISION_ARCHITECTURE_V1.md ]; then

            echo
            echo "Architecture document found:"
            echo "FINAL_UNIFIED_DECISION_ARCHITECTURE_V1.md"

          else

            echo
            echo "WARNING:"
            echo "FINAL_UNIFIED_DECISION_ARCHITECTURE_V1.md"
            echo "was not found at repository root."

          fi

      # ============================================================
      # 8. RUN FINAL VALIDATOR
      # ============================================================
      - name: Run final end-to-end validator
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "FINAL END-TO-END VALIDATION V1"
          echo "============================================================"

          python \
            tests/final_end_to_end_validation_v1.py \
            --repo-root . \
            --artifacts-dir artifacts \
            --output-dir final_end_to_end_validation_output

          rc=$?

          printf '%s\n' "$rc" \
            > final_end_to_end_validation_exit_code.txt

          echo
          echo "============================================================"
          echo "VALIDATOR EXIT CODE"
          echo "============================================================"

          echo "$rc"

          echo
          echo "============================================================"
          echo "VALIDATOR OUTPUT FILES"
          echo "============================================================"

          if [ -d final_end_to_end_validation_output ]; then

            find \
              final_end_to_end_validation_output \
              -maxdepth 2 \
              -type f \
              -print \
              | sort

          else

            echo "Output directory does not exist."

          fi

          # IMPORTANT:
          #
          # Do NOT fail this step.
          #
          # We need to upload the diagnostics first.
          # The final status is applied in the final step.

          exit 0

      # ============================================================
      # 9. DISPLAY JSON RESULT
      # ============================================================
      - name: Display final validation JSON
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL VALIDATION JSON"
          echo "============================================================"

          if [
            -f final_end_to_end_validation_output/final_end_to_end_validation.json
          ]; then

            cat \
              final_end_to_end_validation_output/final_end_to_end_validation.json

          else

            echo "JSON result not found."

          fi

      # ============================================================
      # 10. DISPLAY SUMMARY
      # ============================================================
      - name: Display final validation summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL VALIDATION SUMMARY"
          echo "============================================================"

          if [
            -f final_end_to_end_validation_output/final_end_to_end_validation_summary.csv
          ]; then

            cat \
              final_end_to_end_validation_output/final_end_to_end_validation_summary.csv

          else

            echo "Summary not found."

          fi

      # ============================================================
      # 11. DISPLAY EVENTS
      # ============================================================
      - name: Display final validation events
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL VALIDATION EVENTS / REVIEWS / FAILURES"
          echo "============================================================"

          if [
            -f final_end_to_end_validation_output/final_end_to_end_validation_events.csv
          ]; then

            cat \
              final_end_to_end_validation_output/final_end_to_end_validation_events.csv

          else

            echo "Events file not found."

          fi

      # ============================================================
      # 12. DISPLAY REPORT
      # ============================================================
      - name: Display final validation report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL VALIDATION REPORT"
          echo "============================================================"

          if [
            -f final_end_to_end_validation_output/final_end_to_end_validation_report.csv
          ]; then

            cat \
              final_end_to_end_validation_output/final_end_to_end_validation_report.csv

          else

            echo "Report not found."

          fi

      # ============================================================
      # 13. UPLOAD COMPLETE VALIDATION OUTPUT
      # ============================================================
      - name: Upload final validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-end-to-end-validation-v1
          path: |
            final_end_to_end_validation_output/**
            final_end_to_end_validation_exit_code.txt
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 14. APPLY REAL VALIDATION STATUS
      # ============================================================
      - name: Apply final validation status
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "APPLYING FINAL VALIDATION STATUS"
          echo "============================================================"

          if [ ! -f final_end_to_end_validation_exit_code.txt ]; then

            echo "ERROR:"
            echo "Validation exit code file not found."

            exit 1
          fi

          rc="$(
            cat \
              final_end_to_end_validation_exit_code.txt
          )"

          echo
          echo "Validator exit code: $rc"
          echo

          if [ "$rc" -eq 0 ]; then

            echo "============================================================"
            echo "FINAL END-TO-END VALIDATION: SUCCESS"
            echo "============================================================"

            exit 0

          fi

          echo "============================================================"
          echo "FINAL END-TO-END VALIDATION: FAILED"
          echo "============================================================"

          exit "$rc"
