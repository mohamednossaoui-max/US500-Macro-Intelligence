name: Final End-to-End Validation V1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  final-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALLING VALIDATION DEPENDENCIES"
          echo "============================================================"

          python -m pip install --upgrade pip
          python -m pip install pandas

          echo
          echo "Installed pandas version:"
          python -c "import pandas as pd; print(pd.__version__)"

      - name: Display repository structure
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "US500 MACRO INTELLIGENCE"
          echo "FINAL END-TO-END VALIDATION V1"
          echo "============================================================"

          echo
          echo "Repository root:"
          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -200

      - name: Locate final validator
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "LOCATING FINAL VALIDATOR"
          echo "============================================================"

          if [ ! -f "tests/final_end_to_end_validation_v1.py" ]; then
            echo "Final validator not found at expected path."

            echo
            echo "Searching repository:"
            find tests -type f \
              \( -name "*final*validation*.py" -o -name "*end*to*end*.py" \) \
              -print

            exit 1
          fi

          echo "Final validator found:"
          echo "tests/final_end_to_end_validation_v1.py"

      - name: Run final end-to-end validator
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "RUNNING FINAL END-TO-END VALIDATION V1"
          echo "============================================================"

          python tests/final_end_to_end_validation_v1.py

          rc=$?

          echo
          echo "Validator exit code: $rc"

          printf '%s\n' "$rc" > final_end_to_end_validation_exit_code.txt

          echo
          echo "Exit code artifact written."

          exit 0

      - name: Display validation artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL VALIDATION ARTIFACTS"
          echo "============================================================"

          echo
          echo "CSV / validation files:"
          find . -type f \
            \( -name "*.csv" -o -name "*validation*" -o -name "*summary*" \) \
            -print | sort

          echo
          echo "Exit code:"
          if [ -f "final_end_to_end_validation_exit_code.txt" ]; then
            cat final_end_to_end_validation_exit_code.txt
          else
            echo "Exit code file not found."
          fi

      - name: Upload final validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-end-to-end-validation-v1
          path: |
            **/*validation*.csv
            **/*summary*.csv
            **/*events*.csv
            final_end_to_end_validation_exit_code.txt
          if-no-files-found: warn

      - name: Apply final validation status
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "final_end_to_end_validation_exit_code.txt" ]; then
            echo "Validation exit code file not found."
            exit 1
          fi

          rc="$(
            cat \
              final_end_to_end_validation_exit_code.txt
          )"

          echo
          echo "============================================================"

          if [ "$rc" -eq 0 ]; then
            echo "FINAL END-TO-END VALIDATION: SUCCESS"
            echo "============================================================"
            exit 0
          fi

          echo "FINAL END-TO-END VALIDATION: FAILED"
          echo "============================================================"

          exit "$rc"
