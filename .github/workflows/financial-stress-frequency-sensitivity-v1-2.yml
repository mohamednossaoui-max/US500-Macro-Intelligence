name: Financial Stress Frequency Sensitivity v1.2

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Financial Stress Historical Collector v1"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  frequency-sensitivity:
    # Run automatically only after a successful collector run.
    # Manual runs also execute and will trigger a fresh collector run below.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Locate or create a fresh Historical Collector run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p raw_collector_artifact

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            COLLECTOR_RUN_ID="${{ github.event.workflow_run.id }}"
            echo "Using successful collector run: ${COLLECTOR_RUN_ID}"
          else
            echo "Manual run detected: triggering a fresh Historical Collector run."

            gh workflow run financial-stress-historical-v1.yml               --repo "$REPOSITORY"               --ref main

            echo "Waiting for the collector workflow to start..."
            for i in $(seq 1 30); do
              RUN_ID="$(gh run list                 --repo "$REPOSITORY"                 --workflow financial-stress-historical-v1.yml                 --branch main                 --limit 10                 --json databaseId,status,headBranch                 --jq '.[] | select(.headBranch=="main") | .databaseId'                 | head -n 1 || true)"

              if [ -n "${RUN_ID:-}" ]; then
                COLLECTOR_RUN_ID="$RUN_ID"
                echo "Collector run detected: ${COLLECTOR_RUN_ID}"
                break
              fi

              sleep 5
            done

            if [ -z "${COLLECTOR_RUN_ID:-}" ]; then
              echo "ERROR: Could not detect the newly triggered Historical Collector run."
              exit 1
            fi

            echo "Waiting for collector run ${COLLECTOR_RUN_ID} to finish..."

            for i in $(seq 1 60); do
              STATUS="$(gh run view "$COLLECTOR_RUN_ID"                 --repo "$REPOSITORY"                 --json status                 --jq '.status')"

              CONCLUSION="$(gh run view "$COLLECTOR_RUN_ID"                 --repo "$REPOSITORY"                 --json conclusion                 --jq '.conclusion // ""')"

              echo "Collector status: ${STATUS}; conclusion: ${CONCLUSION}"

              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" != "success" ]; then
                  echo "ERROR: Historical Collector failed."
                  gh run view "$COLLECTOR_RUN_ID" --repo "$REPOSITORY" --log-failed || true
                  exit 1
                fi
                break
              fi

              sleep 10
            done
          fi

          echo "Downloading all artifacts from collector run ${COLLECTOR_RUN_ID}..."
          rm -rf raw_collector_artifact
          mkdir -p raw_collector_artifact

          # Do not depend on a hard-coded artifact name.
          # Download every artifact from the selected collector run, then
          # locate the required CSV recursively.
          gh run download "$COLLECTOR_RUN_ID"             --repo "$REPOSITORY"             --dir raw_collector_artifact

          CSV_PATH="$(find raw_collector_artifact -type f             -name 'financial_stress_records_input_v1.csv'             -print -quit)"

          if [ -z "${CSV_PATH:-}" ]; then
            echo "ERROR: financial_stress_records_input_v1.csv was not found."
            echo "Downloaded artifact contents:"
            find raw_collector_artifact -maxdepth 5 -type f -print || true
            echo "Collector artifacts:"
            gh api               "repos/${REPOSITORY}/actions/runs/${COLLECTOR_RUN_ID}/artifacts?per_page=100"               --jq '.artifacts[] | [.name, .expired, .size_in_bytes] | @tsv' || true
            exit 1
          fi

          cp "$CSV_PATH" financial_stress_records_input_v1.csv

          echo "Raw PIT input located at: $CSV_PATH"
          echo "Rows:"
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("financial_stress_records_input_v1.csv")
          print(len(df))
          print(df.columns.tolist())
          PY

      - name: Validate raw PIT input
        run: |
          set -euo pipefail

          python - <<'PY'
          import pandas as pd

          path = "financial_stress_records_input_v1.csv"
          df = pd.read_csv(path)

          required = [
              "indicator",
              "observation_date",
              "availability_date",
              "actual",
              "unit",
              "frequency",
              "source",
              "source_url",
              "vintage",
              "revision_flag",
              "point_in_time_safe",
              "availability_semantics",
          ]

          missing = [c for c in required if c not in df.columns]
          if missing:
              raise SystemExit(f"Missing required columns: {missing}")

          if df.empty:
              raise SystemExit("Raw PIT input contains zero rows.")

          df["observation_date"] = pd.to_datetime(df["observation_date"], errors="coerce")
          df["availability_date"] = pd.to_datetime(df["availability_date"], errors="coerce")

          if df["observation_date"].isna().any():
              raise SystemExit("Invalid observation_date values found.")

          if df["availability_date"].isna().any():
              raise SystemExit("Invalid availability_date values found.")

          if (df["availability_date"] < df["observation_date"]).any():
              raise SystemExit("PIT violation: availability_date < observation_date.")

          safe = df["point_in_time_safe"].astype(str).str.lower()
          unsafe = ~safe.isin(["true", "1", "yes"])
          if unsafe.any():
              raise SystemExit(
                  f"Found {int(unsafe.sum())} non-PIT-safe raw records."
              )

          print(f"Raw PIT rows: {len(df)}")
          print("Indicators:")
          print(df["indicator"].value_counts().to_string())
          print("Frequencies:")
          print(df["frequency"].value_counts(dropna=False).to_string())
          PY

      - name: Compile v1.2 analyzer
        run: |
          python -m py_compile financial_stress_frequency_sensitivity_v1_2.py

      - name: Run Frequency Sensitivity v1.2
        run: |
          python financial_stress_frequency_sensitivity_v1_2.py

      - name: Validate v1.2 outputs
        run: |
          set -euo pipefail

          test -s financial_stress_validation_v1_2.csv
          test -s financial_stress_validation_summary_v1_2.csv
          test -s financial_stress_validation_events_v1_2.csv
          test -s financial_stress_frequency_sensitivity_v1_2.csv

          python - <<'PY'
          import pandas as pd

          files = [
              "financial_stress_validation_v1_2.csv",
              "financial_stress_validation_summary_v1_2.csv",
              "financial_stress_validation_events_v1_2.csv",
              "financial_stress_frequency_sensitivity_v1_2.csv",
          ]

          for f in files:
              df = pd.read_csv(f)
              print(f"{f}: {len(df)} rows")

          print("\nFrequency sensitivity:")
          print(
              pd.read_csv(
                  "financial_stress_frequency_sensitivity_v1_2.csv"
              ).to_string(index=False)
          )
          PY

      - name: Research-only guard
        run: |
          set -euo pipefail

          if grep -RniE             "decision_engine|decisionengine|execute_trade|executeTrade|place_order|placeOrder|buy_signal|buySignal|sell_signal|sellSignal"             financial_stress_frequency_sensitivity_v1_2.py; then
            echo "ERROR: Research-only guard failed."
            exit 1
          fi

          echo "Research-only guard passed."

      - name: Upload v1.2 outputs
        uses: actions/upload-artifact@v4
        with:
          name: financial-stress-frequency-sensitivity-v1-2
          path: |
            financial_stress_validation_v1_2.csv
            financial_stress_validation_summary_v1_2.csv
            financial_stress_validation_events_v1_2.csv
            financial_stress_frequency_sensitivity_v1_2.csv
          if-no-files-found: error
          retention-days: 90
