name: financial-stress-historical-v1

on:
  workflow_dispatch:
  push:
    paths:
      - "financial_stress_historical_collector_v1.py"
      - ".github/workflows/financial-stress-historical-v1.yml"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Syntax check
        run: python -m py_compile financial_stress_historical_collector_v1.py

      - name: Run historical collector
        run: python financial_stress_historical_collector_v1.py

      - name: Verify output
        run: |
          test -s financial_stress_records_input_v1.csv
          python - <<'PY'
          import pandas as pd
          p = pd.read_csv("financial_stress_records_input_v1.csv")
          required = {
            "indicator","observation_date","availability_date","actual","unit",
            "frequency","source","source_url","vintage","revision_flag",
            "point_in_time_safe","availability_semantics"
          }
          missing = required - set(p.columns)
          assert not missing, missing
          assert len(p) > 0
          assert p["point_in_time_safe"].all()
          print("Rows:", len(p))
          print("Indicators:", sorted(p.indicator.unique()))
          print("PIT:", int(p.point_in_time_safe.sum()), "/", len(p))
          PY

      - name: Research-only guard
        run: |
          ! grep -RniE "decision.engine|decision_engine|trade signal|execute trade|place order" \
            financial_stress_historical_collector_v1.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: financial-stress-historical-v1
          path: financial_stress_records_input_v1.csv
