name: financial-stress-research-v1

on:
  workflow_run:
    workflows:
      - financial-stress-historical-v1
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy

      - name: Download historical collector artifact
        uses: actions/download-artifact@v5
        with:
          name: financial-stress-historical-v1
          path: input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloaded input
        run: |
          echo "Downloaded files:"
          find input -maxdepth 2 -type f -print

          test -s input/financial_stress_records_input_v1.csv

          echo "Input size:"
          wc -l input/financial_stress_records_input_v1.csv

          echo "Input preview:"
          head -5 input/financial_stress_records_input_v1.csv

      - name: Prepare analyzer input
        run: |
          cp input/financial_stress_records_input_v1.csv .

      - name: Syntax check
        run: |
          python -m py_compile financial_stress_analyzer_v1.py

      - name: Run financial stress research analyzer
        run: |
          python financial_stress_analyzer_v1.py

      - name: Verify output
        run: |
          test -s financial_stress_research_v1.csv
          test -s financial_stress_research_summary_v1.csv

          python - <<'PY'
          import pandas as pd

          p = pd.read_csv("financial_stress_research_v1.csv")

          required = {
              "asof_date",
              "VIX",
              "TREASURY_2Y",
              "TREASURY_10Y",
              "YIELD_10Y_2Y_SPREAD",
              "NFCI",
              "ANFCI",
              "VIX_Z",
              "NFCI_Z",
              "ANFCI_Z",
              "YIELD_CURVE_STRESS_Z",
              "stress_component_count",
              "composite_stress_score",
              "research_regime",
              "point_in_time_safe",
              "record_id",
          }

          missing = required - set(p.columns)

          assert not missing, f"Missing columns: {missing}"
          assert len(p) > 0, "Research output contains zero rows"
          assert p["point_in_time_safe"].all(), \
              "Non-PIT-safe research row found"
          assert p["record_id"].notna().all()

          print("Rows:", len(p))
          print(
              "Scored rows:",
              int(p["composite_stress_score"].notna().sum())
          )

          print(
              "Research regimes:",
              sorted(
                  p["research_regime"]
                  .dropna()
                  .unique()
                  .tolist()
              )
          )

          print("Verification: PASS")
          PY

      - name: Research-only guard
        run: |
          ! grep -RniE \
            "decision_engine|trade signal|execute trade|place order|buy signal|sell signal" \
            financial_stress_analyzer_v1.py

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: financial-stress-research-v1
          path: |
            financial_stress_research_v1.csv
            financial_stress_research_summary_v1.csv
