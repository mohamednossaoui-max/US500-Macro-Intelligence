name: financial-stress-research-v1

on:
  # ------------------------------------------------------------
  # Manual execution
  # ------------------------------------------------------------
  workflow_dispatch:

  # ------------------------------------------------------------
  # Automatic execution after successful Historical Collector
  # ------------------------------------------------------------
  workflow_run:
    workflows:
      - financial-stress-historical-v1
    types:
      - completed


# ==============================================================
# Permissions
# ==============================================================

permissions:
  actions: read
  contents: read


# ==============================================================
# Job
# ==============================================================

jobs:

  analyze:

    # ----------------------------------------------------------
    # Run automatically only after successful Historical
    # Collector.
    #
    # Manual workflow_dispatch is always allowed.
    # ----------------------------------------------------------

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. Checkout repository
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # 2. Setup Python
      # ========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ========================================================
      # 3. Install dependencies
      # ========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy


      # ========================================================
      # 4. Download Historical Collector artifact
      #
      # Automatic mode:
      #   Download artifact from the exact successful
      #   Historical Collector run that triggered this workflow.
      #
      # Manual mode:
      #   Find the latest successful Historical Collector run
      #   and download its artifact.
      # ========================================================

      - name: Download historical collector artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          set -e

          mkdir -p input

          echo "============================================================"
          echo "Financial Stress Research"
          echo "Artifact acquisition"
          echo "============================================================"

          # ----------------------------------------------------
          # Automatic workflow_run execution
          # ----------------------------------------------------

          if [ "${{ github.event_name }}" = "workflow_run" ]; then

            RUN_ID="${{ github.event.workflow_run.id }}"

            echo "Trigger mode: workflow_run"
            echo "Historical Collector run ID: ${RUN_ID}"

          else

            # --------------------------------------------------
            # Manual execution
            # --------------------------------------------------

            echo "Trigger mode: workflow_dispatch"

            echo "Finding latest successful Historical Collector run..."

            RUN_ID=$(
              gh run list \
                --workflow financial-stress-historical-v1.yml \
                --status success \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId'
            )

            if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" = "null" ]; then
              echo "ERROR: No successful Historical Collector run found."
              exit 1
            fi

            echo "Latest successful Historical Collector run:"
            echo "${RUN_ID}"

          fi

          # ----------------------------------------------------
          # Download artifact
          # ----------------------------------------------------

          echo
          echo "Downloading artifact..."
          echo

          gh run download \
            "${RUN_ID}" \
            --name financial-stress-historical-v1 \
            --dir input

          echo
          echo "Artifact download completed."


      # ========================================================
      # 5. Inspect downloaded artifact
      # ========================================================

      - name: Inspect downloaded artifact
        run: |

          set -e

          echo "============================================================"
          echo "Downloaded artifact contents"
          echo "============================================================"

          find input \
            -maxdepth 3 \
            -type f \
            -print

          echo
          echo "============================================================"
          echo "Input directory"
          echo "============================================================"

          ls -lah input


      # ========================================================
      # 6. Verify Historical Collector CSV
      # ========================================================

      - name: Verify historical input
        run: |

          set -e

          FILE="input/financial_stress_records_input_v1.csv"

          echo "============================================================"
          echo "Historical input validation"
          echo "============================================================"

          echo "Checking file:"
          echo "${FILE}"

          test -f "${FILE}"

          test -s "${FILE}"

          echo
          echo "File information:"
          ls -lah "${FILE}"

          echo
          echo "Line count:"
          wc -l "${FILE}"

          echo
          echo "First 10 lines:"
          head -10 "${FILE}"

          echo
          echo "Last 5 lines:"
          tail -5 "${FILE}"


      # ========================================================
      # 7. Copy CSV to repository root
      # ========================================================

      - name: Prepare analyzer input
        run: |

          set -e

          SOURCE="input/financial_stress_records_input_v1.csv"

          TARGET="./financial_stress_records_input_v1.csv"

          cp "${SOURCE}" "${TARGET}"

          echo "============================================================"
          echo "Analyzer input prepared"
          echo "============================================================"

          ls -lah "${TARGET}"

          echo
          echo "Line count:"
          wc -l "${TARGET}"


      # ========================================================
      # 8. Validate CSV structure
      # ========================================================

      - name: Validate analyzer input
        run: |

          set -e

          python - <<'PY'

          import pandas as pd

          path = "financial_stress_records_input_v1.csv"

          print("=" * 60)
          print("VALIDATING HISTORICAL COLLECTOR INPUT")
          print("=" * 60)

          df = pd.read_csv(
              path,
              low_memory=False,
          )

          print(
              f"Rows: {len(df)}"
          )

          print(
              f"Columns: {len(df.columns)}"
          )

          print()
          print("Columns:")

          for column in df.columns:
              print(
                  f" - {column}"
              )

          if df.empty:
              raise RuntimeError(
                  "Historical collector CSV contains zero data rows."
              )

          required = {
              "indicator",
              "observation_date",
              "availability_date",
              "actual",
              "unit",
              "frequency",
              "source",
              "source_url",
              "vintage",
              "revision_flag",
              "point_in_time_safe",
              "availability_semantics",
          }

          missing = (
              required
              - set(df.columns)
          )

          if missing:
              raise RuntimeError(
                  "Historical collector CSV is missing columns: "
                  f"{sorted(missing)}"
              )

          if not df[
              "point_in_time_safe"
          ].astype(bool).all():

              raise RuntimeError(
                  "Historical collector CSV contains "
                  "non-PIT-safe records."
              )

          print()
          print("Indicator counts:")

          print(
              df["indicator"]
              .value_counts()
              .sort_index()
          )

          print()
          print("Input validation: PASS")

          PY


      # ========================================================
      # 9. Python syntax check
      # ========================================================

      - name: Syntax check
        run: |

          set -e

          python -m py_compile \
            financial_stress_analyzer_v1.py


      # ========================================================
      # 10. Run Financial Stress Research Analyzer
      # ========================================================

      - name: Run financial stress research analyzer
        run: |

          set -e

          python financial_stress_analyzer_v1.py


      # ========================================================
      # 11. Verify research output
      # ========================================================

      - name: Verify research output
        run: |

          set -e

          test -s financial_stress_research_v1.csv

          test -s financial_stress_research_summary_v1.csv

          python - <<'PY'

          import pandas as pd

          research = pd.read_csv(
              "financial_stress_research_v1.csv"
          )

          summary = pd.read_csv(
              "financial_stress_research_summary_v1.csv"
          )

          required = {
              "asof_date",
              "VIX",
              "TREASURY_2Y",
              "TREASURY_10Y",
              "YIELD_10Y_2Y_SPREAD",
              "NFCI",
              "ANFCI",
              "VIX_Z",
              "NFCI_Z",
              "ANFCI_Z",
              "YIELD_CURVE_STRESS_Z",
              "stress_component_count",
              "composite_stress_score",
              "research_regime",
              "point_in_time_safe",
              "record_id",
          }

          missing = (
              required
              - set(research.columns)
          )

          if missing:
              raise RuntimeError(
                  "Research output missing columns: "
                  f"{sorted(missing)}"
              )

          if research.empty:
              raise RuntimeError(
                  "Research output contains zero rows."
              )

          if not research[
              "point_in_time_safe"
          ].astype(bool).all():

              raise RuntimeError(
                  "Research output contains "
                  "non-PIT-safe rows."
              )

          if research[
              "record_id"
          ].isna().any():

              raise RuntimeError(
                  "Research output contains "
                  "missing record_id."
              )

          print("=" * 60)
          print(
              "Financial Stress Research Verification"
          )
          print("=" * 60)

          print(
              "Research rows:",
              len(research)
          )

          print(
              "Scored rows:",
              int(
                  research[
                      "composite_stress_score"
                  ]
                  .notna()
                  .sum()
              )
          )

          print(
              "Date range:",
              research[
                  "asof_date"
              ].min(),
              "->",
              research[
                  "asof_date"
              ].max(),
          )

          print()
          print(
              "Research regimes:"
          )

          print(
              research[
                  "research_regime"
              ]
              .value_counts(
                  dropna=False
              )
              .sort_index()
          )

          print()
          print(
              "Summary rows:",
              len(summary)
          )

          print()
          print(
              "Verification: PASS"
          )

          PY


      # ========================================================
      # 12. Research-only guard
      #
      # IMPORTANT:
      # Do NOT search for phrases such as:
      # "No trade signals"
      # because those are legitimate research-only comments.
      #
      # We search only for actual integration/execution patterns.
      # ========================================================

      - name: Research-only guard
        run: |

          set -e

          if grep -RniE \
            "decision_engine|decisionengine|execute_trade|executeTrade|place_order|placeOrder|buy_signal|buySignal|sell_signal|sellSignal" \
            financial_stress_analyzer_v1.py
          then

            echo "ERROR: Potential Decision Engine or trade execution integration detected."

            exit 1

          fi

          echo "Research-only guard: PASS"


      # ========================================================
      # 13. Upload Research artifacts
      # ========================================================

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4

        with:

          name: financial-stress-research-v1

          path: |

            financial_stress_research_v1.csv

            financial_stress_research_summary_v1.csv

          if-no-files-found: error
