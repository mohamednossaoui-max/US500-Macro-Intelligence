name: Historical Event Study v1

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/historical-event-study-v1.yml"
      - "tests/historical_event_study/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-event-study-v1
  cancel-in-progress: false

jobs:

  historical-event-study:

    name: US500 Historical Event Study v1

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            yfinance


      # ============================================================
      # 4. VERIFY EVENT STUDY SCRIPT
      # ============================================================

      - name: Verify Historical Event Study script
        run: |
          set -e

          test -f \
            tests/historical_event_study/historical_event_study_v1.py

          python -m py_compile \
            tests/historical_event_study/historical_event_study_v1.py

          echo ""
          echo "Historical Event Study script:"
          echo "OK"


      # ============================================================
      # 5. PREPARE INPUT DIRECTORIES
      # ============================================================

      - name: Prepare input directories
        run: |
          set -e

          rm -rf input
          rm -rf historical_event_study_v1

          mkdir -p input/research_context
          mkdir -p input/liquidity
          mkdir -p input/breadth

          echo "Input directories prepared."


      # ============================================================
      # 6. DOWNLOAD LATEST RESEARCH CONTEXT ARTIFACT
      # ============================================================

      - name: Download latest Research Context artifact
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          echo "=============================================="
          echo "RESEARCH CONTEXT ARTIFACT"
          echo "=============================================="

          ARTIFACT_ID=$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=research-context-v1" \
              --jq '
                .artifacts
                | map(select(.expired == false))
                | sort_by(.created_at)
                | last
                | .id
              '
          )

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "ERROR: research-context-v1 artifact not found."
            exit 1
          fi

          echo "Research Context artifact ID: $ARTIFACT_ID"

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/research_context.zip

          unzip -o \
            /tmp/research_context.zip \
            -d input/research_context

          echo ""
          echo "Research Context artifact downloaded."

          find input/research_context \
            -maxdepth 5 \
            -type f \
            -print


      # ============================================================
      # 7. DOWNLOAD LATEST LIQUIDITY ARTIFACT
      # ============================================================

      - name: Download latest Liquidity Intelligence artifact
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          echo "=============================================="
          echo "LIQUIDITY ARTIFACT"
          echo "=============================================="

          ARTIFACT_ID=$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=liquidity-intelligence-v1" \
              --jq '
                .artifacts
                | map(select(.expired == false))
                | sort_by(.created_at)
                | last
                | .id
              '
          )

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "ERROR: liquidity-intelligence-v1 artifact not found."
            exit 1
          fi

          echo "Liquidity artifact ID: $ARTIFACT_ID"

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/liquidity.zip

          unzip -o \
            /tmp/liquidity.zip \
            -d input/liquidity

          echo ""
          echo "Liquidity artifact downloaded."

          find input/liquidity \
            -maxdepth 5 \
            -type f \
            -print


      # ============================================================
      # 8. DOWNLOAD LATEST MARKET BREADTH ARTIFACT
      # ============================================================

      - name: Download latest Market Breadth artifact
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          echo "=============================================="
          echo "MARKET BREADTH ARTIFACT"
          echo "=============================================="

          ARTIFACT_ID=$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=market-breadth-full-validation-v1" \
              --jq '
                .artifacts
                | map(select(.expired == false))
                | sort_by(.created_at)
                | last
                | .id
              '
          )

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "ERROR: market-breadth-full-validation-v1 artifact not found."
            exit 1
          fi

          echo "Market Breadth artifact ID: $ARTIFACT_ID"

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/breadth.zip

          unzip -o \
            /tmp/breadth.zip \
            -d input/breadth

          echo ""
          echo "Market Breadth artifact downloaded."

          find input/breadth \
            -maxdepth 5 \
            -type f \
            -print


      # ============================================================
      # 9. LOCATE INPUT FILES
      # ============================================================

      - name: Locate research input CSV files
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATING INPUT FILES"
          echo "=============================================="

          echo ""
          echo "Research Context files:"
          find input/research_context \
            -type f \
            -name "*.csv" \
            -print

          echo ""
          echo "Liquidity files:"
          find input/liquidity \
            -type f \
            -name "*.csv" \
            -print

          echo ""
          echo "Market Breadth files:"
          find input/breadth \
            -type f \
            -name "*.csv" \
            -print


          # ========================================================
          # RESEARCH CONTEXT
          # ========================================================

          RESEARCH_CONTEXT_FILE=""

          # First try the canonical filename.
          EXACT_RC=$(
            find input/research_context \
              -type f \
              -name "research_context_v1.csv" \
              -print \
              -quit
          )

          if [ -n "$EXACT_RC" ]; then

            RESEARCH_CONTEXT_FILE="$EXACT_RC"

          else

            echo ""
            echo "Canonical Research Context filename not found."
            echo "Using structural CSV detection..."

            while IFS= read -r f; do

              HEADER=$(head -n 1 "$f" 2>/dev/null || true)

              if echo "$HEADER" | grep -qi "study_date"; then

                RESEARCH_CONTEXT_FILE="$f"
                break

              fi

            done < <(
              find input/research_context \
                -type f \
                -name "*.csv" \
                -print
            )

          fi


          # ========================================================
          # LIQUIDITY
          # ========================================================

          LIQUIDITY_FILE=""

          EXACT_LIQ=$(
            find input/liquidity \
              -type f \
              -name "liquidity_intelligence_research_v1.csv" \
              -print \
              -quit
          )

          if [ -n "$EXACT_LIQ" ]; then

            LIQUIDITY_FILE="$EXACT_LIQ"

          else

            echo ""
            echo "Canonical Liquidity filename not found."
            echo "Using structural CSV detection..."

            while IFS= read -r f; do

              HEADER=$(head -n 1 "$f" 2>/dev/null || true)

              if echo "$HEADER" | \
                grep -qi "NET_LIQUIDITY_PROXY_MILLIONS"; then

                LIQUIDITY_FILE="$f"
                break

              fi

            done < <(
              find input/liquidity \
                -type f \
                -name "*.csv" \
                -print
            )

          fi


          # ========================================================
          # MARKET BREADTH
          # ========================================================

          BREADTH_FILE=""

          EXACT_BREADTH=$(
            find input/breadth \
              -type f \
              -name "market_breadth_analysis_v1.csv" \
              -print \
              -quit
          )

          if [ -n "$EXACT_BREADTH" ]; then

            BREADTH_FILE="$EXACT_BREADTH"

          else

            echo ""
            echo "Canonical Market Breadth filename not found."
            echo "Using structural CSV detection..."

            while IFS= read -r f; do

              HEADER=$(head -n 1 "$f" 2>/dev/null || true)

              if echo "$HEADER" | \
                grep -qi "breadth_research_state"; then

                BREADTH_FILE="$f"
                break

              fi

            done < <(
              find input/breadth \
                -type f \
                -name "*.csv" \
                -print
            )

          fi


          # ========================================================
          # DISPLAY RESOLVED FILES
          # ========================================================

          echo ""
          echo "=============================================="
          echo "RESOLVED INPUT FILES"
          echo "=============================================="

          echo ""
          echo "Research Context:"
          echo "$RESEARCH_CONTEXT_FILE"

          echo ""
          echo "Liquidity:"
          echo "$LIQUIDITY_FILE"

          echo ""
          echo "Market Breadth:"
          echo "$BREADTH_FILE"


          # ========================================================
          # VALIDATION
          # ========================================================

          if [ -z "$RESEARCH_CONTEXT_FILE" ]; then

            echo ""
            echo "ERROR: Research Context CSV not found."
            echo ""
            echo "Available Research Context files:"
            find input/research_context \
              -type f \
              -print

            exit 1

          fi


          if [ -z "$LIQUIDITY_FILE" ]; then

            echo ""
            echo "ERROR: Liquidity CSV not found."
            echo ""
            echo "Available Liquidity files:"
            find input/liquidity \
              -type f \
              -print

            exit 1

          fi


          if [ -z "$BREADTH_FILE" ]; then

            echo ""
            echo "ERROR: Market Breadth CSV not found."
            echo ""
            echo "Available Market Breadth files:"
            find input/breadth \
              -type f \
              -print

            exit 1

          fi


          # ========================================================
          # EXPORT VARIABLES TO FOLLOWING STEPS
          # ========================================================

          {
            echo "RESEARCH_CONTEXT_FILE=$RESEARCH_CONTEXT_FILE"
            echo "LIQUIDITY_FILE=$LIQUIDITY_FILE"
            echo "BREADTH_FILE=$BREADTH_FILE"
          } >> "$GITHUB_ENV"


          echo ""
          echo "=============================================="
          echo "ALL REQUIRED INPUT FILES FOUND"
          echo "=============================================="


      # ============================================================
      # 10. VALIDATE INPUT FILES
      # ============================================================

      - name: Validate input files
        run: |
          set -e

          echo "=============================================="
          echo "INPUT VALIDATION"
          echo "=============================================="


          echo ""
          echo "----------------------------------------------"
          echo "Research Context"
          echo "----------------------------------------------"

          python - <<'PY'
          import os
          import pandas as pd

          path = os.environ["RESEARCH_CONTEXT_FILE"]

          df = pd.read_csv(
              path,
              low_memory=False
          )

          print("File:", path)
          print("Rows:", len(df))
          print("Columns:", len(df.columns))
          print("First columns:")
          print(list(df.columns[:25]))

          if len(df) == 0:
              raise SystemExit(
                  "ERROR: Research Context CSV contains zero rows."
              )
          PY


          echo ""
          echo "----------------------------------------------"
          echo "Liquidity"
          echo "----------------------------------------------"

          python - <<'PY'
          import os
          import pandas as pd

          path = os.environ["LIQUIDITY_FILE"]

          df = pd.read_csv(
              path,
              low_memory=False
          )

          print("File:", path)
          print("Rows:", len(df))
          print("Columns:", len(df.columns))
          print("First columns:")
          print(list(df.columns[:25]))

          if len(df) == 0:
              raise SystemExit(
                  "ERROR: Liquidity CSV contains zero rows."
              )
          PY


          echo ""
          echo "----------------------------------------------"
          echo "Market Breadth"
          echo "----------------------------------------------"

          python - <<'PY'
          import os
          import pandas as pd

          path = os.environ["BREADTH_FILE"]

          df = pd.read_csv(
              path,
              low_memory=False
          )

          print("File:", path)
          print("Rows:", len(df))
          print("Columns:", len(df.columns))
          print("First columns:")
          print(list(df.columns[:25]))

          if len(df) == 0:
              raise SystemExit(
                  "ERROR: Market Breadth CSV contains zero rows."
              )
          PY


          echo ""
          echo "=============================================="
          echo "INPUT VALIDATION COMPLETED"
          echo "=============================================="


      # ============================================================
      # 11. RUN HISTORICAL EVENT STUDY
      # ============================================================

      - name: Run Historical Event Study v1
        run: |
          set -e

          echo "=============================================="
          echo "RUNNING HISTORICAL EVENT STUDY v1"
          echo "=============================================="

          echo ""
          echo "Research Context:"
          echo "$RESEARCH_CONTEXT_FILE"

          echo ""
          echo "Liquidity:"
          echo "$LIQUIDITY_FILE"

          echo ""
          echo "Market Breadth:"
          echo "$BREADTH_FILE"

          echo ""

          python \
            tests/historical_event_study/historical_event_study_v1.py \
            --research-context "$RESEARCH_CONTEXT_FILE" \
            --liquidity "$LIQUIDITY_FILE" \
            --breadth "$BREADTH_FILE" \
            --output historical_event_study_v1


      # ============================================================
      # 12. DISPLAY RESULTS
      # ============================================================

      - name: Display Historical Event Study results
        if: always()
        run: |

          echo "=============================================="
          echo "HISTORICAL EVENT STUDY RESULTS"
          echo "=============================================="


          if [ -f \
            "historical_event_study_v1/historical_event_study_validation_v1.json"
          ]; then

            echo ""
            echo "FINAL VALIDATION REPORT:"
            echo ""

            cat \
              historical_event_study_v1/historical_event_study_validation_v1.json

          else

            echo ""
            echo "Validation report was not generated."

          fi


          echo ""
          echo "=============================================="
          echo "OUTPUT FILES"
          echo "=============================================="


          if [ -d "historical_event_study_v1" ]; then

            find historical_event_study_v1 \
              -maxdepth 2 \
              -type f \
              -print

          else

            echo "Output directory does not exist."

          fi


      # ============================================================
      # 13. UPLOAD RESULTS
      # ============================================================

      - name: Upload Historical Event Study artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-event-study-v1
          path: historical_event_study_v1/
          if-no-files-found: warn
          retention-days: 30
