name: Macro Context v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  macro-context:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install pandas


      # ============================================================
      # 4. VERIFY MACRO CONTEXT SOURCE FILE
      # ============================================================
      - name: Verify Macro Context source
        run: |
          set -euo pipefail

          echo "Checking Macro Context source file..."

          test -f macro-context-v1.py

          echo "Macro Context source found:"
          ls -lh macro-context-v1.py


      # ============================================================
      # 5. DOWNLOAD ECONOMIC INTELLIGENCE
      # ============================================================
      - name: Download Economic Intelligence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ARTIFACT_ID=$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="economic-intelligence-v2-3-refresh" \
            -f per_page=100 \
            --jq '
              [
                .artifacts[]
                | select(.expired == false)
              ]
              | sort_by(.created_at)
              | last
              | .id
            ')

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "ERROR: Economic Intelligence artifact not found."
            exit 1
          fi

          echo "Economic artifact ID: $ARTIFACT_ID"

          mkdir -p "$RUNNER_TEMP/economic"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/economic/economic.zip"

          unzip -o \
            "$RUNNER_TEMP/economic/economic.zip" \
            -d "$RUNNER_TEMP/economic"

          echo "Economic artifact contents:"
          find "$RUNNER_TEMP/economic" -maxdepth 5 -type f -print

          ECONOMIC_FILE=$(find "$RUNNER_TEMP/economic" \
            -type f \
            -name "economic_regime_events_v1.csv" \
            | head -1)

          if [ -z "$ECONOMIC_FILE" ]; then
            echo "ERROR: economic_regime_events_v1.csv not found."
            exit 1
          fi

          cp "$ECONOMIC_FILE" economic_regime_events_v1.csv

          echo "Economic file:"
          ls -lh economic_regime_events_v1.csv


      # ============================================================
      # 6. DOWNLOAD FINANCIAL STRESS
      # ============================================================
      - name: Download Financial Stress artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Searching available Financial Stress artifacts..."

          gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f per_page=100 \
            --jq '
              .artifacts[]
              | select(.expired == false)
              | select(.name | test("financial-stress"; "i"))
              | [
                  .id,
                  .name,
                  .created_at
                ]
              | @tsv
            ' \
            | sort -k3,3r \
            > "$RUNNER_TEMP/financial_stress_artifacts.tsv"

          echo "Available Financial Stress artifacts:"
          cat "$RUNNER_TEMP/financial_stress_artifacts.tsv" || true

          ARTIFACT_ID=$(awk '
            BEGIN { IGNORECASE=1 }
            /financial-stress-research/ {
              print $1
              exit
            }
          ' "$RUNNER_TEMP/financial_stress_artifacts.tsv")

          if [ -z "$ARTIFACT_ID" ]; then
            ARTIFACT_ID=$(awk '
              BEGIN { IGNORECASE=1 }
              /financial-stress-historical/ {
                print $1
                exit
              }
            ' "$RUNNER_TEMP/financial_stress_artifacts.tsv")
          fi

          if [ -z "$ARTIFACT_ID" ]; then
            echo "ERROR: No usable Financial Stress artifact found."
            exit 1
          fi

          echo "Selected Financial Stress artifact ID: $ARTIFACT_ID"

          mkdir -p "$RUNNER_TEMP/financial_stress"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/financial_stress/financial_stress.zip"

          unzip -o \
            "$RUNNER_TEMP/financial_stress/financial_stress.zip" \
            -d "$RUNNER_TEMP/financial_stress"

          echo "Financial Stress artifact contents:"
          find "$RUNNER_TEMP/financial_stress" -maxdepth 5 -type f -print

          STRESS_FILE=$(find "$RUNNER_TEMP/financial_stress" \
            -type f \
            -name "financial_stress_research_v1.csv" \
            | head -1)

          if [ -z "$STRESS_FILE" ]; then
            echo "ERROR: financial_stress_research_v1.csv not found."
            exit 1
          fi

          cp "$STRESS_FILE" financial_stress_research_v1.csv

          echo "Financial Stress file:"
          ls -lh financial_stress_research_v1.csv


      # ============================================================
      # 7. DOWNLOAD FED INTELLIGENCE
      # ============================================================
      - name: Download Fed Intelligence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ARTIFACT_ID=$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="fed-intelligence-v1" \
            -f per_page=100 \
            --jq '
              [
                .artifacts[]
                | select(.expired == false)
              ]
              | sort_by(.created_at)
              | last
              | .id
            ')

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "ERROR: Fed Intelligence artifact not found."
            exit 1
          fi

          echo "Fed artifact ID: $ARTIFACT_ID"

          mkdir -p "$RUNNER_TEMP/fed"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/fed/fed.zip"

          unzip -o \
            "$RUNNER_TEMP/fed/fed.zip" \
            -d "$RUNNER_TEMP/fed"

          find "$RUNNER_TEMP/fed" -maxdepth 5 -type f -print

          FED_FILE=$(find "$RUNNER_TEMP/fed" \
            -type f \
            -name "fed_intelligence_output_v1.json" \
            | head -1)

          if [ -z "$FED_FILE" ]; then
            echo "ERROR: fed_intelligence_output_v1.json not found."
            exit 1
          fi

          cp "$FED_FILE" fed_intelligence_output_v1.json

          ls -lh fed_intelligence_output_v1.json


      # ============================================================
      # 8. DOWNLOAD EVENT / NEWS INTELLIGENCE
      # ============================================================
      - name: Download Event News Intelligence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ARTIFACT_ID=$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="event-news-intelligence-v2.1" \
            -f per_page=100 \
            --jq '
              [
                .artifacts[]
                | select(.expired == false)
              ]
              | sort_by(.created_at)
              | last
              | .id
            ')

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "ERROR: Event / News Intelligence artifact not found."
            exit 1
          fi

          echo "Event / News artifact ID: $ARTIFACT_ID"

          mkdir -p "$RUNNER_TEMP/event_news"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/event_news/event_news.zip"

          unzip -o \
            "$RUNNER_TEMP/event_news/event_news.zip" \
            -d "$RUNNER_TEMP/event_news"

          find "$RUNNER_TEMP/event_news" -maxdepth 5 -type f -print

          EVENT_NEWS_FILE=$(find "$RUNNER_TEMP/event_news" \
            -type f \
            -name "event_news_research_v2.csv" \
            | head -1)

          if [ -z "$EVENT_NEWS_FILE" ]; then
            echo "ERROR: event_news_research_v2.csv not found."
            exit 1
          fi

          cp "$EVENT_NEWS_FILE" event_news_research_v2.csv

          ls -lh event_news_research_v2.csv


      # ============================================================
      # 9. VERIFY INPUTS
      # ============================================================
      - name: Verify inputs
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFYING MACRO CONTEXT INPUTS"
          echo "============================================================"

          ls -lh \
            fed_intelligence_output_v1.json \
            economic_regime_events_v1.csv \
            financial_stress_research_v1.csv \
            event_news_research_v2.csv

          python - <<'PY'
          import json
          import pandas as pd


          def parse_bool(value):
              if isinstance(value, bool):
                  return value

              if pd.isna(value):
                  return False

              value = str(value).strip().lower()

              if value in {"true", "1", "yes", "y", "t"}:
                  return True

              if value in {"false", "0", "no", "n", "f"}:
                  return False

              raise ValueError(
                  f"Invalid boolean value encountered: {value!r}"
              )


          with open(
              "fed_intelligence_output_v1.json",
              "r",
              encoding="utf-8"
          ) as f:
              fed = json.load(f)


          economic = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          stress = pd.read_csv(
              "financial_stress_research_v1.csv"
          )

          event_news = pd.read_csv(
              "event_news_research_v2.csv"
          )


          assert isinstance(fed, dict), (
              "Fed Intelligence output must be a JSON object."
          )

          assert not economic.empty, (
              "Economic Intelligence file is empty."
          )

          assert not stress.empty, (
              "Financial Stress file is empty."
          )

          assert not event_news.empty, (
              "Event / News file is empty."
          )


          # --------------------------------------------------------
          # Event News schema
          # --------------------------------------------------------
          required_event_columns = {
              "published_at",
              "availability_date",
              "topic",
              "title",
              "source",
              "point_in_time_safe",
          }

          missing_event_columns = (
              required_event_columns
              - set(event_news.columns)
          )

          assert not missing_event_columns, (
              "Event / News file missing columns: "
              + ", ".join(sorted(missing_event_columns))
          )


          # --------------------------------------------------------
          # Explicit PIT normalization
          # --------------------------------------------------------
          event_news["_pit_normalized"] = (
              event_news["point_in_time_safe"]
              .map(parse_bool)
          )


          pit_count = int(
              event_news["_pit_normalized"].sum()
          )

          total_count = len(event_news)


          assert pit_count == total_count, (
              "Event / News contains non-PIT-safe rows. "
              f"PIT-safe={pit_count}, total={total_count}"
          )


          print("")
          print("MACRO CONTEXT INPUT VALIDATION PASSED")
          print("Fed Intelligence: OK")
          print("Economic Intelligence: OK")
          print("Financial Stress: OK")
          print("Event / News Intelligence: OK")
          print("Fed as_of_date:", fed.get("as_of_date"))
          print("Economic rows:", len(economic))
          print("Financial Stress rows:", len(stress))
          print("Event / News rows:", len(event_news))
          print("Event / News PIT-safe rows:", pit_count)
          print("Event / News PIT-safe: TRUE")
          PY


      # ============================================================
      # 10. RUN MACRO CONTEXT
      # ============================================================
      - name: Run Macro Context v1
        run: |
          set -euo pipefail

          test -f macro-context-v1.py

          echo "Running:"
          echo "python macro-context-v1.py"

          python macro-context-v1.py


      # ============================================================
      # 11. VERIFY OUTPUT FILES
      # ============================================================
      - name: Verify Macro Context outputs
        run: |
          set -euo pipefail

          test -f macro_context_v1.json
          test -f macro_context_v1.csv

          echo "Macro Context outputs:"
          ls -lh \
            macro_context_v1.json \
            macro_context_v1.csv


      # ============================================================
      # 12. VALIDATE MACRO CONTEXT
      # ============================================================
      - name: Validate Macro Context
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import pandas as pd


          with open(
              "macro_context_v1.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)


          df = pd.read_csv(
              "macro_context_v1.csv"
          )


          # --------------------------------------------------------
          # Research-only constraints
          # --------------------------------------------------------
          assert data.get("research_only") is True, (
              "research_only must be TRUE"
          )

          assert data.get("decision_engine_ready") is False, (
              "decision_engine_ready must be FALSE"
          )

          assert data.get("trade_signal") is None, (
              "trade_signal must be NONE"
          )

          assert data.get("forecast") is None, (
              "forecast must be NONE"
          )


          # --------------------------------------------------------
          # Anti-lookahead
          # --------------------------------------------------------
          assert (
              data["temporal_alignment"]["anti_lookahead"]
              is True
          ), (
              "Anti-lookahead validation failed."
          )


          # --------------------------------------------------------
          # Component PIT
          # --------------------------------------------------------
          assert data["economic"]["pit_safe"] is True, (
              "Economic PIT validation failed."
          )

          assert (
              data["financial_stress"]["pit_safe"]
              is True
          ), (
              "Financial Stress PIT validation failed."
          )

          assert data["event_news"]["pit_safe"] is True, (
              "Event / News PIT validation failed."
          )


          # --------------------------------------------------------
          # Temporal metadata
          # --------------------------------------------------------
          assert (
              "event_news_age_days"
              in data["temporal_alignment"]
          )


          # --------------------------------------------------------
          # CSV structure
          # --------------------------------------------------------
          assert len(df) == 1, (
              "Macro Context CSV must contain exactly one row."
          )


          required_csv_columns = {
              "event_news_source_date",
              "event_news_age_days",
              "event_news_latest_topic",
              "event_news_latest_source",
              "event_news_events_available",
              "event_news_pit_safe",
          }


          missing_csv_columns = (
              required_csv_columns
              - set(df.columns)
          )


          assert not missing_csv_columns, (
              "Macro Context CSV missing columns: "
              + ", ".join(sorted(missing_csv_columns))
          )


          # --------------------------------------------------------
          # Display result
          # --------------------------------------------------------
          print("")
          print("============================================================")
          print("MACRO CONTEXT VALIDATION PASSED")
          print("============================================================")

          print("Context date:",
                data.get("context_date"))

          print(
              "Economic regime:",
              data["economic"].get("economic_regime")
          )

          print(
              "Financial stress regime:",
              data["financial_stress"].get(
                  "research_regime"
              )
          )

          print(
              "Financial stress composite:",
              data["financial_stress"].get(
                  "composite_stress_score"
              )
          )

          print(
              "Fed score:",
              data["fed"].get("fed_score")
          )

          print(
              "Event / News source date:",
              data["event_news"].get("source_date")
          )

          print(
              "Event / News age:",
              data["event_news"].get("age_days"),
              "days"
          )

          print(
              "Event / News latest topic:",
              data["event_news"].get("latest_topic")
          )

          print(
              "Event / News latest source:",
              data["event_news"].get("latest_source")
          )

          print(
              "Event / News events available:",
              data["event_news"].get("events_available")
          )

          print("Research-only: TRUE")
          print("Decision Engine: FALSE")
          print("Trade signal: NONE")
          print("Forecast: NONE")
          print("Anti-lookahead: TRUE")
          print("Event / News PIT-safe: TRUE")
          print("============================================================")
          PY


      # ============================================================
      # 13. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Macro Context artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-context-v1
          path: |
            macro_context_v1.json
            macro_context_v1.csv
          if-no-files-found: error
          retention-days: 90
