name: Macro Context v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  macro-context:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 3. Dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      # --------------------------------------------------
      # 4. Download latest Economic Intelligence artifact
      # --------------------------------------------------
      - name: Download Economic Intelligence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          ARTIFACT_ID=$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="economic-intelligence-v2-3-refresh" \
            -f per_page=100 \
            --jq '
              [
                .artifacts[]
                | select(.expired == false)
              ]
              | sort_by(.created_at)
              | last
              | .id
            ')

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "ERROR: Economic Intelligence artifact not found."
            exit 1
          fi

          echo "Economic artifact ID: $ARTIFACT_ID"

          mkdir -p "$RUNNER_TEMP/economic"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/economic/economic.zip"

          unzip -o \
            "$RUNNER_TEMP/economic/economic.zip" \
            -d "$RUNNER_TEMP/economic"

          find "$RUNNER_TEMP/economic" \
            -type f \
            -maxdepth 3 \
            -print

          ECONOMIC_FILE=$(find "$RUNNER_TEMP/economic" \
            -type f \
            -name "economic_regime_events_v1.csv" \
            | head -1)

          if [ -z "$ECONOMIC_FILE" ]; then
            echo "ERROR: economic_regime_events_v1.csv not found."
            exit 1
          fi

          cp "$ECONOMIC_FILE" economic_regime_events_v1.csv

          echo "Economic input:"
          ls -lh economic_regime_events_v1.csv

      # --------------------------------------------------
      # 5. Find and download latest Financial Stress artifact
      # --------------------------------------------------
      - name: Download Financial Stress artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "Searching available Financial Stress artifacts..."

          gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f per_page=100 \
            --jq '
              .artifacts[]
              | select(.expired == false)
              | select(.name | test("financial-stress"; "i"))
              | [
                  .id,
                  .name,
                  .created_at
                ]
              | @tsv
            ' | sort -k3,3r > "$RUNNER_TEMP/financial_stress_artifacts.tsv"

          echo "Available Financial Stress artifacts:"
          cat "$RUNNER_TEMP/financial_stress_artifacts.tsv" || true

          # Prefer a dedicated Research artifact if one exists.
          ARTIFACT_ID=$(awk '
            BEGIN { IGNORECASE=1 }
            /financial-stress-research/ {
              print $1
              exit
            }
          ' "$RUNNER_TEMP/financial_stress_artifacts.tsv")

          # Otherwise use the historical collector artifact.
          if [ -z "$ARTIFACT_ID" ]; then
            ARTIFACT_ID=$(awk '
              BEGIN { IGNORECASE=1 }
              /financial-stress-historical/ {
                print $1
                exit
              }
            ' "$RUNNER_TEMP/financial_stress_artifacts.tsv")
          fi

          if [ -z "$ARTIFACT_ID" ]; then
            echo ""
            echo "ERROR: No usable Financial Stress artifact found."
            echo "The available artifacts were:"
            cat "$RUNNER_TEMP/financial_stress_artifacts.tsv" || true
            exit 1
          fi

          echo "Selected Financial Stress artifact ID: $ARTIFACT_ID"

          mkdir -p "$RUNNER_TEMP/financial_stress"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/financial_stress/financial_stress.zip"

          unzip -o \
            "$RUNNER_TEMP/financial_stress/financial_stress.zip" \
            -d "$RUNNER_TEMP/financial_stress"

          echo "Financial Stress artifact contents:"
          find "$RUNNER_TEMP/financial_stress" \
            -type f \
            -maxdepth 4 \
            -print

          STRESS_FILE=$(find "$RUNNER_TEMP/financial_stress" \
            -type f \
            -name "financial_stress_research_v1.csv" \
            | head -1)

          if [ -z "$STRESS_FILE" ]; then
            echo ""
            echo "ERROR: financial_stress_research_v1.csv was not found."
            echo ""
            echo "The selected artifact may contain only raw historical data."
            echo "In that case the existing research analyzer must be run first."
            exit 1
          fi

          cp "$STRESS_FILE" financial_stress_research_v1.csv

          echo "Financial Stress input:"
          ls -lh financial_stress_research_v1.csv

      # --------------------------------------------------
      # 6. Download Fed Intelligence artifact
      # --------------------------------------------------
      - name: Download Fed Intelligence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          ARTIFACT_ID=$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="fed-intelligence-v1" \
            -f per_page=100 \
            --jq '
              [
                .artifacts[]
                | select(.expired == false)
              ]
              | sort_by(.created_at)
              | last
              | .id
            ')

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "ERROR: Fed Intelligence artifact not found."
            exit 1
          fi

          echo "Fed artifact ID: $ARTIFACT_ID"

          mkdir -p "$RUNNER_TEMP/fed"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/fed/fed.zip"

          unzip -o \
            "$RUNNER_TEMP/fed/fed.zip" \
            -d "$RUNNER_TEMP/fed"

          FED_FILE=$(find "$RUNNER_TEMP/fed" \
            -type f \
            -name "fed_intelligence_output_v1.json" \
            | head -1)

          if [ -z "$FED_FILE" ]; then
            echo "ERROR: fed_intelligence_output_v1.json not found."
            exit 1
          fi

          cp "$FED_FILE" fed_intelligence_output_v1.json

          echo "Fed input:"
          ls -lh fed_intelligence_output_v1.json

      # --------------------------------------------------
      # 7. Verify all Macro Context inputs
      # --------------------------------------------------
      - name: Verify inputs
        run: |
          set -e

          echo "Input files:"
          ls -lh \
            fed_intelligence_output_v1.json \
            economic_regime_events_v1.csv \
            financial_stress_research_v1.csv

          python - <<'PY'
          import json
          import pandas as pd

          with open(
              "fed_intelligence_output_v1.json",
              "r",
              encoding="utf-8"
          ) as f:
              fed = json.load(f)

          economic = pd.read_csv(
              "economic_regime_events_v1.csv"
          )

          stress = pd.read_csv(
              "financial_stress_research_v1.csv"
          )

          assert isinstance(fed, dict)
          assert not economic.empty
          assert not stress.empty

          print("Fed Intelligence: OK")
          print("Economic Intelligence: OK")
          print("Financial Stress: OK")

          print(
              "Fed as_of_date:",
              fed.get("as_of_date")
          )

          print(
              "Economic rows:",
              len(economic)
          )

          print(
              "Financial Stress rows:",
              len(stress)
          )
          PY

      # --------------------------------------------------
      # 8. Build Macro Context
      # --------------------------------------------------
      - name: Run Macro Context v1
        run: |
          python macro_context_v1.py

      # --------------------------------------------------
      # 9. Validate Macro Context
      # --------------------------------------------------
      - name: Validate Macro Context
        run: |
          set -e

          test -f macro_context_v1.json
          test -f macro_context_v1.csv

          python - <<'PY'
          import json
          import pandas as pd

          with open(
              "macro_context_v1.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          df = pd.read_csv(
              "macro_context_v1.csv"
          )

          assert data["research_only"] is True
          assert data["decision_engine_ready"] is False
          assert data["trade_signal"] is None
          assert data["forecast"] is None

          assert data[
              "temporal_alignment"
          ]["anti_lookahead"] is True

          assert len(df) == 1

          print("")
          print("=" * 60)
          print("MACRO CONTEXT VALIDATION PASSED")
          print("=" * 60)

          print(
              "Context date:",
              data["context_date"]
          )

          print(
              "Economic regime:",
              data["economic"]["economic_regime"]
          )

          print(
              "Financial stress regime:",
              data[
                  "financial_stress"
              ]["research_regime"]
          )

          print(
              "Financial stress composite:",
              data[
                  "financial_stress"
              ]["composite_stress_score"]
          )

          print(
              "Fed score:",
              data["fed"]["fed_score"]
          )

          print("")
          print("Research-only: TRUE")
          print("Decision Engine: FALSE")
          print("Trade signal: NONE")
          print("Forecast: NONE")
          PY

      # --------------------------------------------------
      # 10. Upload Macro Context artifact
      # --------------------------------------------------
      - name: Upload Macro Context artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-context-v1
          path: |
            macro_context_v1.json
            macro_context_v1.csv
          if-no-files-found: error
          retention-days: 90
