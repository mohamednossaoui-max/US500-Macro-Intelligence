name: Apply V6.3 Patch 3 Safely

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          echo "Checking required files..."

          test -f app.py || {
            echo "ERROR: app.py not found"
            exit 1
          }

          test -f apply_patch3.py || {
            echo "ERROR: apply_patch3.py not found"
            exit 1
          }

          echo "Required files found."

      - name: Apply Patch 3
        run: |
          python apply_patch3.py

      - name: Verify backup
        run: |
          test -f app.py.pre_patch3 || {
            echo "ERROR: app.py.pre_patch3 was not created"
            exit 1
          }

          echo "Backup verified: app.py.pre_patch3"

      - name: Python syntax check
        run: |
          python -m py_compile app.py
          echo "app.py syntax check passed."

      - name: Show changed files
        run: |
          echo "Changed files:"
          git status --short

          echo ""
          echo "Patch summary:"
          git diff --stat

      - name: Commit Patch 3
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app.py app.py.pre_patch3
          git commit -m "Apply V6.3 Patch 3 UI cleanup"
          git push
