name: Market Breadth - Full Validation v1

run-name: "${{ github.workflow }} [${{ inputs.correlation_id || github.run_id }}]"

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: "Internal dispatch correlation token; blank for manual runs"
        required: false
        default: ""
      source_ref:
        description: "Pinned source commit; blank uses dispatched commit"
        required: false
        default: ""

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-repair-20261016.txt

permissions:
  contents: read

jobs:
  full-validation:
    name: Market Breadth Full Validation v1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pytest PyYAML

      - name: Verify Market Breadth modules
        run: |
          echo "Checking Market Breadth modules..."

          test -f tests/market_breadth/market_breadth_historical_collector_v1.py
          test -f tests/market_breadth/market_breadth_analyzer_v1.py
          test -f tests/market_breadth/market_breadth_validation_robustness_v1.py

          echo "All modules found."

      - name: Run collector and diagnostic regressions
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p market_breadth_full_validation_v1/logs
          python -m pytest -q tests/test_breadth_collector_run_v1.py 2>&1 | tee market_breadth_full_validation_v1/logs/preflight.log

      - name: 1 - Historical Collector
        id: collector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p market_breadth_full_validation_v1/logs
          echo "=============================================="
          echo "MARKET BREADTH FULL VALIDATION v1"
          echo "STAGE 1/3 — HISTORICAL COLLECTOR"
          echo "=============================================="

          python tests/market_breadth/market_breadth_historical_collector_v1.py             --start 2019-01-01             --output market_breadth_historical_v1 2>&1 | tee market_breadth_full_validation_v1/logs/collector.log

      - name: 2 - Analyzer
        id: analyzer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p market_breadth_full_validation_v1/logs
          echo "=============================================="
          echo "STAGE 2/3 — ANALYZER"
          echo "=============================================="

          python tests/market_breadth/market_breadth_analyzer_v1.py             --input market_breadth_historical_v1/market_breadth_records_v1.csv             --output market_breadth_analysis_v1 2>&1 | tee market_breadth_full_validation_v1/logs/analyzer.log

      - name: 3 - Validation & Robustness
        id: robustness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p market_breadth_full_validation_v1/logs
          echo "=============================================="
          echo "STAGE 3/3 — VALIDATION & ROBUSTNESS"
          echo "=============================================="

          python tests/market_breadth/market_breadth_validation_robustness_v1.py             --input market_breadth_analysis_v1/market_breadth_analysis_v1.csv             --output market_breadth_validation_robustness_v1 2>&1 | tee market_breadth_full_validation_v1/logs/robustness.log

      - name: Build unified final report
        if: always()
        env:
          STEP_PREFLIGHT: ${{ steps.preflight.outcome }}
          STEP_COLLECTOR: ${{ steps.collector.outcome }}
          STEP_ANALYZER: ${{ steps.analyzer.outcome }}
          STEP_ROBUSTNESS: ${{ steps.robustness.outcome }}
        run: python scripts/breadth_validation_report_v1.py

      - name: Upload unified Market Breadth artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-breadth-full-validation-v1
          path: |
            market_breadth_historical_v1/
            market_breadth_analysis_v1/
            market_breadth_validation_robustness_v1/
            market_breadth_full_validation_v1/
          if-no-files-found: warn
          retention-days: 30
