name: Market Breadth - Full Validation v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-validation:
    name: Market Breadth Full Validation v1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Verify Market Breadth modules
        run: |
          echo "Checking Market Breadth modules..."

          test -f tests/market_breadth/market_breadth_historical_collector_v1.py
          test -f tests/market_breadth/market_breadth_analyzer_v1.py
          test -f tests/market_breadth/market_breadth_validation_robustness_v1.py

          echo "All modules found."

      - name: 1 - Historical Collector
        run: |
          echo "=============================================="
          echo "MARKET BREADTH FULL VALIDATION v1"
          echo "STAGE 1/3 — HISTORICAL COLLECTOR"
          echo "=============================================="

          python tests/market_breadth/market_breadth_historical_collector_v1.py             --start 2019-01-01             --output market_breadth_historical_v1

      - name: 2 - Analyzer
        run: |
          echo "=============================================="
          echo "STAGE 2/3 — ANALYZER"
          echo "=============================================="

          python tests/market_breadth/market_breadth_analyzer_v1.py             --input market_breadth_historical_v1/market_breadth_records_v1.csv             --output market_breadth_analysis_v1

      - name: 3 - Validation & Robustness
        run: |
          echo "=============================================="
          echo "STAGE 3/3 — VALIDATION & ROBUSTNESS"
          echo "=============================================="

          python tests/market_breadth/market_breadth_validation_robustness_v1.py             --input market_breadth_analysis_v1/market_breadth_analysis_v1.csv             --output market_breadth_validation_robustness_v1

      - name: Build unified final report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path("market_breadth_full_validation_v1")
          out.mkdir(exist_ok=True)

          collector = Path("market_breadth_historical_v1/market_breadth_validation_v1.json")
          analyzer = Path("market_breadth_analysis_v1/market_breadth_analysis_validation_v1.json")
          robustness = Path("market_breadth_validation_robustness_v1/market_breadth_robustness_validation_v1.json")

          def load(path):
              if not path.exists():
                  return {"file_found": False}
              try:
                  data = json.loads(path.read_text())
                  data["file_found"] = True
                  return data
              except Exception as exc:
                  return {"file_found": True, "parse_error": str(exc)}

          c = load(collector)
          a = load(analyzer)
          r = load(robustness)

          collector_pass = bool(c.get("validation_pass", False))
          analyzer_pass = bool(a.get("validation_pass", False))
          robustness_pass = bool(r.get("validation_pass", False))

          report = {
              "validator": "Market Breadth Full Validation v1",
              "research_only": True,
              "pit_perfect": False,
              "decision_engine_ready": False,
              "trading_signal": False,
              "forecast": False,
              "stages": {
                  "historical_collector": collector_pass,
                  "analyzer": analyzer_pass,
                  "validation_robustness": robustness_pass,
              },
              "final_status": (
                  "PASS"
                  if collector_pass and analyzer_pass and robustness_pass
                  else "FAIL"
              ),
              "collector": c,
              "analyzer": a,
              "robustness": r,
          }

          (out / "market_breadth_full_validation_summary_v1.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False)
          )

          print("==============================================")
          print("MARKET BREADTH FULL VALIDATION v1")
          print("==============================================")
          print(f"Collector:   {'PASS' if collector_pass else 'FAIL'}")
          print(f"Analyzer:    {'PASS' if analyzer_pass else 'FAIL'}")
          print(f"Robustness:  {'PASS' if robustness_pass else 'FAIL'}")
          print(f"FINAL STATUS: {report['final_status']}")
          print("Research-only: TRUE")
          print("PIT-perfect: FALSE")
          print("Decision Engine: FALSE")
          print("Trading signal: FALSE")
          print("Forecast: FALSE")
          PY

          cat market_breadth_full_validation_v1/market_breadth_full_validation_summary_v1.json

      - name: Upload unified Market Breadth artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-breadth-full-validation-v1
          path: |
            market_breadth_historical_v1/
            market_breadth_analysis_v1/
            market_breadth_validation_robustness_v1/
            market_breadth_full_validation_v1/
          if-no-files-found: warn
          retention-days: 30
