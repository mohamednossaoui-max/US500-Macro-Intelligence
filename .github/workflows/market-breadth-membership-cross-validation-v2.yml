name: Market Breadth - Membership Cross Validation v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-validation:
    name: S&P 500 Membership Cross Validation v2
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pitindex

      - name: Verify test script
        run: |
          echo "Checking test script..."

          if [ -f "tests/market_breadth/test_membership_cross_validation_v2.py" ]; then
            echo "Using v2 test script"
            echo "TEST_SCRIPT=tests/market_breadth/test_membership_cross_validation_v2.py" >> "$GITHUB_ENV"

          elif [ -f "tests/market_breadth/test_membership_cross_validation_v1.py" ]; then
            echo "Using v1 filename containing v2 code"
            echo "TEST_SCRIPT=tests/market_breadth/test_membership_cross_validation_v1.py" >> "$GITHUB_ENV"

          else
            echo "ERROR: Test script not found"
            exit 1
          fi

      - name: Run membership cross-validation
        run: |
          echo "=============================================="
          echo "MARKET BREADTH MEMBERSHIP CROSS-VALIDATION v2"
          echo "=============================================="

          python "$TEST_SCRIPT" \
            --start 2019-01-01 \
            --output market_breadth_cross_validation_v2

      - name: Validate artifacts
        run: |
          echo "Checking generated artifacts..."

          test -f market_breadth_cross_validation_v2/membership_cross_validation_summary_v2.json
          test -f market_breadth_cross_validation_v2/membership_snapshot_comparison_v2.csv
          test -f market_breadth_cross_validation_v2/membership_discrepancies_v2.csv
          test -f market_breadth_cross_validation_v2/membership_unresolved_conflicts_v2.csv

          echo "All artifacts found."

      - name: Display result
        if: always()
        run: |
          echo "=============================================="
          echo "FINAL RESULT"
          echo "=============================================="

          if [ -f "market_breadth_cross_validation_v2/membership_cross_validation_summary_v2.json" ]; then
            cat market_breadth_cross_validation_v2/membership_cross_validation_summary_v2.json
          else
            echo "Summary file was not generated."
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-breadth-membership-cross-validation-v2
          path: market_breadth_cross_validation_v2/
          if-no-files-found: warn
          retention-days: 30
