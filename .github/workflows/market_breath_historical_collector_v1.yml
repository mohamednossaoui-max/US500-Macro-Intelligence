name: Market Breadth - Historical Collector v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector:
    name: Market Breadth Historical Collector v1
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Verify collector
        run: |
          echo "Checking Market Breadth collector..."

          test -f tests/market_breadth/market_breadth_historical_collector_v1.py

          echo "Collector found."

      - name: Run Market Breadth Collector
        run: |
          echo "=============================================="
          echo "MARKET BREADTH HISTORICAL COLLECTOR v1"
          echo "=============================================="

          python tests/market_breadth/market_breadth_historical_collector_v1.py \
            --start 2019-01-01 \
            --output market_breadth_historical_v1

      - name: Validate artifacts
        run: |
          echo "Checking generated artifacts..."

          test -f market_breadth_historical_v1/market_breadth_records_v1.csv
          test -f market_breadth_historical_v1/market_breadth_validation_v1.json
          test -f market_breadth_historical_v1/market_breadth_metadata_v1.json

          echo "All artifacts found."

      - name: Display validation
        if: always()
        run: |
          echo "=============================================="
          echo "VALIDATION"
          echo "=============================================="

          if [ -f "market_breadth_historical_v1/market_breadth_validation_v1.json" ]; then
            cat market_breadth_historical_v1/market_breadth_validation_v1.json
          else
            echo "Validation file was not generated."
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-breadth-historical-v1
          path: market_breadth_historical_v1/
          if-no-files-found: warn
          retention-days: 30
