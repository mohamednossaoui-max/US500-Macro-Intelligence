name: Official Economic Ingestion Audit

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (self-hosted requires an installed online runner)"
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest
        required: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests beautifulsoup4 pypdf
      - name: Read-only official latest versus canonical comparison
        run: python economic_official_ingestion_v1.py --mode audit
      - name: Upload comparison and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-economic-ingestion-audit
          path: economic_official_staging/
