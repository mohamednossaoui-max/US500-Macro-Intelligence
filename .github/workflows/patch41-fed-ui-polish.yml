name: Patch 4.1 - Fed UI Polish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app.py'
      - '.github/workflows/patch41-fed-ui-polish.yml'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - '.github/workflows/patch41-fed-ui-polish.yml'

permissions:
  contents: read

jobs:
  validate-patch41:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Patch 4.1 presentation markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "PATCH 4.1 — Fed UI polish; presentation only" app.py
          grep -q "fed-brief" app.py
          grep -q "sep-row" app.py
          grep -q "comm-shift" app.py
          grep -q "Fed Evidence Quality" app.py
          grep -q "PIT_SAFE" app.py || true
          echo "PATCH 4.1 PRESENTATION MARKERS: PASS"

      - name: Python syntax check
        run: python -m py_compile app.py

      - name: Verify fed function structure with Python AST
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src = Path('app.py').read_text(encoding='utf-8')
          tree = ast.parse(src)
          names = [n.name for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))]
          assert names.count('fed') == 1, f'Expected exactly one fed(), found {names.count("fed")}'
          required = [
              'Policy Pulse',
              'What Changed?',
              'FOMC Communication',
              'SEP Pulse — Current vs Previous',
              'Communication — Current vs Previous',
              'Fed Synthesis',
              'Beige Book Context',
              'Fed Evidence Quality',
          ]
          missing = [x for x in required if x not in src]
          assert not missing, f'Missing Fed sections: {missing}'
          print('FED FUNCTION STRUCTURE: PASS')
          PY

      - name: Install project requirements when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          fi

      - name: Run integrity tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f verify_publication_integrity.py ]; then
            python verify_publication_integrity.py
          fi
          if [ -f tests/test_point_in_time_integrity.py ]; then
            python -m pip install pytest
            python -m pytest -q tests/test_point_in_time_integrity.py
          fi

      - name: Patch 4.1 complete
        run: |
          echo "PATCH 4.1 VALIDATION PASSED"
          echo "Fed UI polish is present; syntax and available integrity checks passed."
