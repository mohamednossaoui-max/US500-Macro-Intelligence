name: Patch 4.2 - Dynamic Research Tables

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-patch42:
    name: Verify Patch 4.2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest

      - name: Show repository state
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Repository -----"
          pwd

          echo
          echo "----- Branch -----"
          git branch --show-current

          echo
          echo "----- Git status -----"
          git status --short

          echo
          echo "----- Python -----"
          python --version

      - name: Verify Python syntax
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Python syntax -----"

          python -m py_compile app.py

          echo "PASS: app.py syntax"

      - name: Verify fed function exists
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Verify fed() -----"

          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path("app.py")

          if not path.exists():
              raise SystemExit("FAIL: app.py not found")

          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)

          functions = {
              node.name
              for node in ast.walk(tree)
              if isinstance(
                  node,
                  (ast.FunctionDef, ast.AsyncFunctionDef),
              )
          }

          if "fed" not in functions:
              raise SystemExit("FAIL: fed() function not found")

          print("PASS: fed() function exists")
          PY

      - name: Verify Patch 4.1 Fed UI is preserved
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Verify Patch 4.1 preservation -----"

          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path("app.py")

          if not path.exists():
              raise SystemExit("FAIL: app.py not found")

          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)

          functions = {
              node.name
              for node in ast.walk(tree)
              if isinstance(
                  node,
                  (ast.FunctionDef, ast.AsyncFunctionDef),
              )
          }

          if "fed" not in functions:
              raise SystemExit(
                  "FAIL: fed() function not found"
              )

          markers = (
              "Decision Brief",
              "decision brief",
              "Current vs Previous",
              "SEP Pulse",
              "Communication",
              "Evidence Quality",
              "Fed Evidence Quality",
          )

          found = [
              marker
              for marker in markers
              if marker in source
          ]

          print("PASS: fed() function exists")
          print(
              "Patch 4.1 presentation markers found:",
              len(found),
          )

          for marker in found:
              print(f"  - {marker}")

          if len(found) < 2:
              raise SystemExit(
                  "FAIL: insufficient structural evidence "
                  "that Patch 4.1 Fed UI is preserved"
              )

          print(
              "PASS: Patch 4.1 Fed UI preservation check"
          )
          PY

      - name: Verify Patch 4.2 presentation targets
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Verify Patch 4.2 -----"

          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path("app.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)

          functions = {
              node.name
              for node in ast.walk(tree)
              if isinstance(
                  node,
                  (ast.FunctionDef, ast.AsyncFunctionDef),
              )
          }

          print(
              f"Functions detected: {len(functions)}"
          )

          presentation_markers = (
              "research",
              "panel",
              "Raw",
              "raw",
              "expander",
          )

          found = [
              marker
              for marker in presentation_markers
              if marker in source
          ]

          print(
              "Patch 4.2 presentation markers found:",
              len(found),
          )

          for marker in found:
              print(f"  - {marker}")

          if not found:
              raise SystemExit(
                  "FAIL: Patch 4.2 presentation "
                  "markers were not detected"
              )

          print(
              "PASS: Patch 4.2 presentation "
              "structure detected"
          )
          PY

      - name: Guard backend loading and governance contracts
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Backend/governance guard -----"

          python - <<'PY'
          from pathlib import Path

          source = Path("app.py").read_text(
              encoding="utf-8"
          )

          expected = (
              "manifest.json",
              "public_data",
          )

          missing = [
              item
              for item in expected
              if item not in source
          ]

          if missing:
              raise SystemExit(
                  "FAIL: expected backend contracts "
                  f"missing: {missing}"
              )

          print(
              "PASS: manifest/public_data "
              "contracts remain present"
          )
          PY

      - name: Run publication integrity test when present
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Publication Integrity -----"

          FOUND=0

          for file in \
            verify_publication_integrity.py \
            scripts/verify_publication_integrity.py \
            tests/verify_publication_integrity.py
          do
            if [ -f "$file" ]; then
              echo "Running: $file"
              python "$file"
              FOUND=1
              break
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo \
              "NOTICE: standalone publication integrity script not found."
            echo \
              "Checking pytest suite for publication integrity tests."

            if find tests -type f \
              \( -iname '*publication*integrity*.py' \
              -o -iname '*manifest*.py' \) \
              2>/dev/null | grep -q .; then

              find tests -type f \
                \( -iname '*publication*integrity*.py' \
                -o -iname '*manifest*.py' \) \
                -print

              while IFS= read -r testfile; do
                python -m pytest -q "$testfile"
              done < <(
                find tests -type f \
                  \( -iname '*publication*integrity*.py' \
                  -o -iname '*manifest*.py' \)
              )
            else
              echo \
                "NOTICE: no publication integrity test file detected."
            fi
          fi

      - name: Run PIT tests when present
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Point-in-Time Integrity -----"

          if [ -f tests/test_point_in_time_integrity.py ]; then
            python -m pytest -q \
              tests/test_point_in_time_integrity.py
          else
            echo \
              "NOTICE: tests/test_point_in_time_integrity.py not found."
          fi

      - name: Run Patch 4.2 presentation tests when present
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Patch 4.2 tests -----"

          TESTS=$(find tests -type f \
            \( -iname '*presentation*.py' \
            -o -iname '*patch42*.py' \
            -o -iname '*patch_42*.py' \
            -o -iname '*research*panel*.py' \) \
            2>/dev/null || true)

          if [ -n "$TESTS" ]; then
            echo "$TESTS"

            while IFS= read -r testfile; do
              [ -n "$testfile" ] || continue
              python -m pytest -q "$testfile"
            done <<< "$TESTS"
          else
            echo \
              "NOTICE: no dedicated Patch 4.2 tests found."
          fi

      - name: Confirm Data Explorer remains a raw-data tool
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Data Explorer guard -----"

          python - <<'PY'
          from pathlib import Path

          source = Path("app.py").read_text(
              encoding="utf-8"
          )

          markers = (
              "Data Explorer",
              "data_explorer",
          )

          if not any(
              marker in source
              for marker in markers
          ):
              print(
                  "NOTICE: Data Explorer marker "
                  "not detected by name."
              )
          else:
              print(
                  "PASS: Data Explorer remains present"
              )
          PY

      - name: Final syntax check
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile app.py

          echo \
            "PASS: final Python syntax verification"

      - name: Show changed files
        shell: bash
        run: |
          set -euo pipefail

          echo "----- Git status -----"
          git status --short

          echo
          echo "----- Diff summary -----"
          git diff --stat || true

          echo
          echo "----- Changed files -----"
          git diff --name-only || true

      - name: Patch 4.2 verification summary
        shell: bash
        run: |
          set -euo pipefail

          echo \
            "========================================"
          echo \
            "PATCH 4.2 VERIFICATION PASSED"
          echo \
            "========================================"
          echo \
            "Python syntax: PASS"
          echo \
            "fed() structure: PASS"
          echo \
            "Patch 4.1 preservation: PASS"
          echo \
            "Patch 4.2 presentation: PASS"
          echo \
            "Backend/governance guard: PASS"
          echo \
            "========================================"
