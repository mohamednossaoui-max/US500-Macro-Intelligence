name: Publication Integrity Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-integrity:
    name: Verify Publication Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show environment
        run: |
          python --version
          echo "Repository:"
          pwd
          echo ""
          echo "Public data manifests:"
          find public_data -maxdepth 1 -type f \
            \( -name "manifest.json" -o -name "public_data_manifest.json" \) \
            -print

      - name: Run Publication Integrity verifier
        run: |
          echo "=========================================="
          echo "PUBLICATION INTEGRITY VERIFICATION"
          echo "=========================================="

          python scripts/verify_publication_integrity.py

      - name: Run Publication Integrity tests
        run: |
          echo "=========================================="
          echo "PUBLICATION INTEGRITY TESTS"
          echo "=========================================="

          python -m pip install --upgrade pip
          python -m pip install pytest

          python -m pytest -q tests/test_publication_integrity.py

      - name: Integrity check completed
        if: always()
        run: |
          echo "=========================================="
          echo "Publication Integrity workflow completed."
          echo "No production data was modified."
          echo "=========================================="
