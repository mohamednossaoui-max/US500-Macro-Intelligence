name: Publication Integrity Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Publication Integrity verifier
        run: python scripts/verify_publication_integrity.py
      - name: Verify Canonical Manifest
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("public_data"); m=json.loads((root/"manifest.json").read_text()); files=m.get("files")
          if not isinstance(files,dict) or not files: raise SystemExit("FAIL: invalid canonical manifest")
          failures=[]
          for fn,md in sorted(files.items()):
              p=root/fn
              if not p.is_file(): failures.append(f"MISSING: {fn}"); continue
              if hashlib.sha256(p.read_bytes()).hexdigest()!=md.get("sha256"): failures.append(f"SHA256 MISMATCH: {fn}")
              if p.stat().st_size!=md.get("bytes"): failures.append(f"SIZE MISMATCH: {fn}")
          if failures:
              print("\n".join(failures)); raise SystemExit(1)
          print(f"CANONICAL MANIFEST PASSED\nVerified files: {len(files)}")
          PY
      - name: Run Publication Integrity tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_publication_integrity.py
