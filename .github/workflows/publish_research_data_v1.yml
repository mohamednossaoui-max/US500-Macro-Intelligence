name: Publish Research Data V2

on:
  workflow_dispatch:

  schedule:
    # كل 30 دقيقة
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-research-data
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. DISCOVER + DOWNLOAD + PUBLISH
      # ============================================================
      - name: Discover and publish research artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "US500 MACRO INTELLIGENCE"
          echo "RESEARCH DATA PUBLISHER V2"
          echo "============================================================"

          rm -rf public_data
          mkdir -p public_data

          echo
          echo "============================================================"
          echo "DISCOVERING GITHUB ACTIONS ARTIFACTS"
          echo "============================================================"

          gh api \
            --paginate \
            --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            > /tmp/artifacts_pages.json

          echo "Artifact discovery completed."

          # ========================================================
          # Python performs the selection and uses GH CLI for
          # authenticated artifact downloads.
          # ========================================================

          python <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path
          from datetime import datetime, timezone

          REPO = os.environ["GITHUB_REPOSITORY"]

          OUTPUT_DIR = Path("public_data")
          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)

          # ========================================================
          # DATASET SPECIFICATIONS
          # ========================================================

          DATASETS = {

              "research_context": {
                  "artifacts": [
                      "research-context-v1",
                  ],
                  "files": [
                      "research_context_v1.csv",
                  ],
              },

              "macro_context": {
                  "artifacts": [
                      "macro-context-v1",
                  ],
                  "files": [
                      "macro_context_v1.csv",
                      "macro_context_v1.json",
                  ],
              },

              "financial_stress": {
                  "artifacts": [
                      "financial-stress-research-v1",
                  ],
                  "files": [
                      "financial_stress_research_v1.csv",
                  ],
              },

              "sentiment": {
                  "artifacts": [
                      "sentiment-engine-v1",
                  ],
                  "files": [
                      "sentiment_engine_research_v1.csv",
                  ],
              },

              "technical": {
                  "artifacts": [
                      "technical-intelligence-v1",
                  ],
                  "files": [
                      "technical_intelligence_research_v1.csv",
                  ],
              },

              "liquidity": {
                  "artifacts": [
                      "liquidity-intelligence-v1",
                  ],
                  "files": [
                      "liquidity_intelligence_v1.csv",
                      "liquidity_intelligence_research_v1.csv",
                  ],
              },

              "market_breadth": {
                  "artifacts": [
                      "market-breadth-full-validation-v1",
                  ],
                  "files": [
                      "market_breadth_analysis_v1.csv",
                  ],
              },

              "event_news": {
                  "artifacts": [
                      "event-news-intelligence-v2.1",
                  ],
                  "files": [
                      "event_news_research_v2.csv",
                  ],
              },

              "cross_asset": {
                  "artifacts": [
                      "cross-asset-intelligence-v1",
                  ],
                  "files": [
                      "cross_asset_intelligence_v1.csv",
                  ],
              },

              "earnings": {
                  "artifacts": [
                      "earnings-market-reaction-v3-results",
                  ],
                  "files": [
                      "earnings_market_reaction_v3.csv",
                  ],
              },

              "fed": {
                  "artifacts": [
                      "fed-intelligence-v1",
                  ],
                  "files": [
                      "fed_intelligence_output_v1.json",
                  ],
              },

              "decision_engine": {
                  "artifacts": [
                      "decision-engine-v1",
                  ],
                  "files": [
                      "decision_engine_validation_v1.csv",
                      "decision_engine_validation_v1_summary.csv",
                      "decision_engine_validation_v1_events.csv",
                      "decision_engine_research_v1.csv",
                      "decision_engine_research_v1_summary.csv",
                  ],
              },

              "final_validation": {
                  "artifacts": [
                      "final-end-to-end-validation-v1",
                  ],
                  "files": [
                      "final_end_to_end_validation_report.csv",
                      "final_end_to_end_validation_summary.csv",
                      "final_end_to_end_validation_manifest.csv",
                      "final_end_to_end_validation_events.csv",
                  ],
              },

              "historical_edge": {
                  "artifacts": [
                      "historical-event-study-v2",
                      "historical-event-study-v1",
                  ],
                  "files": [
                      "historical_event_study_summary_v2.csv",
                      "historical_event_study_event_overlap_v2.csv",
                      "historical_event_study_feature_redundancy_v2.csv",
                      "historical_event_study_conditional_events_v2.csv",
                      "historical_event_study_controlled_associations_v2.csv",
                      "historical_event_study_sample_adequacy_v2.csv",
                      "historical_event_study_baseline_v2.csv",
                      "historical_event_study_summary_v1.csv",
                      "historical_event_study_events_v1.csv",
                      "historical_event_study_baseline_v1.csv",
                      "historical_event_study_validation_v1.csv",
                  ],
              },
          }

          # ========================================================
          # LOAD ARTIFACT INDEX
          # ========================================================

          with open("/tmp/artifacts_pages.json", "r", encoding="utf-8") as f:
              pages = json.load(f)

          artifacts = []

          for page in pages:
              if isinstance(page, list):
                  artifacts.extend(page)

          # Only valid, non-expired artifacts
          artifacts = [
              a for a in artifacts
              if not a.get("expired", False)
          ]

          print(f"Non-expired artifacts found: {len(artifacts)}")

          # ========================================================
          # INDEX ARTIFACTS BY NAME
          # ========================================================

          by_name = {}

          for artifact in artifacts:
              name = artifact.get("name")

              if not name:
                  continue

              by_name.setdefault(name, []).append(artifact)

          # Sort newest first
          for name in by_name:
              by_name[name].sort(
                  key=lambda x: (
                      x.get("created_at", ""),
                      x.get("id", 0),
                  ),
                  reverse=True,
              )

          # ========================================================
          # SELECT ARTIFACTS
          # ========================================================

          selected = {}

          for dataset_name, spec in DATASETS.items():

              for artifact_name in spec["artifacts"]:

                  candidates = by_name.get(artifact_name, [])

                  if not candidates:
                      continue

                  artifact = candidates[0]

                  selected_key = artifact["id"]

                  selected[selected_key] = artifact

                  break

          print(f"Selected artifact families: {len(selected)}")

          # ========================================================
          # MANIFEST
          # ========================================================

          manifest = {
              "publisher": "US500 Macro Intelligence",
              "publisher_version": "V2",
              "research_only": True,
              "generated_at_utc": datetime.now(
                  timezone.utc
              ).isoformat(),
              "repository": REPO,
              "datasets": {},
              "files": {},
          }

          # ========================================================
          # DOWNLOAD CACHE
          # ========================================================

          downloaded = {}

          # ========================================================
          # DOWNLOAD ARTIFACT USING GH CLI
          # ========================================================

          def download_artifact(artifact):

              artifact_id = artifact["id"]

              if artifact_id in downloaded:
                  return downloaded[artifact_id]

              print()
              print("------------------------------------------------------------")
              print(f"Downloading: {artifact['name']}")
              print(f"Artifact ID: {artifact_id}")
              print(f"Created: {artifact.get('created_at')}")

              temp_dir = Path(
                  tempfile.mkdtemp(
                      prefix=f"artifact_{artifact_id}_"
                  )
              )

              zip_path = temp_dir / "artifact.zip"

              api_path = (
                  f"repos/{REPO}/actions/artifacts/"
                  f"{artifact_id}/zip"
              )

              print("Downloading authenticated artifact ZIP...")

              with open(zip_path, "wb") as output:

                  process = subprocess.run(
                      [
                          "gh",
                          "api",
                          api_path,
                      ],
                      stdout=output,
                      stderr=subprocess.PIPE,
                      env=os.environ,
                  )

              if process.returncode != 0:

                  error = process.stderr.decode(
                      "utf-8",
                      errors="replace",
                  )

                  raise RuntimeError(
                      f"Artifact download failed: "
                      f"{artifact['name']} "
                      f"(HTTP/API error)\n{error}"
                  )

              extract_dir = temp_dir / "extracted"
              extract_dir.mkdir()

              with zipfile.ZipFile(zip_path, "r") as z:

                  z.extractall(extract_dir)

              downloaded[artifact_id] = (
                  artifact,
                  extract_dir,
              )

              return downloaded[artifact_id]

          # ========================================================
          # FIND FILE INSIDE ZIP
          # ========================================================

          def find_file(root, filename):

              matches = list(root.rglob(filename))

              if not matches:
                  return None

              # Prefer exact basename match.
              matches.sort(
                  key=lambda p: (
                      len(p.parts),
                      str(p),
                  )
              )

              return matches[0]

          # ========================================================
          # PROCESS DATASETS
          # ========================================================

          published_count = 0
          missing_count = 0

          for dataset_name, spec in DATASETS.items():

              print()
              print(
                  "============================================================"
              )
              print(
                  f"DATASET: {dataset_name}"
              )
              print(
                  "============================================================"
              )

              dataset_manifest = {
                  "status": "missing",
                  "artifact": None,
                  "files": {},
              }

              artifact_used = None
              extract_dir = None

              # ----------------------------------------------------
              # Try candidate artifacts in order.
              # ----------------------------------------------------

              for artifact_name in spec["artifacts"]:

                  candidates = by_name.get(
                      artifact_name,
                      [],
                  )

                  if not candidates:
                      print(
                          f"No artifact found: {artifact_name}"
                      )
                      continue

                  artifact = candidates[0]

                  try:

                      _, root = download_artifact(
                          artifact
                      )

                      found_any = False

                      for filename in spec["files"]:

                          source = find_file(
                              root,
                              filename,
                          )

                          if source is None:

                              print(
                                  f"  MISSING in artifact: "
                                  f"{filename}"
                              )

                              continue

                          destination = (
                              OUTPUT_DIR / filename
                          )

                          destination.parent.mkdir(
                              parents=True,
                              exist_ok=True,
                          )

                          shutil.copy2(
                              source,
                              destination,
                          )

                          print(
                              f"  PUBLISHED: {filename}"
                          )

                          dataset_manifest[
                              "files"
                          ][filename] = {
                              "artifact_name":
                                  artifact["name"],
                              "artifact_id":
                                  artifact["id"],
                              "created_at":
                                  artifact.get(
                                      "created_at"
                                  ),
                              "source_path":
                                  str(source),
                          }

                          manifest["files"][filename] = {
                              "dataset":
                                  dataset_name,
                              "artifact_name":
                                  artifact["name"],
                              "artifact_id":
                                  artifact["id"],
                              "created_at":
                                  artifact.get(
                                      "created_at"
                                  ),
                          }

                          published_count += 1
                          found_any = True

                      if found_any:

                          artifact_used = artifact

                          dataset_manifest[
                              "status"
                          ] = "published"

                          break

                  except Exception as exc:

                      print(
                          f"  ERROR downloading "
                          f"{artifact_name}: {exc}"
                      )

                      continue

              if artifact_used:

                  dataset_manifest[
                      "artifact"
                  ] = {
                      "name":
                          artifact_used["name"],
                      "id":
                          artifact_used["id"],
                      "created_at":
                          artifact_used.get(
                              "created_at"
                          ),
                  }

              else:

                  missing_count += 1

              manifest["datasets"][
                  dataset_name
              ] = dataset_manifest

          # ========================================================
          # WRITE MANIFEST
          # ========================================================

          # Remove volatile timestamp so the publisher does not
          # create a Git commit every 30 minutes when nothing changed.
          manifest["generated_at_utc"] = None

          manifest_path = (
              OUTPUT_DIR / "manifest.json"
          )

          with open(
              manifest_path,
              "w",
              encoding="utf-8",
          ) as f:

              json.dump(
                  manifest,
                  f,
                  indent=2,
                  sort_keys=True,
              )

          # ========================================================
          # WRITE README
          # ========================================================

          readme = """# US500 Macro Intelligence — Public Research Data

          This directory contains research datasets automatically published
          from GitHub Actions artifacts.

          ## Important

          - Research-only.
          - No trade execution.
          - No brokerage integration.
          - No position sizing.
          - No SL/TP generation.
          - No deterministic market prediction.
          - Data is published automatically by GitHub Actions.

          The Streamlit application reads these files locally first,
          so a personal GitHub token is NOT required.

          `manifest.json` contains the artifact provenance.
          """

          with open(
              OUTPUT_DIR / "README.md",
              "w",
              encoding="utf-8",
          ) as f:

              f.write(readme.strip() + "\n")

          print()
          print(
              "============================================================"
          )
          print(
              "PUBLIC DATA PUBLISH SUMMARY"
          )
          print(
              "============================================================"
          )

          print(
              f"Files published: {published_count}"
          )

          print(
              f"Datasets missing: {missing_count}"
          )

          print(
              f"Output directory: {OUTPUT_DIR.resolve()}"
          )

          if published_count == 0:

              raise SystemExit(
                  "ERROR: No research files were published."
              )

          PY

      # ============================================================
      # 4. SHOW RESULT
      # ============================================================
      - name: Show published files
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "PUBLIC DATA DIRECTORY"
          echo "============================================================"

          find public_data \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

      # ============================================================
      # 5. COMMIT
      # ============================================================
      - name: Commit published data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add public_data

          if git diff --cached --quiet; then
            echo
            echo "============================================================"
            echo "NO DATA CHANGES"
            echo "============================================================"
            echo "Nothing new to commit."
            exit 0
          fi

          echo
          echo "============================================================"
          echo "COMMITTING RESEARCH DATA"
          echo "============================================================"

          git commit \
            -m "chore: publish latest research data"

          git push

          echo
          echo "============================================================"
          echo "PUBLICATION COMPLETE"
          echo "============================================================"
