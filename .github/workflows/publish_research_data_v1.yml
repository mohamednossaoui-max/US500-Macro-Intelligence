name: Verify Published Research Data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/verify_publication_integrity.py --public-data public_data
      - run: echo "Master Pipeline is the sole data publisher. Use it to rebuild and publish a complete verified generation."
