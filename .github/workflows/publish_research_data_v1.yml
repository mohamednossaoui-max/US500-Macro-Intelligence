name: Publish Research Data V3

on:

  workflow_dispatch:

  workflow_run:
    workflows:
      - "Economic Intelligence Full Pipeline v2.3 Refresh"
      - "financial-stress-historical-v1"
      - "financial-stress-research-v1"
      - "Fed Intelligence"
      - "Event News Intelligence v1"
      - "COT Historical Collector v1"
      - "COT Positioning Analyzer v1"
      - "VIX Historical Collector v1"
      - "VIX Sentiment Analyzer v1"
      - "AAII Historical v1"
      - "AAII Sentiment Analyzer v1"
      - "Technical Intelligence v1"
      - "Liquidity Historical v1"
      - "Liquidity Intelligence v1"
      - "Market Breadth - Full Validation v1"
      - "Cross-Asset Intelligence v1"
      - "Test Earnings Market Reaction V3"
      - "Macro Context v1"
      - "Research Context v1"
      - "Decision Engine V1"
      - "Historical Event Study v2"
      - "Final End-to-End Validation V1"
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-research-data-v3
  cancel-in-progress: false

jobs:

  publish:

    name: Publish Research Data V3

    runs-on: ubuntu-latest

    # ============================================================
    # Only publish when the triggering workflow succeeded.
    # Manual workflow_dispatch is always allowed.
    # ============================================================

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # 3. CREATE PUBLIC DATA DIRECTORY
      # ==========================================================

      - name: Prepare public data directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public_data

          echo "============================================================"
          echo "PUBLIC DATA DIRECTORY"
          echo "============================================================"

          find public_data -maxdepth 1 -type f -print 2>/dev/null || true

      # ==========================================================
      # 4. DEFINE PUBLISH MAP
      # ==========================================================

      - name: Build publication map
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/publication_map.json <<'JSON'
          {
            "economic-intelligence-v2-3-refresh": [
              "economic_historical_events_v1.csv",
              "economic_historical_quality_v1.csv",
              "economic_surprise_engine_v1.csv",
              "economic_surprise_summary_v1.csv",
              "economic_regime_events_v1.csv",
              "economic_regime_summary_v1.csv"
            ],

            "financial-stress-historical-v1": [
              "financial_stress_records_input_v1.csv",
              "financial_stress_collection_summary_v1.csv"
            ],

            "financial-stress-research-v1": [
              "financial_stress_research_v1.csv",
              "financial_stress_research_summary_v1.csv"
            ],

            "fed-intelligence-v1": [
              "fed_intelligence_output_v1.json"
            ],

            "event-news-intelligence-v2.1": [
              "event_news_research_v2.csv",
              "event_news_research_summary_v2.json",
              "event_news_validation_v2.json"
            ],

            "cot-historical-v1": [
              "cot_historical_records_input_v1.csv",
              "cot_historical_collection_summary_v1.csv"
            ],

            "cot-positioning-v1": [
              "cot_positioning_research_v1.csv",
              "cot_positioning_research_summary_v1.csv",
              "cot_positioning_extremes_v1.csv"
            ],

            "vix-historical-v1": [
              "vix_historical_records_input_v1.csv",
              "vix_historical_collection_summary_v1.csv"
            ],

            "vix-sentiment-v1": [
              "vix_sentiment_research_v1.csv",
              "vix_sentiment_research_summary_v1.csv",
              "vix_sentiment_extremes_v1.csv"
            ],

            "aaii-sentiment-v1": [
              "aaii_sentiment_research_v1.csv",
              "aaii_sentiment_research_summary_v1.csv",
              "aaii_sentiment_extremes_v1.csv"
            ],

            "technical-intelligence-v1": [
              "technical_intelligence_research_v1.csv",
              "technical_intelligence_research_summary_v1.csv",
              "technical_intelligence_extremes_v1.csv"
            ],

            "liquidity-historical-v1": [
              "liquidity_historical_records_input_v1.csv",
              "liquidity_historical_collection_summary_v1.csv"
            ],

            "liquidity-intelligence-v1": [
              "liquidity_intelligence_research_v1.csv",
              "liquidity_intelligence_summary_v1.csv"
            ],

            "market-breadth-full-validation-v1": [
              "market_breadth_analysis_v1.csv"
            ],

            "cross-asset-intelligence-v1": [
              "cross_asset_intelligence_v1.csv"
            ],

            "earnings-market-reaction-v3-results": [
              "earnings_market_reaction_v3.csv",
              "earnings_market_reaction_summary_v3.csv",
              "earnings_reaction_by_eps_class_v3.csv",
              "earnings_reaction_by_sector_v3.csv"
            ],

            "macro-context-v1": [
              "macro_context_v1.csv",
              "macro_context_v1.json"
            ],

            "research-context-v1": [
              "research_context_v1.csv",
              "research_context_summary_v1.csv",
              "research_context_extremes_v1.csv"
            ],

            "decision-engine-v1": [
              "decision_engine_research_v1.csv",
              "decision_engine_research_v1_summary.csv",
              "decision_engine_validation_v1.csv",
              "decision_engine_validation_v1_summary.csv",
              "decision_engine_validation_v1_events.csv"
            ],

            "historical-event-study-v2": [
              "historical_event_study_summary_v2.csv",
              "historical_event_study_event_overlap_v2.csv",
              "historical_event_study_feature_redundancy_v2.csv",
              "historical_event_study_conditional_events_v2.csv",
              "historical_event_study_controlled_associations_v2.csv",
              "historical_event_study_sample_adequacy_v2.csv",
              "historical_event_study_baseline_v2.csv"
            ],

            "final-end-to-end-validation-v1": [
              "final_end_to_end_validation_report.csv",
              "final_end_to_end_validation_summary.csv",
              "final_end_to_end_validation_manifest.csv",
              "final_end_to_end_validation_events.csv"
            ]
          }
          JSON

          echo "Publication map created."

      # ==========================================================
      # 5. DETERMINE TRIGGERING RUN
      # ==========================================================

      - name: Determine source workflow run
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then

            echo "Triggered by:"
            echo "${{ github.event.workflow_run.name }}"

            echo "Run ID:"
            echo "${{ github.event.workflow_run.id }}"

            echo "RUN_ID=${{ github.event.workflow_run.id }}" \
              >> "$GITHUB_ENV"

            echo "SOURCE_WORKFLOW=${{ github.event.workflow_run.name }}" \
              >> "$GITHUB_ENV"

          else

            echo "Manual publisher execution."

            echo "RUN_ID=" >> "$GITHUB_ENV"
            echo "SOURCE_WORKFLOW=MANUAL" >> "$GITHUB_ENV"

          fi

      # ==========================================================
      # 6. DOWNLOAD TRIGGERING ARTIFACT
      # ==========================================================

      - name: Download triggering workflow artifact
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DOWNLOADING TRIGGERING ARTIFACT"
          echo "============================================================"

          mkdir -p /tmp/source_artifact

          RUN_ID="${{ github.event.workflow_run.id }}"

          echo "Workflow:"
          echo "${{ github.event.workflow_run.name }}"

          echo "Run ID:"
          echo "$RUN_ID"

          ARTIFACT_NAME=""

          case "${{ github.event.workflow_run.name }}" in

            "Economic Intelligence Full Pipeline v2.3 Refresh")
              ARTIFACT_NAME="economic-intelligence-v2-3-refresh"
              ;;

            "financial-stress-historical-v1")
              ARTIFACT_NAME="financial-stress-historical-v1"
              ;;

            "financial-stress-research-v1")
              ARTIFACT_NAME="financial-stress-research-v1"
              ;;

            "Fed Intelligence")
              ARTIFACT_NAME="fed-intelligence-v1"
              ;;

            "Event News Intelligence v1")
              ARTIFACT_NAME="event-news-intelligence-v2.1"
              ;;

            "COT Historical Collector v1")
              ARTIFACT_NAME="cot-historical-v1"
              ;;

            "COT Positioning Analyzer v1")
              ARTIFACT_NAME="cot-positioning-v1"
              ;;

            "VIX Historical Collector v1")
              ARTIFACT_NAME="vix-historical-v1"
              ;;

            "VIX Sentiment Analyzer v1")
              ARTIFACT_NAME="vix-sentiment-v1"
              ;;

            "AAII Historical v1")
              ARTIFACT_NAME="aaii-historical-v1"
              ;;

            "AAII Sentiment Analyzer v1")
              ARTIFACT_NAME="aaii-sentiment-v1"
              ;;

            "Technical Intelligence v1")
              ARTIFACT_NAME="technical-intelligence-v1"
              ;;

            "Liquidity Historical v1")
              ARTIFACT_NAME="liquidity-historical-v1"
              ;;

            "Liquidity Intelligence v1")
              ARTIFACT_NAME="liquidity-intelligence-v1"
              ;;

            "Market Breadth - Full Validation v1")
              ARTIFACT_NAME="market-breadth-full-validation-v1"
              ;;

            "Cross-Asset Intelligence v1")
              ARTIFACT_NAME="cross-asset-intelligence-v1"
              ;;

            "Test Earnings Market Reaction V3")
              ARTIFACT_NAME="earnings-market-reaction-v3-results"
              ;;

            "Macro Context v1")
              ARTIFACT_NAME="macro-context-v1"
              ;;

            "Research Context v1")
              ARTIFACT_NAME="research-context-v1"
              ;;

            "Decision Engine V1")
              ARTIFACT_NAME="decision-engine-v1"
              ;;

            "Historical Event Study v2")
              ARTIFACT_NAME="historical-event-study-v2"
              ;;

            "Final End-to-End Validation V1")
              ARTIFACT_NAME="final-end-to-end-validation-v1"
              ;;

            *)
              echo "No publication mapping for workflow."
              exit 0
              ;;

          esac

          echo "Artifact:"
          echo "$ARTIFACT_NAME"

          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir /tmp/source_artifact

          echo
          echo "Downloaded files:"

          find /tmp/source_artifact \
            -type f \
            -print | sort

      # ==========================================================
      # 7. MANUAL MODE
      #
      # Download the latest successful run for every producer.
      # This is useful for bootstrapping public_data after the
      # previous artifacts have disappeared.
      # ==========================================================

      - name: Bootstrap from latest successful workflow runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BOOTSTRAP MODE"
          echo "============================================================"

          mkdir -p /tmp/bootstrap

          python <<'PY'

          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["REPOSITORY"]

          with open(
              "/tmp/publication_map.json",
              "r",
              encoding="utf-8"
          ) as f:
              mapping = json.load(f)

          # Workflow name -> artifact name
          workflows = {
              "Economic Intelligence Full Pipeline v2.3 Refresh":
                  "economic-intelligence-v2-3-refresh",

              "financial-stress-historical-v1":
                  "financial-stress-historical-v1",

              "financial-stress-research-v1":
                  "financial-stress-research-v1",

              "Fed Intelligence":
                  "fed-intelligence-v1",

              "Event News Intelligence v1":
                  "event-news-intelligence-v2.1",

              "COT Historical Collector v1":
                  "cot-historical-v1",

              "COT Positioning Analyzer v1":
                  "cot-positioning-v1",

              "VIX Historical Collector v1":
                  "vix-historical-v1",

              "VIX Sentiment Analyzer v1":
                  "vix-sentiment-v1",

              "AAII Historical v1":
                  "aaii-historical-v1",

              "AAII Sentiment Analyzer v1":
                  "aaii-sentiment-v1",

              "Technical Intelligence v1":
                  "technical-intelligence-v1",

              "Liquidity Historical v1":
                  "liquidity-historical-v1",

              "Liquidity Intelligence v1":
                  "liquidity-intelligence-v1",

              "Market Breadth - Full Validation v1":
                  "market-breadth-full-validation-v1",

              "Cross-Asset Intelligence v1":
                  "cross-asset-intelligence-v1",

              "Test Earnings Market Reaction V3":
                  "earnings-market-reaction-v3-results",

              "Macro Context v1":
                  "macro-context-v1",

              "Research Context v1":
                  "research-context-v1",

              "Decision Engine V1":
                  "decision-engine-v1",

              "Historical Event Study v2":
                  "historical-event-study-v2",

              "Final End-to-End Validation V1":
                  "final-end-to-end-validation-v1"
          }

          for workflow, artifact in workflows.items():

              print()
              print("------------------------------------------------------------")
              print("Workflow:", workflow)
              print("Artifact:", artifact)
              print("------------------------------------------------------------")

              result = subprocess.run(
                  [
                      "gh",
                      "run",
                      "list",
                      "--repo",
                      repo,
                      "--workflow",
                      workflow,
                      "--status",
                      "success",
                      "--limit",
                      "1",
                      "--json",
                      "databaseId,createdAt,conclusion",
                  ],
                  capture_output=True,
                  text=True,
                  env=os.environ,
              )

              if result.returncode != 0:
                  print("Unable to query workflow.")
                  continue

              try:
                  runs = json.loads(result.stdout)
              except Exception:
                  print("Invalid workflow response.")
                  continue

              if not runs:
                  print("No successful run found.")
                  continue

              run_id = str(
                  runs[0]["databaseId"]
              )

              created = runs[0].get(
                  "createdAt",
                  ""
              )

              target = Path(
                  "/tmp/bootstrap"
              ) / artifact

              target.mkdir(
                  parents=True,
                  exist_ok=True
              )

              print(
                  f"Latest successful run: "
                  f"{run_id} ({created})"
              )

              download = subprocess.run(
                  [
                      "gh",
                      "run",
                      "download",
                      run_id,
                      "--repo",
                      repo,
                      "--name",
                      artifact,
                      "--dir",
                      str(target),
                  ],
                  capture_output=True,
                  text=True,
                  env=os.environ,
              )

              if download.returncode != 0:

                  print(
                      "Artifact unavailable for this run."
                  )

                  print(
                      download.stderr.strip()
                  )

                  continue

              print("Artifact downloaded.")

          PY

          echo
          echo "============================================================"
          echo "BOOTSTRAP DOWNLOAD COMPLETE"
          echo "============================================================"

          find /tmp/bootstrap \
            -type f \
            -print | sort || true

      # ==========================================================
      # 8. COLLECT SOURCE FILES
      # ==========================================================

      - name: Collect published research files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "COLLECTING RESEARCH DATA"
          echo "============================================================"

          # --------------------------------------------------------
          # Triggered run
          # --------------------------------------------------------

          if [ "${{ github.event_name }}" = "workflow_run" ]; then

            if [ -d "/tmp/source_artifact" ]; then

              while IFS= read -r file; do

                base="$(basename "$file")"

                echo "Publishing:"
                echo "  $base"

                cp "$file" \
                  "public_data/$base"

              done < <(
                find /tmp/source_artifact \
                  -type f \
                  \( \
                    -name "*.csv" \
                    -o \
                    -name "*.json" \
                  \)
              )

            fi

          fi

          # --------------------------------------------------------
          # Manual bootstrap
          # --------------------------------------------------------

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            if [ -d "/tmp/bootstrap" ]; then

              while IFS= read -r file; do

                base="$(basename "$file")"

                echo "Publishing:"
                echo "  $base"

                cp "$file" \
                  "public_data/$base"

              done < <(
                find /tmp/bootstrap \
                  -type f \
                  \( \
                    -name "*.csv" \
                    -o \
                    -name "*.json" \
                  \)
              )

            fi

          fi

          echo
          echo "============================================================"
          echo "PUBLIC DATA FILES"
          echo "============================================================"

          find public_data \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

      # ==========================================================
      # 9. CREATE MANIFEST
      # ==========================================================

      - name: Create public data manifest
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'

          import hashlib
          import json
          from pathlib import Path

          root = Path("public_data")

          manifest = {
              "publisher": "US500 Macro Intelligence",
              "publisher_version": "V3",
              "research_only": True,
              "source_workflow": "${{ github.event.workflow_run.name }}",
              "source_run_id": "${{ github.event.workflow_run.id }}",
              "files": {}
          }

          for path in sorted(root.iterdir()):

              if not path.is_file():
                  continue

              if path.name == "README.md":
                  continue

              # Publication manifests are metadata, never published payloads.
              if path.name == "manifest.json" or (
                  path.suffix == ".json" and "manifest" in path.stem.lower()
              ):
                  continue

              data = path.read_bytes()

              manifest["files"][path.name] = {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(
                      data
                  ).hexdigest()
              }

          with open(
              root / "manifest.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  manifest,
                  f,
                  indent=2,
                  sort_keys=True
              )

              f.write("\n")

          PY

      # ==========================================================
      # 10. README
      # ==========================================================

      - name: Create public data README
        shell: bash
        run: |
          set -euo pipefail

          cat > public_data/README.md <<'EOF'
          # US500 Macro Intelligence — Public Research Data

          Automatically published research datasets.

          ## Research-only

          This data layer is:

          - Research only
          - No trade execution
          - No broker integration
          - No position sizing
          - No SL/TP generation
          - No deterministic market prediction

          The Streamlit terminal reads this directory directly.

          A personal GitHub token is not required.

          `manifest.json` contains SHA-256 checksums for published files.
          EOF

      # ==========================================================
      # 11. VALIDATE
      # ==========================================================

      - name: Validate public data
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "PUBLIC DATA VALIDATION"
          echo "============================================================"

          FILE_COUNT=$(
            find public_data \
              -maxdepth 1 \
              -type f \
              \( \
                -name "*.csv" \
                -o \
                -name "*.json" \
              \) \
              | wc -l
          )

          echo "Published data files: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo
            echo "WARNING:"
            echo "No research data was available to publish."
            echo
            echo "This is expected on the first bootstrap if all"
            echo "previous GitHub Actions artifacts have expired."
            echo
            echo "Run the producer workflows first."
            exit 0
          fi

          echo
          echo "Published files:"

          find public_data \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

      # ==========================================================
      # 12. COMMIT
      # ==========================================================

      - name: Commit public research data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add public_data

          if git diff --cached --quiet; then

            echo
            echo "============================================================"
            echo "NO PUBLIC DATA CHANGES"
            echo "============================================================"

            exit 0
          fi

          echo
          echo "============================================================"
          echo "COMMITTING PUBLIC RESEARCH DATA"
          echo "============================================================"

          git commit \
            -m "chore: publish research data v3"

          git push

          echo
          echo "============================================================"
          echo "RESEARCH DATA PUBLISHED"
          echo "============================================================"

          git log -1 --oneline
