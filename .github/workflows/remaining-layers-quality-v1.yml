name: remaining-layers-quality-v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'remaining_layers_quality_v1.py'
      - 'app.py'
      - 'tests/test_remaining_layers_quality_v1.py'
      - 'public_data/**'
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install pandas pytest
      - run: python remaining_layers_quality_v1.py
      - run: python -m pytest -q tests/test_remaining_layers_quality_v1.py
      - run: python -m py_compile app.py remaining_layers_quality_v1.py
