name: Research Context v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research-context:
    name: Build Unified Research Context v1
    runs-on: ubuntu-latest

    steps:

      # ====================================================
      # Checkout
      # ====================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ====================================================
      # Python
      # ====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ====================================================
      # Dependencies
      # ====================================================
      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install pandas numpy


      # ====================================================
      # Verify Research Context source
      # ====================================================
      - name: Verify Research Context source
        run: |
          set -e

          if [ ! -f "research-context-v1.py" ]; then
            echo "ERROR: research-context-v1.py not found."
            exit 1
          fi

          echo "Research Context source found."


      # ====================================================
      # Find latest Macro Context artifact
      # ====================================================
      - name: Find latest Macro Context artifact
        id: macro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          ARTIFACT_ID=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '
              .artifacts
              | map(
                  select(
                    .name == "macro-context-v1"
                    and .expired == false
                  )
                )
              | sort_by(.created_at)
              | last
              | .id
            ')

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "ERROR: macro-context-v1 artifact not found."
            exit 1
          fi

          echo "Macro artifact ID: $ARTIFACT_ID"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"


      # ====================================================
      # Download Macro Context
      # ====================================================
      - name: Download Macro Context artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p input/macro

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.macro.outputs.artifact_id }}/zip" \
            > /tmp/macro.zip

          unzip -o /tmp/macro.zip -d input/macro

          echo "Macro files:"
          find input/macro -maxdepth 3 -type f -print


      # ====================================================
      # Locate Macro Context CSV
      # ====================================================
      - name: Locate Macro Context CSV
        run: |
          set -e

          MACRO_FILE=$(find input/macro \
            -type f \
            -name "*.csv" \
            | head -n 1)

          if [ -z "$MACRO_FILE" ]; then
            echo "ERROR: No CSV found in Macro Context artifact."
            exit 1
          fi

          echo "Macro CSV: $MACRO_FILE"
          echo "MACRO_FILE=$MACRO_FILE" >> "$GITHUB_ENV"


      # ====================================================
      # Determine Research Context cutoff
      # ====================================================
      - name: Determine Research Context cutoff
        id: cutoff
        run: |
          set -e

          python - <<'PY'
          import os
          import pandas as pd

          macro_file = os.environ["MACRO_FILE"]

          df = pd.read_csv(macro_file)

          if df.empty:
              raise SystemExit(
                  "ERROR: Macro Context dataset is empty."
              )

          date_candidates = [
              "context_date",
              "asof_date",
              "date"
          ]

          date_column = None

          for column in date_candidates:
              if column in df.columns:
                  date_column = column
                  break

          if date_column is None:
              raise SystemExit(
                  "ERROR: Macro Context date column not found. "
                  f"Available columns: {list(df.columns)}"
              )

          dates = pd.to_datetime(
              df[date_column],
              errors="coerce"
          )

          if dates.isna().any():
              raise SystemExit(
                  "ERROR: Macro Context contains invalid dates."
              )

          latest_date = dates.max()

          cutoff = latest_date.strftime("%Y-%m-%d")

          print("=" * 70)
          print("RESEARCH CONTEXT CUTOFF")
          print("=" * 70)
          print("Macro date column:", date_column)
          print("Latest Macro Context date:", cutoff)
          print("=" * 70)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(
                  f"RESEARCH_CONTEXT_AS_OF_DATE={cutoff}\n"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(
                  f"cutoff={cutoff}\n"
              )

          PY


      # ====================================================
      # Find latest Sentiment Engine artifact
      # ====================================================
      - name: Find latest Sentiment Engine artifact
        id: sentiment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          ARTIFACT_ID=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '
              .artifacts
              | map(
                  select(
                    .name == "sentiment-engine-v1"
                    and .expired == false
                  )
                )
              | sort_by(.created_at)
              | last
              | .id
            ')

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "ERROR: sentiment-engine-v1 artifact not found."
            exit 1
          fi

          echo "Sentiment artifact ID: $ARTIFACT_ID"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"


      # ====================================================
      # Download Sentiment Engine
      # ====================================================
      - name: Download Sentiment Engine artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p input/sentiment

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.sentiment.outputs.artifact_id }}/zip" \
            > /tmp/sentiment.zip

          unzip -o /tmp/sentiment.zip -d input/sentiment

          echo "Sentiment files:"
          find input/sentiment -maxdepth 3 -type f -print


      # ====================================================
      # Locate Sentiment CSV
      # ====================================================
      - name: Locate Sentiment Engine CSV
        run: |
          set -e

          SENTIMENT_FILE=$(find input/sentiment \
            -type f \
            -name "sentiment_engine_research_v1.csv" \
            | head -n 1)

          if [ -z "$SENTIMENT_FILE" ]; then
            echo "ERROR: sentiment_engine_research_v1.csv not found."
            exit 1
          fi

          echo "Sentiment CSV: $SENTIMENT_FILE"
          echo "SENTIMENT_FILE=$SENTIMENT_FILE" >> "$GITHUB_ENV"


      # ====================================================
      # Find latest Technical Intelligence artifact
      # ====================================================
      - name: Find latest Technical Intelligence artifact
        id: technical
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          ARTIFACT_ID=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '
              .artifacts
              | map(
                  select(
                    .name == "technical-intelligence-v1"
                    and .expired == false
                  )
                )
              | sort_by(.created_at)
              | last
              | .id
            ')

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "ERROR: technical-intelligence-v1 artifact not found."
            exit 1
          fi

          echo "Technical artifact ID: $ARTIFACT_ID"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"


      # ====================================================
      # Download Technical Intelligence
      # ====================================================
      - name: Download Technical Intelligence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p input/technical

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.technical.outputs.artifact_id }}/zip" \
            > /tmp/technical.zip

          unzip -o /tmp/technical.zip -d input/technical

          echo "Technical files:"
          find input/technical -maxdepth 3 -type f -print


      # ====================================================
      # Locate Technical Intelligence CSV
      # ====================================================
      - name: Locate Technical Intelligence CSV
        run: |
          set -e

          TECHNICAL_FILE=$(find input/technical \
            -type f \
            -name "technical_intelligence_research_v1.csv" \
            | head -n 1)

          if [ -z "$TECHNICAL_FILE" ]; then
            echo "ERROR: technical_intelligence_research_v1.csv not found."
            exit 1
          fi

          echo "Technical CSV: $TECHNICAL_FILE"
          echo "TECHNICAL_FILE=$TECHNICAL_FILE" >> "$GITHUB_ENV"


      # ====================================================
      # Validate source datasets
      #
      # IMPORTANT:
      # Future rows are allowed here.
      #
      # Research Context v1 is responsible for applying
      # the final as-of cutoff and preventing lookahead.
      # ====================================================
      - name: Validate source datasets
        run: |
          set -e

          python - <<'PY'
          import os
          import pandas as pd

          files = {
              "Macro Context": os.environ["MACRO_FILE"],
              "Sentiment Engine": os.environ["SENTIMENT_FILE"],
              "Technical Intelligence": os.environ["TECHNICAL_FILE"],
          }

          print("=" * 70)
          print("SOURCE DATASET VALIDATION")
          print("=" * 70)

          for name, path in files.items():

              df = pd.read_csv(path)

              if df.empty:
                  raise SystemExit(
                      f"ERROR: {name} dataset is empty."
                  )

              candidates = [
                  "context_date",
                  "asof_date",
                  "observation_date",
                  "date",
                  "event_date",
                  "session_date",
              ]

              date_column = None

              for column in candidates:
                  if column in df.columns:
                      date_column = column
                      break

              if date_column is None:
                  raise SystemExit(
                      f"ERROR: Date column not found for {name}. "
                      f"Columns: {list(df.columns)}"
                  )

              dates = pd.to_datetime(
                  df[date_column],
                  errors="coerce"
              )

              if dates.isna().any():
                  raise SystemExit(
                      f"ERROR: Invalid dates detected in {name}."
                  )

              print(
                  f"{name}: PASS | "
                  f"date column={date_column} | "
                  f"rows={len(df):,} | "
                  f"range={dates.min().date()} -> "
                  f"{dates.max().date()}"
              )

          print()
          print(
              "Source datasets are valid."
          )
          print(
              "Future source rows are permitted and will be "
              "handled by the Research Context cutoff/PIT logic."
          )
          print("=" * 70)

          PY


      # ====================================================
      # Prepare Research Context inputs
      # ====================================================
      - name: Prepare Research Context inputs
        run: |
          set -e

          mkdir -p context_input

          cp "$MACRO_FILE" \
            context_input/macro_context_v1.csv

          cp "$SENTIMENT_FILE" \
            context_input/sentiment_engine_research_v1.csv

          cp "$TECHNICAL_FILE" \
            context_input/technical_intelligence_research_v1.csv

          echo "Prepared files:"
          ls -lh context_input


      # ====================================================
      # Run Research Context
      # ====================================================
      - name: Run Research Context v1
        env:
          MACRO_CONTEXT_FILE: context_input/macro_context_v1.csv
          SENTIMENT_ENGINE_FILE: context_input/sentiment_engine_research_v1.csv
          TECHNICAL_INTELLIGENCE_FILE: context_input/technical_intelligence_research_v1.csv
          RESEARCH_CONTEXT_AS_OF_DATE: ${{ env.RESEARCH_CONTEXT_AS_OF_DATE }}

        run: |
          set -e

          echo "=============================================="
          echo "RESEARCH CONTEXT v1"
          echo "=============================================="
          echo "Research cutoff:"
          echo "$RESEARCH_CONTEXT_AS_OF_DATE"
          echo

          python research-context-v1.py


      # ====================================================
      # Validate output files
      # ====================================================
      - name: Validate Research Context outputs
        run: |
          set -e

          test -f research_context_v1.csv
          test -f research_context_summary_v1.csv
          test -f research_context_extremes_v1.csv

          echo "All Research Context outputs exist."


      # ====================================================
      # Final dataset validation
      # ====================================================
      - name: Validate Research Context dataset
        env:
          RESEARCH_CONTEXT_AS_OF_DATE: ${{ env.RESEARCH_CONTEXT_AS_OF_DATE }}

        run: |
          set -e

          python - <<'PY'

          import os
          import pandas as pd


          # ==================================================
          # Load
          # ==================================================

          df = pd.read_csv(
              "research_context_v1.csv"
          )


          if df.empty:
              raise SystemExit(
                  "ERROR: Research Context dataset is empty."
              )


          # ==================================================
          # Required columns
          # ==================================================

          required = [
              "context_date",
              "available_layer_count",
              "macro_available",
              "sentiment_available",
              "technical_available",
              "point_in_time_safe",
              "research_only",
              "decision_engine_ready",
              "trading_signal_generated",
              "forecast_generated",
              "unified_decision_generated",
          ]


          missing = [
              c
              for c in required
              if c not in df.columns
          ]


          if missing:
              raise SystemExit(
                  f"ERROR: Missing columns: {missing}"
              )


          # ==================================================
          # Dates
          # ==================================================

          dates = pd.to_datetime(
              df["context_date"],
              errors="coerce",
          )


          if dates.isna().any():
              raise SystemExit(
                  "ERROR: Invalid context_date values."
              )


          if not dates.is_monotonic_increasing:
              raise SystemExit(
                  "ERROR: Context dates are not sorted."
              )


          if dates.duplicated().any():
              raise SystemExit(
                  "ERROR: Duplicate context dates."
              )


          # ==================================================
          # Dynamic cutoff
          # ==================================================

          cutoff = pd.Timestamp(
              os.environ["RESEARCH_CONTEXT_AS_OF_DATE"]
          )


          if dates.max() > cutoff:

              raise SystemExit(
                  "ERROR: Future context date detected: "
                  f"{dates.max().date()} > "
                  f"{cutoff.date()}"
              )


          if dates.max() != cutoff:

              raise SystemExit(
                  "ERROR: Latest context date is "
                  f"{dates.max().date()}, expected "
                  f"{cutoff.date()}."
              )


          # ==================================================
          # PIT
          # ==================================================

          if not df[
              "point_in_time_safe"
          ].eq(True).all():

              raise SystemExit(
                  "ERROR: PIT validation failed."
              )


          # ==================================================
          # Research-only
          # ==================================================

          if not df[
              "research_only"
          ].eq(True).all():

              raise SystemExit(
                  "ERROR: research_only must be TRUE."
              )


          # ==================================================
          # Decision Engine
          # ==================================================

          if not df[
              "decision_engine_ready"
          ].eq(False).all():

              raise SystemExit(
                  "ERROR: Decision Engine must remain disabled."
              )


          # ==================================================
          # No trading signal
          # ==================================================

          if not df[
              "trading_signal_generated"
          ].eq(False).all():

              raise SystemExit(
                  "ERROR: Trading signal detected."
              )


          # ==================================================
          # No forecast
          # ==================================================

          if not df[
              "forecast_generated"
          ].eq(False).all():

              raise SystemExit(
                  "ERROR: Forecast detected."
              )


          # ==================================================
          # No unified decision
          # ==================================================

          if not df[
              "unified_decision_generated"
          ].eq(False).all():

              raise SystemExit(
                  "ERROR: Unified decision detected."
              )


          # ==================================================
          # Layer count
          # ==================================================

          if (
              (df["available_layer_count"] < 0)
              |
              (df["available_layer_count"] > 3)
          ).any():

              raise SystemExit(
                  "ERROR: Invalid available_layer_count."
              )


          # ==================================================
          # Layer availability flags
          # ==================================================

          for column in [
              "macro_available",
              "sentiment_available",
              "technical_available",
          ]:

              invalid = ~df[column].isin([True, False])

              if invalid.any():

                  raise SystemExit(
                      f"ERROR: Invalid boolean values in {column}."
                  )


          # ==================================================
          # Validate PIT synchronization columns
          # ==================================================

          if "macro_availability_date" in df.columns:

              macro_availability = pd.to_datetime(
                  df["macro_availability_date"],
                  errors="coerce"
              )

              invalid = (
                  macro_availability.notna()
                  & (
                      macro_availability
                      > dates
                  )
              )

              if invalid.any():
                  raise SystemExit(
                      "ERROR: Macro availability "
                      "lookahead detected."
                  )


          if "sentiment_asof_date" in df.columns:

              sentiment_asof = pd.to_datetime(
                  df["sentiment_asof_date"],
                  errors="coerce"
              )

              invalid = (
                  sentiment_asof.notna()
                  & (
                      sentiment_asof
                      > dates
                  )
              )

              if invalid.any():
                  raise SystemExit(
                      "ERROR: Sentiment as-of "
                      "lookahead detected."
                  )


          if "technical_availability_date" in df.columns:

              technical_availability = pd.to_datetime(
                  df["technical_availability_date"],
                  errors="coerce"
              )

              invalid = (
                  technical_availability.notna()
                  & (
                      technical_availability
                      > dates
                  )
              )

              if invalid.any():
                  raise SystemExit(
                      "ERROR: Technical availability "
                      "lookahead detected."
                  )


          if {
              "technical_observation_date",
              "technical_availability_date",
          }.issubset(df.columns):

              technical_observation = pd.to_datetime(
                  df["technical_observation_date"],
                  errors="coerce"
              )

              technical_availability = pd.to_datetime(
                  df["technical_availability_date"],
                  errors="coerce"
              )

              invalid = (
                  technical_observation.notna()
                  & technical_availability.notna()
                  & (
                      technical_availability
                      < technical_observation
                  )
              )

              if invalid.any():
                  raise SystemExit(
                      "ERROR: Technical availability date "
                      "is earlier than observation date."
                  )


          # ==================================================
          # Latest row
          # ==================================================

          latest = df.iloc[-1]


          # ==================================================
          # Output
          # ==================================================

          print()
          print("=" * 70)
          print("RESEARCH CONTEXT VALIDATION PASSED")
          print("=" * 70)

          print(
              "Rows:",
              len(df)
          )

          print(
              "Columns:",
              len(df.columns)
          )

          print(
              "Date range:",
              dates.min().date(),
              "->",
              dates.max().date()
          )

          print(
              "Dynamic cutoff:",
              cutoff.date()
          )

          print(
              "Latest date:",
              latest["context_date"]
          )

          print(
              "Available layers:",
              latest["available_layer_count"],
              "/ 3"
          )

          for column in [
              "economic_regime",
              "sentiment_regime",
              "technical_regime",
              "financial_stress_regime",
              "trend_structure",
          ]:

              if column in df.columns:

                  print(
                      f"{column}:",
                      latest[column]
                  )


          print()
          print("PIT safe: TRUE")
          print("Research only: TRUE")
          print("Decision Engine: FALSE")
          print("Trading signal: FALSE")
          print("Forecast: FALSE")
          print("Unified decision: FALSE")
          print("Future context rows: 0")
          print("=" * 70)

          PY


      # ====================================================
      # Upload artifact
      # ====================================================
      - name: Upload Research Context artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-context-v1
          path: |
            research_context_v1.csv
            research_context_summary_v1.csv
            research_context_extremes_v1.csv
          if-no-files-found: error
          retention-days: 30


      # ====================================================
      # Final status
      # ====================================================
      - name: Final status
        env:
          RESEARCH_CONTEXT_AS_OF_DATE: ${{ env.RESEARCH_CONTEXT_AS_OF_DATE }}

        run: |
          echo "=============================================="
          echo "Research Context v1 PASSED"
          echo "=============================================="
          echo "Macro Context: INCLUDED"
          echo "Sentiment Engine: INCLUDED"
          echo "Technical Intelligence: INCLUDED"
          echo "Research-only: TRUE"
          echo "Decision Engine: DISABLED"
          echo "Trading Signal: FALSE"
          echo "Forecast: FALSE"
          echo "Unified Decision: FALSE"
          echo "Dynamic Cutoff: $RESEARCH_CONTEXT_AS_OF_DATE"
          echo "Artifact: research-context-v1"
          echo "=============================================="
