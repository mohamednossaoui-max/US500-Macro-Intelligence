name: Research Integration Full Validation v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  research-integration-validation:
    name: Validate Unified Research Integration v1
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy


      # ============================================================
      # 4. Find latest Research Context artifact
      #
      # This workflow validates the already-built Research Context.
      # It does NOT rebuild Research Context.
      # ============================================================
      - name: Find latest Research Context artifact
        id: research_context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          ARTIFACT_ID=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '
              [
                .artifacts[]
                | select(
                    .name == "research-context-v1"
                    and .expired == false
                  )
              ]
              | sort_by(.created_at)
              | last
              | .id
            ')

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo ""
            echo "ERROR: No valid research-context-v1 artifact found."
            echo ""
            echo "Run Research Context v1 first."
            exit 1
          fi

          echo ""
          echo "Selected Research Context artifact ID:"
          echo "$ARTIFACT_ID"

          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 5. Download Research Context artifact
      # ============================================================
      - name: Download Research Context artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p input/research_context

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.research_context.outputs.artifact_id }}/zip" \
            > /tmp/research_context.zip

          unzip -o \
            /tmp/research_context.zip \
            -d input/research_context

          echo ""
          echo "Downloaded Research Context artifact:"
          echo ""

          find input/research_context \
            -maxdepth 5 \
            -type f \
            -print


      # ============================================================
      # 6. Locate Research Context datasets
      # ============================================================
      - name: Locate Research Context datasets
        run: |
          set -e

          CONTEXT_FILE=$(find input/research_context \
            -type f \
            -name "research_context_v1.csv" \
            | head -n 1)

          SUMMARY_FILE=$(find input/research_context \
            -type f \
            -name "research_context_summary_v1.csv" \
            | head -n 1)

          EXTREMES_FILE=$(find input/research_context \
            -type f \
            -name "research_context_extremes_v1.csv" \
            | head -n 1)

          if [ -z "$CONTEXT_FILE" ]; then
            echo ""
            echo "ERROR: research_context_v1.csv not found."
            exit 1
          fi

          if [ -z "$SUMMARY_FILE" ]; then
            echo ""
            echo "ERROR: research_context_summary_v1.csv not found."
            exit 1
          fi

          if [ -z "$EXTREMES_FILE" ]; then
            echo ""
            echo "ERROR: research_context_extremes_v1.csv not found."
            exit 1
          fi

          echo ""
          echo "Context file:"
          echo "$CONTEXT_FILE"

          echo ""
          echo "Summary file:"
          echo "$SUMMARY_FILE"

          echo ""
          echo "Extremes file:"
          echo "$EXTREMES_FILE"

          echo "CONTEXT_FILE=$CONTEXT_FILE" >> "$GITHUB_ENV"
          echo "SUMMARY_FILE=$SUMMARY_FILE" >> "$GITHUB_ENV"
          echo "EXTREMES_FILE=$EXTREMES_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 7. Full Research Integration validation
      # ============================================================
      - name: Run Research Integration validation
        env:
          CONTEXT_FILE: ${{ env.CONTEXT_FILE }}
          SUMMARY_FILE: ${{ env.SUMMARY_FILE }}
          EXTREMES_FILE: ${{ env.EXTREMES_FILE }}
        run: |
          set -e

          python - <<'PY'
          import os
          import pandas as pd


          CONTEXT_FILE = os.environ["CONTEXT_FILE"]
          SUMMARY_FILE = os.environ["SUMMARY_FILE"]
          EXTREMES_FILE = os.environ["EXTREMES_FILE"]


          # ============================================================
          # Load datasets
          # ============================================================

          df = pd.read_csv(
              CONTEXT_FILE,
              low_memory=False,
          )

          summary = pd.read_csv(
              SUMMARY_FILE,
              low_memory=False,
          )

          extremes = pd.read_csv(
              EXTREMES_FILE,
              low_memory=False,
          )


          print("=" * 72)
          print("RESEARCH INTEGRATION FULL VALIDATION v1")
          print("=" * 72)


          # ============================================================
          # A. Basic dataset integrity
          # ============================================================

          if df.empty:
              raise SystemExit(
                  "ERROR: Unified Research Context dataset is empty."
              )

          if summary.empty:
              raise SystemExit(
                  "ERROR: Research Context summary is empty."
              )

          print("")
          print("Unified Research Context dataset: PASS")
          print("Summary dataset: PASS")

          print(
              "Extremes dataset: PASS | rows=",
              len(extremes),
          )


          # ============================================================
          # B. Canonical integration schema
          # ============================================================

          required_columns = {
              "context_date",

              "available_layer_count",

              "macro_available",
              "sentiment_available",
              "technical_available",

              "macro_availability_date",
              "sentiment_asof_date",

              "technical_observation_date",
              "technical_availability_date",

              "point_in_time_safe",
              "research_only",

              "decision_engine_ready",
              "trading_signal_generated",
              "forecast_generated",
              "unified_decision_generated",
          }


          missing_columns = sorted(
              required_columns - set(df.columns)
          )


          if missing_columns:
              raise SystemExit(
                  "ERROR: Missing canonical integration columns: "
                  + ", ".join(missing_columns)
              )


          print("Canonical integration schema: PASS")


          # ============================================================
          # C. Verify three integrated layers
          # ============================================================

          prefix_groups = {
              "Macro": "macro_",
              "Sentiment": "sentiment_",
              "Technical": "technical_",
          }


          for layer_name, prefix in prefix_groups.items():

              matching_columns = [
                  column
                  for column in df.columns
                  if column.startswith(prefix)
              ]


              if not matching_columns:
                  raise SystemExit(
                      f"ERROR: No {layer_name} fields found "
                      "inside unified Research Context."
                  )


              print(
                  f"{layer_name} integration fields: PASS | "
                  f"count={len(matching_columns)}"
              )


          print("Three-layer research integration: PASS")


          # ============================================================
          # D. Date integrity
          # ============================================================

          context_dates = pd.to_datetime(
              df["context_date"],
              errors="coerce",
          ).dt.normalize()


          if context_dates.isna().any():
              raise SystemExit(
                  "ERROR: context_date contains invalid dates."
              )


          if not context_dates.is_monotonic_increasing:
              raise SystemExit(
                  "ERROR: context_date is not monotonically increasing."
              )


          if context_dates.duplicated().any():
              raise SystemExit(
                  "ERROR: Duplicate context dates detected."
              )


          cutoff = context_dates.max()


          future_rows = int(
              (context_dates > cutoff).sum()
          )


          print("Context date ordering: PASS")
          print("Context date uniqueness: PASS")
          print("Detected research cutoff:", cutoff.date())
          print("Future context rows:", future_rows)


          if future_rows != 0:
              raise SystemExit(
                  "ERROR: Future context rows detected."
              )


          # ============================================================
          # E. Layer availability/count consistency
          # ============================================================

          layer_flags = [
              "macro_available",
              "sentiment_available",
              "technical_available",
          ]


          expected_layer_count = (
              df[layer_flags]
              .astype(bool)
              .sum(axis=1)
              .astype(int)
          )


          actual_layer_count = (
              pd.to_numeric(
                  df["available_layer_count"],
                  errors="coerce",
              )
          )


          if actual_layer_count.isna().any():
              raise SystemExit(
                  "ERROR: available_layer_count contains "
                  "invalid values."
              )


          if not (
              actual_layer_count.astype(int)
              == expected_layer_count
          ).all():
              raise SystemExit(
                  "ERROR: available_layer_count is inconsistent "
                  "with layer availability flags."
              )


          if (
              (actual_layer_count < 0)
              | (actual_layer_count > 3)
          ).any():
              raise SystemExit(
                  "ERROR: available_layer_count outside valid range 0-3."
              )


          print("Layer availability/count consistency: PASS")


          # ============================================================
          # F. Parse PIT dates
          # ============================================================

          macro_availability = pd.to_datetime(
              df["macro_availability_date"],
              errors="coerce",
          ).dt.normalize()


          sentiment_asof = pd.to_datetime(
              df["sentiment_asof_date"],
              errors="coerce",
          ).dt.normalize()


          technical_observation = pd.to_datetime(
              df["technical_observation_date"],
              errors="coerce",
          ).dt.normalize()


          technical_availability = pd.to_datetime(
              df["technical_availability_date"],
              errors="coerce",
          ).dt.normalize()


          # ============================================================
          # G. Macro PIT
          # ============================================================

          macro_lookahead = (
              macro_availability.notna()
              & (
                  macro_availability
                  > context_dates
              )
          )


          if macro_lookahead.any():

              bad_count = int(
                  macro_lookahead.sum()
              )

              raise SystemExit(
                  "ERROR: Macro PIT lookahead detected. "
                  f"Rows: {bad_count}"
              )


          print("Macro PIT synchronization: PASS")


          # ============================================================
          # H. Sentiment PIT
          #
          # Current Research Context architecture synchronizes
          # Sentiment using sentiment_asof_date.
          # ============================================================

          sentiment_lookahead = (
              sentiment_asof.notna()
              & (
                  sentiment_asof
                  > context_dates
              )
          )


          if sentiment_lookahead.any():

              bad_count = int(
                  sentiment_lookahead.sum()
              )

              raise SystemExit(
                  "ERROR: Sentiment PIT lookahead detected. "
                  f"Rows: {bad_count}"
              )


          print("Sentiment PIT synchronization: PASS")


          # ============================================================
          # I. Technical PIT
          #
          # CRITICAL:
          #
          # Technical availability, NOT observation date,
          # controls when the technical information becomes
          # visible to the unified research context.
          # ============================================================

          technical_lookahead = (
              technical_availability.notna()
              & (
                  technical_availability
                  > context_dates
              )
          )


          if technical_lookahead.any():

              bad_count = int(
                  technical_lookahead.sum()
              )

              raise SystemExit(
                  "ERROR: Technical availability lookahead detected. "
                  f"Rows: {bad_count}"
              )


          print("Technical PIT synchronization: PASS")


          # ============================================================
          # J. Technical internal PIT
          # ============================================================

          technical_internal_failure = (
              technical_observation.notna()
              & technical_availability.notna()
              & (
                  technical_availability
                  < technical_observation
              )
          )


          if technical_internal_failure.any():

              bad_count = int(
                  technical_internal_failure.sum()
              )

              raise SystemExit(
                  "ERROR: Technical availability date is earlier "
                  "than observation date. "
                  f"Rows: {bad_count}"
              )


          print(
              "Technical availability >= observation: PASS"
          )


          # ============================================================
          # K. Layer availability flags
          # ============================================================

          expected_macro_available = (
              macro_availability.notna()
              & (
                  macro_availability
                  <= context_dates
              )
          )


          expected_sentiment_available = (
              sentiment_asof.notna()
              & (
                  sentiment_asof
                  <= context_dates
              )
          )


          expected_technical_available = (
              technical_availability.notna()
              & (
                  technical_availability
                  <= context_dates
              )
          )


          availability_checks = [
              (
                  "macro_available",
                  expected_macro_available,
              ),
              (
                  "sentiment_available",
                  expected_sentiment_available,
              ),
              (
                  "technical_available",
                  expected_technical_available,
              ),
          ]


          for column, expected in availability_checks:

              actual = (
                  df[column]
                  .astype(bool)
              )

              expected_bool = (
                  expected
                  .astype(bool)
              )


              if not actual.equals(
                  expected_bool
              ):

                  mismatch_count = int(
                      (
                          actual
                          != expected_bool
                      ).sum()
                  )

                  raise SystemExit(
                      f"ERROR: {column} availability mismatch. "
                      f"Rows affected: {mismatch_count}"
                  )


          print(
              "Layer availability/PIT consistency: PASS"
          )


          # ============================================================
          # L. Boolean integrity
          # ============================================================

          boolean_columns = [
              "macro_available",
              "sentiment_available",
              "technical_available",

              "point_in_time_safe",
              "research_only",

              "decision_engine_ready",
              "trading_signal_generated",
              "forecast_generated",
              "unified_decision_generated",
          ]


          for column in boolean_columns:

              values = set(
                  df[column]
                  .dropna()
                  .tolist()
              )


              if not values.issubset(
                  {True, False}
              ):

                  raise SystemExit(
                      f"ERROR: {column} contains "
                      f"non-boolean values: {values}"
                  )


          print("Boolean field validation: PASS")


          # ============================================================
          # M. Research-only invariants
          # ============================================================

          if not df["point_in_time_safe"].all():

              raise SystemExit(
                  "ERROR: point_in_time_safe contains FALSE."
              )


          if not df["research_only"].all():

              raise SystemExit(
                  "ERROR: research_only contains FALSE."
              )


          if df["decision_engine_ready"].any():

              raise SystemExit(
                  "ERROR: Decision Engine is enabled."
              )


          if df["trading_signal_generated"].any():

              raise SystemExit(
                  "ERROR: Trading signal detected."
              )


          if df["forecast_generated"].any():

              raise SystemExit(
                  "ERROR: Forecast detected."
              )


          if df["unified_decision_generated"].any():

              raise SystemExit(
                  "ERROR: Unified decision detected."
              )


          print("Research-only invariants: PASS")


          # ============================================================
          # N. Latest unified context
          # ============================================================

          latest = df.iloc[-1]


          latest_layer_count = int(
              latest["available_layer_count"]
          )


          if latest_layer_count != 3:

              raise SystemExit(
                  "ERROR: Latest Research Context does not contain "
                  "all three integrated layers."
              )


          for column in layer_flags:

              if bool(
                  latest[column]
              ) is not True:

                  raise SystemExit(
                      "ERROR: Latest context layer unavailable: "
                      + column
                  )


          print(
              "Latest unified context: 3 / 3 layers available: PASS"
          )


          # ============================================================
          # O. Summary validation
          # ============================================================

          summary_required = {
              "context_date",
              "available_layer_count",

              "macro_available",
              "sentiment_available",
              "technical_available",

              "point_in_time_safe",
              "research_only",

              "decision_engine_ready",
              "trading_signal_generated",
              "forecast_generated",
              "unified_decision_generated",
          }


          summary_missing = sorted(
              summary_required
              - set(summary.columns)
          )


          if summary_missing:

              raise SystemExit(
                  "ERROR: Summary missing columns: "
                  + ", ".join(summary_missing)
              )


          if len(summary) != 1:

              raise SystemExit(
                  "ERROR: Summary must contain exactly one row."
              )


          summary_date = pd.to_datetime(
              summary.iloc[0]["context_date"],
              errors="coerce",
          )


          if pd.isna(summary_date):

              raise SystemExit(
                  "ERROR: Invalid summary context_date."
              )


          if summary_date.normalize() != cutoff:

              raise SystemExit(
                  "ERROR: Summary date does not match "
                  "latest context date."
              )


          for column in [
              "available_layer_count",

              "macro_available",
              "sentiment_available",
              "technical_available",

              "point_in_time_safe",
              "research_only",

              "decision_engine_ready",
              "trading_signal_generated",
              "forecast_generated",
              "unified_decision_generated",
          ]:

              actual = latest[column]
              reported = summary.iloc[0][column]


              if str(actual) != str(reported):

                  raise SystemExit(
                      f"ERROR: Summary mismatch for {column}: "
                      f"context={actual}, summary={reported}"
                  )


          print(
              "Summary/latest-context consistency: PASS"
          )


          # ============================================================
          # P. Extremes validation
          # ============================================================

          if "context_date" not in extremes.columns:

              raise SystemExit(
                  "ERROR: Extremes dataset missing context_date."
              )


          if not extremes.empty:

              extreme_dates = pd.to_datetime(
                  extremes["context_date"],
                  errors="coerce",
              ).dt.normalize()


              if extreme_dates.isna().any():

                  raise SystemExit(
                      "ERROR: Invalid extremes context_date values."
                  )


              future_extreme_rows = int(
                  (
                      extreme_dates
                      > cutoff
                  ).sum()
              )


              if future_extreme_rows > 0:

                  raise SystemExit(
                      "ERROR: Extremes dataset contains "
                      "future dates. "
                      f"Rows: {future_extreme_rows}"
                  )


              context_date_set = set(
                  context_dates.dt.strftime(
                      "%Y-%m-%d"
                  )
              )


              extreme_date_set = set(
                  extreme_dates.dt.strftime(
                      "%Y-%m-%d"
                  )
              )


              orphan_dates = (
                  extreme_date_set
                  - context_date_set
              )


              if orphan_dates:

                  raise SystemExit(
                      "ERROR: Extremes contains dates absent "
                      "from unified context: "
                      + str(
                          sorted(
                              orphan_dates
                          )[:10]
                      )
                  )


          print(
              "Extremes/context integrity: PASS"
          )


          # ============================================================
          # Q. Final diagnostics
          # ============================================================

          print("")
          print("=" * 72)
          print("LATEST UNIFIED RESEARCH CONTEXT")
          print("=" * 72)

          print(
              "Latest context date:",
              cutoff.date(),
          )

          print(
              "Available layers:",
              latest_layer_count,
              "/ 3",
          )

          print(
              "Macro available:",
              bool(
                  latest["macro_available"]
              ),
          )

          print(
              "Sentiment available:",
              bool(
                  latest["sentiment_available"]
              ),
          )

          print(
              "Technical available:",
              bool(
                  latest["technical_available"]
              ),
          )


          # ============================================================
          # R. Final PASS
          # ============================================================

          print("")
          print("=" * 72)
          print(
              "RESEARCH INTEGRATION FULL VALIDATION PASSED"
          )
          print("=" * 72)

          print(
              "Rows:",
              f"{len(df):,}",
          )

          print(
              "Columns:",
              f"{len(df.columns):,}",
          )

          print(
              "Date range:",
              context_dates.min().date(),
              "->",
              context_dates.max().date(),
          )

          print(
              "Extreme research rows:",
              f"{len(extremes):,}",
          )

          print("")
          print(
              "Integrated layers: "
              "Macro + Sentiment + Technical"
          )

          print("PIT safe: TRUE")
          print("Anti-lookahead: PASSED")
          print("Research only: TRUE")
          print("Decision Engine: FALSE")
          print("Trading signal: FALSE")
          print("Forecast: FALSE")
          print("Unified decision: FALSE")
          print("Future context rows: 0")

          print("")
          print(
              "ALL RESEARCH INTEGRATION VALIDATIONS PASSED"
          )
          print("=" * 72)

          PY


      # ============================================================
      # 8. Create Research Integration validation report
      # ============================================================
      - name: Create integration validation report
        env:
          CONTEXT_FILE: ${{ env.CONTEXT_FILE }}
          EXTREMES_FILE: ${{ env.EXTREMES_FILE }}
        run: |
          set -e

          python - <<'PY'
          import os
          from pathlib import Path

          import pandas as pd


          context_file = os.environ["CONTEXT_FILE"]
          extremes_file = os.environ["EXTREMES_FILE"]


          df = pd.read_csv(
              context_file,
              low_memory=False,
          )


          extremes = pd.read_csv(
              extremes_file,
              low_memory=False,
          )


          dates = pd.to_datetime(
              df["context_date"],
              errors="coerce",
          ).dt.normalize()


          latest = df.iloc[-1]


          report = [
              "Research Integration Full Validation v1",
              "",
              "STATUS: PASSED",
              "",

              f"Rows: {len(df):,}",
              f"Columns: {len(df.columns):,}",

              (
                  "Date range: "
                  f"{dates.min().date()} -> "
                  f"{dates.max().date()}"
              ),

              (
                  "Research cutoff: "
                  f"{dates.max().date()}"
              ),

              (
                  "Available layers: "
                  f"{int(latest['available_layer_count'])} / 3"
              ),

              (
                  "Macro available: "
                  f"{latest['macro_available']}"
              ),

              (
                  "Sentiment available: "
                  f"{latest['sentiment_available']}"
              ),

              (
                  "Technical available: "
                  f"{latest['technical_available']}"
              ),

              (
                  "Extreme research rows: "
                  f"{len(extremes):,}"
              ),

              "",

              "Integrated layers: Macro + Sentiment + Technical",

              "PIT safe: TRUE",
              "Anti-lookahead: PASSED",

              "Research only: TRUE",
              "Decision Engine: FALSE",

              "Trading signal: FALSE",
              "Forecast: FALSE",
              "Unified decision: FALSE",

              "Future context rows: 0",

              "",

              "Validation scope:",

              "- Unified integration schema",
              "- Macro integration",
              "- Sentiment integration",
              "- Technical integration",

              "- Layer availability consistency",

              "- Macro PIT synchronization",
              "- Sentiment PIT synchronization",
              "- Technical PIT synchronization",

              "- Technical availability >= observation",

              "- Research-only invariants",

              "- Latest 3/3 layer availability",

              "- Summary/latest-context consistency",

              "- Extremes/context integrity",
          ]


          output = Path(
              "research_integration_full_validation_v1.txt"
          )


          output.write_text(
              "\n".join(report),
              encoding="utf-8",
          )


          print(
              "Research Integration validation report created:"
          )

          print(output)


          PY


      # ============================================================
      # 9. Upload Research Integration validation artifact
      # ============================================================
      - name: Upload Research Integration validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-integration-full-validation-v1
          path: |
            research_integration_full_validation_v1.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 10. Final status
      # ============================================================
      - name: Final status
        run: |
          echo "============================================================"
          echo "RESEARCH INTEGRATION FULL VALIDATION v1 PASSED"
          echo "============================================================"
          echo "Unified Research Context: VALID"
          echo "Integrated Layers: Macro + Sentiment + Technical"
          echo "PIT: PASSED"
          echo "Anti-lookahead: PASSED"
          echo "Research-only: TRUE"
          echo "Decision Engine: DISABLED"
          echo "Trading Signal: FALSE"
          echo "Forecast: FALSE"
          echo "Unified Decision: FALSE"
          echo "Future Context Rows: 0"
          echo ""
          echo "Validation Artifact:"
          echo "research-integration-full-validation-v1"
          echo "============================================================"
