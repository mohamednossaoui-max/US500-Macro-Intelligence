name: Sentiment Engine v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sentiment-engine:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install pandas numpy

      # ============================================================
      # 3. LOCATE SENTIMENT ENGINE SOURCE
      # ============================================================

      - name: Locate Sentiment Engine source
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "LOCATING SENTIMENT ENGINE V1 SOURCE"
          echo "============================================================"

          echo
          echo "Repository Python files:"
          find . \
            -type f \
            -name "*.py" \
            -not -path "./.git/*" \
            | sort

          echo
          echo "Searching for sentiment-engine-v1.py..."

          SOURCE=""

          while IFS= read -r candidate; do
            if [[ "$(basename "$candidate")" == "sentiment-engine-v1.py" ]]; then
              SOURCE="$candidate"
              break
            fi
          done < <(
            find . \
              -type f \
              -name "*.py" \
              -not -path "./.git/*" \
              | sort
          )

          if [[ -z "$SOURCE" ]]; then
            echo
            echo "ERROR: sentiment-engine-v1.py was not found."
            echo
            echo "Possible sentiment files:"
            find . \
              -type f \
              \( \
                -iname "*sentiment*.py" \
                -o \
                -iname "*sentiment*engine*.py" \
              \) \
              -not -path "./.git/*" \
              | sort || true

            exit 1
          fi

          echo
          echo "Found:"
          echo "$SOURCE"

          cp "$SOURCE" sentiment_engine_runner.py

          echo
          echo "Runner:"
          ls -lh sentiment_engine_runner.py

      # ============================================================
      # 4. DISCOVER AVAILABLE GITHUB ARTIFACTS
      # ============================================================

      - name: Discover GitHub Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DISCOVERING ARTIFACTS"
          echo "============================================================"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/actions/artifacts?per_page=100" \
            > artifacts.json

          python - <<'PY'
          import json

          with open("artifacts.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          artifacts = data.get("artifacts", [])

          print(f"Artifacts discovered: {len(artifacts)}")
          print()

          for artifact in sorted(
              artifacts,
              key=lambda x: x.get("created_at", ""),
              reverse=True,
          ):
              print(
                  f"{artifact.get('name')} | "
                  f"id={artifact.get('id')} | "
                  f"created={artifact.get('created_at')} | "
                  f"expired={artifact.get('expired')}"
              )
          PY

      # ============================================================
      # 5. SELECT LATEST COT / AAII / VIX ARTIFACTS
      # ============================================================

      - name: Select source artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "SELECTING SOURCE ARTIFACTS"
          echo "============================================================"

          python - <<'PY'
          import json
          import re
          import sys

          with open("artifacts.json", "r", encoding="utf-8") as f:
              artifacts = json.load(f).get("artifacts", [])

          artifacts = [
              a for a in artifacts
              if not a.get("expired", False)
          ]

          artifacts.sort(
              key=lambda x: x.get("created_at", ""),
              reverse=True,
          )

          def select(patterns, label):
              for artifact in artifacts:
                  name = artifact.get("name", "")

                  normalized = re.sub(
                      r"[^a-z0-9]+",
                      "-",
                      name.lower(),
                  )

                  if all(
                      re.search(pattern, normalized)
                      for pattern in patterns
                  ):
                      return artifact

              return None

          cot = select(
              [r"cot", r"position"],
              "COT",
          )

          aaii = select(
              [r"aaii", r"sentiment"],
              "AAII",
          )

          vix = select(
              [r"vix", r"sentiment"],
              "VIX",
          )

          missing = []

          if cot is None:
              missing.append("COT Positioning")

          if aaii is None:
              missing.append("AAII Sentiment")

          if vix is None:
              missing.append("VIX Sentiment")

          if missing:
              print()
              print("ERROR: Required source artifacts were not found:")
              for item in missing:
                  print(f"  - {item}")

              print()
              print("Available non-expired artifacts:")

              for artifact in artifacts:
                  print(
                      f"  - {artifact.get('name')} "
                      f"(id={artifact.get('id')})"
                  )

              sys.exit(1)

          selections = {
              "cot": cot,
              "aaii": aaii,
              "vix": vix,
          }

          with open(
              "selected_artifacts.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  selections,
                  f,
                  indent=2,
              )

          print()
          print("Selected artifacts:")
          print(
              f"COT  : {cot.get('name')} "
              f"(id={cot.get('id')})"
          )
          print(
              f"AAII : {aaii.get('name')} "
              f"(id={aaii.get('id')})"
          )
          print(
              f"VIX  : {vix.get('name')} "
              f"(id={vix.get('id')})"
          )
          PY

      # ============================================================
      # 6. DOWNLOAD COT ARTIFACT
      # ============================================================

      - name: Download COT artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p inputs/cot

          COT_ID="$(
            python - <<'PY'
          import json

          with open("selected_artifacts.json", "r") as f:
              data = json.load(f)

          print(data["cot"]["id"])
          PY
          )"

          echo "Downloading COT artifact ID: $COT_ID"

          gh api \
            -L \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/actions/artifacts/${COT_ID}/zip" \
            > cot_artifact.zip

          unzip -o cot_artifact.zip \
            -d inputs/cot

          echo
          echo "COT files:"
          find inputs/cot -type f -print

      # ============================================================
      # 7. DOWNLOAD AAII ARTIFACT
      # ============================================================

      - name: Download AAII artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p inputs/aaii

          AAII_ID="$(
            python - <<'PY'
          import json

          with open("selected_artifacts.json", "r") as f:
              data = json.load(f)

          print(data["aaii"]["id"])
          PY
          )"

          echo "Downloading AAII artifact ID: $AAII_ID"

          gh api \
            -L \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/actions/artifacts/${AAII_ID}/zip" \
            > aaii_artifact.zip

          unzip -o aaii_artifact.zip \
            -d inputs/aaii

          echo
          echo "AAII files:"
          find inputs/aaii -type f -print

      # ============================================================
      # 8. DOWNLOAD VIX ARTIFACT
      # ============================================================

      - name: Download VIX artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p inputs/vix

          VIX_ID="$(
            python - <<'PY'
          import json

          with open("selected_artifacts.json", "r") as f:
              data = json.load(f)

          print(data["vix"]["id"])
          PY
          )"

          echo "Downloading VIX artifact ID: $VIX_ID"

          gh api \
            -L \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/actions/artifacts/${VIX_ID}/zip" \
            > vix_artifact.zip

          unzip -o vix_artifact.zip \
            -d inputs/vix

          echo
          echo "VIX files:"
          find inputs/vix -type f -print

      # ============================================================
      # 9. INSTALL INPUT FILES WITH EXACT NAMES EXPECTED BY SCRIPT
      # ============================================================

      - name: Prepare exact Sentiment Engine inputs
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "PREPARING SENTIMENT ENGINE INPUTS"
          echo "============================================================"

          find inputs \
            -type f \
            -name "*.csv" \
            -print \
            | sort

          echo
          echo "Searching required files..."

          find_one() {
            local root="$1"
            local filename="$2"

            find "$root" \
              -type f \
              -name "$filename" \
              -print \
              -quit
          }

          COT_FILE="$(
            find_one \
              "inputs/cot" \
              "cot_positioning_research_v1.csv"
          )"

          AAII_FILE="$(
            find_one \
              "inputs/aaii" \
              "aaii_sentiment_research_v1.csv"
          )"

          VIX_FILE="$(
            find_one \
              "inputs/vix" \
              "vix_sentiment_research_v1.csv"
          )"

          if [[ -z "$COT_FILE" ]]; then
            echo
            echo "ERROR: cot_positioning_research_v1.csv not found."

            echo
            echo "COT CSV files:"
            find inputs/cot \
              -type f \
              -name "*.csv" \
              -print \
              | sort

            exit 1
          fi

          if [[ -z "$AAII_FILE" ]]; then
            echo
            echo "ERROR: aaii_sentiment_research_v1.csv not found."

            echo
            echo "AAII CSV files:"
            find inputs/aaii \
              -type f \
              -name "*.csv" \
              -print \
              | sort

            exit 1
          fi

          if [[ -z "$VIX_FILE" ]]; then
            echo
            echo "ERROR: vix_sentiment_research_v1.csv not found."

            echo
            echo "VIX CSV files:"
            find inputs/vix \
              -type f \
              -name "*.csv" \
              -print \
              | sort

            exit 1
          fi

          cp "$COT_FILE" \
            cot_positioning_research_v1.csv

          cp "$AAII_FILE" \
            aaii_sentiment_research_v1.csv

          cp "$VIX_FILE" \
            vix_sentiment_research_v1.csv

          echo
          echo "Prepared inputs:"
          ls -lh \
            cot_positioning_research_v1.csv \
            aaii_sentiment_research_v1.csv \
            vix_sentiment_research_v1.csv

      # ============================================================
      # 10. VALIDATE INPUT SCHEMAS
      # ============================================================

      - name: Validate Sentiment Engine input schemas
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import pandas as pd

          files = {
              "COT": (
                  "cot_positioning_research_v1.csv",
                  [
                      "observation_date",
                      "availability_date",
                      "point_in_time_safe",
                      "research_only",
                      "decision_engine_ready",
                      "asset_manager_net_percentile",
                      "leveraged_money_net_percentile",
                  ],
              ),
              "AAII": (
                  "aaii_sentiment_research_v1.csv",
                  [
                      "observation_date",
                      "availability_date",
                      "point_in_time_safe",
                      "research_only",
                      "decision_engine_ready",
                      "bull_bear_spread_percentile",
                  ],
              ),
              "VIX": (
                  "vix_sentiment_research_v1.csv",
                  [
                      "observation_date",
                      "availability_date",
                      "point_in_time_safe",
                      "research_only",
                      "decision_engine_ready",
                      "VIX_percentile",
                  ],
              ),
          }

          for name, (path, required) in files.items():

              print()
              print(f"Validating {name}: {path}")

              df = pd.read_csv(path)

              if df.empty:
                  raise SystemExit(
                      f"{name}: input is empty."
                  )

              missing = [
                  col
                  for col in required
                  if col not in df.columns
              ]

              if missing:
                  raise SystemExit(
                      f"{name}: missing columns: {missing}"
                  )

              print(
                  f"{name}: {len(df):,} rows"
              )

              print(
                  f"{name}: columns OK"
              )

          print()
          print("INPUT SCHEMA VALIDATION: PASS")
          PY

      # ============================================================
      # 11. NORMALIZE BOOLEAN PIT FLAGS
      # ============================================================

      - name: Normalize input boolean flags
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          files = [
              Path("cot_positioning_research_v1.csv"),
              Path("aaii_sentiment_research_v1.csv"),
              Path("vix_sentiment_research_v1.csv"),
          ]

          def normalize_bool(value):
              if pd.isna(value):
                  return False

              if isinstance(value, bool):
                  return value

              text = str(value).strip().lower()

              if text in {
                  "true",
                  "1",
                  "yes",
                  "y",
                  "t",
              }:
                  return True

              if text in {
                  "false",
                  "0",
                  "no",
                  "n",
                  "f",
              }:
                  return False

              return False

          for path in files:

              df = pd.read_csv(path)

              for column in [
                  "point_in_time_safe",
                  "research_only",
                  "decision_engine_ready",
              ]:
                  if column in df.columns:
                      df[column] = df[column].map(
                          normalize_bool
                      )

              df.to_csv(
                  path,
                  index=False,
              )

              print(
                  f"Normalized: {path}"
              )
          PY

      # ============================================================
      # 12. HARD PIT VALIDATION BEFORE ENGINE
      # ============================================================

      - name: Validate point-in-time safety
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import pandas as pd

          files = [
              "cot_positioning_research_v1.csv",
              "aaii_sentiment_research_v1.csv",
              "vix_sentiment_research_v1.csv",
          ]

          for path in files:

              df = pd.read_csv(path)

              observation = pd.to_datetime(
                  df["observation_date"],
                  errors="coerce",
              )

              availability = pd.to_datetime(
                  df["availability_date"],
                  errors="coerce",
              )

              if observation.isna().any():
                  raise SystemExit(
                      f"{path}: invalid observation_date."
                  )

              if availability.isna().any():
                  raise SystemExit(
                      f"{path}: invalid availability_date."
                  )

              if not (
                  availability > observation
              ).all():
                  raise SystemExit(
                      f"{path}: availability_date "
                      f"must be after observation_date."
                  )

              if not df[
                  "point_in_time_safe"
              ].all():
                  raise SystemExit(
                      f"{path}: point_in_time_safe violation."
                  )

              if not df[
                  "research_only"
              ].all():
                  raise SystemExit(
                      f"{path}: research_only violation."
                  )

              if df[
                  "decision_engine_ready"
              ].any():
                  raise SystemExit(
                      f"{path}: Decision Engine flag detected."
                  )

          print()
          print("PIT VALIDATION: PASS")
          print("RESEARCH-ONLY VALIDATION: PASS")
          print("DECISION ENGINE: DISABLED")
          PY

      # ============================================================
      # 13. RUN SENTIMENT ENGINE
      # ============================================================

      - name: Run Sentiment Engine v1
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RUNNING SENTIMENT ENGINE V1"
          echo "============================================================"

          python sentiment_engine_runner.py

      # ============================================================
      # 14. VERIFY OUTPUT FILES
      # ============================================================

      - name: Verify Sentiment Engine outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFYING OUTPUTS"
          echo "============================================================"

          required_outputs=(
            "sentiment_engine_research_v1.csv"
            "sentiment_engine_research_summary_v1.csv"
            "sentiment_engine_extremes_v1.csv"
          )

          for file in "${required_outputs[@]}"; do

            if [[ ! -f "$file" ]]; then
              echo
              echo "ERROR: Missing output:"
              echo "$file"

              echo
              echo "CSV files currently present:"
              find . \
                -type f \
                -name "*.csv" \
                -not -path "./.git/*" \
                | sort

              exit 1
            fi

            echo
            echo "FOUND: $file"
            ls -lh "$file"

          done

          echo
          echo "OUTPUT FILE VALIDATION: PASS"

      # ============================================================
      # 15. VALIDATE FINAL SENTIMENT OUTPUT
      # ============================================================

      - name: Validate final Sentiment Engine dataset
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import pandas as pd

          path = "sentiment_engine_research_v1.csv"

          df = pd.read_csv(path)

          required = [
              "asof_date",
              "unified_sentiment_score",
              "research_regime",
              "available_component_count",
              "point_in_time_safe",
              "research_only",
              "decision_engine_ready",
              "sentiment_score_generated",
              "trading_signal_generated",
              "forecast_generated",
          ]

          missing = [
              col
              for col in required
              if col not in df.columns
          ]

          if missing:
              raise SystemExit(
                  f"Missing output columns: {missing}"
              )

          if df.empty:
              raise SystemExit(
                  "Sentiment output is empty."
              )

          if not df[
              "point_in_time_safe"
          ].all():
              raise SystemExit(
                  "Output contains non-PIT-safe rows."
              )

          if not df[
              "research_only"
          ].all():
              raise SystemExit(
                  "Output contains non-research rows."
              )

          if df[
              "decision_engine_ready"
          ].any():
              raise SystemExit(
                  "Decision Engine integration detected."
              )

          if df[
              "trading_signal_generated"
          ].any():
              raise SystemExit(
                  "Trading signal detected."
              )

          if df[
              "forecast_generated"
          ].any():
              raise SystemExit(
                  "Forecast detected."
              )

          scores = pd.to_numeric(
              df["unified_sentiment_score"],
              errors="coerce",
          ).dropna()

          if (
              (scores < 0)
              |
              (scores > 100)
          ).any():
              raise SystemExit(
                  "Unified sentiment score outside 0-100."
              )

          allowed = {
              "EXTREME_BULLISH",
              "BULLISH",
              "NEUTRAL",
              "BEARISH",
              "EXTREME_BEARISH",
              "INSUFFICIENT_DATA",
          }

          actual = set(
              df["research_regime"]
              .dropna()
              .unique()
          )

          unexpected = actual - allowed

          if unexpected:
              raise SystemExit(
                  f"Unexpected regimes: {unexpected}"
              )

          print()
          print("============================================================")
          print("SENTIMENT ENGINE FINAL VALIDATION")
          print("============================================================")

          print(
              f"Rows: {len(df):,}"
          )

          print(
              f"Date range: "
              f"{df['asof_date'].min()} "
              f"-> "
              f"{df['asof_date'].max()}"
          )

          latest = df.iloc[-1]

          print()
          print("Latest state:")
          print(
              f"  asof_date: "
              f"{latest['asof_date']}"
          )
          print(
              f"  COT score: "
              f"{latest.get('cot_sentiment_score')}"
          )
          print(
              f"  AAII score: "
              f"{latest.get('aaii_sentiment_score')}"
          )
          print(
              f"  VIX score: "
              f"{latest.get('vix_sentiment_score')}"
          )
          print(
              f"  Components: "
              f"{latest['available_component_count']}"
          )
          print(
              f"  Unified score: "
              f"{latest['unified_sentiment_score']}"
          )
          print(
              f"  Research regime: "
              f"{latest['research_regime']}"
          )

          print()
          print("PIT SAFE: TRUE")
          print("RESEARCH ONLY: TRUE")
          print("DECISION ENGINE: DISABLED")
          print("TRADING SIGNAL: NONE")
          print("FORECAST: NONE")

          print()
          print("FINAL VALIDATION: PASS")
          PY

      # ============================================================
      # 16. DISPLAY SUMMARY
      # ============================================================

      - name: Display Sentiment Engine summary
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "SENTIMENT ENGINE SUMMARY"
          echo "============================================================"

          cat sentiment_engine_research_summary_v1.csv

          echo
          echo "============================================================"
          echo "EXTREME SENTIMENT ROWS"
          echo "============================================================"

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv(
              "sentiment_engine_extremes_v1.csv"
          )

          print(
              f"Extreme rows: {len(df):,}"
          )

          if not df.empty:
              print()
              print(
                  df.tail(20).to_string(
                      index=False
                  )
              )
          PY

      # ============================================================
      # 17. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload Sentiment Engine v1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-engine-v1
          if-no-files-found: error
          retention-days: 30
          path: |
            sentiment_engine_research_v1.csv
            sentiment_engine_research_summary_v1.csv
            sentiment_engine_extremes_v1.csv
