name: Test BLS Employment Ingestion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bls-employment-ingestion:
    name: Fetch BLS Employment Data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependencies
        run: python -m pip install "requests>=2.31,<3"

      - name: Verify requests import
        run: python -c "import requests; print('PASS requests import')"

      - name: Show Python version
        run: python --version

      - name: Verify ingestion script exists
        run: |
          test -f economic_bls_employment_ingestion_v1.py
          echo "PASS: economic_bls_employment_ingestion_v1.py exists"

      - name: Syntax check
        run: |
          python -m py_compile economic_bls_employment_ingestion_v1.py
          echo "PASS: Python syntax check"

      - name: Run BLS Employment ingestion
        run: |
          python economic_bls_employment_ingestion_v1.py

      - name: Verify staging artifacts
        run: |
          test -f staging/economic/bls_employment_latest_v1.json
          test -f staging/economic/bls_employment_latest_v1.csv

          echo "PASS: staging artifacts created"
          echo
          echo "=== staging/economic/bls_employment_latest_v1.json ==="
          cat staging/economic/bls_employment_latest_v1.json
          echo
          echo "=== staging/economic/bls_employment_latest_v1.csv ==="
          cat staging/economic/bls_employment_latest_v1.csv

      - name: Upload staging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bls-employment-staging
          path: staging/economic/
          if-no-files-found: warn
          retention-days: 7
