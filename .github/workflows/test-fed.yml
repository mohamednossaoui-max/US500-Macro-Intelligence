name: Test Fed Intelligence

on:
  workflow_dispatch:

jobs:
  test-fed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Fed Intelligence test
        run: |
          python fed_intelligence.py
