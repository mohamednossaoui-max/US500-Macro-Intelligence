name: Fed Intelligence

run-name: "${{ github.workflow }} [${{ inputs.correlation_id || github.run_id }}]"

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: "Internal dispatch correlation token; blank for manual runs"
        required: false
        default: ""
      source_ref:
        description: "Pinned source commit; blank uses dispatched commit"
        required: false
        default: ""

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints-repair-20261016.txt

permissions:
  contents: read

jobs:
  fed-intelligence:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 pypdf lxml pytest streamlit

      # ------------------------------------------------------
      # PR-05 availability-aware Fed scoring tests
      # ------------------------------------------------------
      - name: Run Fed comparison, date integrity and UI regression tests
        run: |
          python -m pytest -q tests/test_fed_intelligence.py tests/test_fed_communication_dates_v1.py tests/test_fed_beige_evidence_v1.py tests/test_fed_report_comparison_v2.py tests/test_publication_integrity.py tests/test_point_in_time_integrity.py tests/test_ui_v3_safe_overlay.py tests/test_research_context_quality_ui.py tests/test_pr07_multi_module_ui.py tests/test_ath_ui_polish_v1.py tests/test_economic_ui_integration.py tests/test_stage15_final_ui_integration.py tests/test_ui_theme_v1.py

      # ------------------------------------------------------
      # Run existing Fed Intelligence engine
      # and export stable JSON artifact
      # ------------------------------------------------------
      - name: Run Fed Intelligence
        run: |
          python fed_intelligence_export_v1.py

      # ------------------------------------------------------
      # Verify artifact
      # ------------------------------------------------------
      - name: Verify Fed Intelligence output
        run: |
          test -f public_data/fed_intelligence_output_v1.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("public_data/fed_intelligence_output_v1.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          print("JSON loaded successfully.")
          print("available:", data.get("available"))
          print("as_of_date:", data.get("as_of_date"))
          print("latest_fomc:", data.get("latest_fomc"))
          print("fed_chair:", data.get("fed_chair"))
          print("latest_sep_date:", data.get("latest_sep_date"))

          assert isinstance(data, dict)
          assert "available" in data
          assert "as_of_date" in data
          assert "latest_fomc" in data
          PY

      # ------------------------------------------------------
      # Publish refreshed Fed artifact to the repository
      # The Streamlit app reads public_data from the deployed checkout,
      # so uploading an Actions artifact alone does not refresh the UI.
      # ------------------------------------------------------
      - name: Keep publication under the master generation gate
        run: echo "Fed candidate built. Run Master Pipeline with changed_sources=fed to refresh the complete published generation."

      # ------------------------------------------------------
      # Upload artifact
      # ------------------------------------------------------
      - name: Upload Fed Intelligence artifact
        uses: actions/upload-artifact@v4
        with:
          name: fed-intelligence-v1
          path: |
            public_data/fed_intelligence_output_v1.json
            public_data/manifest.json
          if-no-files-found: error
          retention-days: 90
