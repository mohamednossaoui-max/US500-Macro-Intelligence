name: Fed Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fed-intelligence:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 pypdf lxml pytest

      # ------------------------------------------------------
      # PR-05 availability-aware Fed scoring tests
      # ------------------------------------------------------
      - name: Run PR-05 Fed Intelligence tests
        run: |
          python -m pytest -q tests/test_fed_intelligence.py

      # ------------------------------------------------------
      # Run existing Fed Intelligence engine
      # and export stable JSON artifact
      # ------------------------------------------------------
      - name: Run Fed Intelligence
        run: |
          python fed_intelligence_export_v1.py

      # ------------------------------------------------------
      # Verify artifact
      # ------------------------------------------------------
      - name: Verify Fed Intelligence output
        run: |
          test -f public_data/fed_intelligence_output_v1.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("public_data/fed_intelligence_output_v1.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          print("JSON loaded successfully.")
          print("available:", data.get("available"))
          print("as_of_date:", data.get("as_of_date"))
          print("latest_fomc:", data.get("latest_fomc"))
          print("fed_chair:", data.get("fed_chair"))
          print("latest_sep_date:", data.get("latest_sep_date"))

          assert isinstance(data, dict)
          assert "available" in data
          assert "as_of_date" in data
          assert "latest_fomc" in data
          PY

      # ------------------------------------------------------
      # Publish refreshed Fed artifact to the repository
      # The Streamlit app reads public_data from the deployed checkout,
      # so uploading an Actions artifact alone does not refresh the UI.
      # ------------------------------------------------------
      - name: Publish refreshed Fed Intelligence data
        run: |
          if git diff --quiet -- public_data/fed_intelligence_output_v1.json public_data/manifest.json; then
            echo "Fed Intelligence public_data is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public_data/fed_intelligence_output_v1.json public_data/manifest.json
            git commit -m "data: refresh Fed Intelligence artifact"
            git push
          fi

      # ------------------------------------------------------
      # Upload artifact
      # ------------------------------------------------------
      - name: Upload Fed Intelligence artifact
        uses: actions/upload-artifact@v4
        with:
          name: fed-intelligence-v1
          path: |
            public_data/fed_intelligence_output_v1.json
            public_data/manifest.json
          if-no-files-found: error
          retention-days: 90
