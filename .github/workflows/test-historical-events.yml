name: Test Historical Events

on:
  workflow_dispatch:

jobs:
  historical-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Historical Events Test
        run: |
          python historical_events.py
