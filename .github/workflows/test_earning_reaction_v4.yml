name: Test Earnings Market Reaction V4

on:
  workflow_dispatch:

  push:
    paths:
      - "earning_market_reaction_v4.py"
      - "earnings_breadth_v2.py"
      - "requirements.txt"
      - ".github/workflows/test_earning_reaction_v4.yml"

jobs:
  test-earnings-market-reaction-v4:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 3. Verify repository
      # --------------------------------------------------

      - name: Verify V4 files
        run: |
          echo "=========================================="
          echo "WORKSPACE"
          echo "=========================================="
          pwd

          echo ""
          echo "=========================================="
          echo "GIT BRANCH"
          echo "=========================================="
          git branch --show-current || true

          echo ""
          echo "=========================================="
          echo "GIT COMMIT"
          echo "=========================================="
          git log -1 --oneline

          echo ""
          echo "=========================================="
          echo "EARNINGS FILES"
          echo "=========================================="
          find . -maxdepth 2 -type f | sort | grep -E "earning|earnings|requirements"

          echo ""
          echo "=========================================="
          echo "CHECK V4 SCRIPT"
          echo "=========================================="

          if [ -f "earning_market_reaction_v4.py" ]; then
            echo "V4 script FOUND."
            ls -lh earning_market_reaction_v4.py
          else
            echo "ERROR: V4 script NOT FOUND."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "CHECK V2 INPUT DATA"
          echo "=========================================="

          if [ -f "earnings_breadth_events_v2.csv" ]; then
            echo "V2 input CSV FOUND."
            ls -lh earnings_breadth_events_v2.csv
          else
            echo "ERROR: earnings_breadth_events_v2.csv NOT FOUND."
            echo ""
            echo "The V4 script requires this file."
            echo "It must either be committed to the repository"
            echo "or generated before V4 runs."
            exit 1
          fi

      # --------------------------------------------------
      # 4. Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 5. Run V4
      # --------------------------------------------------

      - name: Run Corporate Earnings Intelligence V4
        run: |
          echo "=========================================="
          echo "RUNNING CORPORATE EARNINGS INTELLIGENCE V4"
          echo "=========================================="

          python earning_market_reaction_v4.py

      # --------------------------------------------------
      # 6. Verify outputs
      # --------------------------------------------------

      - name: Check generated files
        run: |
          echo "=========================================="
          echo "CHECKING V4 OUTPUT FILES"
          echo "=========================================="

          test -f earnings_market_reaction_v4.csv
          test -f earnings_event_study_v4.csv
          test -f earnings_abnormal_return_v4.csv
          test -f earnings_market_reaction_summary_v4.csv
          test -f earnings_reaction_by_eps_class_v4.csv
          test -f earnings_reaction_by_sector_v4.csv

          echo ""
          echo "All V4 output files were created successfully."

          echo ""
          echo "Generated files:"
          ls -lh \
            earnings_market_reaction_v4.csv \
            earnings_event_study_v4.csv \
            earnings_abnormal_return_v4.csv \
            earnings_market_reaction_summary_v4.csv \
            earnings_reaction_by_eps_class_v4.csv \
            earnings_reaction_by_sector_v4.csv

      # --------------------------------------------------
      # 7. Upload results
      # --------------------------------------------------

      - name: Upload V4 results
        uses: actions/upload-artifact@v4
        with:
          name: corporate-earnings-intelligence-v4-results
          path: |
            earnings_market_reaction_v4.csv
            earnings_event_study_v4.csv
            earnings_abnormal_return_v4.csv
            earnings_market_reaction_summary_v4.csv
            earnings_reaction_by_eps_class_v4.csv
            earnings_reaction_by_sector_v4.csv
