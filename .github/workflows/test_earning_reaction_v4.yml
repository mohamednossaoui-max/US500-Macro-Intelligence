name: Test Earnings Market Reaction V4

on:
  workflow_dispatch:

  push:
    paths:
      - "earnings_breadth_v2.py"
      - "earnings_market_reaction_v4.py"
      - "requirements.txt"
      - ".github/workflows/test_earning_reaction_v4.yml"

jobs:

  earnings-v4:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 3. SHOW FILES
      # ======================================================

      - name: Show repository files
        run: |
          echo "=========================================="
          echo "WORKSPACE"
          echo "=========================================="

          pwd

          echo ""
          echo "=========================================="
          echo "FILES"
          echo "=========================================="

          ls -lah

          echo ""
          echo "=========================================="
          echo "EARNINGS FILES"
          echo "=========================================="

          find . -maxdepth 1 -type f \
            \( -name "*earning*" -o -name "*earnings*" \) \
            -print

      # ======================================================
      # 4. VERIFY EXACT V4 PATH
      # ======================================================

      - name: Verify V4
        run: |
          echo "=========================================="
          echo "VERIFYING V4"
          echo "=========================================="

          V4="./earnings_market_reaction_v4.py"

          echo "Expected path:"
          echo "$V4"

          echo ""
          echo "Testing path..."

          if test -e "$V4"; then
              echo "V4 FILE EXISTS"
          else
              echo "V4 FILE DOES NOT EXIST"
              echo ""
              echo "Current directory:"
              pwd
              echo ""
              echo "Files:"
              ls -lah
              exit 1
          fi

          echo ""
          echo "File information:"
          stat "$V4"

          echo ""
          echo "V4 verification completed."

      # ======================================================
      # 5. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install pandas numpy requests yfinance

      # ======================================================
      # 6. RUN V2
      # ======================================================

      - name: Run Earnings Breadth V2
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          echo "=========================================="
          echo "RUNNING EARNINGS BREADTH V2"
          echo "=========================================="

          python earnings_breadth_v2.py

      # ======================================================
      # 7. VERIFY V2 OUTPUT
      # ======================================================

      - name: Verify V2 output
        run: |
          echo "=========================================="
          echo "VERIFYING V2 OUTPUT"
          echo "=========================================="

          ls -lh *.csv || true

          if test -e "./earnings_breadth_events_v2.csv"; then
              echo "earnings_breadth_events_v2.csv FOUND"
          else
              echo "ERROR: V2 CSV NOT FOUND"
              exit 1
          fi

      # ======================================================
      # 8. RUN V4
      # ======================================================

      - name: Run Earnings Market Reaction V4
        run: |
          echo "=========================================="
          echo "RUNNING V4"
          echo "=========================================="

          python ./earnings_market_reaction_v4.py

      # ======================================================
      # 9. VERIFY V4 OUTPUT
      # ======================================================

      - name: Verify V4 output
        run: |
          echo "=========================================="
          echo "VERIFYING V4 OUTPUT"
          echo "=========================================="

          echo ""
          echo "CSV files generated:"
          ls -lh *.csv

          echo ""
          echo "Checking expected files..."

          test -e "./earnings_market_reaction_v4.csv"
          test -e "./earnings_event_study_v4.csv"
          test -e "./earnings_abnormal_return_v4.csv"
          test -e "./earnings_market_reaction_summary_v4.csv"
          test -e "./earnings_reaction_by_eps_class_v4.csv"
          test -e "./earnings_reaction_by_sector_v4.csv"

          echo ""
          echo "ALL V4 OUTPUT FILES FOUND."

      # ======================================================
      # 10. DISPLAY SUMMARY
      # ======================================================

      - name: Display V4 summary
        run: |
          echo "=========================================="
          echo "V4 SUMMARY"
          echo "=========================================="

          cat earnings_market_reaction_summary_v4.csv

          echo ""
          echo "=========================================="
          echo "EPS CLASS"
          echo "=========================================="

          cat earnings_reaction_by_eps_class_v4.csv

          echo ""
          echo "=========================================="
          echo "SECTOR"
          echo "=========================================="

          cat earnings_reaction_by_sector_v4.csv

      # ======================================================
      # 11. UPLOAD RESULTS
      # ======================================================

      - name: Upload V4 results
        uses: actions/upload-artifact@v4
        with:
          name: corporate-earnings-intelligence-v4-results
          path: |
            earnings_breadth_events_v2.csv
            earnings_market_reaction_v4.csv
            earnings_event_study_v4.csv
            earnings_abnormal_return_v4.csv
            earnings_market_reaction_summary_v4.csv
            earnings_reaction_by_eps_class_v4.csv
            earnings_reaction_by_sector_v4.csv
