name: Test Economic Intelligence Phase 1A

on:
  workflow_dispatch:
  push:
    paths:
      - "economic_data_v1.py"
      - "economic_release_records_input_v1.csv"
      - "requirements.txt"
      - ".github/workflows/test_economic_data_v1.yml"

jobs:
  economic-phase-1a:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show repository files
        run: |
          echo "Repository root:"
          pwd
          echo ""
          find . -maxdepth 2 -type f -print | sort

      - name: Verify Phase 1A script
        run: |
          test -f "./economic_data_v1.py"
          python -m py_compile "./economic_data_v1.py"
          echo "Economic Phase 1A syntax OK."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Economic Phase 1A
        run: |
          python "./economic_data_v1.py"

      - name: Verify outputs
        run: |
          test -f "./economic_events_v1.csv"
          test -f "./economic_data_quality_v1.csv"
          echo "Phase 1A outputs exist."

      - name: Display quality report
        run: |
          echo "=============================="
          echo "ECONOMIC DATA QUALITY"
          echo "=============================="
          cat "./economic_data_quality_v1.csv"

      - name: Upload Phase 1A results
        uses: actions/upload-artifact@v4
        with:
          name: economic-intelligence-phase-1a
          path: |
            economic_events_v1.csv
            economic_data_quality_v1.csv
            economic_release_records_input_v1.csv
