name: US500 Macro Intelligence - Full Research Pipeline

on:
  workflow_dispatch:
    inputs:
      publish_public_data:
        description: "Publish research datasets to public_data/"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: us500-full-research-pipeline
  cancel-in-progress: false

jobs:

  orchestrate:

    name: Run Complete Research Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_REF: ${{ github.ref_name }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. CONFIGURE GIT
      # ============================================================

      - name: Configure Git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ============================================================
      # 3. VERIFY GITHUB CLI
      # ============================================================

      - name: Verify GitHub CLI
        run: |
          set -euo pipefail

          echo "GitHub CLI:"
          gh --version

          echo ""
          echo "Repository:"
          echo "$GH_REPO"

          echo ""
          echo "Branch:"
          echo "$GH_REF"

          echo ""
          echo "GitHub authentication:"
          gh auth status


      # ============================================================
      # 4. RUN PIPELINES SEQUENTIALLY
      # ============================================================

      - name: Run complete research pipeline
        shell: bash
        run: |

          set -euo pipefail

          RUN_LOG="$RUNNER_TEMP/us500_pipeline_runs.tsv"

          rm -f "$RUN_LOG"
          touch "$RUN_LOG"


          # ========================================================
          # FUNCTION: GET CURRENT TIME
          # ========================================================

          now_epoch() {
            date +%s
          }


          # ========================================================
          # FUNCTION: ISO DATE -> EPOCH
          # ========================================================

          iso_to_epoch() {
            date -u -d "$1" +%s
          }


          # ========================================================
          # FUNCTION: FIND RUN CREATED AFTER TIMESTAMP
          # ========================================================

          find_new_run() {

            local workflow="$1"
            local since_epoch="$2"

            gh run list \
              --repo "$GH_REPO" \
              --workflow "$workflow" \
              --limit 20 \
              --json databaseId,status,conclusion,createdAt \
              --jq '.[] |
                [
                  .databaseId,
                  .status,
                  .conclusion,
                  .createdAt
                ] |
                @tsv' |
            while IFS=$'\t' read -r \
              run_id \
              status \
              conclusion \
              created_at
            do

              [ -n "$run_id" ] || continue

              created_epoch="$(iso_to_epoch "$created_at")"

              if [ "$created_epoch" -ge "$since_epoch" ]; then
                echo "$run_id"
                break
              fi

            done
          }


          # ========================================================
          # FUNCTION: WAIT FOR RUN
          # ========================================================

          wait_for_run() {

            local workflow="$1"
            local run_id="$2"

            echo ""
            echo "============================================================"
            echo "WAITING FOR WORKFLOW"
            echo "============================================================"
            echo "Workflow: $workflow"
            echo "Run ID:   $run_id"
            echo "============================================================"

            while true
            do

              result="$(
                gh run view "$run_id" \
                  --repo "$GH_REPO" \
                  --json status,conclusion \
                  --jq '[.status,.conclusion] | @tsv'
              )"

              status="$(echo "$result" | cut -f1)"
              conclusion="$(echo "$result" | cut -f2)"

              echo ""
              echo "Time:       $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo "Status:     $status"
              echo "Conclusion: $conclusion"

              if [ "$status" = "completed" ]; then

                if [ "$conclusion" != "success" ]; then

                  echo ""
                  echo "============================================================"
                  echo "WORKFLOW FAILED"
                  echo "============================================================"
                  echo "Workflow:   $workflow"
                  echo "Run ID:     $run_id"
                  echo "Conclusion: $conclusion"
                  echo "============================================================"

                  gh run view "$run_id" \
                    --repo "$GH_REPO" || true

                  exit 1
                fi

                echo "$workflow|$run_id" >> "$RUN_LOG"

                echo ""
                echo "SUCCESS"
                echo "Workflow: $workflow"
                echo "Run ID:   $run_id"

                return 0
              fi

              sleep 15

            done
          }


          # ========================================================
          # FUNCTION: RUN WORKFLOW
          # ========================================================

          run_workflow() {

            local workflow="$1"

            echo ""
            echo "############################################################"
            echo "# STARTING WORKFLOW"
            echo "############################################################"
            echo "$workflow"
            echo "############################################################"

            local start_time

            start_time="$(now_epoch)"


            # ------------------------------------------------------
            # DISPATCH
            # ------------------------------------------------------

            echo ""
            echo "Dispatching workflow..."

            gh workflow run "$workflow" \
              --repo "$GH_REPO" \
              --ref "$GH_REF"


            # ------------------------------------------------------
            # FIND CREATED RUN
            # ------------------------------------------------------

            local run_id=""

            echo ""
            echo "Waiting for GitHub to create the workflow run..."

            for attempt in $(seq 1 40)
            do

              sleep 5

              run_id="$(find_new_run "$workflow" "$start_time" || true)"

              if [ -n "$run_id" ]; then

                echo ""
                echo "Run detected:"
                echo "$run_id"

                break
              fi

              echo "Attempt $attempt/40 - run not visible yet."

            done


            if [ -z "$run_id" ]; then

              echo ""
              echo "============================================================"
              echo "ERROR: RUN NOT FOUND"
              echo "============================================================"
              echo "$workflow"
              echo "============================================================"

              exit 1
            fi


            # ------------------------------------------------------
            # WAIT
            # ------------------------------------------------------

            wait_for_run \
              "$workflow" \
              "$run_id"
          }


          # ============================================================
          # PHASE 1
          # ECONOMIC INTELLIGENCE
          # ============================================================

          echo ""
          echo "============================================================"
          echo "PHASE 1 - ECONOMIC INTELLIGENCE"
          echo "============================================================"

          run_workflow \
            "economic_intelligence_full_pipeline_v2.3_refresh.yml"


          # ============================================================
          # PHASE 2
          # FINANCIAL STRESS
          # ============================================================

          echo ""
          echo "============================================================"
          echo "PHASE 2 - FINANCIAL STRESS"
          echo "============================================================"

          run_workflow \
            "financial-stress-historical-v1.yml"

          run_workflow \
            "financial-stress-research-v1.yml"


          # ============================================================
          # PHASE 3
          # FED INTELLIGENCE
          # ============================================================

          echo ""
          echo "============================================================"
          echo "PHASE 3 - FED INTELLIGENCE"
          echo "============================================================"

          run_workflow \
            "test-fed.yml"


          # ============================================================
          # PHASE 4
          # EVENT / NEWS
          # ============================================================

          echo ""
          echo "============================================================"
          echo "PHASE 4 - EVENT / NEWS INTELLIGENCE"
          echo "============================================================"

          run_workflow \
            "event-news-intelligence-v1.yml"


          # ============================================================
          # PHASE 5
          # COT
          # ============================================================

          echo ""
          echo "============================================================"
          echo "PHASE 5 - COT INTELLIGENCE"
          echo "============================================================"

          run_workflow \
            "cot-historical-v1.yml"

          run_workflow \
            "cot-positioning-analyzer-v1.yml"


          # ============================================================
          # PHASE 6
          # VIX
          # ============================================================

          echo ""
          echo "============================================================"
          echo "PHASE 6 - VIX INTELLIGENCE"
          echo "============================================================"

          run_workflow \
            "vix-historical-v1.yml"

          run_workflow \
            "vix-sentiment-analyzer-v1.yml"


          # ============================================================
          # PHASE 7
          # AAII
          # ============================================================

          echo ""
          echo "============================================================"
          echo "PHASE 7 - AAII SENTIMENT"
          echo "============================================================"

          run_workflow \
            "aaii-historical-v1.yml"

          run_workflow \
            "aaii-sentiment-analyzer-v1.yml"


          # ============================================================
          # PHASE 8
          # TECHNICAL INTELLIGENCE
          # ============================================================

          echo ""
          echo "============================================================"
          echo "PHASE 8 - TECHNICAL INTELLIGENCE"
          echo "============================================================"

          run_workflow \
            "technical-intelligence-v1.yml"


          # ============================================================
          # PHASE 9
          # LIQUIDITY
          # ============================================================

          echo ""
          echo "============================================================"
          echo "PHASE 9 - LIQUIDITY INTELLIGENCE"
          echo "============================================================"

          run_workflow \
            "liquidity-historical-v1.yml"

          run_workflow \
            "liquidity-intelligence-v1.yml"


          # ============================================================
          # PHASE 10
          # MARKET BREADTH
          # ============================================================

          echo ""
          echo "============================================================"
          echo "PHASE 10 - MARKET BREADTH"
          echo "============================================================"

          run_workflow \
            "market-breadth-full-validation-v1.yml"


          # ============================================================
          # PHASE 11
          # CROSS ASSET
          # ============================================================

          echo ""
          echo "============================================================"
          echo "PHASE 11 - CROSS ASSET"
          echo "============================================================"

          run_workflow \
            "cross-asset-intelligence-v1.yml"


          # ============================================================
          # PHASE 12
          # EARNINGS
          # ============================================================

          echo ""
          echo "============================================================"
          echo "PHASE 12 - EARNINGS INTELLIGENCE"
          echo "============================================================"

          run_workflow \
            "earnings_reaction_v3.yml"


          # ============================================================
          # ALL COMPLETE
          # ============================================================

          echo ""
          echo "============================================================"
          echo "ALL PRODUCER WORKFLOWS COMPLETED SUCCESSFULLY"
          echo "============================================================"

          echo ""
          echo "PIPELINE RUN LOG"
          echo "============================================================"

          cat "$RUN_LOG"


      # ============================================================
      # 5. DOWNLOAD ARTIFACTS
      # ============================================================

      - name: Download research artifacts
        if: ${{ inputs.publish_public_data }}
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p public_data

          ARTIFACT_DIR="$RUNNER_TEMP/us500_artifacts"

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"


          echo ""
          echo "============================================================"
          echo "DOWNLOADING RESEARCH ARTIFACTS"
          echo "============================================================"


          while IFS='|' read -r workflow run_id
          do

            [ -n "$run_id" ] || continue

            workflow_safe="$(
              echo "$workflow" |
              tr '/ ' '__'
            )"

            destination="$ARTIFACT_DIR/$workflow_safe"

            mkdir -p "$destination"

            echo ""
            echo "------------------------------------------------------------"
            echo "Workflow: $workflow"
            echo "Run:      $run_id"
            echo "------------------------------------------------------------"


            if gh run download "$run_id" \
                --repo "$GH_REPO" \
                --dir "$destination"
            then

              echo "Artifact download completed."

            else

              echo "WARNING: No artifact could be downloaded."
              continue

            fi


            find "$destination" \
              -type f \
              \( \
                -name "*.csv" \
                -o \
                -name "*.json" \
              \) \
              -print |
            while IFS= read -r file
            do

              [ -f "$file" ] || continue

              filename="$(basename "$file")"

              cp "$file" \
                "public_data/$filename"

              echo "Published:"
              echo "$filename"

            done

          done < "$RUNNER_TEMP/us500_pipeline_runs.tsv"


      # ============================================================
      # 6. BUILD MANIFEST
      # ============================================================

      - name: Build public data manifest
        if: ${{ inputs.publish_public_data }}
        shell: bash
        run: |

          set -euo pipefail

          python - <<'PY'

          from pathlib import Path
          import hashlib
          import json


          root = Path("public_data")

          files = []


          for path in sorted(root.iterdir()):

              if not path.is_file():
                  continue

              if path.name in {
                  "README.md",
                  "public_data_manifest.json",
              }:
                  continue

              data = path.read_bytes()

              files.append(
                  {
                      "file": path.name,
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  }
              )


          manifest = {
              "schema_version": "us500-public-data-v1",
              "research_only": True,
              "trade_execution": False,
              "broker_integration": False,
              "deterministic_prediction": False,
              "source": "US500 Macro Intelligence Full Research Pipeline",
              "files": files,
          }


          manifest_path = (
              root /
              "public_data_manifest.json"
          )


          manifest_path.write_text(
              json.dumps(
                  manifest,
                  indent=2
              ),
              encoding="utf-8",
          )


          readme = """# US500 Macro Intelligence - Public Research Data

This directory contains research datasets generated by the
US500 Macro Intelligence Full Research Pipeline.

Properties:

- Research-only
- No trade execution
- No broker integration
- No deterministic market prediction
- Designed for the Streamlit application
- No Personal GitHub Token required by the Streamlit application

The Streamlit application can read these datasets directly
from the repository.
"""


          (
              root /
              "README.md"
          ).write_text(
              readme,
              encoding="utf-8",
          )


          print("")
          print("============================================================")
          print("PUBLIC DATA MANIFEST")
          print("============================================================")
          print(f"Dataset count: {len(files)}")

          for item in files:
              print(
                  f"{item['file']} "
                  f"({item['bytes']} bytes)"
              )

          PY


      # ============================================================
      # 7. DISPLAY PUBLIC DATA
      # ============================================================

      - name: Display public data
        if: ${{ inputs.publish_public_data }}
        run: |

          echo ""
          echo "============================================================"
          echo "PUBLIC DATA CONTENTS"
          echo "============================================================"

          find public_data \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" |
            sort


      # ============================================================
      # 8. COMMIT DATA
      # ============================================================

      - name: Commit public research data
        if: ${{ inputs.publish_public_data }}
        shell: bash
        run: |

          set -euo pipefail

          git add public_data


          if git diff --cached --quiet
          then

            echo "No changes detected in public_data."

            exit 0

          fi


          git commit \
            -m "chore: publish research datasets"


          git push \
            origin \
            "HEAD:$GH_REF"


      # ============================================================
      # 9. FINAL SUMMARY
      # ============================================================

      - name: Final summary
        if: always()
        shell: bash
        run: |

          echo ""
          echo "============================================================"
          echo "US500 MACRO INTELLIGENCE"
          echo "FULL RESEARCH PIPELINE"
          echo "============================================================"

          echo ""
          echo "Research-only: YES"
          echo "Trade execution: NO"
          echo "Broker integration: NO"
          echo "Deterministic prediction: NO"

          echo ""
          echo "Publish public_data:"
          echo "${{ inputs.publish_public_data }}"

          echo ""
          echo "Pipeline runs:"

          if [ -f "$RUNNER_TEMP/us500_pipeline_runs.tsv" ]
          then
            cat "$RUNNER_TEMP/us500_pipeline_runs.tsv"
          else
            echo "No run log available."
          fi
