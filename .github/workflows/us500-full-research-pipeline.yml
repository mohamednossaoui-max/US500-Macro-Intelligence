name: US500 Macro Intelligence - Master Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:

  master:
    name: Master Pipeline
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GitHub CLI
        run: |
          set -e

          echo "=============================================="
          echo "US500 MACRO INTELLIGENCE - MASTER PIPELINE"
          echo "=============================================="

          gh --version

          echo ""
          echo "Repository:"
          echo "${{ github.repository }}"

          echo ""
          echo "Branch:"
          echo "${{ github.ref_name }}"

      - name: Test workflow dispatch
        run: |
          echo "=============================================="
          echo "MASTER WORKFLOW IS RUNNING"
          echo "=============================================="

          echo "Manual dispatch works correctly."
