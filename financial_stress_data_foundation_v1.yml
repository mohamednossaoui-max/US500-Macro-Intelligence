name: Financial Stress Data Foundation v1
on:
  workflow_dispatch:
  push:
    paths:
      - "financial_stress_data_foundation_v1.py"
      - "financial_stress_records_input_v1.csv"
      - ".github/workflows/financial_stress_data_foundation_v1.yml"
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile financial_stress_data_foundation_v1.py
      - name: Run foundation
        run: python financial_stress_data_foundation_v1.py
      - name: Verify outputs
        run: |
          test -f financial_stress_events_v1.csv
          test -f financial_stress_data_quality_v1.csv
      - name: Research-only guard
        run: |
          ! grep -Eiq "decision[ _-]*engine[[:space:]]+integration[[:space:]]*[:=][[:space:]]*true" financial_stress_data_foundation_v1.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: financial-stress-foundation-v1
          path: |
            financial_stress_events_v1.csv
            financial_stress_data_quality_v1.csv
